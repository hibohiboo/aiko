<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>藍子の漂流日記</title>
<style>
:root{
  --paper:#f3ead3; --paper2:#ebdfc2; --ink:#2a2216; --muted:#76684f; --line:#d3c39f;
  --hp:#c23f35; --food:#b87a12; --water:#2a73ad; --ok:#2f6b4c; --warn:#b5541b;
  --night:#121a30; --night2:#1d2747;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#d9cba8;color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--paper);position:relative;display:flex;flex-direction:column}

/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.hud-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.day{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:.02em}
.pips{display:flex;gap:4px}
.pip{font-size:12px;padding:2px 7px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.pip.done{background:var(--paper2);color:#a89a7d;text-decoration:line-through}
.pip.now{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.hud-place{margin-left:auto;font-size:13px;color:var(--muted)}
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g{position:relative}
.g-head{display:flex;align-items:baseline;gap:4px;font-size:12px;color:var(--muted)}
.g-head b{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;margin-left:auto}
.g-state{font-size:11px;font-weight:700;color:#fff;background:var(--warn);border-radius:3px;padding:0 4px;display:none}
.g.low .g-state{display:inline-block}
.bar{position:relative;height:9px;border-radius:5px;background:#e2d5b6;overflow:hidden;margin-top:3px;border:1px solid transparent}
.g.low .bar{border-color:var(--warn)}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:5px}
.bar .ghost{background:repeating-linear-gradient(135deg,#0003 0 3px,#0001 3px 6px);transition:width .45s ease .35s}
.bar .fill{transition:width .2s ease}
.g.hp .fill{background:var(--hp)} .g.food .fill{background:var(--food)} .g.water .fill{background:var(--water)}
.float{position:absolute;right:0;top:-4px;font-size:13px;font-weight:800;pointer-events:none;animation:floatUp 1.1s ease forwards}
.float.neg{color:var(--hp)} .float.pos{color:var(--ok)}
@keyframes floatUp{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-14px)}}

/* ---------- places ---------- */
.places{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none}
.places::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:7px 11px;border-radius:18px;border:1px solid var(--line);background:#fbf6e9;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.here{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.chip.locked{background:transparent;color:#9b8d72;border-style:dashed}
.chip.newp{box-shadow:0 0 0 2px var(--ok) inset}
.move-note{padding:0 14px;font-size:11px;color:var(--muted);min-height:16px}
.move-note.err{color:var(--warn);font-weight:700}

/* ---------- scene ---------- */
main{flex:1;padding:6px 14px 96px}
.scene{font-family:var(--serif);font-size:15px;line-height:1.85;margin:6px 0 12px}
.scene .pname{font-family:var(--sans);font-size:12px;color:var(--muted);display:block;margin-bottom:2px}

.cards{display:flex;flex-direction:column;gap:9px}
.card{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;align-items:start;text-align:left;width:100%;padding:12px 12px 11px;border-radius:10px;border:1px solid var(--line);background:#fffaf0;box-shadow:0 2px 0 #cdbd97;cursor:pointer;transition:transform .08s,box-shadow .08s}
.card:active:not(.off){transform:translateY(2px);box-shadow:0 0 0 #cdbd97}
.card .ci{font-size:28px;line-height:44px;text-align:center;background:var(--paper2);border-radius:8px;grid-row:span 2}
.card .ct{font-weight:700;font-size:15px}
.card .cs{font-size:12px;color:var(--muted);margin-top:1px}
.costs{display:flex;flex-wrap:wrap;gap:4px;grid-column:2}
.cost{font-size:11px;padding:1px 6px;border-radius:3px;background:var(--paper2);font-variant-numeric:tabular-nums}
.cost.f{color:#7d5208} .cost.w{color:#1c5585}
.cost.need{background:var(--ok);color:#fff}
.note{grid-column:1/-1;font-size:12px;border-radius:5px;padding:4px 7px;margin-top:4px}
.note.warn{background:#f8e1c9;color:#7a3810}
.note.danger{background:#f4d3cf;color:#7c1f17;font-weight:700}
.card.warn{border-color:#d9a06b}
.card.off{background:#ece4cf;box-shadow:none;cursor:not-allowed;opacity:.85}
.card.off .ct,.card.off .ci{filter:grayscale(1);opacity:.55}
.card.off .note{background:#ddd3bb;color:#4d4434}
.card.deal{animation:deal .28s ease both}
@keyframes deal{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}

.result{border:1px solid var(--line);background:#fffaf0;border-radius:10px;padding:14px;animation:deal .25s ease both}
.result .story{font-family:var(--serif);line-height:1.9;font-size:15px;margin:0 0 8px;white-space:pre-line}
.result .extra{font-size:13px;color:var(--hp);font-weight:700;margin:4px 0;white-space:pre-line}
.gets{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 4px}
.get{font-size:12px;padding:3px 8px;border-radius:12px;background:var(--paper2)}
.get.neg{background:#f4d3cf;color:#7c1f17}
.get.pos{background:#d8e8d6;color:#1e4a33}
.get.know{background:#28344f;color:#f3ead3;cursor:pointer}
.get.clue{background:#5a3d6b;color:#f6ecff;cursor:pointer}
.get.place{background:var(--ok);color:#fff}
.btn{display:block;width:100%;padding:13px;border-radius:9px;border:0;background:var(--ink);color:var(--paper);font-weight:700;font-size:15px;cursor:pointer;margin-top:12px}
.btn.sub{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{background:#cbbd9c;color:#7f7258;cursor:not-allowed}

/* ---------- bottom nav ---------- */
nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:grid;grid-template-columns:repeat(4,1fr);background:#efe4c8;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.bottom button{background:none;border:0;padding:8px 2px 9px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;position:relative}
nav.bottom button span{font-size:20px}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--hp);color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:0 5px;min-width:16px}
.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.18)}}

/* ---------- sheet ---------- */
.veil{position:fixed;inset:0;background:#0007;z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;max-height:82vh;max-height:82dvh;overflow:auto;background:var(--paper);border-radius:14px 14px 0 0;z-index:21;padding:14px 14px calc(20px + env(safe-area-inset-bottom));animation:up .24s ease}
@keyframes up{from{transform:translate(-50%,40px);opacity:.4}}
.sheet h2{font-family:var(--serif);font-size:18px;margin:0 0 10px;display:flex;align-items:center}
.sheet h2 small{font-family:var(--sans);font-size:12px;color:var(--muted);margin-left:8px;font-weight:400}
.close{margin-left:auto;background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer}
.sec{font-size:12px;color:var(--muted);margin:14px 0 6px;font-weight:700}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}
.row .ri{font-size:22px;width:30px;text-align:center}
.row .rn{flex:1;font-size:14px}
.row .rn small{display:block;color:var(--muted);font-size:11px}
.mini{border:1px solid var(--ink);background:#fffaf0;border-radius:6px;padding:6px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
.mini[disabled]{border-color:#b9ab8c;color:#9b8d72;cursor:not-allowed;background:transparent}
.mats{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.mat{font-size:11px;padding:1px 6px;border-radius:3px;background:var(--paper2)}
.mat.short{background:#f4d3cf;color:#7c1f17;font-weight:700}
.mat.ok{background:#d8e8d6;color:#1e4a33}
.matlist{display:flex;flex-wrap:wrap;gap:6px}
.msg{background:#fffaf0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:6px}
.kn{padding:10px 0;border-bottom:1px dashed var(--line)}
.kn b{font-size:14px}
.kn p{margin:3px 0 0;font-size:13px;line-height:1.7;color:#4a3f2d}
.kn.unk b{color:#a99b7f;letter-spacing:.2em}
.newtag{font-size:10px;background:var(--ok);color:#fff;border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:2px}
.clue{font-family:var(--serif);padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.7}
.clue.unk{color:#a99b7f}

/* ---------- night ---------- */
.nightwrap{background:linear-gradient(var(--night),var(--night2));color:#e6e1f0;flex:1;padding:28px 18px 40px;min-height:100vh;min-height:100dvh}
.nightwrap h2{font-family:var(--serif);font-size:22px;margin:0 0 4px}
.nightwrap .sky{font-size:30px;letter-spacing:10px;margin:8px 0 16px}
.nightwrap p{font-family:var(--serif);line-height:1.95;white-space:pre-line}
.nightwrap .ledger{background:#ffffff10;border:1px solid #ffffff24;border-radius:10px;padding:10px 12px;margin:16px 0;font-size:13px}
.ledger div{display:flex;justify-content:space-between;padding:3px 0}
.ledger .neg{color:#ff9b8f} .ledger .pos{color:#9fe0b3}
.nightwrap .btn{background:#e6e1f0;color:var(--night)}
.nightwrap .get.clue{display:inline-block}

/* ---------- title / result ---------- */
.title{padding:60px 22px 40px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center}
.title h1{font-family:var(--serif);font-size:40px;margin:0 0 6px;letter-spacing:.12em}
.title .wave{font-size:13px;color:var(--muted);letter-spacing:.4em;margin-bottom:34px}
.title .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:26px 0 6px}
.title .meta div{background:#fffaf0;border:1px solid var(--line);border-radius:8px;padding:8px 4px;font-size:11px;color:var(--muted)}
.title .meta b{display:block;font-size:18px;color:var(--ink)}
.howto{text-align:left;font-size:12.5px;line-height:1.8;color:#4a3f2d;background:#fffaf0;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:16px}
.res{padding:26px 16px 40px}
.res .kind{font-size:12px;letter-spacing:.3em;color:var(--muted)}
.res h1{font-family:var(--serif);font-size:28px;margin:4px 0 10px}
.res .story{font-family:var(--serif);line-height:1.95;font-size:15px;white-space:pre-line}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.stats div{background:#fffaf0;border:1px solid var(--line);border-radius:8px;padding:10px 4px;text-align:center;font-size:11px;color:var(--muted)}
.stats b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.stats .big{grid-column:1/-1}
.stats .big b{font-size:34px}
.persona{background:var(--ink);color:var(--paper);border-radius:12px;padding:16px;margin:14px 0}
.persona .lbl{font-size:11px;letter-spacing:.2em;opacity:.7}
.persona h3{font-family:var(--serif);font-size:21px;margin:4px 0 6px}
.persona p{font-size:13px;line-height:1.8;margin:0 0 10px;opacity:.9}
.tagbar{display:grid;grid-template-columns:64px 1fr 26px;align-items:center;gap:8px;font-size:12px;margin:5px 0}
.tagbar .tb{height:7px;border-radius:4px;background:#ffffff22;overflow:hidden}
.tagbar .tb i{display:block;height:100%;background:var(--paper);border-radius:4px;transition:width .8s ease}
.tagbar.top{font-weight:700}
.tagbar.top .tb i{background:#f2c56b}

.sec small{font-weight:400;margin-left:6px}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:#a99b7f;font-size:13px}
.thinkhead{font-weight:700;font-size:15px;margin:4px 0 10px}
.thinkhead small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.btn.think{margin-top:14px}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:8px 0 0}
.card.fresh{border-color:var(--ok);box-shadow:0 2px 0 var(--ok)}
.card.incoming{border:2px solid var(--ok);cursor:default}
.swaprow{display:flex;gap:8px;align-items:stretch}
.swaprow .card{flex:1;cursor:default}
.mini.drop{align-self:center;border-color:var(--hp);color:var(--hp)}
.cost.once{background:#e3d6f0;color:#4b2f66}
.note.info{background:#e4ecf3;color:#1c4568}
.get.idea{background:#f2c56b;color:#3d2a00;cursor:pointer}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important}
}
nav.bottom.one{grid-template-columns:1fr}
nav.bottom.two{grid-template-columns:1fr 1fr}
nav.bottom.two button{flex-direction:row;justify-content:center;gap:6px;font-size:14px;padding:12px 4px 13px}
nav.bottom.two button span{font-size:20px}
nav.bottom.two button[disabled]{opacity:.4}
nav.bottom.two .badge{top:6px;left:auto;right:18%}
nav.bottom.one button{flex-direction:row;justify-content:center;gap:8px;font-size:14px;padding:12px 4px 13px}
nav.bottom.one button span{font-size:20px}
.journal{font-family:var(--serif);font-size:14px;line-height:1.8;color:#5a4a30;border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:8px 0 4px;white-space:pre-line}
.kbox{background:#28344f;color:#f3ead3;border-radius:9px;padding:10px 12px;margin:10px 0 2px;animation:deal .3s ease both}
.kbox .klbl{font-size:11px;opacity:.75;letter-spacing:.1em}
.kbox b{font-size:14px}
.kbox p{font-size:12.5px;line-height:1.75;margin:4px 0 0;opacity:.92}
.kbox.old{background:#3a4560;padding:7px 12px}
.nightwrap .kbox{background:#ffffff14;border:1px solid #ffffff26}
.pager{display:flex;align-items:center;gap:12px;margin-top:6px}
.pager span{font-size:12px;color:var(--muted);white-space:nowrap}
.pager .btn{margin-top:0}
.page.turn{animation:turn .32s ease both}
@keyframes turn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.result .story{min-height:5.7em}
.cards.fixed{margin-bottom:14px}
.card.story{border:2px solid #c99a3a;background:#fff6dc;box-shadow:0 2px 0 #c99a3a}
.card.story .ci{background:#f6e2b0}
.card.camp{border-color:#9db39f;background:#f4f8ef;box-shadow:0 2px 0 #9db39f}
.get.lost{background:#e9dccb;color:#6b4a1e;border:1px dashed #b08a55}
.res .clue{font-size:13px}
.moon2{display:inline-block;font-size:.68em;margin-left:6px;filter:hue-rotate(-45deg) saturate(2.5) brightness(.9);vertical-align:4px}

.move-note{display:none;min-height:0;margin:8px 14px 0;padding:7px 10px;border-radius:7px;background:#fffaf0;border:1px solid var(--line);font-size:12px;white-space:pre-line}
.move-note.on{display:block}
.row.lockrow .rn{color:#9b8d72}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{flex:1;padding:8px;border-radius:7px;border:1px solid var(--line);background:#fffaf0;font-size:13px;cursor:pointer}
.tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.pip i{font-style:normal;margin-right:3px;font-size:12px}
.pip.done i{filter:grayscale(1);opacity:.6}

.ic{width:1em;height:1em;display:inline-block;vertical-align:-.14em}
.card .ci .ic{width:30px;height:30px;vertical-align:middle}
.ic2{position:relative;display:inline-block;line-height:1}
.ic2 b{position:absolute;right:-.28em;bottom:-.18em;font-size:.55em;font-weight:400}
.pip i .ic{width:13px;height:13px;vertical-align:-2px}
.pip.done i .ic{filter:grayscale(1);opacity:.55}
nav.bottom.two button span .ic{width:22px;height:22px}

/* ---------- 藍子版 ---------- */
.ep{background:#f6ecd2;border:1px solid #d9c08a;border-left:4px solid #c99a3a;border-radius:8px;padding:10px 12px;margin:2px 0 8px;animation:deal .3s ease both}
.ep .eph{font-size:11.5px;font-weight:700;color:#8a6420;letter-spacing:.04em;margin-bottom:4px}
.ep p{font-family:var(--serif);font-size:14px;line-height:1.85;margin:0;white-space:pre-line;color:#4a3b22}
.result .ep{min-height:5.7em}
.snap{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;padding:10px;border-radius:9px;border:1.5px dashed #8a6420;background:#fff6dc;color:#5a4214;font-weight:700;font-size:14px;cursor:pointer}
.snap small{font-weight:400;font-size:11px;color:#8a6420}
div.snap.done{cursor:default;border-style:solid;font-weight:400;font-size:12.5px;background:#f1e8d0}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px;margin:6px 0 4px}
.ph{margin:0;background:#fffdf7;padding:7px 7px 9px;border-radius:3px;box-shadow:0 2px 6px #0002;transform:rotate(-1deg)}
.ph:nth-child(even){transform:rotate(1.2deg)}
.phi{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:44px;background:linear-gradient(160deg,#cfe0e8,#e9dcbc);border-radius:2px}
.phi .ic{width:44px;height:44px}
.ph figcaption{font-family:var(--serif);font-size:11.5px;line-height:1.55;margin-top:6px;color:#4a3f2d}
.nightwrap .ep{background:#ffffff12;border-color:#ffffff30;border-left-color:#c99a3a}
.nightwrap .ep p{color:#e6e1f0}
.nightwrap .ep .eph{color:#f2c56b}
.nightwrap .snap{background:#ffffff14;color:#f3ead3;border-color:#f2c56b;margin-bottom:6px}
.nightwrap .snap small{color:#f2c56b}
nav.bottom.three{grid-template-columns:repeat(3,1fr)}
nav.bottom.three button{flex-direction:row;justify-content:center;gap:5px;font-size:13px;padding:12px 2px 13px}
nav.bottom.three button span{font-size:19px}
nav.bottom.three button span .ic{width:20px;height:20px}
nav.bottom.three button[disabled]{opacity:.4}
nav.bottom.three .badge{top:5px;left:auto;right:6%}
.tabs{flex-wrap:wrap}
.tab{min-width:0;padding:7px 4px;font-size:12.5px}
.tab small{display:block;font-size:10.5px;opacity:.75;font-weight:400}
.kn .src{display:inline-block;margin-left:6px;font-size:10.5px;color:#8a6420;background:#f6ecd2;border-radius:3px;padding:0 5px;vertical-align:1px}
.title .kick{font-size:12px;letter-spacing:.3em;color:var(--muted);margin-bottom:8px}
.title h1{font-size:32px;letter-spacing:.08em}
.title a.back{display:block;margin-top:18px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ================= utilities ================= */
const R=Math.random, P=p=>R()<p, ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const clamp=v=>Math.max(0,Math.min(100,v));
const store={
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function hurtAdd(t,k,a,b){if(S.seen['hurt:'+k])return t+'\n'+b;S.seen['hurt:'+k]=1;return[t,a]}

C('beach','findcamp',{fixed:1,story:1,i:'🌙',t:'寝られる場所を探す',s:'日が暮れる前に',c:[3,5],tags:['explore'],once:1,req:s=>!s.places.camp,run:s=>({discover:['camp'],photo:'camp',t:[

// 焼き方：[はじめて焼くとき, 二回目から]
const COOKT={
  fish:['小枝の皮をむいて、魚の口から尾のほうへ、波を縫うように刺していく。\n焚き火のまわりの砂に、斜めに立てて並べた。\n「遠火の強火じゃ」\n漁師のおじいさんの声を思い出して、炎から少し離す。近すぎると、皮だけ焦げて中は生のままになってしまう。\nじりじり、と脂が落ちて、炎がぱっと跳ねる。くるりと返して、もう半分。\n皮がきつね色にふくらんできたら、焼きあがり。','魚は小枝に刺して、遠火でじっくり焼いた。'],
  crab:['焚き火の燠を少しよけて、平たい石を熱しておく。\nカニさんは、甲羅を下にして石の上へ。\n「……ごめんなさい。いただきます」\n黒っぽかった甲羅が、みるみるうちに赤く染まっていく。\n殻のすき間から、しゅわしゅわと潮の香りの湯気が上がった。','カニは甲羅を下にして、焼いた石の上で赤くなるまで焼いた。'],
  clam:['貝は、口を上にして燠の上に並べる。\n「貝はね、ひっくり返さないの。おいしいおつゆがこぼれちゃうから」\n島のおばあちゃんに教わったとおり、じっと待つ。\nぱかっ。ぱかっ。\nひとつずつ口を開いていく貝の中で、おつゆがふつふつと煮立っていた。','貝は口を上にして燠に並べ、ぱかっと開くまで待った。'],
  egg:['平たい石を焚き火にのせて、よく熱する。\n真ん中を少しくぼませておくと、白身が流れていかない。\n手をかざして、じんわり熱が伝わってくるくらいになったら――\n卵を石のかどでこつんと割って、そっと落とす。\nじゅっ。\n白身のふちがちりちりと、レースみたいに焼けていく。黄身は、まんまるのまま。\n「……ふふっ。目玉焼きだ」\nフライパンのかわりに、島の石。','卵は、焼いた石の上で目玉焼きにした。'],
  imo:['芋は大きな葉で包んで、焚き火の下の、熱い灰の中に埋めた。\n「焼き芋はね、炎じゃなくて、灰でじっくり焼くのよ」\n島のおばあちゃんの言葉を思い出しながら、のんびり待つ。\n枝でつついて掘り出すと、葉っぱは真っ黒。\nそっと開くと、ほっくりした湯気が立ちのぼった。','芋は葉で包んで、熱い灰に埋めて焼いた。']
};
C('camp','cook',{fixed:1,i:'🐟+🔥',t:'焚き火で料理する',s:'焼けるものをまとめて焼く',c:[2,3],tags:['safe'],req:s=>s.fire,dis:s=>!Object.keys(COOK).some(k=>have(k)&&((k!=='wshell'&&k!=='wflask')||tool('pot')))&&'焼けるものがない',run:s=>{
  const get={},foods=[];let water=0;
  for(const[k,to]of Object.entries(COOK)){if((k==='wshell'||k==='wflask')&&!tool('pot'))continue;const n=have(k);if(!n)continue;get[k]=-n;get[to]=(get[to]||0)+n;if(COOKT[k])foods.push(k);else water=1}
  const salt=foods.length&&have('salt')>0;if(salt)get.salt=-1;
  const first=foods.filter(k=>!s.seen['cook:'+k]),again=foods.filter(k=>s.seen['cook:'+k]);
  first.forEach(k=>s.seen['cook:'+k]=1);
  const t=first.map(k=>COOKT[k][0]);
  if(again.length)t.push((first.length?'ほかのものも、いつものように焼いた。\n':'')+again.map(k=>COOKT[k][1]).join('\n'));
  if(foods.length)t.push('香ばしい匂いが、岩陰いっぱいに満ちる。'+(salt?'\n仕上げに、手作りの塩をひとつまみ。':'')+'\n焼きあがったものを、大きな葉っぱのお皿に並べた。\n使った石や器は、あとで灰をまぶしてこすり洗いしよう。');
  if(water)t.push('汲んできた水は土器に移して、ぐらぐらと沸かしてから冷ました。');
  if(foods.length)t.push(...ep('cook'));
  return{get,d:{hp:salt?5:0},know:[water?'boil':null,foods.length?'ash':null],photo:foods.length?'cook':null,t}}});
C('ruins','gate',{fixed:1,story:1,i:'🌀',t:'門にかけらをはめる',s:'青い石のかけら 3/3',c:[0,0],tags:['observe'],req:s=>inv('shard')>=3,run:s=>({choice:1,photo:'gate',t:[
  '門の柱の三つのくぼみに、青いかけらをひとつずつはめていく。\n最後のひとつがかちりと収まった瞬間、足もとの石が低くうなった。',
  '門の内側の霧が、ゆっくりと渦を巻きはじめる。\n渦の奥に、灯りが見えた。\nロケのテント。朝ごはんの湯気。浜辺を走りまわる、ふたつの人影。\n「……未央ちゃん。茜ちゃん」',
  'ふり返る。\n霧の切れ間から、ふたつの月が昇りはじめた島が見える。\n岩陰の野営地。焚き火の煙。'+(s.flags.birdFriend?'\n肩の上で、ルリが小さく鳴いた。':'')+'\n\n門は、そう長くは開いていないだろう。']})});

C('camp','smudge',{i:'💨',t:'葉っぱをいぶして虫よけ',s:'香りのいい葉1を使う',c:[1,2],tags:['safe'],req:s=>s.fire&&have('herb')>=1&&s.flags.smudge!==s.day,run:s=>{s.flags.smudge=s.day;return{get:{herb:-1},know:'kayari',t:'焚き火のはしに、香りのいい葉をくべた。\n白い煙がゆるゆると岩陰に広がって、羽音が遠ざかっていく。\n「……よかったぁ」\n虫は、本当に苦手なんです。今夜は、ぐっすり眠れそう。'}}});
C('camp','sing',{i:'🎵',t:'歌を口ずさむ',s:'ひとりの夕方は、少しさびしいから',c:[1,2],tags:['safe'],run:s=>{const n=(s.flags.sang||0);s.flags.sang=n+1;
  const t=['流木に腰かけて、小さな声で歌った。\nポジパの三人で歌った、元気な曲。ひとりで歌うと、ちょっとゆっくりになる。','波の音に合わせて、ゆったりした曲を歌った。\nライブでこの曲を歌うと、客席のペンライトが波みたいに揺れるんです。','鼻歌まじりに、曲の振りをなぞってみた。\n……レッスン、ずいぶん休んじゃってる。帰ったら、トレーナーさんに怒られちゃうかな。'][n%3];
  return{d:{hp:6},t:t+(s.flags.birdFriend?'\nルリが、合いの手みたいにピィと鳴いた。':'')}}});
C('camp','diary',{i:'📓',t:'日記を読み返す',s:'引っかかっていることがある',c:[2,4],tags:['observe'],req:s=>clueN(s)>=2,run:s=>{const n=clueN(s);let t;
  if(n<4)t='この島に来てからの日記を、一日ずつ読み返す。\n歌鈴ちゃんと作った「藍鈴ダイアリー」みたいに、帰ったら写真も貼りたいな。\nうまく言葉にできないけれど、何かがずっと引っかかっている。\nもう少し、島のあちこちをお散歩してみよう。';
  else if(n<7)t='引っかかっていたことを、砂の上に指で書き出してみた。\nひとつひとつは小さなこと。でも、並べてみると――\n……ここは本当に、地図に載っている島なのかな。'+(s.places.ruins?'':'\n水の流れてくる先、小川の上流が気になる。');
  else t='書き出した線が、ひとつの答えを指している。\nここは、元いた世界とは違う場所。\n'+(s.flags.recall?'霧の朝にくぐった、あの岩のアーチ。':'')+'帰り道があるとすれば、霧の奥の石の門しかない。';
  return{d:{hp:4},t}}});

C('beach','toforest',{i:'🌴',t:'森のほうへ行ってみる',s:'浜の奥に木々が見える',c:[3,5],tags:['explore'],once:1,w:3,req:s=>!s.places.forest,run:s=>({discover:['forest'],t:'砂浜を背に歩くと、ヤシの木立の向こうに深い森が広がっていた。\n湿った土の匂い。頭の上で、鳥がにぎやかに鳴いている。\n「こんにちは。少し、おじゃましますね」\n木の実がありそうだ。'})});

C('beach','flotsam',{i:'👀',t:'漂着物を調べる',s:'波打ち際に何が流れ着いているか',c:[3,6],tags:['observe'],w:1.4,run:s=>{
  if(!s.clues.noplastic)return{clue:'noplastic',know:'beachcomb',get:{wood:1},t:['波打ち際を、端から端まで歩いて調べた。\n流木。ちぎれた海藻。割れた貝殻。ヤシの実の殻。軽石。\n使えそうなのは、手ごろな流木が一本くらい。',...ep('beach'),'ペットボトルのキャップひとつ、お菓子の袋の切れはしひとつ、落ちていない。\n「……どうして？」']};
  if(s.day>=3&&!s.clues.float&&P(.45))return{clue:'float',know:'floatglass',t:['波間で、何かが緑色に光った。\n拾い上げると、手のひらほどのガラス玉だった。中に、丸めた紙が入っている。\n漁師のおじいさんの倉庫で見た、漁網の浮き玉に似ている。','石で割って、紙を広げた。\nインクで文字が書かれている。……どこの国の文字だろう。一文字も読めない。\n角ばった記号が、右から左へ並んでいるようにも見えた。']};
  const r=R();if(r<.4)return{get:{coconut:1},t:'波に転がされていたヤシの実を見つけた。'};if(r<.75)return{get:{leaf:2},t:'打ち上げられたヤシの葉が使えそうだ。'};return{get:{wood:1,twig:1},t:'目ぼしいものはない。小さな流木と枝を拾った。'}}});
C('beach','horn',{i:'🐚',t:'大きな巻き貝を吹いてみる',s:'両手で抱えるほどの巻き貝',c:[1,2],tags:['observe'],once:1,w:1.5,run:s=>({d:{hp:6},t:['波打ち際に、両手で抱えるほどの巻き貝が転がっていた。\n先っぽが欠けて、穴があいている。\n……芳乃ちゃんの、ほら貝みたい。','エフェメラのみんなで集まった日、芳乃ちゃんがほら貝を見事に鳴らしてくれたことがあります。\n「ぶおおー」\n「藍子さんもー、いかがでしてー？」\n私が吹いたら、すうっと息のもれる音しか出なくて。まゆちゃんと智絵里ちゃんが、くすくす笑っていました。','息を吸って、思いきり吹いてみる。\n……ぷすー。\n「ふふっ。やっぱり、だめですね」\nでも肩の力が抜けて、ちょっとだけ元気が出た。']})});
C('beach','shells',{i:'🐚',t:'波打ち際で貝を探す',s:'砂を掘って貝をとる',c:[3,6],tags:['safe'],run:s=>({get:{clam:ri(1,2)},t:'引き波のあとに残る小さな穴。指で掘ると、貝が出てきた。'})});
C('beach','tide',{i:'🦀',t:'潮だまりをのぞく',s:'取り残された生き物を探す',c:[4,7],tags:['observe','explore'],run:s=>{
  if(!s.clues.crab)return{clue:'crab',know:'tidepool',get:{crab:1},photo:'crab',t:['潮だまりの底に、カニさんがいた。\n「こんにちは。……ちょっとだけ、ごめんなさい」\n甲羅をつまんで持ち上げると、脚がわらわらと宙をかく。',...ep('tide'),'一本、二本……脚は10本。\nでも、ハサミが3本あった。\n「……え？」']};
  const o={t:'',get:{}};const r=R();if(r<.5){o.get.crab=1;o.t='岩のすき間からカニを引っぱり出した。'}else if(r<.75){o.get.fish=1;o.t='逃げ場をなくした小魚を、手ですくった。'}else{o.get.clam=1;o.t='岩に貼りついた貝をはがした。'}
  if(P(.15)){o.d={hp:-5};o.t=hurtAdd(o.t,'slip','濡れた岩で、つるりと足がすべった。\nとっさに手をついて、膝をしたたかにすりむく。血がにじんだ。\n潮だまりの水で傷を洗いながら、ふと思う。……ここで頭を打っていたら。\n濡れた岩の上では、海藻のついていないところを選んで歩こう。','濡れた岩で足をすべらせて、膝をすりむいた。')}return o}});
C('beach','seawater',{i:'🌊',t:'海水を飲む',s:'目の前に水はいくらでもある',c:[0,0],tags:['risk'],dis:s=>known('seawater')&&'海水は飲むほど渇く',run:s=>({d:{water:-8,hp:-4},know:'seawater',hurt:'余計に喉が渇いた',t:firstHurt('seawater',['両手ですくって、ごくごく飲みほす。\nしょっぱさで、一瞬だけ喉がうるおった――気がした。','すぐに、前よりひどい渇きがやってきた。\n舌が上あごに貼りつく。こめかみが、どくどくと脈打つ。\n「……亜季さんに、あれだけ言われていたのに」\n海の水は、飲めば飲むほど体の水を持っていく。わかっていたのに、目の前の青さに負けてしまった。','波打ち際に座りこんで、しばらく動けなかった。\n真水を探そう。今度こそ、ちゃんと。'],'両手ですくって飲みほす。しょっぱさで、一瞬だけ喉がうるおった。\nすぐに、前よりひどい渇きがやってきた。')})});
C('beach','swim',{i:'🏊',t:'海に入って魚を追う',s:'うまくいけば魚が手に入る',c:[6,9],tags:['risk'],run:s=>{const r=R();
  if(r<.3)return{d:{hp:-12},hurt:'クラゲに刺された',know:'jelly',cause:'クラゲの毒',t:firstHurt('jelly',['海に腰までつかって、魚の影を追っていたとき。\n腕に、ぴりっと電気が走った。','次の瞬間、焼けるような痛み。\n腕に赤いみみず腫れが、すうっと浮き上がってくる。\n水の中に、透明な傘がふわりと揺れていた。クラゲ。','「真水じゃなくて、海水で……こすらないで……」\n七海ちゃんに教わったことを、声に出して確かめる。\n浜に上がって、海水でそっと洗い流した。\n肌に残った細い糸のような触手は、素手でさわらず、貝殻のふちでそっとこそげ取る。\n痛みは、夕方まで引かなかった。'],'腕に焼けるような痛み。透明なクラゲが漂っていた。\n七海ちゃんに教わったとおり、海水でそっと洗い流した。')};
  if(r<.6)return{get:{fish:1},t:'浅瀬に追いこんだ魚を、両手でつかみ上げた！\n「や、やりました……！」'};return{d:{hp:-3},t:'魚の影は見えるのに、指先をすり抜けていく。\n泳ぎつかれて、浜でしばらく大の字になった。体力、ないんです。'}}});
C('beach','sos',{i:'🆘',t:'砂浜にSOSを書く',s:'空から見えるように大きく',c:[5,8],tags:['safe'],run:s=>{
  if(s.day>=3&&!s.clues.noplanes)return{clue:'noplanes',t:'流木で大きなSOSを描き直した。\nあおむけに寝ころんで、空を見上げる。\n雲がゆっくり流れていく。ほかには何も通らない。今日も。昨日も。'};
  return{t:'流木を並べて、大きなSOSを描いた。\n最後に、すみっこに小さく「藍子」と書きたした。誰かが見つけてくれますように。'}}});
C('beach','raft',{i:'🛶',t:'いかだで沖へ出る',s:'この島を出られるかもしれない',c:[8,14],tags:['risk','explore'],once:1,w:3,req:s=>s.tools.raft,run:s=>{s.tools.raft=0;s.flags.raftUsed=1;return{d:{hp:-8},clue:'loop',t:['流木のいかだを、波打ち際から押し出した。\nツルで作った櫂で、ひたすら沖へ漕ぐ。島がだんだん小さくなっていく。\n「まっすぐ……まっすぐ……回らないで……」','やがて、白い霧に包まれた。\n自分の手も見えない。お日さまの位置だけを頼りに、まっすぐ、まっすぐ漕ぎ続けた。','どれくらいたっただろう。霧が、ふっと晴れた。\n\n目の前にあったのは、白い砂浜。\n流木で描いた、見覚えのあるSOS。すみっこに「藍子」。','いかだは浜に乗り上げて、ばらばらにくずれた。\n「……戻ってきちゃった」']}}});
C('beach','sunset',{i:'🌅',t:'夕日をながめる',s:'夕方だけ',c:[1,3],tags:['observe'],slot:2,run:s=>{if(!known('greenflash'))return{d:{hp:6},know:'greenflash',photo:'flash',t:['お日さまが水平線――ううん、霧の向こうに沈んでいく。\n最後の一瞬、上のふちが緑色に光った。\n「あっ……！」',...ep('flash')]};return{d:{hp:6},know:'kanten',t:'空が茜色に染まっていく。\n茜ちゃんの色だな、と思った。今日も一日、生きのびました。\n「夕焼けの次の日は、晴れ」漁師のおじいさんの口ぐせ。明日も、きっといいお天気。'}}});

C('forest','fruit',{i:'🫐',t:'木の実を採る',s:'鳥がついばんでいる実だけを選ぶ',c:[4,6],tags:['safe'],run:s=>({get:{fruit:ri(1,2)},t:'鳥がついばんでいた枝から、同じ実をもいだ。\n鳥さんが食べられるなら、きっと大丈夫。'})});
C('forest','redberry',{i:'🔴',t:'見慣れない赤い実を食べる',s:'つやつやしておいしそう',c:[2,3],tags:['risk'],run:s=>{if(P(.45))return{d:{hp:-14,food:-5},hurt:'お腹を下した',know:'unknownplant',cause:'見知らぬ実',t:firstHurt('berry',['つやつやの赤い実をひとつ、口に入れる。\n甘い。……と思ったのもつかの間。','お腹の奥が、ねじれるように痛みだした。\n冷や汗が背中を伝う。木の根もとにしゃがみこんで、浅い息をくり返す。\n「……知らないものは、口に入れない……」\n名人のおばあさんの言葉が、今になって身にしみる。',...ep('plants'),'痛みの波が引くまで、日陰でじっとしていた。\n夕美さん、ごめんなさい。見て楽しむだけに、しておけばよかった。'],'甘い。……と思ったら、またお腹がねじれるように痛みだした。\n知らない実は、やっぱりこわい。')};return{d:{food:12,water:4},t:'甘ずっぱくて、みずみずしい。当たりだったみたい。'}}});
C('forest','mushroom',{i:'🍄',t:'白いキノコを食べる',s:'香りはいい',c:[1,2],tags:['risk'],dis:s=>known('mushroom')&&'知らないキノコは食べない',run:s=>({d:{hp:-22,food:5},hurt:'手足がひどくしびれた',know:'mushroom',cause:'毒キノコ',t:['白いキノコを、ひと口だけかじった。\nいい香り。ほんのり、木の匂いがする。','しばらくして、指先がじんとしびれはじめた。\nしびれは手首へ、腕へ。唇まで、ぴりぴりする。\n立ち上がろうとして、膝から力が抜けた。','木の根もとにうずくまって、ゆっくり息をする。\n少しずつ、水を口にふくむ。\n「大丈夫……大丈夫……」\n自分に言い聞かせながら、半日、動けずに過ごした。',...ep('plants'),'……夕美さんの「とっても危ない子なんだよ」が、今ごろになって聞こえた気がした。']})});

C('forest','herb',{i:'🌱',t:'いい香りの葉を摘む',s:'どこかで嗅いだことのある香り',c:[2,4],tags:['safe'],run:s=>({get:{herb:2},t:['葉をちぎって香りをかぐと、ヨモギに似たやさしい匂いがした。\n島のおばあちゃんの縁側を思い出す。\n知っている葉っぱに、ちゃんと似ているものだけを選んで摘んだ。',...ep('plants'),(s.recipes.tea?'香りのいい葉を、両手いっぱいに摘んだ。':'……これ、お茶にできないかな。')]})});
C('forest','dig',{i:'🥔',t:'芋を掘る',s:'ハート形の大きな葉の根もと',c:[5,7],tags:['craft'],run:s=>P(.7)?{get:{imo:ri(1,2)},know:'taro',t:'タロイモに似た、ハート形の大きな葉。根もとを石で掘ると、ごつごつした芋が出てきた。\n「生で食べちゃだめよ。口がかゆくなるからね」\n島のおばあちゃんの声がする。焚き火で焼こう。'+(owns('pot')&&!s.flags.sealed?'\n……そういえば、新しい土器は、最初に何かを煮るといいんだっけ。':'')}:{t:'掘っても掘っても、細い根ばかりだった。\n手が泥だらけになった。'}});
C('forest','flowers',{i:'🌼',t:'白い小花を摘む',s:'木もれ日の原っぱに咲いている',c:[2,3],tags:['observe'],run:s=>({get:{flower:ri(2,3)},t:'原っぱに、シロツメクサに似た白い花が咲いていた。\n「ごめんね、少しだけ」\n摘んだ花を手のひらにのせると、甘い香りがした。\n夕美さんなら、この花の名前もすぐにわかるのかな。'})});
C('forest','palm',{i:'🌴',t:'ヤシの木に登る',s:'実と葉がまとめて手に入る',c:[6,8],tags:['risk'],run:s=>{if(P(.3))return{d:{hp:-10},get:{coconut:1},hurt:'木から落ちた',cause:'転落',t:firstHurt('palm',['幹にしがみついて、少しずつ登っていく。\nあと少し。実に手が届きそう――','そこで、うっかり下を見てしまった。\n思っていたより、ずっと高い。くらり、と目の前が揺れる。\n手のひらが、汗ですべった。','背中から、砂の上に落ちた。\n息が止まる。しばらく、空しか見えなかった。\n……下が砂でよかった。岩だったら、と思うと、ぞっとする。','体を起こして、手足をひとつずつ動かしてみる。痛いけど、折れてはいない。\n転がってきた実をひとつだけ拾って、そろそろと帰った。'],'途中で下を見てしまって、手がすべった。背中から砂に落ちる。\n転がってきた実をひとつだけ拾った。')};return{get:{coconut:2,leaf:1},t:'下は見ないで、幹にしがみついて登りきった。\n実をふたつ落として、そろそろと降りる。……膝が笑ってる。'}}});
C('forest','fallen',{i:'🥥',t:'落ちたヤシの実を探す',s:'木の根もとを見て回る',c:[3,5],tags:['safe'],run:s=>P(.7)?{get:{coconut:1},t:'根もとの草むらに、熟した実がひとつ落ちていた。'}:{get:{shell:1},t:'あるのは割れて乾いた殻ばかり。\nきれいに半分に割れたものをひとつ拾った。器になりそうだ。'}});
C('forest','deep',{i:'🌳',t:'森の奥へ分け入る',s:'水の音がした気がする',c:[6,10],tags:['explore'],once:1,w:2,req:s=>!s.places.stream,run:s=>{if(P(known('followdown')?.75:.5))return{discover:['stream'],know:'followdown',t:['喉がからから。水を探さなきゃ。\n「迷ったら、沢へ下りちゃいけないよ。落ち着いて、来た道を引き返すの」\n山歩き名人のおばあさんの言葉が、頭の中で聞こえる。',...ep('forest'),'でも、今は水がいる。\n通った枝にツルを結んで目印にしながら、地面のくぼみに沿って、少しずつ下りた。\n子どものころは、迷子になってばかりだった。だから、ふり返って目印を確かめるのを忘れない。','さらさら、と音がした。\n茂みを抜けた先に、澄んだ小川が流れていた。\n思わずかけ寄って、手を浸す。冷たい。\n……でも、このまま飲んで大丈夫かな。']};return{keep:1,d:{water:-4},know:'followdown',t:['シダをかき分けて進むうちに、どっちから来たのかわからなくなった。\n胸がどきどきする。……子どものころ、迷子になったときと同じ。','「迷ったら、落ち着いて、来た道を引き返すの」\n深呼吸して、折れた枝と足あとをたどって、森の入口まで戻った。\n次は、通った道に目印を残しながら進もう。',...ep('forest')]}}});
C('forest','bird',{i:'🐦',t:'鳥の声をたどる',s:'鳥のいる所には実がある',c:[3,6],tags:['observe'],run:s=>{if(!s.clues.bird&&P(.6)){s.flags.recall=1;return{clue:'bird',get:{fruit:1},photo:'bird',t:['枝の上で、青い鳥が実をついばんでいた。\n……あれ？　この色、どこかで――\nふいに鳥がこちらを向いた。小さな顔に、黒い目が四つ並んでいる。\n二股の尾羽をひるがえして、鳥は森の奥へ飛んでいった。','……思い出した。\nあの朝、ポジパ島の浜辺に白い霧が出て、霧のなかから、あの青い鳥が飛んできたんだ。\n一枚撮りたくて追いかけて、岩のアーチをくぐって――\n気がついたら、この島の浜で眠っていた。']}};return{get:{fruit:1},t:'鳥が落とした実を拾った。「ありがとう」'}}});
C('forest','feedbird',{i:'🐦',t:'青い鳥に木の実をわける',s:'木の実1つを持っていく',c:[2,3],tags:['observe'],w:2,req:s=>s.clues.bird&&!s.flags.birdFriend&&inv('fruit')>=1,run:s=>{const n=s.flags.birdN||0;s.flags.birdN=n+1;
  if(n===0)return{get:{fruit:-1},t:'枝の上の青い鳥に、木の実をそっと差し出した。\n「こんにちは。お腹、すいてませんか？」\n四つの目が、じっとこちらを見る。……今日は、降りてきてくれなかった。\n実は枝の根もとに置いておいた。'};
  if(n===1)return{get:{fruit:-1},t:'今日も木の実を差し出すと、青い鳥は枝を一本ずつ降りてきて、手のひらの実をついばんだ。\n小さなくちばしが、くすぐったい。\n「ふふっ。また明日も来ますね」'};
  s.flags.birdFriend=1;return{get:{fruit:-1},photo:'sora',t:['呼ぶより先に、青い鳥が肩に舞い降りてきた。\n「わっ……。ふふっ、おはようございます」','「あなたに、名前をつけてもいいですか？」\nきれいな瑠璃色だから――「ルリちゃん」。\nルリちゃんは、二股の尾羽をふるわせて鳴いた。\n……前にも、こんなふうに瑠璃色の小鳥に名前をつけたことがあるような。夢の中だったかな。\n\nこの島で、はじめてのお友だち。']}}});

C('rocks','stones',{i:'🪨',t:'石を拾う',s:'割れば刃物になる石もある',c:[4,6],tags:['craft'],run:s=>({get:{stone:2},t:'黒くてつやのある石を選んで拾った。\n考古学の先生が持ってきてくれた石に、よく似ている。'})});
C('rocks','rcrab',{i:'🦀',t:'岩陰のカニを捕る',s:'すばしっこい',c:[4,7],tags:['risk'],run:s=>{const o=P(.6)?{get:{crab:1},t:'岩の裏から、カニを引っぱり出した。'}:{t:'逃げられた。「あっ、待って……」'};if(P(.2)){o.d={hp:-4};o.t=hurtAdd(o.t,'pinch','「いたっ……！」\nハサミが、指にがっちり食いこんだ。振っても離れない。\n無理に引っぱったら、指の皮ごと持っていかれそう。\n「はさまれたら、水に浸けてやれ。そうすりゃ放す」\n漁師のおじいさんの言葉を思い出して、潮だまりにそっと手を沈める。\nカニはぱっと指を放して、岩の陰へ逃げていった。','指をはさまれた。痛い……。')}return o}});
C('rocks','seaweed',{i:'svg:seaweed',t:'海藻をかじる',s:'食べられるが、しょっぱい',c:[2,4],tags:['safe'],run:s=>({d:{food:8,water:-4},know:'seaweed',t:'岩に張りついた海藻をかじった。お腹は少し満ちたけれど、喉が渇く。\n七海ちゃんなら、どの海藻がおいしいか、すぐにわかるんだろうな。'})});
C('rocks','eggs',{i:'🥚',t:'海鳥の卵を探す',s:'岩棚の巣をのぞく',c:[4,7],tags:['explore'],run:s=>P(.5)?{get:{egg:ri(1,2)},t:'岩棚のくぼみに、斑点のある卵があった。\n「ひとつだけ、いただきますね」'}:{t:'巣は空っぽだった。'}});
C('rocks','crack',{i:'🕳️',t:'岩の割れ目をのぞく',s:'冷たい風が吹き出している',c:[3,5],tags:['explore'],once:1,w:2,req:s=>!s.places.cave,run:s=>({discover:['cave'],t:'岩と岩のすき間から、ひんやりした風が吹き出している。\n奥は真っ暗。手を伸ばしても、何にも触れない。\n明かりがあれば、進めるかもしれない。'})});
C('rocks','lookup',{i:'⛰️',t:'崖を見上げる',s:'上には何があるんだろう',c:[1,2],tags:['explore'],once:1,w:2.5,req:s=>!s.places.hill,run:s=>({discover:['hill'],t:'岩場の奥に、切り立った崖がそびえている。上には緑が見える。\n登れれば、島じゅうを見渡せそう。\n……高いところは、ちょっと苦手なんだけど。素手で登るには高すぎる。'})});
C('rocks','climb',{i:'🧗',t:'崖をよじ登る',s:'ロープなしで',c:[7,10],tags:['risk','explore'],w:1.5,req:s=>s.places.hill&&!owns('rope')&&!s.flags.climbed,run:s=>{if(P(.45)){s.flags.climbed=1;return{goto:'hill',t:'「下は見ない、下は見ない……」\n指をかけ、足をかけ、息を止めて体を引き上げた。\n崖の上に出た！　膝がまだ震えている。でも、手がかりはもう覚えた。'}}return{d:{hp:-18},hurt:'足をすべらせて落ちた',cause:'転落',know:'santen',t:firstHurt('climb',['岩の出っぱりに指をかけて、体を引き上げる。\n「下は見ない、下は見ない……」\n半分ほど登ったところで、足をかけた岩が、ぼろりと崩れた。','とっさに、見てしまった。下を。\n足がすくむ。指先から、力が抜けていく。','岩場に叩きつけられた。\n腰から背中へ、じんと重い痛みが広がる。\nしばらく、声も出なかった。','「両手両足のうち三つで体を支えて、動かすのは一つずつ。足をかける前に、岩を確かめる」\n名人のおばあさんに教わった登り方を、今さら思い出す。\n縄があれば。せめて、もっとゆっくり登っていれば。'],'半分ほど登ったところで、うっかり下を見てしまった。\n足がすくんで、手がすべる。岩場に落ちて、したたかに腰を打った。\n「縄があれば……」')}}});

C('stream','drinkraw',{i:'🤲',t:'小川の水をそのまま飲む',s:'澄んで見える',c:[1,0],tags:['risk'],run:s=>{if(P(.4))return{d:{water:30,hp:-10,food:-6},hurt:'お腹をこわした',know:'boil',cause:'生水',t:firstHurt('rawwater',['澄んだ水を両手ですくって、ごくごく飲んだ。\n冷たくて、おいしい。','夕方になって、お腹がきりきりと痛みだした。\n何度も茂みに駆けこんで、そのたびに体から水が抜けていく。\n額に脂汗。足に力が入らない。','「澄んで見えても、生水は危ないのであります」\n亜季さんの声。……ちゃんと、言ってたのに。\nお腹をこわすと、飲んだ以上に水を失ってしまう。水は、沸かしてから。'],'冷たい水を、ごくごく飲んだ。\n夕方になって、ひどい腹痛がやってきた。澄んで見えても、生水は危ない。')};return{d:{water:35},t:'冷たくて、体のすみずみまで染みわたる。'}}});
// 水を汲む（小川・地底湖）
const noVessel=s=>!inv('shell')&&!inv('flask')&&!POT.some(k=>inv(k))&&'空の器を持っていない';
C('stream','fetch',{i:'svg:wshell',t:'水を汲む',s:'殻・魔法瓶・土器に汲む',c:[2,4],tags:['safe'],dis:noVessel,run:s=>fetchWater(s,'stream')});
C('cave','lakefetch',{i:'svg:wshell',t:'地底湖の水を汲む',s:'殻・魔法瓶・土器に汲む',c:[2,3],tags:['safe'],dis:noVessel,run:s=>fetchWater(s,'lake')});
function fetchWater(s,where){
  const n=inv('shell'),fl=inv('flask'),get={},parts=[];
  if(n){get.shell=-n;get.wshell=n;parts.push('ヤシの殻')}
  if(fl){get.flask=-fl;get.wflask=fl;parts.push('魔法瓶')}
  const pk=POT.find(k=>inv(k));
  if(pk){if(pk!=='wpot'){get[pk]=-1;get.wpot=1}s.potW=s.flags.sealed?3:1;parts.push(s.flags.sealed?'土器（3杯分）':'土器')}
  const leak=pk&&!s.flags.sealed?'\n……土器の底から、じわりと水がしみ出してくる。一杯分しか持ちそうにない。':'';
  if(where==='lake')return{get,t:'松明を岩のすき間に立てかけて、地底湖のほとりにしゃがむ。\n持ってきた'+parts.join('と')+'を、しんと冷えた水にそっと沈めた。\nこぼさないように葉でふたをする。'+leak+'\nこのまま飲んでもよさそうなくらい澄んでいるけれど、持ち歩くあいだに何が入るかわからない。'+(known('boil')?'念のため、野営地で沸かしてから飲もう。':'')};
  return{get,t:'持ってきた'+parts.join('と')+'に、水を汲んだ。こぼさないように葉でふたをする。'+leak+(known('boil')?'\n野営地で沸かしてから飲もう。':'')};
}

C('stream','upstream',{i:'🌫️',t:'上流をたどる',s:'水はどこから来るのだろう',c:[6,9],tags:['explore'],once:1,w:2,req:s=>!s.places.ruins,run:s=>{if(clueN(s)>=4)return{discover:['ruins'],t:['岩を越え、苔の斜面を登る。やがて濃い霧が立ちこめた。\n……この霧、なんだかなつかしい。','霧の切れ間に、石の柱が並んでいるのが見えた。\n自然にできたものじゃない。誰かが、ここに立てたものだ。']};return{discover:['ruins'],t:'上流へ行くほど霧が濃くなって、足もとも見えなくなった。引き返すしかない。\nこの霧の先へ進むには、まだ何かが足りない気がする。\nこの島のことを、もっとよく知らなきゃ。'}}});

C('cave','moss',{i:'✨',t:'光る苔を観察する',s:'壁がぼんやり青い',c:[2,4],tags:['observe'],once:1,w:2,run:s=>({clue:'moss',know:'hikarigoke',photo:'moss',t:['岩壁の苔が、ぼんやりと青く光っている。\n松明を背中に隠してみた。\nまっくらな中で、苔だけが青く光り続けていた。',...ep('cave'),'鍾乳洞のガイドさんは、ヒカリゴケは自分では光らないって言っていた。\n……じゃあ、この苔は？']})});
C('cave','mural',{i:'🖐️',t:'壁画を調べる',s:'岩肌に何か描かれている',c:[3,5],tags:['observe'],once:1,w:2,run:s=>({clue:'mural',get:{shard:1},photo:'mural',t:['奥の岩壁に、赤い顔料で絵が描かれていた。\n松明を近づける。','空に、大小ふたつの円。\nその下に、柱が並ぶ石の門。\n海の上には舟。舟から降りる、小さな人の姿がいくつも。\n「私みたいに、迷いこんだ人たち……？」','絵の下のくぼみに、青い石のかけらがはめこまれていた。\nそっと外すと、かけらは手のひらでかすかに光った。']})});

C('cave','cavelife',{i:'🛖',t:'ここで暮らせないか考える',s:'雨もしのげるし、水もある',c:[1,2],tags:['observe'],once:1,w:3,run:s=>({know:'cavelife',t:['ひんやりした岩壁に、手を当てて考える。\n雨はしのげる。地底湖の水もある。苔のおかげで、真っ暗でもない。\n……ここに住めたら、楽かもしれない。','でも、しばらく座っていると、背中から冷えがしみこんでくる。\n外はあんなに暑いのに、ここは一日じゅう、ひんやりしたまま。\n岩壁はじっとり濡れていて、服も、拾ってきた枝も、乾きそうにない。','鍾乳洞の回で、ガイドさんが言っていた。\n「洞窟の中は、一年じゅうほとんど同じ温度なんだ。夏はすずしいけど、寝泊まりするには冷えすぎるし、湿気で体が冷える」\n「それに、奥で火を焚くと、煙の逃げ場がないからね」','足もとの砂に、波のようなすじが残っていた。岩壁の、私の背より高いところにも、水のあとの線。\n……大雨のあとは、地底湖の水がここまで上がってくるんだ。\nそれに、ここからは海が見えない。もし船が通っても、狼煙も、手を振ることもできない。','「……休ませてもらうのは、入口のあたりまでにしよう」\n住むのは、お日さまと海の見える、あの岩陰。\n洞窟は、水を汲みに来て、苔の光をながめに来る場所。']})});
C('cave','deeper',{i:'svg:torch',t:'洞窟の奥へ進む',s:'足もとに注意',c:[5,7],tags:['explore'],run:s=>{const o={get:P(.5)?{stone:2}:{clay:1},t:'奥へ進むと、粘土質の床と崩れた岩があった。使えそうなものを拾う。'};if(P(.25)){o.d={hp:-8};o.hurt='天井に頭をぶつけた';o.t=hurtAdd(o.t,'head','ごつん。\n低い天井に、思いきり頭をぶつけた。目の前に星が散る。\n松明を落としそうになって、あわてて握りなおす。……ここで火を落としたら、まっくらだ。\nしゃがみこんで、痛みが引くのを待った。\n茜ちゃんの気持ちが、ちょっとわかった。洞窟では、頭を低く。','低い天井に頭をぶつけた。……洞窟では、頭を低く。')}else if(P(.3))o.t+='\n足もとを何かがカサカサと横切った。「ひゃっ……！」虫は、苦手です。';return o}});

C('hill','overlook',{i:'🏝️',t:'島を見渡す',s:'島の形を確かめる',c:[3,6],tags:['explore','observe'],once:1,w:2,run:s=>{const o={noGo:1,clue:'fogwall',photo:'overlook',t:['島は、思っていたより小さい。歩いて一日でひと回りできそう。\n浜辺、森、岩場。自分の野営地の煙も見える。','視線を沖へ移す。\n……どの方角も、海の少し先で、白い霧が壁のように立ちのぼっている。\n空と海の境目が、どこにも見えなかった。']};if(!s.places.stream){o.discover=['stream'];o.t.push('森の中に、光る筋が見えた。小川だ。')}return o}});
C('hill','stars',{i:'🌌',t:'星が出るのを待つ',s:'夕方だけ',c:[2,4],tags:['observe'],slot:2,once:1,w:2,run:s=>({clue:'stars',know:'polaris',photo:'stars',t:['日が沈んで、空いっぱいに星が広がった。\nこんなに星の多い空は、はじめて。',...ep('stars'),'北の空を探す。ひしゃくの形。カシオペヤのW。\n目をこらしても、どの星をつないでも、見覚えのある形にならない。\n「……未央ちゃん。北極星、どこにもないよ」']})});
C('hill','smoke',{i:'💨',t:'狼煙を上げる',s:'枯れ枝1・ヤシの葉1を持っていく',c:[5,7],tags:['explore'],req:s=>s.fire&&inv('twig')>=1&&inv('leaf')>=1,run:s=>{const o={get:{twig:-1,leaf:-1},know:'smoke',t:['焚き火の燠を運んで、青い葉をくべた。白い煙が高く昇っていく。',...ep('smoke')]};if(!s.clues.noplanes){o.clue='noplanes';o.t.push('日が傾くまで待った。\n返事の煙も、船も、飛行機も、何も来なかった。')}else o.t.push('誰も来ない。\nそれでも、白い煙がまっすぐ昇っていくのを見ていると、少しだけ心が強くなる。');return o}});
C('hill','nest',{i:'🪺',t:'海鳥の巣を探る',s:'崖のふちにある',c:[4,6],tags:['risk'],run:s=>{let o;if(!s.flags.nestShard){s.flags.nestShard=1;o={get:{shard:1},t:'崖のふちに腹ばいになって、巣をのぞいた。下は見ない。\n巣の中に、卵といっしょに、青く光る石のかけらがあった。\n鳥が光るものを集めてきたのかな。'}}else o=P(.6)?{get:{egg:1},t:'卵をひとつ、ゆずってもらった。'}:{t:'親鳥に追い払われた。「ご、ごめんなさい」'};if(P(.15)){o.d={hp:-5};o.t=hurtAdd(o.t,'peck','頭の上で、ばさっと羽音がした。\n親鳥が、鋭いくちばしで頭をつついてくる。何度も、何度も。\n「ご、ごめんなさい……！」\n腕で頭をかばいながら後ずさる。……すぐ後ろは、崖のふち。\nあわてて動くのが、いちばん危ない。息を整えて、ゆっくり、ゆっくり離れた。','親鳥に頭をつつかれた。')}return o}});
C('hill','breeze',{i:'🍃',t:'風に吹かれて休む',s:'体力を回復する',c:[2,4],tags:['safe'],run:s=>({d:{hp:8},t:'白い小花の咲く草の上に寝ころぶ。風の音だけが聞こえる。\nこういう時間が、私はいちばん好きです。'})});

C('ruins','tablet',{i:'svg:tablet',t:'石板の文字を調べる',s:'柱のそばに倒れている',c:[2,4],tags:['observe'],once:1,w:2,run:s=>({clue:'script',know:'rosetta',t:['石板には、三段にわたって文字が刻まれている。\n角ばった記号。丸い記号。波のような線。どの段も、見たことのない形。\n一番下の段にだけ、ふたつの円が重なる絵があった。',...ep('museum')]})});
C('ruins','rubble',{i:'🪨',t:'がれきをどける',s:'何か埋まっているかも',c:[6,8],tags:['explore'],run:s=>{let o;if(!s.flags.rubbleShard){s.flags.rubbleShard=1;o={get:{shard:1},t:'崩れた柱の下から、青い石のかけらが出てきた。'}}else o={get:{stone:2},t:'石ばかりだ。'};if(P(.2)){o.d={hp:-6};if(!s.seen['hurt:cut'])o.know='firstaid';o.t=hurtAdd(o.t,'cut','崩れた石のふちで、手のひらをざっくり切った。\n赤い血が、ぽたぽたと苔の上に落ちる。\n「……落ち着いて」\n持ってきた水で傷口の砂を洗い流して、ハンカチを当てて、ぎゅっと押さえる。\n亜季さんに教わった応急手当て。しばらく押さえていると、血は止まった。','崩れた石で手を切った。')}return o}});

const RECIPES=[
  {id:'fire',i:'🔥',t:'火を起こす',show:s=>have('wood')||have('twig'),need:s=>bowOK()?{twig:2,wood:1,vine:1}:{twig:2,wood:1},req:s=>!s.fire,run:s=>{const ok=bowOK()?.9:.3;if(P(ok)){s.fire=1;return{know:'driftwood',made:'火',photo:'fire',t:[

      'やがて、板のくぼみにたまった黒い粉から、細い煙が立ちのぼった。\n息を止めて、粉を枯れ草の束に移す。\n両手で包んで、そっと、長く、息を吹きこむ。',
      'ぼっ、と。\n手の中に、オレンジ色の火が生まれた。',

    return{get:{twig:-1},know:'bowdrill',keepMats:1,t:['乾いた流木の板に枝を立てて、両手でもみこむ。\n手のひらが熱くなって、うっすら煙が上がった。','……そこまでだった。\n腕が先に音を上げた。手のひらに水ぶくれができている。\n「握力、ないんですよね、私……」','亜季さんの声を思い出す。\n「藍子殿は、力ではなく道具に頼るのであります」\nツルを弦にした弓で錐を回せば、もっと速く、長く回せるはず。次はそうしよう。']}}},
  {id:'bed',i:'🛏️',t:'寝床をつくる',show:s=>have('leaf'),need:{leaf:3,wood:2},req:s=>s.shelter===0,run:s=>{s.shelter=1;return{know:'ground',made:'寝床',photo:'bed',t:['流木を四角く組んで枠にして、そこへヤシの葉を何枚も重ねた。',...ep('bed'),'横になってみる。\nゆうべまで背中を冷やしていた砂の冷たさが、うそのように消えた。\n葉っぱの青い匂い。今夜はぐっすり眠れそう。']}}},
  {id:'knife',i:'svg:knife',t:'石ナイフ',show:s=>have('stone'),need:{stone:2},req:s=>!owns('knife'),run:s=>({tool:'knife',know:'conchoidal',made:'石ナイフ',t:['石同士を打ちつける。……割れない。\n「迷わず、ね」\n息をひとつ吸って、角を狙って、迷わず打った。',...ep('knife'),'貝殻のような曲面を描いて、薄いかけらが剥がれた。\nふちに指を当てると、ひやりとするほど鋭い。']})},
  {id:'rope',i:'🪢',t:'ロープを編む',show:s=>have('vine')||s.places.hill,need:{vine:3},req:s=>!owns('rope'),run:s=>({tool:'rope',know:'rope',made:'ロープ',t:['ツルを細く裂いて、同じ向きにねじる。それを逆向きに撚り合わせる。\nゆっくりでいい。目をそろえて。',...ep('rope'),'体重をかけても切れない縄ができた。'+(s.places.hill&&!s.flags.climbed?'\nこれで、あの崖を登れる。……登れる、はず。':'')]})},

  {id:'tea',i:'🍵',t:'葉っぱのお茶を淹れる',show:s=>have('herb'),need:{herb:2},tools:['pot'],fire:1,req:s=>true,run:s=>{const first=!s.flags.tea;s.flags.tea=1;return{know:'herbtea',made:first?'葉っぱのお茶':null,photo:first?'tea':null,get:{tea:2},t:first?['香りのいい葉を焚き火のそばで軽くあぶって、土器のお湯に落とした。\nふわりと、やさしい香りが立ちのぼる。',...ep('tea'),'殻の器にふたつ注いで、ひとつを岩の上に置いた。\n……つい、もうひとり分淹れちゃった。\n歌鈴ちゃんに紅茶の淹れ方を教えたとき、「藍子ちゃん先生」って呼ばれたのを思い出す。\n「ふふっ。いつものくせ、ですね」']:'香りのいい葉をあぶって、お茶を淹れた。湯気が、ふわりと岩陰に広がる。'}}},
  {id:'crown',i:'🌼',t:'花かんむりを編む',show:s=>have('flower'),need:{flower:3,vine:1},req:s=>!s.tools.crown,run:s=>({tool:'crown',made:'花かんむり',photo:'crown',t:['白い小花の茎を、一本ずつ巻きつけながら編んでいく。\n小さいころから、何度も作ってきた。指が覚えている。',...ep('crown'),'できあがった花かんむりを、そっと頭にのせた。\n「……ふふっ。誰も見てないけど」\n水たまりに映った自分が、少しだけ笑っていた。\n（花の香りで、夜よく眠れるようになった）']})},
  {id:'hut',i:'🛖',t:'屋根のある小屋',show:s=>s.shelter>=1,need:{wood:4,vine:2,leaf:3},tools:['knife'],req:s=>s.shelter===1,run:s=>{s.shelter=2;return{made:'小屋',photo:'hut',t:['流木の柱を四本、砂に深く突き立てる。\nツルで梁をしばって、ナイフで葉の軸を整えて、屋根を下から一枚ずつふいていく。\n「何事も、下から」',...ep('hut'),'夕方、ぱらぱらと雨が降りだした。\n屋根の下で膝を抱えて、雨の音を聞く。ひとつも、濡れない。']}}},
  {id:'house',i:'🏠',t:'高床の家',show:s=>s.shelter>=2,need:{wood:6,vine:3,stone:2},tools:['rope','knife'],req:s=>s.shelter===2,run:s=>{s.shelter=3;return{made:'高床の家',photo:'house',t:['平たい石を土台に並べて、その上に柱を立てる。\nロープで床を高く組み上げて、流木を一本ずつ渡していく。','最後の一本を渡して、ひとりで小さく言ってみた。\n「せーの……ポジパ、DASH」',...ep('house'),'完成した床に寝ころぶと、潮風が床下を抜けていった。\n虫も、波しぶきも、もうここまでは上がってこない。\n\nここはもう、ちゃんとしたおうちです。']}}},

  {id:'pot',i:'🏺',t:'土器を焼く',show:s=>have('clay'),need:{clay:2,wood:1},fire:1,req:s=>!owns('pot'),run:s=>({tool:'pot',know:'pottery',made:'土器',photo:'pot',t:['粘土をこねてひも状にして、くるくると巻き上げて器の形にした。\n今度は、乾かしすぎないように。日なたで様子を見ながら乾かして、焚き火の真ん中に埋める。',...ep('pot'),'火が落ちるのを待って掘り出すと、器は赤茶色に焼きしまっていた。\n指で弾くと、こん、と澄んだ音がした。\nひびは、ひとつもない。これで、水を沸かせる。\n……でも、水を入れてみると、底がうっすら湿ってくる。焼きたての器には、目に見えないすき間があるんだっけ。\n帰ったら、肇ちゃんに見てもらおう。']})},

// 増減。野営地にいるときは蓄えへ、外ではリュックへ（上限あり）
function gain(k,n,res){
  if(n>0){
    if(atCamp()){S.store[k]=(S.store[k]||0)+n;res.gets.push([k,n]);return}
    let put=n;
    if(!KEYI.includes(k)){const room=Math.max(0,cap()-packN());put=Math.min(n,room)}
    if(put){S.inv[k]=inv(k)+put;res.gets.push([k,put])}
    if(n-put>0)res.lost.push([k,n-put]);
  }else if(n<0){
    let need=-n;const fromPack=Math.min(need,inv(k));S.inv[k]=inv(k)-fromPack;need-=fromPack;
    if(need&&atCamp())S.store[k]=Math.max(0,(S.store[k]||0)-need);
    if(!S.inv[k])delete S.inv[k];if(S.store[k]===0)delete S.store[k];
    res.gets.push([k,n]);
  }
}

  if(d.hp<0)S.cause=o.cause||'けがと疲労';
  if(!free){
    if(S.food<=0){S.hp=clamp(S.hp-8);extra.push(firstHurt('hunger','お腹が鳴るのを通りこして、手足に力が入らない。\n目の前が、ときどきちかちかする。\n……何か、食べないと。（体力 −8）','空腹で力が抜ける（体力 −8）'));S.cause='空腹'}
    if(S.water<=0){S.hp=clamp(S.hp-10);extra.push(firstHurt('thirst','喉が焼けつくように渇く。\n頭がぼうっとして、まっすぐ歩けない。\n「水がないと、3日……」亜季さんの声が、遠くで聞こえる。\n何より先に、水を。（体力 −10）','喉が焼けつくように渇く（体力 −10）'));S.cause='渇き'}
  }

function think(){

  const h=handOf(S.place);

  const en=pool.filter(c=>!disOf(c)),di=pool.filter(c=>disOf(c));

  const must=[];
  for(const[need,ids]of [[S.water<LOWNEED,FIND.water],[S.food<LOWNEED,FIND.food]].sort((a,b)=>(a[1]===FIND.water?S.water:S.food)-(b[1]===FIND.water?S.water:S.food))){

}

function act(c){

  if(!S){renderTitle();return}
  if(S.phase==='end'){renderResult();return}
  if(S.phase==='night'){renderNight();return}
  app.innerHTML=`<header class="hud" id="hud"></header>
  <div class="move-note" id="mnote"></div>
  <main id="main"></main>
  <nav class="bottom three" id="nav"></nav>`;
  renderHud(!!UI.animHud);UI.animHud=false;renderPlaces();renderMain(deal);renderNav();

function gHTML(cls,ic,lab,v,low){return`<div class="g ${cls}${v<=25?' low':''}" role="meter" aria-label="${lab}" aria-valuenow="${v}" aria-valuemin="0" aria-valuemax="100"><div class="g-head">${ic} ${lab} <span class="g-state">${low}</span><b>${v}</b></div><div class="bar"><i class="ghost" style="width:${v}%"></i><i class="fill" style="width:${v}%"></i></div></div>`}
function renderHud(animate){
  const h=document.getElementById('hud');if(!h)return;
  const prev=UI.lastHud;
  if(!h.firstChild)h.innerHTML=`<div class="hud-top"><span class="day" id="dayl"></span><span class="pips" id="pips"></span><span class="hud-place" id="hplace"></span></div><div class="gauges">${gHTML('hp','♥','体力',S.hp,'危険')}${gHTML('food','🍖','満腹',S.food,'空腹')}${gHTML('water','💧','水分',S.water,'渇き')}</div>`;
  document.getElementById('dayl').textContent=S.day+'日目';
  document.getElementById('pips').innerHTML=SLOTS.map((x,i)=>`<span class="pip ${i<S.slot?'done':i===S.slot?'now':''}"><i aria-hidden="true">${ic(SLOT_I[i])}</i>${x}</span>`).join('');
  document.getElementById('hplace').innerHTML=ic(PLACES[S.place].i)+' '+PLACES[S.place].n;
  [['hp',S.hp],['food',S.food],['water',S.water]].forEach(([k,v])=>{
    const g=h.querySelector('.g.'+k);g.classList.toggle('low',v<=25);g.setAttribute('aria-valuenow',v);
    g.querySelector('b').textContent=v;
    const fill=g.querySelector('.fill'),ghost=g.querySelector('.ghost');
    const old=prev?prev[k]:v;
    if(animate&&prev&&old!==v){
      fill.style.transition='none';ghost.style.transition='none';fill.style.width=old+'%';ghost.style.width=old+'%';void fill.offsetWidth;
      fill.style.transition='';ghost.style.transition='';
      requestAnimationFrame(()=>{fill.style.width=v+'%';ghost.style.width=v+'%'});
      const fl=document.createElement('span');fl.className='float '+(v<old?'neg':'pos');fl.textContent=(v>old?'+':'')+(v-old);g.appendChild(fl);setTimeout(()=>fl.remove(),1200);
    }else{fill.style.width=v+'%';ghost.style.width=v+'%'}
  });
  UI.lastHud={hp:S.hp,food:S.food,water:S.water};
}
function renderPlaces(){

function deltaChips(d){return[['体力','hp'],['満腹','food'],['水分','water']].filter(([,k])=>d[k]).map(([n,k])=>`<span class="get ${d[k]<0?'neg':'pos'}">${n} ${d[k]>0?'+':''}${d[k]}</span>`).join('')}

function pageHTML(p,cls){if(p&&p.ep)return`<div class="ep${cls&&/turn/.test(cls)?' page turn':''}"><div class="eph">📺 ポジパDASH ${esc(p.ep)}</div><p>${esc(p.t)}</p></div>`;return`<p class="${cls||'story'}">${esc(p)}</p>`}
function photoHTML(id,snapped){if(!id||!PHOTO[id])return'';if(S.album.includes(id))return!snapped?'':`<div class="snap done">📷 撮った：${esc(PHOTO[id][1])}</div>`;if(S.film<=0)return'<div class="snap done">📷 フィルムが、もう残っていない</div>';return`<button class="snap" id="snap" data-ph="${id}">📷 この瞬間を撮る<small>のこり ${S.film} 枚</small></button>`}

function albumHTML(list){return`<div class="album">${list.map(id=>`<figure class="ph"><div class="phi">${ic(PHOTO[id][0])}</div><figcaption>${esc(PHOTO[id][1])}</figcaption></figure>`).join('')}</div>`}
function renderMain(deal){
  const m=document.getElementById('main');

      (r.ideas||[]).forEach(t=>chips+=`<span class="get idea">💡 ひらめき：${t}</span>`);
      if(chips)body+=`<div class="gets">${chips}</div>`;

  if(S.work){
    const list=RECIPES.filter(r=>S.recipes[r.id]&&r.req(S)).map(r=>({r,why:craftReason(r)})).sort((a,b)=>(a.why?1:0)-(b.why?1:0));
    const co=costOf(CARDS.work.c);
    m.innerHTML=head+`<div class="thinkhead">🔨 何を作ろう？<small>作ると時間が進む（満腹 −${co.food}・水分 −${co.water}）。材料は野営地の蓄えとリュックから使う。</small></div>`+
      (list.map(({r,why})=>{const mats=Object.entries(needOf(r)).map(([k,n])=>`<span class="mat ${have(k)>=n?'ok':'short'}">${ic(ITEMS[k][1])}${ITEMS[k][0]} ${have(k)}/${n}</span>`).join('')+(r.tools||[]).map(t=>`<span class="mat ${S.tools[t]?'ok':'short'}">${ic(TOOLS[t][1])}${TOOLS[t][0]}</span>`).join('')+(r.fire?`<span class="mat ${S.fire?'ok':'short'}">🔥火</span>`:'');
        return`<div class="row"><span class="ri">${ic(r.i)}</span><span class="rn">${r.t}${r.id==='fire'?`<small>${bowOK()?'弓きり式（ツルを弦に使う）で成功しやすい':known('bowdrill')?'ツルがあれば弓きり式にできる':'うまくいくとは限らない'}</small>`:''}<div class="mats">${mats}</div></span><button class="mini" data-craft="${r.id}" ${why?'disabled':''}>${why?esc(why):'作る'}</button></div>`}).join('')||'<p class="hint" style="text-align:left">まだ、作れそうなものを思いつかない。<br>島で何かを拾ってくれば、ひらめくかもしれない。</p>')+

    }

const THINK={beach:'波打ち際で、何をしようか考える',forest:'森の入口で、何をしようか考える',rocks:'岩場で、何をしようか考える',stream:'小川のほとりで、何をしようか考える',camp:'野営地で、何をしようか考える',hill:'崖の上で、何をしようか考える',cave:'洞窟で、何をしようか考える',ruins:'石の門の前で、何をしようか考える'};
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
function cardHTML(c,o={}){
  const co=costOf(c.c);const dis=disOf(c);const so=!o.idea&&slotOff(c);const hurt=S.hurt[c.id];
  let notes='';
  if(dis)notes+=`<span class="note">🚫 ${esc(dis)}</span>`;
  else{
    if(o.idea&&c.slot!=null)notes+=`<span class="note info">🕒 夕方にできる</span>`;
    if(so)notes+=`<span class="note">🕒 ${esc(so)}</span>`;
    if(hurt)notes+=`<span class="note warn">⚠ 前回：${esc(hurt)}</span>`;
    const zf=co.food>0&&S.food-co.food<=0,zw=co.water>0&&S.water-co.water<=0;
    if(!o.idea&&!so&&!c.work&&(zf||zw))notes+=`<span class="note danger">${zw?'💧 水分':'🍖 満腹'}が尽きる → 体力が減る</span>`;
  }
  let sub=c.s;
  if(c.work){const n=RECIPES.filter(r=>S.recipes[r.id]&&r.req(S)&&!craftReason(r)).length;sub=n?`いま作れるもの：${n}`:'道具や住まいを作る'}
  const costs=c.work?'<i class="cost">作るものを選ぶ</i>':(co.food?`<i class="cost f">満腹 −${co.food}</i>`:'')+(co.water?`<i class="cost w">水分 −${co.water}${heat()&&c.c[1]>0?'（暑さ+2）':''}</i>`:'')+(!co.food&&!co.water?'<i class="cost">消耗なし</i>':'')+(c.once&&!c.fixed?'<i class="cost once">一度きり</i>':'');
  const off=dis||so;const tag=o.tag||'button';
  return`<${tag} class="card ${off?'off':''} ${hurt&&!off?'warn':''} ${o.deal!=null?'deal':''} ${o.fresh?'fresh':''} ${o.cls||''}" ${o.deal!=null?`style="animation-delay:${o.deal*90}ms"`:''} data-id="${c.id}" ${off?'aria-disabled="true"':''}>
    <span class="ci" aria-hidden="true">${ic(c.i)}</span><span><span class="ct">${esc(c.t)}</span>${o.fresh?'<span class="newtag">NEW</span>':''}<div class="cs">${esc(sub)}</div></span>
    <span class="costs">${costs}</span>${notes}</${tag}>`;
}

    else if(tab==='ep')h+=eps.length?eps.map(e=>`<div class="ep"><div class="eph">📺 ポジパDASH ${esc(EP[e][0])}</div><p>${esc(EP[e][1])}</p></div>`).join(''):'<p class="hint" style="text-align:left">島で新しいことをすると、ポジパDASHで教わったことを思い出す。</p>';
    else if(tab==='album')h+=(S?'':'<p class="hint" style="text-align:left;margin-top:0">これまでに撮った写真</p>')+(album.length?albumHTML(album):'<p class="hint" style="text-align:left">まだ一枚も撮っていない。トイカメラのフィルムは '+FILM+' 枚。</p>');
    else h+=Object.entries(K).map(([k,[t,b,src]])=>known(k)?`<div class="kn"><b>${t}</b>${src?`<small class="src">${esc(src)}</small>`:''}<p>${b}</p></div>`:'<div class="kn unk"><b>？？？</b></div>').join('');
  }
  sh.innerHTML=h;
  app.appendChild(v);app.appendChild(sh);
  sh.querySelector('.close').onclick=()=>closeSheet();
  sh.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>useItem(b.dataset.use,+b.dataset.i));
  sh.querySelectorAll('[data-carry]').forEach(b=>b.onclick=()=>carry(b.dataset.carry,+b.dataset.d));
  sh.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>move(b.dataset.go));
  sh.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{UI.noteTab=b.dataset.tab;openSheet('know')});
  sh.querySelector('.close').focus({preventScroll:true});
}
function closeSheet(silent){
  document.querySelectorAll('.veil,.sheet').forEach(e=>e.remove());
  UI.sheet=null;
  if(!silent&&S&&S.phase==='play'){renderNav();const b=document.querySelector('[data-s="bag"]');if(b)b.focus({preventScroll:true})}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.sheet)closeSheet()});

function renderNight(){
  const n=S.night,pg=pages(n.t),pi=n.page||0,last=pi>=pg.length-1;
  app.innerHTML=`<div class="nightwrap"><h2>${S.day}日目の夜</h2><div class="sky" aria-hidden="true">🌕${S.clues.moons?'<span class="moon2">🌕</span>':''}　✦ ✧</div>
  ${pageHTML(pg[pi],'page'+(pi?' turn':''))}
  ${last?`${knBox(n.kn)}${photoHTML(n.photo,n.snapped)}<div class="ledger">${n.lines.map(([a,b,c])=>`<div><span>${a}</span><span class="${c}">${b}</span></div>`).join('')}
  <div style="border-top:1px solid #ffffff30;margin-top:6px;padding-top:6px"><span>朝の状態</span><span>♥ ${S.hp}　🍖 ${S.food}　💧 ${S.water}</span></div></div>`:''}
  <button class="btn" id="morn">${!last?'つづき ▸':S.hp<=0?'結果を見る':S.day>=30?'三十日目の朝へ':'朝を迎える'}</button></div>`;
  const b=document.getElementById('morn');b.onclick=morning;b.focus({preventScroll:true});bindPhoto(renderNight);
}
function renderTitle(){
  const run=store.get('aiko_drift_run1');
  const ne=Object.keys(META.eps||{}).length;
  app.innerHTML=`<div class="title"><div class="kick">ポジパDASH 番外編</div><h1>藍子の漂流日記</h1><div class="wave">〜〜〜　〜〜　〜〜〜</div>
  ${run&&run.phase!=='end'?`<button class="btn" id="cont">つづきから（${run.day}日目・${SLOTS[run.slot]||'夜'}）</button><button class="btn sub" id="start">はじめから</button>`:'<button class="btn" id="start">はじめる</button>'}
  <div class="meta"><div><b>${META.best||0}日</b>最長の日数</div><div><b>${Object.keys(META.endings||{}).length}/2</b>エンディング</div><div><b>${ne}/${Object.keys(EP).length}</b>DASHの思い出</div></div>
  ${ne||META.runs?'<button class="btn sub" id="notebook">📓 手帳を見る</button>':''}
  <div class="howto">・高森藍子が、番組『ポジパDASH』で教わった知恵を頼りに、ひとりで島を生きのびる。<br>・「考える」と案が3つ浮かぶ。1つ選んで、その場所の手札（3枚まで）に加える。<br>・手札の行動を選ぶと時間が進む（1日に朝・昼・夕の3回）。<br>・行動すると満腹と水分が減る。どちらかが0になると体力が減り、0で終わり。<br>・移動には満腹と水分を使う。遠い場所ほど多く減る。<br>・作ることと火で焼くことは、野営地でしかできない。<br>・新しいことをすると、番組の思い出がよみがえる。<br>・トイカメラのフィルムは${FILM}枚。残したい瞬間を選んで撮ろう。</div>
  <a class="back" href="index.html">← お話の一覧へ</a></div>`;
  document.getElementById('start').onclick=()=>{if(run&&run.phase!=='end'&&!confirmReset())return;newRun();render()};
  const c=document.getElementById('cont');if(c)c.onclick=()=>{S=run;UI=freshUI();render()};
  const nb=document.getElementById('notebook');if(nb)nb.onclick=()=>{UI.noteTab='ep';openSheet('know')};
}
let resetArmed=false;
function confirmReset(){if(resetArmed)return true;resetArmed=true;const b=document.getElementById('start');b.textContent='もう一度押すと、今の記録を消してはじめる';setTimeout(()=>{resetArmed=false;if(b.isConnected)b.textContent='はじめから'},3500);return false}

function renderResult(){
  const k=S.ending;
  const bird=S.flags.birdFriend,al=S.album;
  const E={
    dead:['GAME OVER','力尽きる',`砂の上に倒れこんだ。\n波の音が、少しずつ遠くなっていく……\n\n「あーちゃーん！」\nどこかで、未央ちゃんの声が聞こえた気がした。\n\n原因：${S.cause||'疲労'}`],
    return:['ENDING','おかえりなさい','門をくぐった瞬間、ふたつの月の光が背中で重なった。\n霧が渦を巻いて、潮の匂いが変わる。'+(bird?'\n\n肩の上で、ルリが小さく鳴いた。ふり向くと、青い羽が一枚、霧の向こうへ舞っていった。\n「……またね、ルリちゃん。どこかの森で、また会える気がする」':'')+'\n\n目を開けると、ポジパ島の浜辺だった。\n岩のアーチ。ロケのテント。朝ごはんの匂い。\n\n「あーちゃん！　どこ行ってたの、もう！」\n「藍子ちゃーーん！　探しましたよーっ！！」\n走ってくる未央ちゃんと茜ちゃん。その後ろで、プロデューサーさんが、ほっとしたように笑っていた。\n\n私がいなくなっていたのは、ほんの一時間だったそうです。\n\n「……ただいま。あのね、聞いてほしいお話が、たくさんあるんです」'+(al.includes('moons')?'\n\n後日、トイカメラの写真を現像したら、ふたつの月がちゃんと写っていました。\n三人で、しばらく何も言えませんでした。':al.length?'\n\n後日、トイカメラの写真を現像して、三人で一枚ずつ眺めました。\n「これ、どこ？」って聞かれて、私は「ないしょです」って笑いました。\nいちばんお気に入りの一枚は、歌鈴ちゃんとの「藍鈴ダイアリー」に貼りました。':'')],
    survive:['ENDING','三十日目の朝','三十日目の朝。\n水の探し方も、火の起こし方も、もう体が覚えている。\n今日も、日記の最初に書く。\n「未央ちゃん、茜ちゃん、プロデューサーさんへ。私は元気です」\n\n霧の向こうに帰り道があると信じて、今日もゆっくり、浜辺をお散歩する。'+(bird?'\n肩の上には、ルリ。':'')]
  }[k];
  const tg=S.tags,max=Math.max(...Object.values(tg));
  const top=Object.keys(tg).sort((a,b)=>tg[b]-tg[a])[0];
  const per=max>0?PERSONA[top]:['まだ何者でもない藍子','次の島では、どんな藍子になるだろう。'];
  const placesN=Object.keys(S.places).length;
  app.innerHTML=`<div class="res"><div class="kind">${E[0]}</div><h1>${E[1]}</h1><p class="story">${esc(E[2])}</p>
  <div class="stats"><div class="big"><b>${S.daysSurvived}日</b>島で過ごした日数</div>
  <div><b>${S.stats.actions}</b>行動</div><div><b>${placesN}/8</b>見つけた場所</div><div><b>${S.stats.made.length}</b>作ったもの</div>
  <div><b>${S.eps.length}</b>DASHの思い出</div><div><b>${clueN(S)}/${NCL}</b>気づいた違和感</div><div><b>${S.stats.hurts}</b>痛い目</div></div>
  <div class="persona"><div class="lbl">今回の藍子は</div><h3>${per[0]}</h3><p>${per[1]}</p>
  ${Object.keys(TAGS).map(t=>`<div class="tagbar ${t===top&&max>0?'top':''}"><span>${TAGS[t]}</span><span class="tb"><i style="width:0" data-w="${max?Math.round(tg[t]/max*100):0}"></i></span><span>${tg[t]}</span></div>`).join('')}</div>
  <div class="sec">トイカメラの写真 ${al.length}/${FILM}</div>
  ${al.length?albumHTML(al):'<p class="hint" style="text-align:left">一枚も撮らなかった。</p>'}
  ${S.eps.length?`<div class="sec">思い出したポジパDASH</div><div class="matlist">${S.eps.map(e=>`<span class="get know">📺 ${esc(EP[e][0])}</span>`).join('')}</div>`:''}
  <div class="sec">この島の違和感 ${clueN(S)}/${NCL}</div>
  ${Object.keys(CL).map(c=>S.clues[c]?`<div class="clue">✔ ${CL[c]}</div>`:`<div class="clue unk">${META.clues[c]?'（前の島で気づいた）'+CL[c]:'？？？'}</div>`).join('')}
  ${S.stats.made.length?`<div class="sec">作ったもの</div><div class="matlist">${S.stats.made.map(x=>`<span class="get">${esc(x)}</span>`).join('')}</div>`:''}
  ${Object.keys(S.newKnow).length?`<div class="sec">今回はじめて教わったことを思い出した</div><div class="matlist">${Object.keys(S.newKnow).map(x=>`<span class="get know">📺 ${K[x][0]}</span>`).join('')}</div>`:''}
  <button class="btn" id="again">もう一度、島へ</button><button class="btn sub" id="totitle">タイトルへ</button></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>app.querySelectorAll('.tb i').forEach(i=>i.style.width=i.dataset.w+'%')));
  document.getElementById('again').onclick=()=>{newRun();render()};
  document.getElementById('totitle').onclick=()=>{S=null;render()};
}

render();

</script>
