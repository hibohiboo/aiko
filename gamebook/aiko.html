<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>辺境ギルドの札使い 藍子の章</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* layout: 夜のギルドホール。濃い緑黒の板壁に、紙色の貼り紙と札が浮かぶ一列のスマホ画面 */
:root{color-scheme:dark;
--bg:#121b1a;--panel:#1b2826;--line:#35473f;--fg:#ece8dc;--mute:#9db0a7;
--paper:#ece4c9;--paper2:#d5dfe0;--paper3:#efd9cf;--ink:#2b2520;--ink2:#6a5f52;
--gold:#e2b04a;--seal:#c4412f;--ok:#2c7a4c;--bad:#b3352a;
--fd:'Yuji Syuku','Hiragino Mincho ProN','Yu Mincho',serif;
--fn:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
--fu:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif}
.t-w{--tc:#c4472f}.t-e{--tc:#a9740f}.t-a{--tc:#7a52c4}.t-s{--tc:#1b8c7f}.t-r{--tc:#55852a}.t-h{--tc:#c45f88}.t-x{--tc:#5d6b66}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--fu);font-size:15px;line-height:1.7;
background-image:repeating-linear-gradient(90deg,transparent 0 88px,rgba(0,0,0,.18) 88px 90px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
#app{max-width:480px;margin:0 auto;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;border:0;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);font-weight:400;margin:0;text-wrap:balance;line-height:1.35}
p{margin:0}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);margin-inline:-16px;padding:8px 16px;display:flex;flex-direction:column;gap:6px}
.hud-in{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.hud b{color:var(--fg);font-size:14px;margin-left:4px;font-variant-numeric:tabular-nums}
.rank{font-family:var(--fd);font-size:20px;line-height:1;color:var(--seal);border:2px solid var(--seal);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;transform:rotate(-8deg);background:rgba(196,65,47,.12)}
.hp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.bar{flex:1;height:8px;background:#0c1211;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#b3352a,#e2764a);transition:width .3s}
.title{padding-top:48px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--gold)}
.title h1{font-size:44px;line-height:1.2}
.sub{color:var(--mute);font-size:13px}
.nar{font-family:var(--fn);font-size:16px;line-height:1.95}
.head{padding-top:20px;display:flex;flex-direction:column;gap:6px}
.head h2{font-size:26px}
.head p{color:var(--mute);font-size:13px}
.say{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:var(--fn);font-size:15px}
.say b{font-family:var(--fu);font-size:12px;color:var(--gold);display:block;letter-spacing:.08em}
.msg{background:rgba(226,176,74,.14);border:1px solid var(--gold);border-radius:8px;padding:8px 12px;font-size:13px}
.board{display:flex;flex-direction:column;gap:14px}
.lbl{font-size:12px;letter-spacing:.18em;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:4px}
.flyer{position:relative;display:flex;flex-direction:column;gap:4px;width:100%;background:var(--paper);color:var(--ink);padding:18px 16px 14px;border-radius:2px;box-shadow:0 3px 0 rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.3)}
.flyer.p2{background:var(--paper2)}.flyer.p3{background:var(--paper3)}
.board>.flyer:nth-of-type(odd){transform:rotate(-.5deg)}.board>.flyer:nth-of-type(even){transform:rotate(.45deg)}
.flyer::before{content:"";position:absolute;top:6px;left:50%;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:var(--seal);box-shadow:0 1px 2px rgba(0,0,0,.5)}
.flyer:disabled,.flyer.lock{opacity:.55;cursor:default}
.fl-k{font-size:11px;letter-spacing:.16em;color:var(--ink2)}
.fl-t{font-family:var(--fd);font-size:21px;line-height:1.35;padding-right:44px}
.fl-x{font-family:var(--fn);font-size:14px;line-height:1.75}
.fl-m{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:11px;border:1px solid var(--ink2);border-radius:3px;padding:1px 6px;color:var(--ink)}
.tag.need{border-color:var(--bad);color:var(--bad);font-weight:700}
.stamp{position:absolute;top:14px;right:14px;font-family:var(--fd);font-size:20px;line-height:1;color:var(--seal);border:2px solid var(--seal);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;transform:rotate(10deg)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin-top:8px;border-top:1px dashed var(--ink2);padding-top:8px}
.dl dt{color:var(--ink2)}.dl dd{margin:0;min-width:0}
.hand{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hand.two{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fuda{display:flex;flex-direction:column;gap:3px;background:var(--paper);color:var(--ink);border-radius:8px;padding:0 0 8px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.4),0 6px 12px rgba(0,0,0,.28);min-height:132px;transition:transform .12s}
.fuda:active{transform:translateY(2px) scale(.98)}
.fuda:disabled{opacity:.45;cursor:default}
.fuda.off{opacity:.5}
.fuda>span{padding-inline:8px}
.fd-top{background:var(--tc);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;padding-block:5px;letter-spacing:.06em}
.fd-top i{font-style:normal;font-family:var(--fd);font-size:16px;line-height:1;font-weight:400}
.fd-name{font-family:var(--fd);font-size:15px;line-height:1.3;margin-top:4px;overflow-wrap:anywhere}
.fd-pow{font-family:var(--fd);font-size:30px;line-height:1.1;color:var(--tc);font-variant-numeric:tabular-nums}
.fd-x{font-family:var(--fn);font-size:12.5px;line-height:1.6}
.fd-foot{font-size:11px;font-weight:700;margin-top:auto;color:var(--ink2)}
.fd-foot.ok{color:var(--ok)}.fd-foot.bad{color:var(--bad)}
.fd-own{font-size:10px;color:var(--ink2)}
.two .fuda{min-height:0;padding-bottom:10px}.two .fd-name{font-size:17px}
.scene{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.prog{font-size:12px;color:var(--mute);letter-spacing:.08em}
.scene h2{font-size:26px}
.need-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.diff{font-family:var(--fd);color:var(--fg);border:2px solid var(--gold);border-radius:6px;padding:2px 10px;font-size:14px}
.diff b{font-size:22px;color:var(--gold);margin-left:6px;font-weight:400}
.chip{font-style:normal;background:var(--tc);color:#fff;border-radius:99px;padding:1px 9px;font-size:11px;font-weight:700}
.res{border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:8px}
.res h3{font-size:24px}
.res.ok h3{color:#7fd09c}.res.crit h3{color:var(--gold)}.res.hurt h3{color:#ef7d6b}
.delta{font-size:13px;font-weight:700}
.go{width:100%;background:var(--gold);color:#221a08;border-radius:8px;padding:14px 16px;font-family:var(--fd);font-size:19px;text-align:center;box-shadow:0 3px 0 #8d6a22}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 #8d6a22}
.go.alt{background:transparent;color:var(--fg);border:1px solid var(--line);box-shadow:none;font-size:16px}
.go:disabled{background:var(--line);color:var(--mute);box-shadow:none;cursor:default}
.go small{display:block;font-family:var(--fu);font-size:11px;margin-top:2px}
.stack{display:flex;flex-direction:column;gap:10px}
.slips{display:flex;flex-direction:column;gap:6px}
.slip{background:var(--paper);color:var(--ink);border-radius:3px;padding:8px 12px;display:flex;justify-content:space-between;gap:12px;font-size:14px}
.slip span:first-child{color:var(--ink2);font-size:12px;flex:none}
.slip span:last-child{font-family:var(--fd);text-align:right;min-width:0}
.rows{display:flex;flex-direction:column;gap:6px;font-size:14px}
.row{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.row .chip{flex:none}.row span:last-child{margin-left:auto;color:var(--mute);font-size:12px;text-align:right}
.pips{letter-spacing:3px;color:var(--gold)}
.read{gap:12px}
.read .nar{font-size:16.5px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13px;color:var(--mute);background:transparent}
.tab.on{background:var(--gold);color:#221a08;border-color:var(--gold);font-weight:700}
.flyer.mini{padding:18px 10px 10px}
.flyer.mini .fl-t{font-size:16px;padding-right:0}
.flyer.mini .fl-x{font-size:12.5px;line-height:1.6}
.crest{border:2px solid var(--gold);border-radius:10px;padding:14px 16px 18px;text-align:center;background:rgba(226,176,74,.08)}
.crest span{font-size:12px;letter-spacing:.3em;color:var(--mute)}
.crest b{display:block;font-family:var(--fd);font-weight:400;font-size:36px;line-height:1.3;color:var(--gold)}
.row.ttl>span:nth-child(2){flex:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);width:min(440px,calc(100% - 32px));background:var(--gold);color:#221a08;border-radius:10px;padding:12px 16px;font-weight:700;font-size:14px;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:no-preference){#app:not(.still) .read>.nar,#app:not(.still) .read>.say{animation:rise .5s ease backwards;animation-delay:calc(var(--i,0)*140ms)}}
@keyframes deal{from{transform:translateY(14px)}}
@media (prefers-reduced-motion:no-preference){#app:not(.still) .fuda,#app:not(.still) .board>.flyer{animation:deal .32s cubic-bezier(.2,.8,.3,1) backwards;animation-delay:calc(var(--i,0)*35ms)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const T={w:{n:'戦士',g:'剣'},e:{n:'探索',g:'探'},a:{n:'攻撃魔法',g:'魔'},s:{n:'補助魔法',g:'援'},r:{n:'射撃',g:'弓'},h:{n:'回復',g:'癒'}},TK=Object.keys(T),RK=['F','E','D','C','B','A'];
const SK={w:['斬りつけ','盾受け','強撃','旋風斬','渾身の一閃','剣聖の構え','竜断ち'],e:['忍び足','罠外し','鍵開け','気配察知','影渡り','千里眼','無音の極み'],a:['火矢','氷槍','雷撃','爆炎','流星','極光','星落とし'],s:['灯りの術','眠りの霧','身体強化','幻影','時の枷','聖域','運命の糸'],r:['石つぶて','速射','狙い撃ち','二連射','必中の一矢','曲射','天穿つ矢'],h:['応急手当','癒しの光','解毒','浄化','大いなる祈り','蘇生の息吹','奇跡']};
const MAIN={w:'剣と盾で前に立つ。正面からの勝負に強い。',e:'罠、鍵、足跡。戦わずに道を拓く。',a:'火と氷と雷。群れや硬い敵をまとめて崩す。',s:'灯り、眠り、強化。適性外の場面では次の札を強める。',r:'弓と投擲。遠い的と素早い敵に強い。',h:'癒しと浄化。適性外の場面ではHPを回復する。'};
const JOB={w:'戦士',e:'探索者',a:'魔術師',s:'まじない師',r:'射手',h:'癒し手'};
const ORG={
town:{n:'街育ち',x:'辺境都市ラズベルの下町。石畳と人混みと、ギルドの鐘の音で育った。',hi:'「あら、下町の方ですよね？　ついに登録ですか。',y:{w:'衛兵詰所の裏で、非番の衛兵に毎朝稽古をつけてもらった。',e:'下町の鍵師の店で、錠前の仕組みを見て覚えた。',a:'魔法学院に通う幼なじみの教本を、こっそり写した。',s:'路地裏の占い婆に、まじないと人の見方を教わった。',r:'祭りの射的屋を手伝い、的の真ん中だけを狙い続けた。',h:'神殿の施療院で、包帯巻きの下働きをしていた。'}},
village:{n:'村育ち',x:'山あいの開拓村。畑と森と、冬の長い夜で育った。',hi:'「遠いところをようこそ。街の人混みには慣れました？　',y:{w:'村の自警団で、退役兵の爺さんに槍と盾を叩き込まれた。',e:'羊を追って山を歩き、獣道と足跡の読み方を覚えた。',a:'村に流れ着いた老魔術師に、薪割りと引き換えで術を習った。',s:'森はずれの魔女に、薬草を届ける役目だった。',r:'猟師の叔父と山に入り、兎で夕飯を賄った。',h:'産婆の祖母について回り、傷と熱の手当てを覚えた。'}},
road:{n:'旅育ち',x:'隊商の荷馬車が家だった。街道と、野営の火で育った。',hi:'「旅慣れた足取りですね。ラズベルは初めてですか？　',y:{w:'隊商の護衛に、野営のたび剣の相手をしてもらった。',e:'関所と宿場を渡り歩き、抜け道と危ない気配を覚えた。',a:'同行した旅の魔術師に、荷運びの駄賃として火の術を習った。',s:'隊商つきの占い師に、星読みとまじないを仕込まれた。',r:'荷馬車の上から、狼除けの弓を引くのが役目だった。',h:'旅の薬売りと同じ馬車で、膏薬作りを手伝った。'}}};
const SCH={
w:{n:'ギルド訓練場',who:'教官バルド',x:'木剣と大盾、貸します。',hi:['「新顔か。剣を握ったことは？　……ないな、その手は。いい、最初から教えてやる」','「構えろ。口で教えることは何もない。体で覚えろ」','「ほう、手の皮が厚くなったな。なら今日は、俺も木剣じゃなく鉄を持つ」','「……最近、お前との稽古が一番きつい。年寄りを労われ。いや、手は抜くな」','「教えることは、もうない。たまには若いのに稽古をつけてやってくれ。俺の代わりにな」'],ok:['日が暮れるまで打ち込みを続けた。腕は上がらないが、剣は上がるようになった。','三本に一本、バルドから取れるようになった。教官は悔しそうに、そして嬉しそうに笑った。']},
e:{n:'鍵師ドノバンの工房',who:'鍵師ドノバン',x:'錠前いじり教えます。悪用厳禁。',hi:['「客か？　弟子入り？　……手を見せな。ふん、指は長いな。入門料は先払いだ」','「錠前ってのは、作った奴との知恵比べだ。まずはこいつを開けてみな」','「この前の錠、もう開けたのか。……あれは俺が三日かけて作ったんだがな」','「お前が来ると聞いて、新作を用意した。今度こそ半日は保つはずだ。……保ってくれ」','「もう俺の錠じゃ、お前の暇つぶしにもならん。今度、王都の大金庫でも見物に行くか。見るだけだぞ」'],ok:['指先の感覚だけで、三つ目の錠が開いた。ドノバンは黙って四つ目を置いた。','ドノバンの新作は、茶が冷める前に開いた。鍵師は天を仰ぎ、それから設計図を引き直し始めた。']},
a:{n:'王立魔法学院 公開講座',who:'老教授',x:'学外生歓迎。聴講料は別途。',hi:['「学外生かね。聴講料は受付で。……言っておくが、ここは火遊びを教える場所ではないぞ」','「遅刻は減点。居眠りは火球の的にする。では始めよう」','「先週の課題、読んだよ。乱暴だが筋はいい。前の席に座りたまえ」','「君、実戦でその術式を使ったのかね？　……詳しく聞かせなさい。講義は後回しだ」','「今日は君が教壇に立ちたまえ。私は後ろで聴講する。遅刻も居眠りもせんから安心しなさい」'],ok:['黒板を埋める術式を、半分は理解した。残りの半分は、撃ってみて理解した。','実戦の話を、教授は羽根ペンが折れるほど書き取った。帰りがけ、禁書庫の鍵をそっと貸してくれた。']},
s:{n:'森はずれの魔女の庵',who:'魔女',x:'弟子入り可。猫に好かれる者に限る。',hi:['「弟子入りだって？　物好きだね。……ノワ、どう思う。ふん、引っかかないなら、まあいいさ」','「まじないは理屈じゃないよ。相手をよく見て、ちょっと背中を押すだけさ」','「鍋の混ぜ方が板についてきたじゃないか。今日は、あたしの帳面を見せてやろう」','「あんたの術、あたしのとは違う色になってきたね。それでいい。弟子は師匠の写しじゃないんだ」','「もう教えることはないよ。茶でも飲んでいきな。……たまに顔を見せりゃ、それでいい」'],ok:['薬草を刻み、鍋をかき混ぜ、黒猫に三度引っかかれた。帰るころには、新しい術が指に馴染んでいた。','魔女の帳面の最後の頁は、白紙だった。「そこは、あんたが書くんだよ」']},
r:{n:'猟師組合の射場',who:'組合長ヘルガ',x:'的は動きます。矢は自前で。',hi:['「弓を引いたことは？　……まあいい。まずは的じゃなく、自分の息を見な」','「当てようと思うな。当たるところに、矢を置いてくるんだ」','「止まった的は卒業だ。今日からは、あたしが投げる皿を撃ちな」','「組合の若いのが、あんたの射を見に集まってる。気にするな。……いや、少しはいいところを見せな」','「秋の射会、あんたは出るんじゃないよ。他の連中がやる気をなくす。審判をやりな」'],ok:['百本射って、最後の十本が全部同じ場所に刺さった。ヘルガは一度だけうなずいた。','投げられた皿を五枚、落ちる前にすべて射抜いた。ヘルガは皿代を請求してから、笑った。']},

{t:'夜営',d:3,x:'夜、馬が怯えて嘶いた。闇の向こうで、光る目が増えていく。',a:{a:'夜空に火柱を立てると、狼の群れは森へ消えた。',r:'闇の中の目をひとつ射ると、群れは引いた。',h:'怯える馬を落ち着かせ、御者の傷を手当てして夜を越えた。'},f:'眠れぬまま一晩中、狼を追い払い続けた。'}]},
q7:{k:'用心棒',n:'酒場「踊る子豚亭」の一夜',r:1,min:1,max:1,x:'今夜だけ用心棒を頼みたい。腕っぷしより機転の利く人を一人。',rw:{g:30,xp:2,f:1,mem:'gald'},after:'翌朝、二日酔いの大男ガルドが頭を下げた。「足が遅いと追放された身だが、盾にはなれる。組んでくれ」',sc:[
{t:'荒れる大男',d:2,x:'大男が酔って暴れている。名のあるパーティを「足が遅い」と追放されたばかりらしい。',a:{w:'腕相撲で受けて立ち、互角の勝負の末に笑い合った。',h:'酔い覚ましの術をかけ、黙って愚痴を聞いた。',s:'そっと眠りの霧をかけ、長椅子に寝かせた。'},f:'投げ飛ばされて、卓をひとつ壊した。'},
{t:'イカサマ師',d:3,x:'奥の卓で、流れ者が札に細工をしている。',a:{e:'袖口の隠し札を見抜き、衆目の前で引き抜いた。',s:'灯りを強めると、印を付けた札が浮かび上がった。'},f:'証拠を掴めず、押し問答の末に殴られた。'},
{t:'仕返し',d:3,x:'閉店間際、イカサマ師が仲間を連れて戻ってきた。刃物が光る。',a:{w:'椅子を盾に立ち回り、三人まとめて表へ放り出した。',r:'投げた皿が刃物を弾き飛ばした。',a:'指先に火を灯して見せる。ごろつきは魔法使いと喧嘩をしない。'},f:'切り傷を負ったが、起き上がった大男が加勢してくれた。'}]},
q8:{k:'調査依頼',n:'古井戸の底の物音',r:1,min:1,max:4,x:'旧市街の枯れ井戸から、夜な夜な物音がする。底を見てきてほしい。',rw:{g:35,xp:2,f:1,mem:'nico'},after:'助け出した獣人の少年ニコは、耳を伏せて言った。「盗掘はもうやめる。鼻と耳なら役に立つよ」',sc:[
{t:'降下',d:2,x:'井戸は深く、縄は古い。底は見えない。',a:{e:'壁の窪みを足がかりに、縄に頼らず降りた。',s:'身を軽くする術で、ふわりと底に降り立った。',r:'鉤付きの矢を梁に撃ち込み、新しい縄を張った。'},f:'縄が切れ、最後の三歩ぶんを落ちた。'},
{t:'紋章の石扉',d:3,x:'井戸の底に古い石扉。四つの紋章が刻まれた回転錠だ。',a:{e:'摩耗の具合から正しい順を読み、錠を開けた。',a:'紋章は古代の属性記号。火・水・風・土の順に回した。'},f:'間違えるたび矢が飛び出す。三度目でやっと開いた。'},
{t:'石の番犬',d:3,x:'扉の奥で、石の番犬が目を光らせた。隅には、罠にかかった獣人の少年。',a:{w:'首の継ぎ目に刃を叩き込み、砕いた。',a:'急に熱して、急に冷やす。石像はひび割れて崩れた。',s:'時を鈍らせる術で動きを縛り、少年を連れて抜け出した。'},f:'石の牙にやられたが、なんとか砕いた。'}]},
q9:{k:'討伐依頼',n:'オークの砦',r:2,min:3,max:4,x:'北の丘にオークが砦を築いた。捕らわれた村人あり。三人以上の編成で。',rw:{g:90,xp:3,f:2,eq:1},after:'村人たちは、砦の宝物庫にあった逸品を「どうか使ってくれ」と差し出した。',sc:[
{t:'砦の偵察',d:3,x:'丸太の柵に囲まれた砦。見張り櫓が二つ、門は一つ。',a:{e:'夜陰に紛れて、柵の弱い箇所を見つけた。',r:'櫓の見張りを二人とも射落とした。',s:'幻の霧で砦を包み、接近を隠した。'},f:'見つかり、投げ槍を浴びた。'},
{t:'門前の突撃',d:4,x:'門が開き、オークの戦士たちが雄叫びとともに飛び出してきた。',a:{w:'突進を正面から受け止め、押し返した。',a:'門の前に炎の壁を立て、隊列を分断した。',r:'門を出る端から射抜き、足を止めた。'},f:'力負けし、何度も吹き飛ばされた。'},
{t:'牢の村人',d:4,x:'牢に村人が十人ほど。衰弱がひどく、歩けない者もいる。',a:{h:'癒しの光が牢を満たし、皆が自分の足で立った。',e:'錠を次々に外し、裏手の抜け道へ誘導した。',s:'身体強化を村人にかけ、一気に走らせた。'},f:'担いで運ぶうちに、追っ手に斬りつけられた。'},
{t:'オークロード',d:5,x:'砦の主は、人の背丈ほどの戦斧を片手で振る。',a:{w:'三合打ち合い、四合目で斧の柄ごと断ち切った。',a:'仲間が稼いだ時間で詠唱を終え、特大の雷が落ちた。',r:'兜の隙間、ただ一点を射抜いた。'},f:'満身創痍になりながら、最後は全員で押し切った。'}]},
q10:{k:'緊急依頼',n:'学院の暴走ゴーレム',r:2,min:2,max:4,x:'王立魔法学院・実験棟。試作ゴーレムが暴走中。壊してよいが、建物は壊すな。',rw:{g:70,xp:3,f:2,mem:'lucia'},after:'制御盤にいた女学生ルシアは、煤だらけの顔で宣言した。「実地研究よ。あなたたちに同行するわ」',sc:[
{t:'封鎖結界',d:3,x:'実験棟は封鎖結界の中。教授たちは責任の押し付け合いで忙しい。',a:{a:'結界の術式を読み解き、通れる綻びを作った。',s:'同調の術で、結界をすり抜けた。',e:'搬入用の地下通路を見つけた。'},f:'結界に弾かれ、全身が痺れた。'},
{t:'箒とバケツ',d:4,x:'廊下を、魔力を帯びた箒とバケツの群れが暴れ回っている。',a:{r:'飛び回る箒を一本ずつ撃ち落とした。',w:'まとめて叩き折った。請求書は学院持ちだ。',a:'魔力を打ち消す波を放ち、ただの掃除用具に戻した。'},f:'バケツを頭に被せられ、箒に散々叩かれた。'},
{t:'鉄のゴーレム',d:5,x:'天井に届く鉄のゴーレム。足元の制御盤にしがみつく女学生が叫んだ。「核は胸よ！」',a:{a:'装甲の継ぎ目から雷を流し込み、核を焼き切った。',r:'開いた装甲の奥、赤い核を射抜いた。',s:'時の枷で動きを止める間に、女学生が停止の術式を書き終えた。',w:'膝を砕いて倒し、胸の装甲を剥がして核を叩き割った。'},f:'鉄の拳を何度も受け、壁際まで吹き飛ばされながら止めた。'}]},
q11:{k:'調査依頼',n:'丘の上の幽霊屋敷',r:2,min:1,max:4,x:'旧伯爵邸に買い手がつかない。出るらしい。原因を取り除いてほしい。',rw:{g:60,xp:3,f:2,mem:'elma'},after:'成仏するかと思いきや、令嬢エルマは「外の世界が見たいの」と、ふわふわついてきた。',sc:[
{t:'玄関広間',d:3,x:'扉がひとりでに閉まり、燭台の火が青く変わった。皿が宙に浮く。',a:{s:'灯りの術で青い火を打ち消すと、皿は静かに床へ降りた。',h:'浄めの祈りで、屋敷の空気が和らいだ。',e:'仕掛けではないと確かめ、気配の濃い二階へ進んだ。'},f:'飛んできた皿が額に当たった。'},
{t:'歩く鎧',d:4,x:'廊下の鎧が、中身のないまま剣を抜いた。',a:{w:'剣を弾き、兜を叩き落とすと鎧は崩れた。',a:'鎧を動かす魔力の糸を焼き切った。',h:'浄化の光に触れ、鎧はただの飾りに戻った。'},f:'空っぽの鎧は疲れを知らない。斬られながら逃げ切った。'},
{t:'書斎の令嬢',d:4,x:'書斎に、半透明の少女。百年前の日記を抱え、「誰も読んでくれないの」と泣いている。',a:{h:'鎮魂の祈りを捧げ、日記を最後まで読んで聞かせた。',s:'心を繋ぐ術で、百年ぶんの話を一晩かけて聞いた。',e:'隠し金庫から、彼女が探していた手紙を見つけ出した。'},f:'泣き声の嵐に耐え、夜明けまで付き合った。'}]},
q12:{k:'緊急依頼',n:'古竜の目覚め',r:3,min:4,max:4,x:'北の霊峰で古竜が目を覚ました。Cランク以上、四人編成必須。生きて帰ること。',rw:{g:300,xp:4,f:5},after:'',sc:[
{t:'霊峰の吹雪',d:4,x:'北の霊峰は六合目から吹雪。視界は腕の長さほどしかない。',a:{s:'温もりの結界で一行を包んだ。',e:'雪庇を避け、風の当たらない岩陰の道を選んだ。',h:'凍傷を癒やしながら、歩みを止めなかった。'},f:'凍えた手足を引きずって登り切った。'},
{t:'竜牙兵',d:5,x:'雪の中から、竜の牙より生まれた骨の兵が六体、音もなく立ち上がった。',a:{w:'骨の継ぎ目を断ち、一体ずつ雪に還した。',a:'爆炎が骨を灰に変えた。',h:'浄化の光を浴び、兵はただの牙に戻って転がった。'},f:'斬っても起き上がる骨に、じわじわ削られた。'},
{t:'溶岩の川',d:5,x:'竜の寝息で溶けた岩が、赤い川になって行く手を横切る。',a:{e:'冷え固まった岩だけを見分け、飛び石にして渡った。',r:'対岸の岩に縄付きの矢を三本。即席の橋ができた。',s:'熱避けの護りを全員にかけ、川べりを駆け抜けた。'},f:'靴底を焦がし、火傷を負いながら渡った。'},
{t:'咆哮',d:6,x:'巣の奥で古竜が首をもたげた。咆哮ひとつで、膝が勝手に折れる。',a:{s:'勇気の加護が、全員の震えを止めた。',h:'祈りの声は咆哮の中でも途切れず、恐怖を払った。',w:'咆哮の中を一歩前へ。掲げた剣に、仲間の足音が続いた。'},f:'体が竦み、尾の一撃をまともに受けた。'},
{t:'古竜',d:7,x:'千年を生きた鱗は鋼より硬い。だが喉元に一枚だけ、逆さに生えた鱗がある。',a:{w:'炎の息をくぐり、逆鱗に渾身の一閃を叩き込んだ。',a:'空が割れ、流星が古竜の背を撃った。',r:'息を吸う一瞬、逆鱗の一点を矢が貫いた。'},f:'焼かれ、薙がれ、それでも最後の一撃だけは届いた。'}]}};
QS.q12.rw.mem='tia';QS.q12.after='古竜は地に伏し、やがて喉の奥で笑った。「千年ぶりに負けた。愉快だ」――光が収まると、そこには角の生えた少女が立っていた。「退屈しておったのだ。そなたらの旅に付き合わせよ。名か？　ティアでよい」';
Object.assign(QS,{
q13:{k:'指名依頼',n:'王都からの召喚状',r:4,min:2,max:4,x:'国王陛下より。古竜を従えし冒険者は、十日以内に王都へ参上すること。道中の安全は保証しない。',rw:{g:150,xp:4,f:3,eq:1},after:'王は竜の少女に焼き菓子を勧め、少女は三皿平らげた。辺境に王家の紋章入りの感状が届いたのは、翌月のことだ。',sc:[
{t:'関所の私兵',d:6,x:'街道の関所を、見慣れぬ紋章の私兵が固めている。「竜は当家が預かる」と、通す気配がない。',a:{s:'幻で王家の旗印を空に掲げてみせると、私兵たちは青ざめて道を開けた。',e:'夜のうちに関所の裏の獣道を抜けた。朝、私兵たちは空の街道を見張り続けていた。',h:'腹を壊していた隊長を癒やしてやると、ばつが悪そうに門を開けてくれた。'},f:'押し問答の末に力ずくで突破した。追っ手の矢が背中をかすめる。'},
{t:'密猟団の夜襲',d:6,x:'野営の火が、一斉に消えた。竜の鱗を狙う密猟団だ。闇の中、鎖のついた銛が飛んでくる。',a:{w:'銛を盾で叩き落とし、鎖をたぐって投げ手を引きずり出した。',r:'鎖の音だけを頼りに、闇の中の射手を一人ずつ黙らせた。',a:'夜空に雷を走らせると、密猟団の姿が白く浮かび上がった。あとは早かった。'},f:'鎖に足を取られ、引きずられながら応戦した。'},
{t:'騎士団長の試し',d:7,x:'王の隣で、白髭の騎士団長が剣を抜いた。「竜を従える器か、確かめさせてもらう」',a:{w:'十合打ち合い、互いの切っ先が喉元で止まった。騎士団長は笑って剣を収めた。',a:'詠唱なしの氷槍を、騎士団長の足元一寸に突き立てた。「……見事」',s:'時の枷で剣を止めた一瞬に、仲間が背後を取った。「連携か。よかろう」'},f:'さんざん打ち据えられたが、最後まで膝はつかなかった。「根性は認めよう」'}]},
q14:{k:'探索依頼',n:'迷宮「奈落の階」第二十層',r:4,min:3,max:4,x:'ラズベル地下迷宮の未踏階層。二十層の階層主を確認し、可能なら討伐せよ。三人以上。',rw:{g:180,xp:4,f:3,it:['smoke','song']},after:'二十層の地図は、ギルドの壁に額装して飾られた。隅に小さく、あなたたちの名前が入っている。',sc:[
{t:'転移罠の回廊',d:6,x:'床の魔法陣を踏めば、どこへ飛ばされるか分からない。しかも陣は、ゆっくり動いている。',a:{e:'陣の動きの周期を読み切り、一度も踏まずに渡り切った。',s:'灯りの術で、隠された陣まですべて浮かび上がらせた。',a:'陣の術式を読み、魔力を流して一時的に眠らせた。'},f:'踏んだ。壁の中でなかったのが幸いだが、落ちた先は水路だった。'},
{t:'魔物の巣部屋',d:6,x:'扉を開けた瞬間、背後で閂が落ちた。部屋じゅうの暗がりで、無数の目が開く。',a:{w:'壁を背に、押し寄せる端から斬り伏せた。',a:'部屋の中央で爆炎が咲き、目の数が半分になった。残りは逃げた。',r:'天井の鍾乳石を射落とし、群れの真ん中に降らせた。'},f:'数に呑まれ、傷だらけになりながら部屋を抜けた。'},
{t:'毒沼の階',d:7,x:'十九層は、階そのものが沼だった。紫の霧が立ちこめ、息をするたび喉が焼ける。',a:{h:'浄化の祈りを途切れさせず、霧の中に清浄な道を一本通した。',s:'風の護りで一行を包み、霧を寄せつけなかった。',e:'沼に沈みかけた古い石橋の跡を見つけ、霧の薄い高みを渡った。'},f:'毒に咳き込みながら、気力だけで歩き切った。'},
{t:'階層主ミノタウロス',d:8,x:'二十層の大広間。牛頭の巨人が、柱ほどの戦槌を引きずって立ち上がった。',a:{w:'戦槌を紙一重でかわし、踏み込んで膝を断った。巨体が傾ぐ。',a:'仲間が稼いだ十数える間で、最大の術を編み上げた。',r:'両目を続けざまに射抜いた。闇雲に振るわれる戦槌は、もう当たらない。'},f:'戦槌の風圧だけで吹き飛ばされた。それでも、最後に立っていたのはこちらだ。'}]},
q15:{k:'救出依頼',n:'遭難したパーティ「蒼の牙」',r:4,min:2,max:4,x:'北の古代遺跡でBランクパーティが消息を絶った。盾役を欠いたまま深入りしたらしい。至急。',rw:{g:160,xp:4,f:3},after:'「蒼の牙」の頭目は、包帯だらけの頭を深く下げた。「速さだけでは、帰ってこられなかった。……礼を言う」',sc:[
{t:'崩れた入口',d:6,x:'遺跡の入口は、内側から崩れていた。瓦礫の隙間から、かすかに風が吹いてくる。',a:{e:'崩れの具合を読み、抜いても落ちない石だけを選んで道を作った。',w:'梁を肩で支え、仲間を先に通した。',s:'身体強化をかけ、大岩をひとつずつ持ち上げた。'},f:'抜いた石がまずかった。二度目の崩落で、頭を打った。'},
{t:'死霊騎士',d:7,x:'通路を、錆びた甲冑が巡回している。兜の奥に、青い火。斬っても斬っても立ち上がる類だ。',a:{h:'浄化の光が甲冑を貫き、青い火はため息のように消えた。',w:'盾ごと壁に叩きつけ、甲冑をばらばらにした。組み上がる前に通り抜ける。',a:'炎で錆を焼き切り、動けなくなるまで溶かした。'},f:'何度倒しても起き上がる相手に、じりじりと削られた。'},
{t:'閉じ込められた一行',d:7,x:'小部屋に、四人が倒れていた。一人は足が岩の下。もう一人は呪いで顔が土気色だ。',a:{h:'解呪と治癒を同時に進める。全員の息が、ゆっくりと深くなった。',s:'巡りを遅らせる術で呪いの進みを止め、運び出す時間を稼いだ。',e:'てこと楔で岩を浮かせ、足を傷つけずに引き抜いた。'},f:'手当てが追いつかない。自分の薬まで使い果たした。'},
{t:'崩落からの脱出',d:7,x:'遺跡全体が鳴動した。天井が、奥から順に落ちてくる。',a:{e:'来た道ではなく、風の通る脇道を選んだ。読みは当たった。',r:'落ちてくる大岩を矢で砕き、担架の上に降らせなかった。',s:'全員に俊足の加護をかけ、担架ごと走り抜けた。'},f:'最後の一人をかばって、背中に瓦礫を受けた。'}]},
q16:{k:'緊急依頼',n:'魔の森の大暴走',r:5,min:3,max:4,x:'魔の森の魔物が一斉に南下。明朝にはラズベルに達する。戦える者は全員、北門へ。',rw:{g:300,xp:5,f:4},after:'北門の上で、誰かが歌い始めた。日が暮れるころには、街じゅうがその歌を歌っていた。',sc:[
{t:'夜明け前の北門',d:7,x:'城壁の上に、衛兵と冒険者と、鍬を持った町人が並ぶ。群れが着くまで、あと一刻。',a:{e:'門前に落とし穴と逆茂木を三重に仕掛けた。町人たちが目を輝かせて手伝った。',s:'震える新兵たち一人ひとりに、勇気の加護をかけて回った。',h:'施療所を門の内側に設け、運ぶ者と診る者の手順を決めた。'},f:'準備が間に合わない。足りない分は、体で埋めるしかなかった。'},
{t:'第一波・魔狼',d:8,x:'地平が黒く波打った。先頭は魔狼。数は、数えるのをやめた。',a:{r:'射程に入った端から射倒す。矢筒が三つ、空になった。',a:'門前の平原に、炎の壁を二重に走らせた。',w:'門の前に立ち、抜けてきた狼を一匹も通さなかった。'},f:'壁の上まで跳び上がってきた一頭に、肩を裂かれた。'},
{t:'第二波・翼竜',d:8,x:'空が翳った。翼竜の群れが、城壁を越えて街へ降りようとしている。',a:{r:'翼の付け根を狙い、先頭の三頭を続けて落とした。群れが乱れる。',a:'雷を空に放つ。濡れた翼から翼へ、光が走った。',s:'幻の大竜を空に描くと、翼竜たちは怯えて高度を上げた。'},f:'急降下の爪を避けきれず、城壁に叩きつけられた。'},
{t:'崩れかけた戦線',d:8,x:'門の内側は、負傷者であふれていた。衛兵隊長が倒れ、指示が止まっている。',a:{h:'癒しの光を広場いっぱいに広げた。立てる者から、また壁へ戻っていく。',s:'声を増す術で、街じゅうに届く号令をかけた。止まっていた列が動き出す。',w:'隊長の旗を拾って門の上に立った。それだけで、兵たちの背が伸びた。'},f:'自分の傷を後回しにして、運び、縛り、怒鳴り続けた。'},
{t:'群れの主ベヒモス',d:9,x:'森の木々を薙ぎ倒しながら、小山のような獣が現れた。あれが追い立てていたのだ、すべてを。',a:{w:'突進を真正面から受け流し、すれ違いざまに腱を断った。',a:'口を開けた瞬間を逃さず、喉の奥へ最大の火球を叩き込んだ。',r:'片目、もう片目、そして耳の奥。三本の矢が、巨獣を止めた。'},f:'角にかけられ、宙を舞った。落ちた先で、それでも剣を握っていた。'}]},
q17:{k:'密命',n:'仮面舞踏会の刺客',r:5,min:2,max:4,x:'辺境伯より内密に。今宵の舞踏会に魔族の刺客が紛れている。騒ぎにせず、見つけ出せ。',rw:{g:280,xp:5,f:4,eq:1},after:'辺境伯は、何事もなかったように舞踏会の閉会を告げた。あなたたちの杯にだけ、いちばん良い酒が注がれた。',sc:[
{t:'招待客の中へ',d:7,x:'仮面と絹と、作り笑い。三百人の客のうち、一人だけが人ではない。まずは怪しまれずに紛れること。',a:{s:'幻で衣装を整え、古い家名を名乗った。誰も疑わない。',e:'給仕に扮して盆を持った。給仕の顔を見る貴族はいない。'},f:'場違いな身なりを見咎められ、執事に延々と絞られた。'},
{t:'毒の杯',d:8,x:'辺境伯の杯に、葡萄酒が注がれる。色が、ほんのわずかに濃い。',a:{h:'すれ違いざまに、杯へ浄化の祈りを落とした。毒はただの渋みに変わった。',e:'わざとつまずいて杯を落とさせ、注いだ給仕の袖口を見た。爪が、黒い。',s:'眠りの霧をひと息だけ。杯を持つ手が緩み、葡萄酒は絨毯に吸われた。'},f:'間に合わず、自分が毒見役を買って出た。舌が痺れる。'},
{t:'屋根の上の追跡',d:8,x:'黒い爪の給仕が、窓から屋根へ跳んだ。人の跳び方ではない。月明かりの瓦の上、影が走る。',a:{r:'走る影の、次の一歩が着く瓦を射抜いた。影が体勢を崩す。',e:'屋根の形を読み、先回りして煙突の陰で待ち伏せた。',w:'瓦を蹴って跳び、背中に組みついた。二人まとめて露台に落ちる。'},f:'足を滑らせ、樋にぶら下がって肝を冷やした。'},
{t:'魔族の刺客',d:9,x:'仮面が割れ、角と翼が現れた。「辺境の犬どもが。主の露払いくらいにはなれ」',a:{a:'闇の刃を、同じ数の雷で撃ち落とした。最後の一条が翼を焼く。',w:'爪と剣が火花を散らす。七合目で、角を根元から断った。',h:'聖なる光が中庭を満たした。魔族は目を覆い、その隙に仲間の刃が届いた。'},f:'闇の刃に切り刻まれながら、相打ち覚悟で踏み込んだ。'}]},
q18:{k:'決戦',n:'辺境を覆う影',r:5,min:4,max:4,x:'魔将ヴァルガの軍勢が南の峠に布陣。王都の援軍は間に合わない。辺境の全戦力をもって、将を討て。四人編成。',rw:{g:500,xp:6,f:6},after:'',sc:[
{t:'敵陣を抜ける',d:8,x:'峠を埋める篝火。その一番奥に、黒い天幕がある。正面から行けば、千の兵を相手にすることになる。',a:{e:'歩哨の交代の隙を縫い、荷車の影から影へ。誰にも気づかれなかった。',s:'幻で敵兵の姿をまとい、堂々と陣の中を歩いた。',r:'遠くの篝火を射倒して騒ぎを起こし、兵をそちらへ引きつけた。'},f:'見つかった。追われながら、陣の奥へ奥へと駆け込む。'},
{t:'親衛隊',d:9,x:'天幕の前に、黒鉄の鎧が六体。魔将の親衛隊だ。一言も発さず、同時に剣を抜いた。',a:{w:'一体目の剣を奪い、二体目に叩きつけた。背中は仲間が守っている。',a:'六体をまとめて氷に閉ざした。砕くのは、仲間に任せる。',r:'鎧の継ぎ目だけを狙う。六本の矢で、六体が膝をついた。'},f:'連携の取れた剣に追い詰められ、深手を負いながら斬り抜けた。'},
{t:'瘴気',d:9,x:'天幕の中は、息が詰まるほどの瘴気だった。足元から力が抜けていく。奥の玉座に、巨きな影。',a:{h:'祈りが瘴気を押し返し、一行のまわりにだけ澄んだ空気が戻った。',s:'護りの結界を幾重にも重ね、瘴気を寄せつけなかった。',a:'瘴気そのものに火を放った。黒い霧が、青く燃えて消えていく。'},f:'吸うたびに肺が焼ける。それでも、前へ。'},
{t:'魔将ヴァルガ',d:10,x:'「竜を降し、獣を退けたというのは貴様らか」――魔将は身の丈の倍ある大剣を、片手で持ち上げた。',a:{w:'大剣を受けた盾が割れた。割れた盾を捨て、懐へ。鎧の胸に、初めて傷が入る。',a:'詠唱が終わるまで、仲間が一歩も退かなかった。だから、撃てた。',r:'兜の隙間は、指一本ぶん。それで十分だった。'},f:'一振りで天幕が吹き飛び、全員が地に転がった。立ち上がるのに、ありったけの意地が要った。'},
{t:'最後の一手',d:10,x:'魔将が膝をついた。だが、その手に闇が集まっていく。峠ごと吹き飛ばす気だ。――次の一手で、決める。',a:{w:'仲間が作った一瞬の隙。渾身の一閃が、闇ごと魔将を断った。',e:'砕けた鎧の隙間に短剣を滑り込ませたのは、誰も見ていなかった影だった。',a:'全員の魔力を束ねた光が、闇を呑み込んだ。',s:'時の枷が、魔将の腕を止めた。たった一拍。それで、仲間の刃が届いた。',r:'放った矢は、集まる闇の中心を貫き、その向こうの心臓に届いた。',h:'祈りの光が闇を打ち消した。丸腰になった魔将に、仲間の刃が殺到する。'},f:'闇の奔流に呑まれ、それでも手を伸ばし、相打ちで止めた。'}]}});

const URG={q10:'「緊急です！　学院の実験棟で、何かが暴れています。ほかの貼り紙は、いったん下げました。すぐ向かってください」',q12:'「北の霊峰から早馬です。……古竜が、目を覚ましました。いまギルドで動けるのは、あなたたちだけです。ほかの依頼はすべて止めました。四人そろえて、すぐに」',q16:'「鐘が鳴りやみません。魔の森の魔物が、この街へ向かっています。ほかの依頼は、すべて止めました。北門へ！」',q18:'「南の峠に、魔将の軍勢です。……今日の貼り紙は、これ一枚きりです」'};

function persona(){const s=S.st,n=s.n||1,a=s.crit/n>=.45?0:s.hurt/n>=.3?1:2,b=s.chat>=s.rest*2?0:1;
 return{n:[['頼れる参謀型','孤高の職人型'],['熱血の旗手型','不言実行の猛者型'],['世話焼きのまとめ役型','静かな道しるべ型']][a][b],
  x:['下調べと段取りで勝負を決める人。難度を見極め、いちばん効く札を迷わず切ってきた。','考えるより先に足が出る人。傷の数は、前に出た回数の証だ。','無理はしないが、退きもしない人。手堅い一手を積み重ねて、ここまで来た。'][a]+['仲間の話によく耳を傾け、いつも輪の真ん中にいた。','多くは語らず、背中で仲間を引っぱった。'][b]+(s.body>=5?'いざとなれば、札がなくても体を張る。':s.item>=12?'道具に頼ることを恥じない現実家でもある。':S.gold>=600?'財布の紐は、最後まで固かった。':'')}}
const ST={
q1:{in:['掲示板の隅、何度も貼り直された跡のある貼り紙。依頼主は薬師通りの老婆だという。|ミレア：「マルタお婆さんの依頼ですね。初めての方には、いつもこれをお勧めしているんです」|ミレア：「東の森は浅いところなら安全です。ただ、似た毒草がありますから、葉の裏をよく見てくださいね」','薬師通りの店先で、老婆は乾いた束をひとつ見せてくれた。|マルタ：「これが癒し草。裏に白い筋が三本。二本のは毒だよ。間違えたら自分で試してもらうからね」|冗談か本気か分からない笑顔に送られて、あなたは東門を出た。'],
p:['街道を外れると、土の匂いが濃くなった。木漏れ日の下、小鳥の声。|籠を下ろし、膝をつく。日陰の湿った土に、それらしい葉がいくつも顔を出していた。','籠が半分ほど埋まったころ、近くの茂みががさりと揺れた。|風ではない。何かが、落ち葉の上を這っている。','日が傾き始めた。あと二束で十束になる。|帰り道の崖を見上げたとき、岩肌の中ほどに、見事な緑の塊が揺れているのに気づいた。']},
q2:{in:['ミレア：「これは……人気のない依頼なんです。報酬は悪くないんですけど、その、匂いが」|ミレアは申し訳なさそうに、布きれと香草の小袋を差し出した。|ミレア：「鼻に当ててください。気休めですけど」','市場裏の石段を下りると、下水道管理人の小屋がある。|管理人：「来てくれたか！　あいつら、昨日はうちの猫を追い回しやがったんだ。猫をだぞ」|管理人はランタンを押しつけると、自分は一歩も近づかずに入口を指さした。'],
p:['石段の底、湿った空気が頬に貼りつく。|入口の鉄格子には、赤錆びた錠前がぶら下がっていた。','格子の先は、ゆるい下り坂の水路だった。ランタンの灯りは三歩先で闇に呑まれる。|水音に混じって、きい、きい、と細い鳴き声が重なり始めた。','水路は広い集水場で行き止まりになっていた。|腐った残飯の山が、もぞりと動く。山だと思ったものの半分は、毛皮だった。']},
q3:{in:['貼り紙の文字は、癖の強い古い書体だった。隅に小さく「猫を怖がらせる者お断り」。|ミレア：「森はずれの魔女様です。気難しい方ですけど、報酬の薬はよく効くって評判ですよ」','森はずれの庵は、屋根まで蔦に覆われていた。戸を叩く前に、中から声がする。|魔女：「開いてるよ。足を拭いて入りな」|魔女：「ノワはね、あたしの目であり耳なんだ。三日も帰らないなんて初めてさ。……心配なんかしちゃいないよ、不便なだけだ」|煙管を持つ手が、少しだけ震えていた。'],
p:['庵の中は薬草と煙の匂い。棚には猫用の皿がひとつ、きれいに洗って置いてある。|魔女：「さて、どこから探すね。お手並み拝見といこうか」','手がかりを追って北へ半刻。屋根の落ちかけた廃屋に着いた。|埃の積もった床に、小さな足跡が点々と続いている。見上げると、暗がりに金色の目がふたつ。','黒猫を懐に入れ、夕暮れの道を急ぐ。ノワは観念したのか、喉を鳴らしている。|その喉の音が、ふいに止まった。前方の藪から、低い唸り声。']},
q4:{in:['ミレア：「神殿からの急ぎの依頼です。見習いの子が、昨日の昼に森へ出たきり……」|ミレア：「セラさんというんです。施療院の薬草が足りないからって、一人で。真面目な子なんですよ」','神殿の門前で、年配の神官が待っていた。|神官：「止めたのです。だがあの子は、熱を出した子どもたちを放っておけなかった」|神官：「どうか、連れ帰ってください。あの子の祈りは、まだ拙いが――誰よりもまっすぐなのです」'],
p:['東の森の、癒し草の群生地よりさらに奥。人の入らない道だ。|ぬかるみに、小さな靴跡。その横に、深く抉れた大きな爪の跡があった。','跡を辿ると、岩棚に口を開けた浅い洞が見えた。|洞の前を、灰色の影が行ったり来たりしている。','洞の奥に、白い法衣の少女がうずくまっていた。あなたを見て、力なく笑う。|セラ：「……来て、くださったんですね。すみません、足が……もう、感覚がなくて」']},
q5:{in:['ミレア：「ゴブリンは一匹なら子どもでも追い払えます。でも巣となると話は別です」|ミレア：「先月も、一人で入った新人さんが……いえ。とにかく、必ず二人以上で。約束ですよ」','街道脇の茶屋で、荷を奪われた行商人が待っていた。|行商人：「反物を三梱と、火炎瓶をひと箱やられた。命があっただけましだがね」|行商人：「穴は丘の裏だ。夜になるとあいつら、奪った酒で騒ぎやがる。昼のうちに行きな」'],
p:['丘の裏手に回ると、岩の割れ目から煙が細く上がっていた。|入口の脇に、槍を持った小さな影がふたつ。片方は首から角笛を下げている。','洞穴の中は、獣脂の燃える匂いがした。壁の松明はまばらで、足元が暗い。|通路の先に、妙に落ち葉の多い一角がある。洞穴の中に、落ち葉。','通路の奥から、がやがやと耳障りな声。|角を曲がると、そこは天井の高い広間だった。焚き火のまわりで、十数の目が一斉にこちらを向く。','最後の一匹が逃げていくと、広間は静かになった。|――いや。奥の暗がりで、何かが重い腰を上げる音がした。積み上げた木箱の玉座。その主は、まだ座っていたのだ。']},
q6:{in:['ミレア：「隣町ハルデンまでの護衛です。依頼主のベルトさんは、この街いちばんの心配性で有名なんですよ」|ミレア：「あ、それと。もう一人、弓使いの方が雇われています。腕は確かですが……ちょっと、口が」','東門の前に、荷馬車と小太りの商人、それに御者台で脚を組むエルフがいた。|ベルト：「来た来た！　よろしく頼むよ。積み荷は蜂蜜酒なんだ、揺らさないでくれよ」|フィーネ：「あなたたちが護衛？　ふうん。足を引っ張らないでね、矢がもったいないから」'],
p:['昼過ぎ、街道は谷に差しかかった。古い木橋が、深い沢をまたいでいる。|フィーネ：「止まって。……橋板が足りないわ」','谷を抜けた先、道の両側に大岩が並ぶ場所。馬が耳を伏せた。|フィーネ：「来るわよ。七人。風下に回ったつもりでしょうけど、匂うのよね」','日が暮れ、街道脇で火を焚いた。ベルトは荷台で毛布にくるまり、三度目の「大丈夫かね」を言った。|フィーネは火に背を向けて座っている。目を闇に慣らしておくためだ。|真夜中、馬が鋭く嘶いた。']},
q7:{in:['ミレア：「踊る子豚亭のおかみさんからです。今夜は収穫祭の前夜で、荒れるんですって」|ミレア：「一人だけ、というのがご希望です。大勢で睨みを利かせると、お客さんが飲めないからって」','踊る子豚亭は、日暮れ前からもう賑やかだった。|おかみ：「あんたかい。いいかい、うちは喧嘩は外、勘定は中。皿は割らせない。それだけ守ってくれりゃいい」|おかみは顎で隅の卓をしゃくった。|おかみ：「それと、あの大きいの。今日で三日目だ。そろそろ潰れる頃合いさ」'],
p:['隅の卓で、熊のような背中が丸まっていた。足元には空の樽。|大男：「足が遅い、だと……俺が前に立ってたから、お前らは無傷だったんだろうが……！」|ジョッキが卓に叩きつけられ、周りの客がそっと席を立った。','大男が静かになると、店に笑い声が戻ってきた。|料理を運ぶ娘が、通りすがりに囁く。|給仕：「奥の卓、さっきから同じ人ばかり勝ってるの。おかしくない？」','夜が更け、客もまばらになった。おかみが最後の樽の栓を閉める。|そのとき、扉が乱暴に開いた。さっきのイカサマ師だ。後ろに、にやついた顔が三つ。']},
q8:{in:['ミレア：「旧市街の町内会からです。枯れ井戸から、夜中に何かを引っかく音がするって」|ミレア：「猫か、風か、それとも……。あの辺り、昔の地下遺構が残っているんですよね」','旧市街の広場。苔むした井戸のまわりに、住人が集まっていた。|老人：「ゆうべは声も聞こえたんだ。『だれかー』って。子どもの声だった」|老婆：「井戸の幽霊だよ。あたしの婆さんも言ってた」|覗き込むと、冷たい風が吹き上げてきた。底のほうで、かり、かり、と音がする。'],
p:['釣瓶の縄は、触れただけで繊維がほつれた。|石組みの壁は苔で滑る。底までは、家三軒ぶんほどありそうだ。','底は乾いていた。横穴がひとつ、人の手で掘られた跡がある。新しい。|奥に、紋章を刻んだ石扉。その前に、小さなつるはしと、食べかけの干し肉が落ちていた。','扉が開くと、音がはっきり聞こえた。爪で石を掻く音。それと、泣き声。|？？？：「だれか……！　足、挟まって……こいつ、まだ動くんだ！」|暗がりで、石の目がふたつ、青く灯った。']},
q9:{in:['ミレアの顔から、いつもの笑みが消えていた。|ミレア：「北の丘のオークが、開拓村を襲いました。村人が十数人、連れ去られています」|ミレア：「Dランクのあなたたちにお願いするのは、心苦しいんです。でも、今この街で動けるのは――」','開拓村は、半分が焼け跡だった。逃げのびた若者が、包帯の腕で丘を指す。|若者：「親父も、妹も、あの中だ。あいつら、冬越しの人手にするつもりなんだ」|若者：「俺も行く、と言いたいが……この腕じゃ足手まといだ。頼む。頼みます」|丘の上に、黒い柵の影が見えた。'],
p:['日暮れを待って、丘の麓の林に潜む。|丸太の柵、櫓がふたつ、門はひとつ。篝火が焚かれ、見張りの影がゆっくり動いている。','柵に取りついたそのとき、砦の中で太鼓が鳴った。気づかれたか、それとも交代の合図か。|どちらにせよ、門が軋みながら開いていく。','門前を抜け、砦の中へ。家畜小屋のような建物から、すすり泣きが聞こえた。|格子の向こうで、痩せた顔がいくつも、信じられないものを見る目でこちらを見た。','村人を裏手へ逃がし終えたとき、背後の地面が揺れた。|砦の主だ。人の背丈ほどの戦斧を肩に担ぎ、逃げていく村人と、あなたたちを見比べて――笑った。']},
q10:{in:['ギルドの扉が勢いよく開き、ローブ姿の若者が転がり込んできた。|助手：「が、学院です！　実験棟で試作ゴーレムが！　教授会は『想定内』と言っていますが、全然想定内じゃありません！」|ミレア：「……緊急依頼として受理します。お願いできますか」','王立魔法学院の中庭は、避難した学生でごった返していた。|実験棟の窓から、ときどき青白い光と、何かが割れる音。|老教授：「壊してよい。ただし建物は壊すな。あれは寄付で建てたのだ」|助手：「それと、ルシア君がまだ中に……止めると言って聞かなくて」'],
p:['実験棟のまわりには、薄い膜のような光が張られていた。触れた落ち葉が、ぱちりと弾かれる。|教授たちは膜の前で、誰が解除の書類に署名するかを議論している。','棟の中は、嵐の後のようだった。廊下に羊皮紙が舞い、床は水浸し。|角の向こうから、ばたばたと木のぶつかる音が近づいてくる。それも、たくさん。','大実験室の扉は、内側から吹き飛んでいた。|天井まで届く鉄の巨体。その足元で、制御盤にしがみついた女学生が、こちらを見もせずに怒鳴る。|ルシア：「遅い！　誰でもいいから、あれの気を引いて！」']},
q11:{in:['ミレア：「不動産組合からの依頼です。丘の旧伯爵邸、もう十年も買い手がつかなくて」|ミレア：「下見に行った人が、みんな青い顔で戻ってくるんです。『誰かが泣いている』って」','組合の男は、門の前で鍵束を渡すと、三歩下がった。|組合員：「わ、私はここで。中のものは壊しても構いません。ただ、その……泣かせないでやってください」|組合員：「妙な話ですが、聞いていると、こっちまで悲しくなるんですよ」|錆びた門が、風もないのに、きい、と鳴った。'],
p:['玄関の扉は、鍵を差す前に内側へ開いた。|広間には埃よけの布をかぶった家具。正面の大階段。壁の肖像画は、どれも顔のところだけ色が褪せている。','二階の廊下は長く、両側に飾り鎧が並んでいた。|歩くたび、背後でかちゃり、と小さな音がする。振り向くと、鎧の向きが、さっきと少し違う。','廊下の突き当たり、書斎の扉の下から、青い光が漏れていた。|すすり泣きが聞こえる。扉を開けると、本の山の真ん中に、透きとおった少女が座っていた。']},
q12:{in:['その朝、ギルドの鐘が三度鳴った。緊急招集の合図だ。|ミレア：「北の霊峰で、古竜が目を覚ましました。麓の村に、灰が降り始めています」|ミレア：「王都の騎士団が着くまで十日。それまで保ちません。……行けるのは、あなたたちだけです」','出発の朝。ギルドの前に、見知った顔が並んでいた。薬師のマルタ、酒場のおかみ、下水道の管理人まで。|マルタ：「持っていきな。裏の筋は三本、ちゃんと数えたよ」|ミレアは何か言いかけて、やめて、もう一度口を開いた。|ミレア：「依頼の条件、覚えていますね。『生きて帰ること』です。……達成印、用意して待っていますから」'],
p:['三日歩いて、霊峰の麓。そこから先は道がない。|六合目を越えたあたりで、風が雪を運んできた。','吹雪を抜けると、嘘のように風が止んだ。白い斜面に、巨大な獣の骨が点々と突き出している。|――違う。牙だ。抜け落ちた、竜の牙。それが、雪の下でかたかたと震え始めた。','山頂が近い。雪が消え、岩が黒く濡れている。暖かいのだ。|規則正しい地鳴りが、足の裏に伝わってくる。寝息だ、と気づいたとき、目の前の岩が赤く溶けて流れた。','火口の縁に立つ。底に、山ひとつぶんの鱗がとぐろを巻いていた。|金色の瞳が、ゆっくりと開く。|古竜：「――小さきものが、何用か」','膝が震えている。それでも、誰も退がらなかった。|古竜は首を高く上げ、胸をふくらませた。喉の奥に、白い光が灯る。']}};
Object.assign(ST,{
q13:{in:['ギルドに、金の封蝋の書状が届いた。ミレアが両手で捧げ持っている。|ミレア：「こ、国王陛下からです。『古竜を従えし者、十日以内に参上せよ』……従えてはいませんよね？」|ティア：「従えてはおらぬ。ついて行っておるだけじゃ」','出発の朝。ギルド長が珍しく見送りに出てきた。|ギルド長：「王都の貴族には、竜を欲しがる者が多い。鱗一枚で城が建つからな」|ギルド長：「陛下は話の分かる方だ。問題は、そこへ着くまでだ。気をつけろ」'],
p:['王都まで五日の街道。三日目の昼、関所が見えてきた。|旗が違う。王家の獅子ではなく、見慣れぬ黒い鷲だ。','関所を越えた夜。街道脇の林で火を焚く。|風が止み、虫の声が止んだ。静かすぎる。','王都の城門は、ラズベルの城壁の三倍はあった。|謁見の間。玉座の王は、思ったより若い。その隣で、白髭の老騎士がこちらを値踏みしている。|国王：「よく来た。……爺、やめておけと言っても聞かぬのだろうな」']},
q14:{in:['ミレア：「迷宮管理局からです。十八層まで行ったCランクの一行が、『この先は無理だ』と地図を置いて引き返しました」|ミレア：「二十層には階層主がいるはずです。誰も見たことはありませんけど、足音だけは、十五層まで聞こえるそうです」','ラズベル地下迷宮「奈落の階」。入口の石碑には、踏破者の名が層ごとに刻まれている。|十九層から先は、まだ空白だ。|迷宮番：「帰りの分の松明を忘れるなよ。忘れた奴の名前は、別の石に刻むことになってる」'],
p:['十四層までは、先人の地図が役に立った。|十五層。壁の松明の色が、青に変わる。ここからは、地図の書き込みが急に少ない。','回廊を抜けると、古い扉があった。取っ手だけが、妙に新しく磨かれている。|誰かが、何度も開けたのだ。そして、たぶん出てきていない。','階段を下りるにつれ、空気が重く、甘くなった。|足元の石畳が、途中から水に沈んでいる。水は紫色をしていた。','沼を渡り切った先に、巨大な両開きの扉。|扉の向こうで、何かが歩いている。一歩ごとに、足元の小石が跳ねた。']},
q15:{in:['ミレア：「Bランクパーティ『蒼の牙』が、北の遺跡から戻りません。予定を五日過ぎています」|ミレア：「速攻が売りの一行で……先月、盾役の方が抜けてから、少し無理をしていたみたいです」','遺跡の麓の村。宿の主人は、五日前のことをよく覚えていた。|宿の主人：「四人とも、えらく急いでいたよ。『日帰りで済ませる』ってね。荷物も半分、うちに置いていった」|宿の主人：「前は、でっかい盾を持った人が一緒だったろう。あの人がいつも、帰りの刻限を決めていたんだがなあ」'],
p:['遺跡は、山の斜面に半ば埋もれていた。|入口の前に、焚き火の跡。灰は冷え切っている。','瓦礫を抜けると、長い通路だった。壁に、新しい刀傷。そして、引きずったような血の跡。|奥から、金属の擦れる規則正しい音が近づいてくる。','血の跡は、最奥の小部屋へ続いていた。扉は内側から塞がれている。|蒼の牙：「……誰だ。助け、か？　すまん、動けるのは俺だけだ」','四人を担架と肩で支え、来た道を戻る。|半分まで来たとき、足の下で、低い唸りが始まった。']},
q16:{in:['真夜中、ギルドの鐘が鳴り止まない。|ミレア：「魔の森の物見から早馬です。森じゅうの魔物が、一斉に南へ動いています。大暴走です」|ミレア：「夜明けには北門に着きます。……Aランクのあなたたちに門の指揮をお願いしたいと、衛兵隊長から」','北門へ向かう通りは、松明を持った人であふれていた。逃げる者と、門へ向かう者。|薬師のマルタが、籠いっぱいの癒し草を荷車に積んでいる。|マルタ：「裏の筋は三本、全部数えたよ。今度はあたしらが届ける番さ」'],
p:['城壁の上は、冷たい風が吹いていた。北の地平は、まだ暗い。|衛兵隊長：「兵が二百、冒険者が四十、あとは町の者だ。……足りんな」|隊長は笑った。足りないのは、いつものことだ。','東の空が白む。同時に、北の地平が動いた。|地鳴りが、足の裏から膝へ上ってくる。','魔狼の波が引いた。壁の上に、短い歓声。|それを、頭上からの甲高い叫びが断ち切った。','翼竜が去っても、門の内側の騒ぎは収まらない。|担架が足りない。包帯が足りない。そして、声を出す者がいない。','日が高くなった。群れはまばらになり、森へ引き返す魔物も見える。|終わった、と誰かが言いかけたとき、森の木々がまとめて倒れた。']},
q17:{in:['その依頼は、掲示板ではなく、ミレアの手から直接渡された。封筒に差出人はない。|ミレア：「辺境伯閣下の執事の方が、裏口から。……読んだら燃やすように、と」|中には招待状と、一行だけの走り書き。「今宵、客の中に角を隠した者がいる」','辺境伯の館。裏の通用口で、痩せた執事が待っていた。|執事：「閣下はご存じです。ですが、舞踏会は中止できません。王都の使者が来ている。弱みは見せられないのです」|執事：「騒ぎにせず、客に気づかれず。……無理を申しているのは承知しております」'],
p:['大広間の扉が開く。楽団の音、香水、千本の蝋燭。|仮面の群れが、ゆるやかに渦を巻いている。','一刻ほどが過ぎた。怪しい者は見つからない。|広間の中央で、辺境伯が乾杯の杯を掲げようとしている。銀の盆を持った給仕が、その隣に立った。','給仕は、こちらの視線に気づいた。仮面の奥の目が、縦に細くなる。|次の瞬間、盆が床に落ち、露台の窓が開いていた。','中庭。追い詰められた給仕は、ゆっくりと振り返った。|広間からは、まだ楽団の音が聞こえている。誰も、気づいていない。']},
q18:{in:['その朝、南の空は、昼になっても暗いままだった。|ミレア：「南の峠に、魔将ヴァルガの軍勢です。舞踏会の刺客が言っていた『主』……」|ミレア：「王都の援軍は七日後。峠からここまでは、三日です」|ミレアは、依頼書に自分で判を押した。手が、少しだけ震えている。','ギルドの広間に、街じゅうの冒険者が集まっていた。「蒼の牙」の四人も、衛兵隊長も、迷宮番もいる。|衛兵隊長：「俺たちが正面で騒ぐ。お前たちは将の首だけを狙え」|魔女：「死ぬんじゃないよ。うちの猫が寂しがる」|ミレア：「依頼の条件は、いつもと同じです。『生きて帰ること』。……行ってらっしゃい」'],
p:['夜。峠の麓で、味方の陣が鬨の声を上げた。陽動が始まったのだ。|その騒ぎを背に、岩陰から敵陣を見下ろす。','陣の最奥。黒い天幕は、近くで見ると小さな砦ほどもあった。|入口の前に、動かない影が六つ。','親衛隊の最後の一体が崩れると、天幕の垂れ布が、内側からの風でめくれ上がった。|冷たく、重く、甘い風だった。','瘴気の奥で、影が立ち上がった。|魔将ヴァルガ：「千の兵を抜けて、四人か。……よい。久しく、退屈していた」','魔将の兜が割れ、大剣が半ばから折れた。こちらも、もう立っているのがやっとだ。|仲間の顔を見る。全員が、同じ顔をしていた。まだやれる、という顔を。']}});
for(const k in ST){QS[k].in=ST[k].in;ST[k].p.forEach((p,i)=>QS[k].sc[i].p=p)}
const QT={
q1:{x:'薬師のマルタが、礼だと言って薬草茶の包みを子豚亭に届けてくれていた。',m:{sera:'「癒し草、施療院でも使うんです。裏の筋が三本……わたし、今日は一度も間違えませんでしたよ」',nico:'「草むしりで金がもらえるなんて、いい街だよなあ。おいら、匂いで全部見つけたぜ」',tia:'「草を摘むだけの仕事に、わらわを連れ出すとはの。……崖の上の景色は、悪くなかったが」'}},
q2:{x:'席につく前に、おかみに裏の井戸で三度、手を洗わされた。',m:{sera:'「匂い、まだ取れていませんか？　……法衣は三回洗ったんですけど」',fine:'「二度と行かないわ。エルフの鼻を何だと思ってるの。……報酬は、まあ、悪くなかったけど」',gald:'「下水道は狭くていい。俺が通路に立てば、後ろには何も通らん」'}},
q3:{x:'袖口には、まだ黒い猫の毛がついている。',m:{sera:'「猫ちゃん、無事でよかったですね。……あの、魔女さまの軟膏、成分を聞いてもいいでしょうか」',elma:'「まあ、黒猫。わたくしの屋敷にもおりましたのよ。百年前に。あの子の子孫かしら」',nico:'「梁の上の猫かあ。おいらなら尻尾でつかまって……え、一人で行く依頼だったの？」'}},
q4:{x:'神殿から、焼き菓子の籠が届いていた。少し焦げている。',m:{sera:'「あの……あらためて、ありがとうございました。あの洞の冷たさは、たぶん一生忘れません。来てくれた足音も」'}},
q5:{x:'行商人が、取り戻した反物の切れ端で、人数ぶんの手拭いを作ってくれた。',m:{sera:'「ゴブリンさんたちにも、帰る場所があったんですよね。……いえ、後悔はしていません。少し、祈っただけです」',fine:'「見張りの二匹、見た？　同時よ、同時。……あなた、ちゃんと数えてた？」',gald:'「あのホブゴブリンの鉈、重かったな。久しぶりに、盾がいい音で鳴った」'}},
q6:{x:'ベルトが礼に置いていった蜂蜜酒の小樽が、卓の真ん中に据えられた。',m:{fine:'「言っておくけど、あの護衛で私が撃った矢は十四本。外したのは、なしよ」',sera:'「ベルトさん、最後まで『大丈夫かね』って。十二回、数えました」',gald:'「荷馬車と同じ速さで歩く仕事は、性に合う。誰にも遅いと言われん」'}},
q7:{x:'おかみが、昨夜割れなかった皿の枚数だけ、腸詰めをおまけしてくれた。',m:{gald:'「……昨夜のことは、半分しか覚えていない。覚えている半分は、忘れてくれ」',fine:'「一人で酒場の用心棒？　人間って、妙な仕事を思いつくのね。で、誰が一番うるさかったの」',sera:'「イカサマって、どうやるんですか？　……いえ、やりませんよ！　見破るためです」'}},
q8:{x:'旧市街の町内会から、井戸の幽霊を退治した礼にと、干し果物がひと袋届いた。',m:{nico:'「あの石の犬、まだ夢に出るんだ。……でも、夢の最後は、いつも誰かが扉を開けてくれる」',gald:'「あの井戸を下りるのは骨だった。縄より先に、俺の膝が切れるかと思ったぞ」',fine:'「井戸の底に子どもがいるなんて、誰が思うのよ。……泣き声は、聞こえてたけど」'}},
q9:{x:'開拓村の若者が、村で最初に焼いたというパンを届けに来た。まだ温かい。',m:{sera:'「牢から出てきた方々の顔、見ましたか。あれを見るために、わたしは神官になったんだと思います」',gald:'「オークロードの斧を受けたとき、盾が半分に割れるかと思った。……割れなかった。いい盾だ」',nico:'「裏の抜け道、おいらが見つけたんだぜ。みんな通れたろ？　へへ」'}},
q10:{x:'学院から届いた請求書は、なぜか箒とバケツの代金だけだった。',m:{lucia:'「あのゴーレム、右膝の関節が設計より二割も脆かったわ。……助かったけれど、設計者としては複雑よ」',nico:'「箒が飛んで、バケツが走るんだぜ！？　学院って、毎日あんななの？」',fine:'「魔法使いって、どうして自分で止められないものを作るのかしら。……あの子は、止めようとしてたわね」'}},
q11:{x:'不動産組合の男が、まだ少し青い顔で、礼の葡萄酒を置いていった。',m:{elma:'「わたくしの屋敷で、皆さまが大立ち回りなさるのを、書斎から聞いておりましたの。少し、楽しかったですわ」',sera:'「鎧に祈りが効いたとき、ほっとしました。……泣いている方を、力で黙らせずに済んで」',lucia:'「幽霊の魔力構造、興味深いわ。今度すこし測らせてもらえないかしら。痛くはしないから」'}},
q12:{x:'街じゅうが、古竜の話で持ちきりだ。子豚亭の看板には、もう小さな竜の絵が描き足されている。',m:{tia:'「そなたら、わらわの逆鱗を狙うたであろう。……良い目をしておった。千年で一番、良い目じゃった」',gald:'「竜の尾を、盾で受けた。受けたんだ、俺が。……前の連中に、手紙でも書いてやるか」',sera:'「咆哮のとき、祈りの声が震えなかったんです。自分でも、びっくりしました」',elma:'「竜の息って、幽霊にも熱いんですのね。新しい発見ですわ。日記に書きましたの」',lucia:'「古竜の炎の温度、概算で鉄の融点の三倍。記録できたのは、世界でわたしだけよ」',fine:'「竜を射たエルフなんて、森の歴史に一人もいないわ。長老たちに、どんな顔で話そうかしら」',nico:'「溶けた岩の上を走ったんだぜ、おいら。尻尾の先、ちょっと焦げたけど」'}},
q13:{x:'王都土産の焼き菓子は、帰り道の三日で半分に減っていた。犯人は分かっている。',m:{tia:'「王というのは、存外話の分かる男であった。菓子の趣味が良い。また呼ばれてやってもよいぞ」',gald:'「騎士団長の剣は重かった。……年を取っても、ああありたいもんだ」',fine:'「王都の人間は、エルフを見ても驚かないのね。つまらないわ。竜には驚いてたけど」'}},
q14:{x:'迷宮番が、石碑に名前を刻む日取りを知らせに来た。綴りを三度、確かめていった。',m:{nico:'「二十層！　おいらの名前が石に残るんだぜ。墓じゃない石にさ。……へへ、変な気分」',lucia:'「転移陣の周期、帳面に全部写したわ。論文三本ぶんよ。共著者の欄、空けてあるから」',sera:'「毒沼の階で、祈りを一度も切らしませんでした。……喉は、まだ少し痛いですけど」'}},
q15:{x:'「蒼の牙」の四人から、不器用な字の礼状と、酒の樽がひとつ届いていた。',m:{gald:'「あいつら、俺の顔を見て泣きやがった。……俺もだ。言うなよ」',sera:'「呪いを解いたとき、あの方、昔の盾役さんの名前を呼んでいました。ずっと、気にしていたんですね」',nico:'「遺跡が崩れるとき、おいらの耳が先に気づいたんだ。昔の商売も、たまには役に立つよな」'}},
q16:{x:'街じゅうの酒場が、今夜は代金を取らないと決めたらしい。子豚亭は、通りまで人であふれている。',m:{fine:'「矢筒を三つ空にしたの、初めてよ。指が動かないわ。……杯は、持てるけど」',tia:'「群れの主とやら、わらわの寝起きより行儀が悪かったのう。街を守るというのは、存外、気分の良いものじゃ」',gald:'「門の前に立って、一匹も通さなかった。……町の子どもが、俺の盾に花を挿していった」'}},
q17:{x:'館の執事から、差出人のない箱が届いた。中身は、あの夜いちばん良かった酒だ。',m:{elma:'「舞踏会！　百年越しの舞踏会でしたわ！　……踊れませんでしたけれど。次は、きっと」',lucia:'「仮面をつけて貴族のふりなんて、学院の晩餐会より楽だったわ。あそこは素顔で腹を探り合うもの」',nico:'「給仕の服、似合ってただろ？　盆も落とさなかったし。……つまみ食いは、ちょっとした」'}},
q18:{x:'南の空は、もう暗くない。子豚亭の扉は外され、卓は通りの向こうまで並べられている。',m:{sera:'「みんな、帰ってきました。数えたんです、何度も。……全員です」',gald:'「一歩も退がらなかった。足が遅くてよかったと思ったのは、初めてだ」',fine:'「これで百年ぶんの土産話ができたわ。最後は『みんな無事だった』。約束どおりね」',nico:'「帰り道、ちゃんと人数そろってた！　おいら、三回数えたから間違いない！」',lucia:'「勝算は七割と言ったわね。訂正するわ。あなたたちとなら、最初から十割だった」',elma:'「日記の今日の頁、何から書けばよいのか分かりませんの。……『生きている』と書いても、よろしいかしら」',tia:'「千年で二度目の、良い戦であった。一度目は、そなたらに負けたときじゃ」'}}};

q9:[['sera',2,'セラが、格子の前に膝をついた。|セラ：「もう大丈夫です。迎えに来ました。……わたしも前に、こうして迎えに来てもらったんです」'],['gald',3,'ガルド：「でかい斧だな。……いい。ああいうのを止めるために、俺はいる」']],
q11:[['sera',2,'セラ：「泣いています。……悪いものの声じゃありません。迷子の声です」']],
q12:[['lucia',3,'ルシア：「古竜と言葉を交わした記録は、文献に三例だけ。四例目は、わたしが書くわ。……手が震えて、字にならないけれど」'],['gald',4,'ガルド：「全員、俺の後ろだ。竜の息だろうが何だろうが、一度は止めてみせる。一度あれば、十分だろう」']],
q13:[['tia',2,'ティアは玉座を見上げ、腰に手を当てた。|ティア：「そなたが王か。若いの。わらわが最後に見た王は、そなたの二十代前じゃ」|国王：「……それは、ぜひ話を聞かせてほしい。菓子は好きかね」|ティア：「好きじゃ」']],
q14:[['lucia',0,'ルシア：「待って。この陣、学院の初代学長の筆跡よ。……教本に載っているのと、癖が同じ」|ルシア：「三百年前の人と、答え合わせができるなんて。少しだけ時間をちょうだい。少しだけよ」'],['nico',1,'ニコ：「この扉、嫌な匂いがする。開けた奴が、帰ってきてない匂い」|ニコ：「……でも、行くんだよな。分かってる。おいらが最初に入るよ」']],
q15:[['nico',0,'ニコ：「入口が内側から崩れてる。……盗掘屋はね、こういうとき絶対に入らないんだ」|ニコ：「でも、今のおいらは斥候だから。入るよ」'],['gald',2,'ガルドが、塞がれた扉の前で足を止めた。|ガルド：「……俺だ。開けろ。迎えに来た」|扉の向こうで、長い沈黙。それから、嗚咽。|蒼の牙：「ガルド……すまん。すまなかった……」|ガルド：「話は後だ。全員、俺の後ろに入れ。いつもどおりにな」']],
q16:[['sera',3,'セラは、倒れた人々を見回して、一度だけ深く息を吸った。|セラ：「施療院で習いました。重い方から、順番に。泣くのは、全員を診てからです」'],['tia',4,'ティア：「ほう、あれが主か。図体ばかりじゃの。わらわが元の姿なら、ひと睨みで逃げ出すものを」|ティア：「まあよい。今のわらわは冒険者じゃ。冒険者のやり方で、片づけてやろう」']],
q17:[['elma',0,'エルマが、広間の入口で動かなくなった。|エルマ：「……百年前、わたくしが行けなかった舞踏会も、きっとこんなふうでしたのね」|エルマ：「大丈夫ですわ。お仕事ですもの。でも――一曲ぶんだけ、目に焼きつけさせてくださいな」'],['fine',2,'フィーネ：「屋根の上？　任せなさい。枝から枝へ跳ぶのに比べたら、瓦なんて平地よ」']]};

 const bv=q.buff;h+=fuda({a:'body',gl:'体',ty:'捨て身',name:'体を張る',pow:bv,foot:bv>=d?'成功':`HP−${dmgOf(d-bv)}`,fc:bv>=d?'ok':'bad',own:'札を使わない'});
 return h+'</div>'},
reward(){const r=S.rw,Q=QS[r.id];return hud()+`<div class="head"><p class="eyebrow">依頼達成</p><h2>${Q.n}</h2></div>${Q.after?prose(Q.after):''}${r.say?`<div class="say"><b>${r.say[0]}</b>${r.say[1]}</div>`:''}<div class="slips">${r.got.map(g=>`<div class="slip"><span>${g[0]}</span><span>${g[1]}</span></div>`).join('')}</div>${r.perf?'<div class="say"><b>受付嬢ミレア</b>「依頼主さんが、わざわざギルドまでお礼にいらしたんですよ。『期待以上だ、非の打ちどころがない』って。報酬に色をつけてくださいました」</div>':''}${r.up?`<div class="say"><b>受付嬢ミレア</b>「おめでとうございます。今日からあなたは${r.up}ランクです。新しい貼り紙が受けられますよ」</div>`:''}${go('home',r.id==='q18'?'朝日の中を帰る':S.mem.length?'子豚亭で打ち上げ':'ギルドへ戻る')}`},
ending0(){return `<section class="title"><p class="eyebrow">終章</p><h1>辺境の<br>夜明け</h1><p class="nar">魔将ヴァルガの大剣が、地に落ちた。瘴気が晴れ、南の空に朝日が昇る。<br><br>辺境都市ラズベルは、その日を祝日に決めた。銀の秤亭の掲示板のいちばん上には、依頼ではない貼り紙が一枚。『おかえりなさい』。<br><br>ミレアは達成印を押しながら言った。「Sランク審査の話が来ていますよ。王都まで出向くそうですけど――その前に、溜まっている貼り紙、片づけてくれますよね？」</p>${go('recap','旅をふりかえる',{s:'実績と称号、冒険者気質診断'})}</section>`},
fail(){return hud()+`<div class="head"><p class="eyebrow">依頼失敗</p><h2>気がつくと、ギルドの長椅子だった</h2></div><p class="nar">通りすがりの冒険者が担いで帰ってくれたらしい。ミレアが濡れた布を額に載せてくれる。${S.ff&&QS[S.ff].pre?'「ほかの冒険者たちが、時間を稼いでくれています。いまのうちに立て直してください。下げていた貼り紙も、戻しておきますから」':'「生きて帰れば、何度でも挑めます。準備を整えて、また来てください」'}</p><p class="prog">報酬はなし。使った道具は戻らない。技能と仲間はそのまま。</p>${go('home','掲示板の前に立つ')}`},
shop(){const ri=rankI(),tier=(lbl,r)=>`<p class="lbl">${lbl}</p>`+(ri>=r?`<div class="hand two">${Object.keys(GR).filter(k=>GR[k].c&&(GR[k].r||0)===r).map(k=>{const g=GR[k];return fuda({t:g.t,a:'buyg',d:`data-k="${k}"`,ty:'装備',gl:g.t?'':'輪',name:g.n,x:g.x,foot:`${g.c}G・所持${S.gear.filter(x=>x.k===k).length}`,dis:S.gold<g.c})}).join('')}</div>`:`<p class="prog">${RK[r]}ランクになると入荷する。</p>`);
 return hud()+`<div class="head"><h2>行商人の露店</h2><p>道具は一度きり、最大6個（いま${S.items.length}個）。装備は買ったあと、掲示板の「仲間と装備」で誰かに身につけさせる。</p></div><div class="say"><b>行商人</b>${ri<3?'「いらっしゃい。駆け出しさん向けの品なら、ひととおり揃ってるよ」':ri<4?'「お、顔つきが変わったね。奥の箱も開けようか。値は張るが、物はいい」':ri<5?'「竜を連れた御一行に、安物は出せないね。王都の工房から取り寄せた品だ」':'「Aランク様のお越しだ。この箱はね、あんたが来るまで誰にも見せなかったんだよ」'}</div>${msg()}<p class="lbl">道具</p><div class="hand two">${Object.entries(IT).map(([id,it])=>fuda({a:'buy',d:`data-id="${id}"`,name:it.n,x:it.x,foot:`${it.c}G・所持${S.items.filter(x=>x===id).length}`,dis:S.gold<it.c||S.items.length>=6})).join('')}</div>${tier('装備',0)}${tier('上級品',3)}${tier('逸品',4)}${tier('伝説級',5)}${go('back','掲示板に戻る',{alt:1})}`},
school(){const t=S.sch,s=SCH[t],l=S.sk[t],c=trainCost(t);return hud()+`<div class="scene read"><p class="prog">${T[t].n}の習い事${S.msg&&l===7?'　免許皆伝':''}</p><h2>${s.n}</h2>${prose(S.msg?(l===7?MAS[t]:s.ok[l>4?1:0]):`${s.who}：${s.hi[l===0?0:l<3?1:l<5?2:l<7?3:4]}`)}</div>${msg()}<div class="hand two">${fuda({t,a:'learn',d:`data-t="${t}"`,name:c?`Lv${l} → ${l+1}`:'Lv7 極めた',x:c?`習得：${SK[t][l]}（突破力${l+1}）`:'これ以上は、自分で道を拓くしかない。',foot:c?`経験値札${c.xp}${c.g?'・'+c.g+'G':''}`:'',dis:!c||S.xp<c.xp||S.gold<c.g})}</div><p class="prog">経験値札は依頼の報酬で手に入る（いま${S.xp}枚・所持金${S.gold}G）。${l?'':'初めての系統は入門料20G。'}</p>${go('back','掲示板に戻る',{alt:1})}`},
recruit(){const c=20+10*rankI(),b=rankI()>=2?3:2,full=S.act.length>=3;return hud()+`<div class="head"><h2>臨時メンバー募集</h2><p>次に受ける依頼一回だけ同行する助っ人（ソロ限定の依頼には来ない）。契約料は${c}G。</p></div>${msg()}${S.temp?`<div class="say"><b>契約中</b>${S.temp.n}（${T[S.temp.t].n}）が、次の依頼を待っている。</div>`:full?'<div class="say"><b>席がない</b>同行する仲間がすでに3人いる。依頼の貼り紙で誰かを待機にすれば雇える。</div>':''}<div class="hand">${S.cands.map(i=>{const p=TP[i];return fuda({t:p.t,a:'hire',d:`data-i="${i}"`,name:p.n,x:p.c.map(n=>`${n} ${b}`).join('<br>'),foot:c+'G',dis:!!S.temp||full||S.gold<c})}).join('')}</div>${go('back','掲示板に戻る',{alt:1})}`},
tavern(){const L=S.last;return hud()+`<div class="scene read"><p class="prog">依頼明けの一杯</p><h2>踊る子豚亭</h2>${S.tav?prose((L?QT[L.id].x+'|'+(AQT[L.id]?'藍子：'+AQT[L.id]+'|':''):'')+'今夜は、誰の隣に座ろう。話を聞けるのは一晩に一人。まっすぐ帰ってもいい。'):prose('今夜はもう解散した。次の依頼を終えたら、また集まろう。')}</div>${S.tav?`<div class="hand">${S.mem.map(id=>{const m=MB[id];return fuda({t:m.t,a:'talk',d:`data-id="${id}"`,name:m.n,x:m.j,foot:hearts(id),own:L&&L.p.includes(id)?'今日の依頼に同行':(S.epi[id]||0)<3?'話したそうにしている':'くつろいでいる'})}).join('')}</div>`:''}${go('back','掲示板に戻る',{alt:1})}`},
talk(){const t=S.talk,m=MB[t.id];return hud()+talkV(`${m.n}と卓を囲む`,'踊る子豚亭',t.lead||'',m,m.ep[t.idx]||GEN,t,'talkR','back','ギルドへ戻る')},
equip(){const w=S.who,me=w==='me',m=MB[w],mine=gearOf(w),free=S.gear.map((g,i)=>[g,i]).filter(x=>!x[0].w);
 const cards=me?TK.flatMap(t=>Array.from({length:S.sk[t]},(_,l)=>({n:SK[t][l],t,p:l+1,w:'me'}))).concat(aCards()):mCards(w);
 return hud()+`<div class="head"><h2>仲間と装備</h2><p>装備は一人2つまで。仲間は依頼に同行するとLvが上がり、語らうと絆が深まる。</p></div>
<div class="tabs">${['me',...S.mem].map(id=>`<button class="tab ${id===w?'on':''}" data-a="who" data-w="${id}">${id==='me'?'藍子':MB[id].n}</button>`).join('')}</div>
<div class="say"><b>${me?whoAmI():m.j}</b>${me?`${RK[rankI()]}ランクの冒険者。技能は習い事の貼り紙で、見習い帖は頁で伸ばす。`:`Lv${mLv(w)}${mLv(w)<5?`（次のLvまで、依頼の経験あと${[2,5,9,16][mLv(w)-1]-(S.mx[w]||0)}）`:'（最高）'}<br>${hearts(w)}${bondOf(w)<3?'　絆3で絆の札を覚える':''}<br>これまでの返事：背中を押す ${(S.lean[w]||[0,0])[0]}回／寄り添う ${(S.lean[w]||[0,0])[1]}回`}</div>
${!me&&mLv(w)<4?(n=>`<p class="prog">Lv${n?4:2}で覚える札は、返事の向きで決まる。背中を押すほうが多ければ「${m.c[n+2][0]}」（${T[m.t].n}）、寄り添うほうが多ければ「${m.alt[n][0]}」（${T[m.alt[n][2]].n}）。</p>`)(mLv(w)<2?0:1):''}
<p class="lbl">札</p><div class="rows">${cards.map(c=>`<div class="row"><i class="chip t-${c.t}">${T[c.t].g}</i><span>${c.n}${c.ak?(c.any?'（見習い帖・どこでも適性）':'（見習い帖）'):c.any?'（絆・どこでも適性）':''}</span><span>突破力 ${c.p+bon(c)}</span></div>`).join('')}</div>
<p class="lbl">装備中 ${mine.length}/2（タップで外す）</p>${mine.length?`<div class="hand two">${S.gear.map((g,i)=>g.w===w?gfuda(g.k,'strip',i,'外す'):'').join('')}</div>`:'<p class="prog">何も身につけていない。</p>'}
<p class="lbl">持ち物（タップで装備）</p>${free.length?`<div class="hand two">${free.map(([g,i])=>gfuda(g.k,'wear',i,mine.length>=2?'枠がいっぱい':'装備する',mine.length>=2)).join('')}</div>`:'<p class="prog">空いている装備はない。露店や依頼の報酬で手に入る。</p>'}
${go('back','掲示板に戻る',{alt:1})}`},
status(){const cnt={};S.items.forEach(i=>cnt[i]=(cnt[i]||0)+1);
 return hud()+`<div class="head"><h2>冒険者証</h2><p>${whoAmI()}　${RK[rankI()]}ランク${rankI()<3?`（次のランクまで名声あと${[2,5,9][rankI()]-S.fame}）`:rankI()===3?'（古竜の依頼を果たせばBランク）':rankI()===4?`（Aランクまで名声あと${20-S.fame}）`:''}</p></div>
<p class="lbl">技能</p><div class="rows">${TK.map(t=>`<div class="row"><i class="chip t-${t}">${T[t].g} ${T[t].n}</i><span class="pips">${'●'.repeat(S.sk[t])}${'○'.repeat(7-S.sk[t])}</span><span>札${S.sk[t]}枚</span></div>`).join('')}</div>
<p class="lbl">仲間</p><div class="rows">${S.mem.length?S.mem.map(id=>{const m=MB[id];return `<div class="row"><i class="chip t-${m.t}">${T[m.t].g}</i><span>${m.n} Lv${mLv(id)}　${hearts(id)}</span><span>${S.act.includes(id)?'同行':'待機'}</span></div>`}).join(''):'<p class="prog">まだ固定の仲間はいない。依頼の報酬に「新しい仲間」とある貼り紙を探そう。</p>'}${S.temp?`<div class="row"><i class="chip t-${S.temp.t}">${T[S.temp.t].g}</i><span>${S.temp.n}</span><span>臨時</span></div>`:''}</div>
<p class="lbl">見習い帖（頁 ${S.ap}枚）</p>${aRows()}<p class="lbl">道具</p><p class="prog">${Object.keys(cnt).length?Object.entries(cnt).map(([i,n])=>`${IT[i].n}×${n}`).join('、'):'なし'}</p>
<div class="stack">${S.done.q18?go('recap','旅の記録と称号を見る'):''}${go('back','掲示板に戻る',{alt:1})}${go('reset','記録を消して最初から',{alt:1})}</div>`},
recap(){const s=S.st,d=domT(),head=d?TL.find(t=>t.k==='t'+d).n:TK.every(t=>S.sk[t]>=3)?'万能の人':'辺境の冒険者',p=persona(),best=[...S.mem].sort((a,b)=>bondOf(b)-bondOf(a))[0],fav=[...TK].sort((a,b)=>s.t[b]-s.t[a])[0],qn=Object.keys(QS);
 const rows=[['達成した依頼',`${qn.filter(k=>S.done[k]).length} / ${qn.length}`],['挑んだ場面',`${s.n}`],['会心の一手',`${s.crit}回`],['負傷',`${s.hurt}回`],['倒れた回数',`${s.fail}回`],['いちばん使った技',s.t[fav]?`${T[fav].n}（${s.t[fav]}枚）`:'―'],['いちばん絆の深い仲間',best?`${MB[best].n}（絆${bondOf(best)}）`:'―'],['仲間との語らい',`${s.chat}回`],['稼いだ報酬',`${s.gold}G`]];
 return `<div class="head"><p class="eyebrow">旅の記録</p><h2>${whoAmI()}の歩み</h2></div>${aCrest()}<div class="crest"><span>冒険者の称号</span><b>${head}</b></div><div class="say"><b>冒険者気質診断：${p.n}</b>${p.x}</div><div class="slips">${rows.map(g=>`<div class="slip"><span>${g[0]}</span><span>${g[1]}</span></div>`).join('')}</div><p class="lbl">称号コレクション ${COL.length} / ${TL.length}</p><div class="rows">${TL.map(t=>{const now=t.f(),old=COL.includes(t.k);return `<div class="row ttl"><span class="pips">${now?'●':old?'◎':'○'}</span><span>${now||old?t.n:'？？？'}</span><span>${t.x}</span></div>`}).join('')}</div><p class="prog">● 今回の旅で獲得　◎ 以前の旅で獲得　○ まだ。得意な技や仲間との過ごし方を変えると、別の称号が手に入る。</p><div class="stack">${go('back','ギルドへ戻る')}${go('reset','もう一度、最初から',{alt:1})}</div>`},
reset(){return `<div class="head"><h2>本当に最初からやり直しますか</h2><p>技能・仲間・所持品の記録がすべて消えます。</p></div><div class="stack">${go('reset2','記録を消す')}${go('back','やめて掲示板に戻る',{alt:1})}</div>`}
};
Object.assign(V,{
pro(){const i=S.pro||0;return `<div class="scene read"><p class="prog">序章　${i+1} / ${PRO.length}</p>${i===0?'<h2>私を呼ぶ声</h2>':''}${prose(PRO[i])}</div>${go('prop',i<PRO.length-1?'続きを読む':'登録用紙を受け取る')}`},
og(){return `<div class="head"><h2>得意なこと</h2><p>ミレアが登録用紙を差し出す。「特技の欄、何か書けそうなことはありますか？」（Lv2で開始）</p></div><div class="hand two">${TK.map(t=>fuda({t,a:'og',d:`data-t="${t}"`,name:JOB[t],x:OGX[t],foot:`${T[t].n} Lv2`})).join('')}</div>`},
og2(){const o=ORG.other;return `<div class="head"><h2>元の世界の思い出</h2><p>アイドルのお仕事で、いろいろな役を演じてきた。そこで覚えたことが、ひとつ（+1Lv）。得意と同じ系統を選べば、さらに伸びる。</p></div><div class="hand two">${TK.map(t=>fuda({t,a:'og2',d:`data-t="${t}"`,name:`${T[t].n} +1`,x:o.y[t]})).join('')}</div>`},
parting(){const ch=['帰ります','残ります','……ルリ、どうしたらいいのかな'],x=['待っている人のところへ、元の世界へ帰る','この街で、まだやりたいことがある','心に任せる。仲間との絆と、これまでの返事の向きで決まる'];
 return `<div class="scene read"><p class="prog">終章のまえに</p><h2>陽だまりの扉</h2>${prose(PART)}</div><p class="prog">あなたの答えを選ぶ</p><div class="hand">${ch.map((n,i)=>fuda({t:'h',a:'part',d:`data-i="${i}"`,ty:'答え',gl:'藍',name:n,x:x[i]})).join('')}</div>`},
ending(){const e=S.aend;if(!e)return V.ending0();const sk=e.sk,bk=sk==='tou'||sk==='bu'?'band':sk,b=e.b,bb=b?bondOf(b):0,bi=bb>=5?0:bb<3?2:1,bye=b?BYE[b][e.k]:'';
 const why=AE.why[e.ch<2?e.ch:e.k==='stay'?2:3];
 const body=e.k==='ret'?[AE.pre,why,AE.retBond[bi],bye,AE.ret,AE.souv[bk],AE.retEnd]:[AE.pre,why,AE.stayBond[bi],bye,AE.stay[bk],AE.stayEnd];
 return `<section class="title"><p class="eyebrow">終章</p><h1>${e.k==='ret'?'光の<br>向こうへ':'陽だまりの<br>街で'}</h1></section><div class="scene read">${prose(body.filter(Boolean).join('|'))}</div>${go('recap','旅をふりかえる',{s:'実績と称号、冒険者気質診断'})}`},
aschool(){const k=S.ask,a=AK[k],l=S.ak[k]||0,c=acost(k),rq=areq(k),just=S.alast===k,txt=just?a.ls[l-1]:l>=3?a.ls[2]:a.hi[l];
 return hud()+`<div class="scene read"><p class="prog">藍子の見習い帖　${a.n}${l?' Lv'+l:''}</p><h2>${a.at}</h2>${prose(txt)}</div>${msg()}${!just&&c!=null?`<div class="hand two">${fuda({t:a.t,a:'alearn',name:`Lv${l} → ${l+1}`,x:`覚える札：${a.card[l]}（${a.any?'どの場面でも適性・':''}突破力${a.p[l]}）`,foot:rq||`見習い帖の頁 ${c}枚`,fc:rq?'bad':'',dis:!!rq||S.ap<c})}</div>`:''}<p class="prog">見習い帖の頁は、依頼を初めて果たしたときと、子豚亭で仲間と語らったときにたまる（いま${S.ap}枚）。見習い帖の札は、Lvの高い4つを依頼に持っていける。どの技能を伸ばしたかで、物語の結末が変わる。</p>${go('back','掲示板に戻る',{alt:1})}`}});
function save(){if(S.scr==='title')return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function render(keep){_i=0;if(S.og&&!S.org)S.org='town';S.st=S.st||ST0();for(const k of['cin','pf','lean','grow','sp','uf','ak'])S[k]=S[k]||{};if(!V[S.scr])S.scr=S.og?'guild':'title';const cur=S;let html=V[S.scr]();S=cur;$app.classList.toggle('still',!!keep);$app.innerHTML=html;if(!keep)window.scrollTo(0,0);save()}
function start(data){$app=document.getElementById('app');
 try{COL=JSON.parse(localStorage.getItem(TKEY))||[]}catch(e){}if(data&&data.S)S=data.S;else{try{const j=localStorage.getItem(KEY);if(j)saved=JSON.parse(j)}catch(e){}S=fresh()}
 $app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;S.msg='';const keep=A[b.dataset.a](b.dataset);if(S.msg)toast(S.msg);render(keep===true)});
 render()}
if(typeof module!=='undefined')module.exports={A,V,QS,render,start,get S(){return S}};
else{window.claude?.hot?.snapshot?.(()=>({S}));window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{})}
</script>
