<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>高森藍子のゲームブック</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* layout: ギルドの掲示板に、章ごとの貼り紙が二枚。ゲーム本体と同じ夜の板壁 */
:root{color-scheme:dark;
--bg:#121b1a;--line:#35473f;--fg:#ece8dc;--mute:#9db0a7;--paper:#ece4c9;--paper3:#efd9cf;--ink:#2b2520;--ink2:#6a5f52;--gold:#e2b04a;--seal:#c4412f;
--fd:'Yuji Syuku','Hiragino Mincho ProN','Yu Mincho',serif;--fn:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;--fu:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--fu);font-size:15px;line-height:1.7;
background-image:repeating-linear-gradient(90deg,transparent 0 88px,rgba(0,0,0,.18) 88px 90px)}
main{max-width:480px;margin:0 auto;padding-block:48px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--gold);margin:0}
h1{font-family:var(--fd);font-weight:400;font-size:44px;line-height:1.2;margin:0;text-wrap:balance}
.lead{font-family:var(--fn);font-size:16px;line-height:1.95;margin:0}
.lbl{font-size:12px;letter-spacing:.18em;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:4px;margin:8px 0 0}
a.flyer{position:relative;display:flex;flex-direction:column;gap:4px;background:var(--paper);color:var(--ink);text-decoration:none;padding:18px 16px 14px;border-radius:2px;box-shadow:0 3px 0 rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.3);transform:rotate(-.5deg);transition:transform .15s}
a.flyer.p3{background:var(--paper3);transform:rotate(.45deg)}
a.flyer.island{background:#f3ead3;transform:rotate(.3deg);border-top:5px solid #6fa8c7}
a.flyer:hover{transform:rotate(0) translateY(-2px)}
a.flyer:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
a.flyer::before{content:"";position:absolute;top:6px;left:50%;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:var(--seal)}
.k{font-size:11px;letter-spacing:.16em;color:var(--ink2)}
.t{font-family:var(--fd);font-size:24px;line-height:1.35}
.x{font-family:var(--fn);font-size:14px;line-height:1.75}
.note{font-size:12px;color:var(--mute);margin:0}
@media (prefers-reduced-motion:reduce){a.flyer{transition:none}}
html.lite .x,html.lite .note{display:none}
</style>
<script>if(/github.io$/.test(location.hostname)&&!/[?&]debug/.test(location.search))document.documentElement.classList.add("lite")</script>
</head>
<body>
<main>
<a class="flyer p3" href="hidamari.html"><span class="k">陽だまりの章</span><span class="t">辺境ギルドの冒険者</span><span class="x">薬草摘みの森で聞こえた、誰かを励ます声。傷ついた小鳥を抱えた少女・高森藍子と出会い、仲間として旅をする。藍子が伸ばす8つの技能と、最後に返す言葉で結末が変わる。</span></a>
<a class="flyer island" href="island.html"><span class="k">無人島のひとり暮らし</span><span class="t">ゆるふわソロキャンアイランド</span><span class="x">番組で通う無人島「ポジパ島」の早朝ロケ。気がつくと、藍子はひとり、知らない浜辺で目を覚ましていた。亜季さんや島の先生たちに教わった知恵を頼りに、火を起こし、土器を焼き、家を建てて、みんなのところへ帰る道を探す。新しいことをするたびに、番組の思い出がよみがえる。</span></a>
<p class="note">進行はこのブラウザに自動で保存されます。章ごとに別々の記録です。</p>
</main>
</body>
</html>
