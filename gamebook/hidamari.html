<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>辺境ギルドの冒険者 陽だまりの章</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* layout: 夜のギルドホール。濃い緑黒の板壁に、紙色の貼り紙と札が浮かぶ一列のスマホ画面 */
:root{color-scheme:dark;
--bg:#121b1a;--panel:#1b2826;--line:#35473f;--fg:#ece8dc;--mute:#9db0a7;
--paper:#ece4c9;--paper2:#d5dfe0;--paper3:#efd9cf;--ink:#2b2520;--ink2:#6a5f52;
--gold:#e2b04a;--seal:#c4412f;--ok:#2c7a4c;--bad:#b3352a;
--fd:'Yuji Syuku','Hiragino Mincho ProN','Yu Mincho',serif;
--fn:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
--fu:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif}
.t-w{--tc:#c4472f}.t-e{--tc:#a9740f}.t-a{--tc:#7a52c4}.t-s{--tc:#1b8c7f}.t-r{--tc:#55852a}.t-h{--tc:#c45f88}.t-x{--tc:#5d6b66}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--fu);font-size:15px;line-height:1.7;
background-image:repeating-linear-gradient(90deg,transparent 0 88px,rgba(0,0,0,.18) 88px 90px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
#app{max-width:480px;margin:0 auto;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;border:0;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);font-weight:400;margin:0;text-wrap:balance;line-height:1.35}
p{margin:0}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);margin-inline:-16px;padding:8px 16px;display:flex;flex-direction:column;gap:6px}
.hud-in{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.hud b{color:var(--fg);font-size:14px;margin-left:4px;font-variant-numeric:tabular-nums}
.rank{font-family:var(--fd);font-size:20px;line-height:1;color:var(--seal);border:2px solid var(--seal);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;transform:rotate(-8deg);background:rgba(196,65,47,.12)}
.hp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.bar{flex:1;height:8px;background:#0c1211;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#b3352a,#e2764a);transition:width .3s}
.title{padding-top:48px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--gold)}
.title h1{font-size:44px;line-height:1.2}
.sub{color:var(--mute);font-size:13px}
.nar{font-family:var(--fn);font-size:16px;line-height:1.95}
.head{padding-top:20px;display:flex;flex-direction:column;gap:6px}
.head h2{font-size:26px}
.head p{color:var(--mute);font-size:13px}
.say{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:var(--fn);font-size:15px}
.say b{font-family:var(--fu);font-size:12px;color:var(--gold);display:block;letter-spacing:.08em}
.msg{background:rgba(226,176,74,.14);border:1px solid var(--gold);border-radius:8px;padding:8px 12px;font-size:13px}
.board{display:flex;flex-direction:column;gap:14px}
.lbl{font-size:12px;letter-spacing:.18em;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:4px}
.flyer{position:relative;display:flex;flex-direction:column;gap:4px;width:100%;background:var(--paper);color:var(--ink);padding:18px 16px 14px;border-radius:2px;box-shadow:0 3px 0 rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.3)}
.flyer.p2{background:var(--paper2)}.flyer.p3{background:var(--paper3)}
.board>.flyer:nth-of-type(odd){transform:rotate(-.5deg)}.board>.flyer:nth-of-type(even){transform:rotate(.45deg)}
.flyer::before{content:"";position:absolute;top:6px;left:50%;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:var(--seal);box-shadow:0 1px 2px rgba(0,0,0,.5)}
.flyer:disabled,.flyer.lock{opacity:.55;cursor:default}
.fl-k{font-size:11px;letter-spacing:.16em;color:var(--ink2)}
.fl-t{font-family:var(--fd);font-size:21px;line-height:1.35;padding-right:44px}
.fl-x{font-family:var(--fn);font-size:14px;line-height:1.75}
.fl-m{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:11px;border:1px solid var(--ink2);border-radius:3px;padding:1px 6px;color:var(--ink)}
.tag.need{border-color:var(--bad);color:var(--bad);font-weight:700}
.stamp{position:absolute;top:14px;right:14px;font-family:var(--fd);font-size:20px;line-height:1;color:var(--seal);border:2px solid var(--seal);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;transform:rotate(10deg)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin-top:8px;border-top:1px dashed var(--ink2);padding-top:8px}
.dl dt{color:var(--ink2)}.dl dd{margin:0;min-width:0}
.hand{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hand.two{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fuda{display:flex;flex-direction:column;gap:3px;background:var(--paper);color:var(--ink);border-radius:8px;padding:0 0 8px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.4),0 6px 12px rgba(0,0,0,.28);min-height:132px;transition:transform .12s}
.fuda:active{transform:translateY(2px) scale(.98)}
.fuda:disabled{opacity:.45;cursor:default}
.fuda.off{opacity:.5}
.fuda>span{padding-inline:8px}
.fd-top{background:var(--tc);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;padding-block:5px;letter-spacing:.06em}
.fd-top i{font-style:normal;font-family:var(--fd);font-size:16px;line-height:1;font-weight:400}
.fd-name{font-family:var(--fd);font-size:15px;line-height:1.3;margin-top:4px;overflow-wrap:anywhere}
.fd-pow{font-family:var(--fd);font-size:30px;line-height:1.1;color:var(--tc);font-variant-numeric:tabular-nums}
.fd-x{font-family:var(--fn);font-size:12.5px;line-height:1.6}
.fd-foot{font-size:11px;font-weight:700;margin-top:auto;color:var(--ink2)}
.fd-foot.ok{color:var(--ok)}.fd-foot.bad{color:var(--bad)}
.fd-own{font-size:10px;color:var(--ink2)}
.two .fuda{min-height:0;padding-bottom:10px}.two .fd-name{font-size:17px}
.scene{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.prog{font-size:12px;color:var(--mute);letter-spacing:.08em}
.scene h2{font-size:26px}
.need-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.diff{font-family:var(--fd);color:var(--fg);border:2px solid var(--gold);border-radius:6px;padding:2px 10px;font-size:14px}
.diff b{font-size:22px;color:var(--gold);margin-left:6px;font-weight:400}
.chip{font-style:normal;background:var(--tc);color:#fff;border-radius:99px;padding:1px 9px;font-size:11px;font-weight:700}
.res{border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:8px}
.res h3{font-size:24px}
.res.ok h3{color:#7fd09c}.res.crit h3{color:var(--gold)}.res.hurt h3{color:#ef7d6b}
.delta{font-size:13px;font-weight:700}
.go{width:100%;background:var(--gold);color:#221a08;border-radius:8px;padding:14px 16px;font-family:var(--fd);font-size:19px;text-align:center;box-shadow:0 3px 0 #8d6a22}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 #8d6a22}
.go.alt{background:transparent;color:var(--fg);border:1px solid var(--line);box-shadow:none;font-size:16px}
.go:disabled{background:var(--line);color:var(--mute);box-shadow:none;cursor:default}
.go small{display:block;font-family:var(--fu);font-size:11px;margin-top:2px}
.stack{display:flex;flex-direction:column;gap:10px}
.slips{display:flex;flex-direction:column;gap:6px}
.slip{background:var(--paper);color:var(--ink);border-radius:3px;padding:8px 12px;display:flex;justify-content:space-between;gap:12px;font-size:14px}
.slip span:first-child{color:var(--ink2);font-size:12px;flex:none}
.slip span:last-child{font-family:var(--fd);text-align:right;min-width:0}
.rows{display:flex;flex-direction:column;gap:6px;font-size:14px}
.row{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.row .chip{flex:none}.row span:last-child{margin-left:auto;color:var(--mute);font-size:12px;text-align:right}
.pips{letter-spacing:3px;color:var(--gold)}
.read{gap:12px}
.read .nar{font-size:16.5px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13px;color:var(--mute);background:transparent}
.tab.on{background:var(--gold);color:#221a08;border-color:var(--gold);font-weight:700}
.flyer.mini{padding:18px 10px 10px}
.flyer.mini .fl-t{font-size:16px;padding-right:0}
.flyer.mini .fl-x{font-size:12.5px;line-height:1.6}
.crest{border:2px solid var(--gold);border-radius:10px;padding:14px 16px 18px;text-align:center;background:rgba(226,176,74,.08)}
.crest span{font-size:12px;letter-spacing:.3em;color:var(--mute)}
.crest b{display:block;font-family:var(--fd);font-weight:400;font-size:36px;line-height:1.3;color:var(--gold)}
.row.ttl>span:nth-child(2){flex:none}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-24px);width:min(440px,calc(100% - 32px));background:var(--gold);color:#221a08;border-radius:10px;padding:12px 16px;font-weight:700;font-size:14px;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:no-preference){#app:not(.still) .read>.nar,#app:not(.still) .read>.say{animation:rise .5s ease backwards;animation-delay:calc(var(--i,0)*140ms)}}
@keyframes deal{from{transform:translateY(14px)}}
@media (prefers-reduced-motion:no-preference){#app:not(.still) .fuda,#app:not(.still) .board>.flyer{animation:deal .32s cubic-bezier(.2,.8,.3,1) backwards;animation-delay:calc(var(--i,0)*35ms)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const T={w:{n:'戦士',g:'剣'},e:{n:'探索',g:'探'},a:{n:'攻撃魔法',g:'魔'},s:{n:'補助魔法',g:'援'},r:{n:'射撃',g:'弓'},h:{n:'回復',g:'癒'}},TK=Object.keys(T),RK=['F','E','D','C','B','A'];
const SK={w:['斬りつけ','盾受け','強撃','旋風斬','渾身の一閃','剣聖の構え','竜断ち','不落の盾','剣神の一閃','辺境の守護者'],e:['忍び足','罠外し','鍵開け','気配察知','影渡り','千里眼','無音の極み','風の足跡','万鍵の指','誰も見ぬ道'],a:['火矢','氷槍','雷撃','爆炎','流星','極光','星落とし','天雷','竜の息吹の写し','創世の火'],s:['灯りの術','眠りの霧','身体強化','幻影','時の枷','聖域','運命の糸','星読み','祝福の環','大いなる導き'],r:['石つぶて','速射','狙い撃ち','二連射','必中の一矢','曲射','天穿つ矢','風読みの一矢','千里の矢','流星群'],h:['応急手当','癒しの光','解毒','浄化','大いなる祈り','蘇生の息吹','奇跡','慈雨','聖女の手','命の泉']};
const MAIN={w:'剣と盾で前に立つ。正面からの勝負に強い。',e:'罠、鍵、足跡。戦わずに道を拓く。',a:'火と氷と雷。群れや硬い敵をまとめて崩す。',s:'灯り、眠り、強化。適性外の場面では次の札を強める。',r:'弓と投げ物。遠い的と素早い敵に強い。',h:'癒しと浄化。適性外の場面ではHPを回復する。'};
const JOB={w:'戦士',e:'探索者',a:'魔術師',s:'まじない師',r:'射手',h:'癒し手'};
const ORG={
town:{n:'街育ち',x:'辺境都市ラズベルの下町。石畳と人混みと、ギルドの鐘の音で育った。',hi:'「あら、下町の方ですよね？　ついに登録ですか。',y:{w:'衛兵詰所の裏で、非番の衛兵に毎朝稽古をつけてもらった。',e:'下町の鍵師の店で、錠前の仕組みを見て覚えた。',a:'魔法学院に通う幼なじみの教本を、こっそり写した。',s:'路地裏の占い婆に、まじないと人の見方を教わった。',r:'祭りの射的屋を手伝い、的の真ん中だけを狙い続けた。',h:'神殿の施療院で、包帯巻きの下働きをしていた。'}},
village:{n:'村育ち',x:'山あいの開拓村。畑と森と、冬の長い夜で育った。',hi:'「遠いところをようこそ。街の人混みには慣れました？　',y:{w:'村の自警団で、退役兵の爺さんに槍と盾を叩き込まれた。',e:'羊を追って山を歩き、獣道と足跡の読み方を覚えた。',a:'村に流れ着いた老魔術師に、薪割りと引き換えで術を習った。',s:'森はずれの魔女に、薬草を届ける役目だった。',r:'猟師の叔父と山に入り、兎で夕飯を賄った。',h:'産婆の祖母について回り、傷と熱の手当てを覚えた。'}},
road:{n:'旅育ち',x:'隊商の荷馬車が家だった。街道と、野営の火で育った。',hi:'「旅慣れた足取りですね。ラズベルは初めてですか？　',y:{w:'隊商の護衛に、野営のたび剣の相手をしてもらった。',e:'関所と宿場を渡り歩き、抜け道と危ない気配を覚えた。',a:'同行した旅の魔術師に、荷運びの駄賃として火の術を習った。',s:'隊商つきの占い師に、星読みとまじないを仕込まれた。',r:'荷馬車の上から、狼除けの弓を引くのが役目だった。',h:'旅の薬売りと同じ馬車で、塗り薬作りを手伝った。'}}};
const SCH={
w:{n:'ギルド訓練場',who:'教官バルド',x:'木剣と大盾、貸します。',hi:['「新顔か。剣を握ったことは？　……ないな、その手は。いい、最初から教えてやる」','「構えろ。口で教えることは何もない。体で覚えろ」','「ほう、手の皮が厚くなったな。なら今日は、俺も木剣じゃなく鉄を持つ」','「……最近、お前との稽古が一番きつい。年寄りを労われ。いや、手は抜くな」','「教えることは、もうない。たまには若いのに稽古をつけてやってくれ。俺の代わりにな」'],ok:['日が暮れるまで打ち込みを続けた。腕は上がらないが、剣は上がるようになった。','三本に一本、バルドから取れるようになった。教官は悔しそうに、そして嬉しそうに笑った。']},
e:{n:'鍵師ドノバンの工房',who:'鍵師ドノバン',x:'錠前いじり教えます。悪用厳禁。',hi:['「客か？　弟子入り？　……手を見せな。ふん、指は長いな。入門料は先払いだ」','「錠前ってのは、作った奴との知恵比べだ。まずはこいつを開けてみな」','「この前の錠、もう開けたのか。……あれは俺が三日かけて作ったんだがな」','「お前が来ると聞いて、新作を用意した。今度こそ半日は保つはずだ。……保ってくれ」','「もう俺の錠じゃ、お前の暇つぶしにもならん。今度、王都の大金庫でも見物に行くか。見るだけだぞ」'],ok:['指先の感覚だけで、三つ目の錠が開いた。ドノバンは黙って四つ目を置いた。','ドノバンの新作は、茶が冷める前に開いた。鍵師は天を仰ぎ、それから設計図を引き直し始めた。']},
a:{n:'王立魔法学院 公開講座',who:'老教授',x:'学外生歓迎。聴講料は別途。',hi:['「学外生かね。聴講料は受付で。……言っておくが、ここは火遊びを教える場所ではないぞ」','「遅刻は減点。居眠りは火球の的にする。では始めよう」','「先週の課題、読んだよ。乱暴だが筋はいい。前の席に座りたまえ」','「君、実戦でその術式を使ったのかね？　……詳しく聞かせなさい。講義は後回しだ」','「今日は君が教壇に立ちたまえ。私は後ろで聴講する。遅刻も居眠りもせんから安心しなさい」'],ok:['黒板を埋める術式を、半分は理解した。残りの半分は、撃ってみて理解した。','実戦の話を、教授は羽根ペンが折れるほど書き取った。帰りがけ、禁書庫の鍵をそっと貸してくれた。']},
s:{n:'森はずれの魔女の庵',who:'魔女',x:'弟子入り可。猫に好かれる者に限る。',hi:['「弟子入りだって？　物好きだね。……ノワ、どう思う。ふん、引っかかないなら、まあいいさ」','「まじないは理屈じゃないよ。相手をよく見て、ちょっと背中を押すだけさ」','「鍋の混ぜ方が板についてきたじゃないか。今日は、あたしの魔導書を見せてやろう」','「あんたの術、あたしのとは違う色になってきたね。それでいい。弟子は師匠の写しじゃないんだ」','「もう教えることはないよ。茶でも飲んでいきな。……たまに顔を見せりゃ、それでいい」'],ok:['薬草を刻み、鍋をかき混ぜ、黒猫に三度引っかかれた。帰るころには、新しい術が指に馴染んでいた。','魔女の魔導書の最後の頁は、白紙だった。「そこは、あんたが書くんだよ」']},

{t:'廃屋の梁',d:2,x:'黒猫は廃屋の梁の上。銀の匙をくわえ、降りる気配はない。',a:{e:'音もなく梁を渡り、そっと抱き上げた。',r:'匙だけを小石で弾き落とす。猫は慌てて追って降りてきた。',h:'怪我をした前足に気づいて手当てしてやると、自分から寄ってきた。'},f:'さんざん引っかかれながら捕まえた。'},
{t:'野犬',d:2,x:'帰り道、猫の匂いにつられた野犬が三頭、道を塞いだ。',a:{w:'先頭の一頭を打ち据えると、残りは尻尾を巻いた。',a:'足元に火を走らせ、野犬を追い散らした。',s:'{眠りの霧|眠気を誘うまじない}をかけ、寝息を立てる横を通り過ぎた。'},f:'猫をかばって腕を噛まれた。'}]},
q4:{k:'捜索依頼',n:'帰らない神官見習い',r:0,min:1,max:4,x:'神殿より。薬草摘みに出た見習いのセラが、昨夜から戻らない。',rw:{g:20,xp:1,f:1,mem:'sera'},after:'数日後、すっかり元気になったセラがギルドに現れた。「恩返しをさせてください。回復なら任せて」',sc:[
{t:'森の奥',d:2,x:'踏み荒らされた茂みと、落ちた聖印。何かに追われた跡だ。',a:{e:'折れた枝を辿り、岩棚の洞窟へ続く道を見つけた。',r:'狩人の目で獣道を読み、後を追った。'},f:'道に迷い、茨で傷だらけになった。'},
{t:'森狼',d:2,x:'洞窟の前に森狼が二頭。中から、か細い祈りの声が聞こえる。',a:{w:'牙を受け流し、返す刀で追い払った。',r:'一頭の足を射ると、群れは退いた。',a:'火球を鼻先で炸裂させた。'},f:'噛み傷を負いながら狼を退けた。'},
{t:'蛇の毒',d:2,x:'少女は足を毒蛇に噛まれ、動けずにいた。唇が紫色だ。',a:{h:'{解毒|癒し}の祈りで、頬に血の気が戻った。',s:'巡りを遅らせる術で毒の回りを止め、街まで運んだ。',e:'近くに毒消し草を見つけ、噛み砕いて傷に当てた。'},f:'背負って街まで走り通した。こちらが倒れそうだ。'}]},
q5:{k:'討伐依頼',n:'ゴブリンの巣穴',r:1,min:2,max:4,x:'街道脇の洞穴にゴブリンが住み着いた。数が多い。必ず二人以上で。',rw:{g:45,xp:2,f:1,it:['bomb']},after:'巣穴の奥には、奪われた荷と火炎瓶がひとつ残っていた。',sc:[
{t:'見張り',d:2,x:'入口に見張りが二匹。角笛を吹かれれば、中の全員が出てくる。',a:{r:'二本の矢がほぼ同時に飛び、見張りは声もなく倒れた。',s:'{眠りの霧|眠気を誘うまじない}。見張りは槍にもたれて舟を漕ぎ始めた。',e:'背後に回り込み、一匹ずつ静かに片づけた。'},f:'角笛が鳴った。奥が騒がしくなる。'},
{t:'枯れ葉の通路',d:3,x:'通路の床に不自然な枯れ葉。ゴブリンは罠が好きだ。',a:{e:'落とし穴と吊り岩、二重の罠を見抜いて外した。',s:'灯りで天井まで照らし、仕掛けの縄を見つけた。'},f:'落とし穴に片足を取られた。'},
{t:'広間の群れ',d:3,x:'広間に十数匹。こちらに気づき、錆びた武器を手に殺到してくる。',a:{w:'通路の狭さを利用し、一匹ずつ斬り伏せた。',a:'広間の中央で{爆炎|炎}が咲いた。',r:'先頭から順に射倒し、群れの勢いを殺した。'},f:'数に押され、あちこちに傷を負った。'},
{t:'ホブゴブリン',d:4,x:'奥の玉座もどきから、頭ふたつ大きいホブゴブリンが立ち上がった。',a:{w:'大<ruby>鉈<rt>なた</rt></ruby>を弾き、がら空きの胴を薙いだ。',a:'{雷撃|雷}が鉄兜を直撃した。',h:'傷を癒やし続け、仲間の刃が届くまで戦線を支えた。'},f:'大<ruby>鉈<rt>なた</rt></ruby>の一撃を受けながら、相打ち気味に倒した。'}]},
q6:{k:'護衛依頼',n:'荷馬車を隣町まで',r:1,min:2,max:4,x:'隣町まで一日。雇いの弓使いが一人同行する。二人以上で。',rw:{g:40,xp:2,f:1,mem:'fine'},after:'別れ際、弓使いのフィーネが言った。「あなたたち、悪くないわ。次も声をかけて」',sc:[
{t:'谷の橋',d:2,x:'谷の橋板が何枚か落とされている。事故ではなさそうだ。',a:{e:'細工の跡を見つけ、待ち伏せを察して迂回路を取った。',w:'丸太を担いで橋板を渡し、荷馬車を通した。'},f:'車輪が嵌まり、押し上げるのに苦労した。'},
{t:'野盗',d:3,x:'岩陰から野盗が七人。「荷を置いていけ」と、お決まりの台詞。',a:{w:'頭目を一合で叩き伏せると、手下は顔を見合わせた。',r:'フィーネと並んで矢の雨を降らせ、足を止めた。',s:'{幻影|まじないの幻}で護衛の数を倍に見せた。野盗は青ざめて逃げた。'},f:'乱戦になり、荷をかばって斬られた。'},
{t:'野営',d:3,x:'夜、馬が怯えていなないた。闇の向こうで、光る目が増えていく。',a:{a:'夜空に火柱を立てると、狼の群れは森へ消えた。',r:'闇の中の目をひとつ射ると、群れは引いた。',h:'怯える馬を落ち着かせ、御者の傷を手当てして夜を越えた。'},f:'眠れぬまま一晩中、狼を追い払い続けた。'}]},
q7:{k:'用心棒',n:'酒場「踊る子豚亭」の一夜',r:1,min:1,max:1,x:'今夜だけ用心棒を頼みたい。腕っぷしより機転の利く人を一人。',rw:{g:30,xp:2,f:1,mem:'gald'},after:'翌朝、二日酔いの大男ガルドが頭を下げた。「足が遅いと追放された身だが、盾にはなれる。組んでくれ」',sc:[
{t:'荒れる大男',d:2,x:'大男が酔って暴れている。名のあるパーティを「足が遅い」と追放されたばかりらしい。',a:{w:'腕相撲で受けて立ち、互角の勝負の末に笑い合った。',h:'酔い覚ましの術をかけ、黙って愚痴を聞いた。',s:'そっと{眠りの霧|眠気を誘うまじない}をかけ、長椅子に寝かせた。'},f:'投げ飛ばされて、卓をひとつ壊した。'},
{t:'イカサマ師',d:3,x:'奥の卓で、流れ者が札に細工をしている。',a:{e:'袖口の隠し札を見抜き、衆目の前で引き抜いた。',s:'灯りを強めると、印を付けた札が浮かび上がった。'},f:'証拠を掴めず、押し問答の末に殴られた。'},
{t:'仕返し',d:3,x:'閉店間際、イカサマ師が仲間を連れて戻ってきた。刃物が光る。',a:{w:'椅子を盾に立ち回り、三人まとめて表へ放り出した。',r:'投げた皿が刃物を弾き飛ばした。',a:'指先に火を灯して見せる。ごろつきは魔法使いと喧嘩をしない。'},f:'切り傷を負ったが、起き上がった大男が加勢してくれた。'}]},
q8:{k:'調査依頼',n:'古井戸の底の物音',r:1,min:1,max:4,x:'旧市街の枯れ井戸から、夜な夜な物音がする。底を見てきてほしい。',rw:{g:35,xp:2,f:1,mem:'nico'},after:'助け出した獣人の少年ニコは、耳を伏せて言った。「盗掘はもうやめる。鼻と耳なら役に立つよ」',sc:[
{t:'降下',d:2,x:'井戸は深く、縄は古い。底は見えない。',a:{e:'壁の窪みを足がかりに、縄に頼らず降りた。',s:'身を軽くする術で、ふわりと底に降り立った。',r:'鉤付きの矢を梁に撃ち込み、新しい縄を張った。'},f:'縄が切れ、最後の三歩ぶんを落ちた。'},
{t:'紋章の石扉',d:3,x:'井戸の底に古い石扉。四つの紋章が刻まれた回転錠だ。',a:{e:'摩耗の具合から正しい順を読み、錠を開けた。',a:'紋章は古代の属性記号。火・水・風・土の順に回した。'},f:'間違えるたび矢が飛び出す。三度目でやっと開いた。'},
{t:'石の番犬',d:3,x:'扉の奥で、石の番犬が目を光らせた。隅には、罠にかかった獣人の少年。',a:{w:'首の継ぎ目に刃を叩き込み、砕いた。',a:'急に熱して、急に冷やす。石像はひび割れて崩れた。',s:'時を鈍らせる術で動きを縛り、少年を連れて抜け出した。'},f:'石の牙にやられたが、なんとか砕いた。'}]},
q9:{k:'討伐依頼',n:'オークの砦',r:2,min:3,max:4,x:'北の丘にオークが砦を築いた。捕らわれた村人あり。三人以上の編成で。',rw:{g:90,xp:3,f:2,eq:1},after:'村人たちは、砦の宝物庫にあった逸品を「どうか使ってくれ」と差し出した。',sc:[
{t:'砦の偵察',d:3,x:'丸太の柵に囲まれた砦。見張り櫓が二つ、門は一つ。',a:{e:'夜陰に紛れて、柵の弱い箇所を見つけた。',r:'櫓の見張りを二人とも射落とした。',s:'幻の霧で砦を包み、接近を隠した。'},f:'見つかり、投げ槍を浴びた。'},
{t:'門前の突撃',d:4,x:'門が開き、オークの戦士たちが雄叫びとともに飛び出してきた。',a:{w:'突進を正面から受け止め、押し返した。',a:'門の前に炎の壁を立て、隊列を分断した。',r:'門を出る端から射抜き、足を止めた。'},f:'力負けし、何度も吹き飛ばされた。'},
{t:'牢の村人',d:4,x:'牢に村人が十人ほど。衰弱がひどく、歩けない者もいる。',a:{h:'{癒しの光|癒しの力}が牢を満たし、皆が自分の足で立った。',e:'錠を次々に外し、裏手の抜け道へ誘導した。',s:'{身体強化|力を増すまじない}を村人にかけ、一気に走らせた。'},f:'担いで運ぶうちに、追っ手に斬りつけられた。'},
{t:'オークロード',d:5,x:'砦の主は、人の背丈ほどの戦斧を片手で振る。',a:{w:'三合打ち合い、四合目で斧の柄ごと断ち切った。',a:'仲間が稼いだ時間で詠唱を終え、特大の雷が落ちた。',r:'兜の隙間、ただ一点を射抜いた。'},f:'満身創痍になりながら、最後は全員で押し切った。'}]},
q10:{k:'緊急依頼',n:'学院の暴走ゴーレム',r:2,min:2,max:4,x:'王立魔法学院・実験棟。試作ゴーレムが暴走中。壊してよいが、建物は壊すな。',rw:{g:70,xp:3,f:2,mem:'lucia'},after:'制御盤にいた女学生ルシアは、煤だらけの顔で宣言した。「実地研究よ。あなたたちに同行するわ」',sc:[
{t:'封鎖結界',d:3,x:'実験棟は封鎖結界の中。教授たちは責任の押し付け合いで忙しい。',a:{a:'結界の術式を読み解き、通れる綻びを作った。',s:'同調の術で、結界をすり抜けた。',e:'搬入用の地下通路を見つけた。'},f:'結界に弾かれ、全身が痺れた。'},
{t:'箒とバケツ',d:4,x:'廊下を、魔力を帯びた箒とバケツの群れが暴れ回っている。',a:{r:'飛び回る箒を一本ずつ撃ち落とした。',w:'まとめて叩き折った。請求書は学院持ちだ。',a:'魔力を打ち消す波を放ち、ただの掃除用具に戻した。'},f:'バケツを頭に被せられ、箒に散々叩かれた。'},
{t:'鉄のゴーレム',d:5,x:'天井に届く鉄のゴーレム。足元の制御盤にしがみつく女学生が叫んだ。「核は胸よ！」',a:{a:'装甲の継ぎ目から雷を流し込み、核を焼き切った。',r:'開いた装甲の奥、赤い核を射抜いた。',s:'{時の枷|動きを鈍らせるまじない}で動きを止める間に、女学生が停止の術式を書き終えた。',w:'膝を砕いて倒し、胸の装甲を剥がして核を叩き割った。'},f:'鉄の拳を何度も受け、壁際まで吹き飛ばされながら止めた。'}]},
q11:{k:'調査依頼',n:'丘の上の幽霊屋敷',r:2,min:1,max:4,x:'旧伯爵邸に買い手がつかない。出るらしい。原因を取り除いてほしい。',rw:{g:60,xp:3,f:2,mem:'elma'},after:'成仏するかと思いきや、令嬢エルマは「外の世界が見たいの」と、ふわふわついてきた。',sc:[
{t:'玄関広間',d:3,x:'扉がひとりでに閉まり、燭台の火が青く変わった。皿が宙に浮く。',a:{s:'{灯りの術|術の灯り}で青い火を打ち消すと、皿は静かに床へ降りた。',h:'浄めの祈りで、屋敷の空気が和らいだ。',e:'仕掛けではないと確かめ、気配の濃い二階へ進んだ。'},f:'飛んできた皿が額に当たった。'},
{t:'歩く鎧',d:4,x:'廊下の鎧が、中身のないまま剣を抜いた。',a:{w:'剣を弾き、兜を叩き落とすと鎧は崩れた。',a:'鎧を動かす魔力の糸を焼き切った。',h:'{浄化|浄め}の光に触れ、鎧はただの飾りに戻った。'},f:'空っぽの鎧は疲れを知らない。斬られながら逃げ切った。'},
{t:'書斎の令嬢',d:4,x:'書斎に、半透明の少女。百年前の日記を抱え、「誰も読んでくれないの」と泣いている。',a:{h:'鎮魂の祈りを捧げ、日記を最後まで読んで聞かせた。',s:'心を繋ぐ術で、百年ぶんの話を一晩かけて聞いた。',e:'隠し金庫から、彼女が探していた手紙を見つけ出した。'},f:'泣き声の嵐に耐え、夜明けまで付き合った。'}]},
qk:{k:'指名依頼',n:'黒き森の番人',r:2,min:2,max:4,need:'aiko',x:'森はずれの魔女より、藍子を名指しで。黒き森の奥、先代の番人が遺した温室を荒らす「影の狼」を鎮めておくれ。',rw:{g:70,xp:3,f:1,gear:'hood'},
in:['ミレア：「森はずれの魔女さんからの指名依頼です。藍子さんを、と。……東の森のさらに奥、『黒き森』は、昼でも暗いんですよ。古い童話の舞台だって、子どものころ聞かされました」|藍子：「童話……。赤い頭巾の女の子が、狼に出会うお話ですか？」|ミレア：「あら、ご存じなんですね。こちらでは、頭巾の子は『森の番人』なんです。悪い狼を追い払って、森を守るんですよ」',
'森はずれの庵。魔女は、頭巾のついた古い赤い外套を、藍子に放ってよこした。|魔女：「番人の頭巾だ。先代が置いていったきり、百年だれも被っていない。影の狼は、あれを被った者の言うことしか聞かないのさ」|魔女：「森の奥には、先代の番人が建てた<ruby>硝子<rt>ガラス</rt></ruby>の温室がある。月光草――あたしの薬に欠かせない草でね。月の光と、人の手の温もりがないと育たない」|魔女：「番人がいなくなって百年。あたしが細々と世話してきたが、この秋から、影の狼が棚を荒らすようになった」|藍子：「わ、私が……？　……赤ずきんの役なら、前に、お仕事で。新しいタイプの赤ずきん、でしたけど」|魔女：「役でもなんでもいい。森は、演じきった者を本物と呼ぶんだよ」'],
sc:[
{t:'黒き森の小道',d:3,x:'昼なお暗い森。茨が道を塞ぎ、木々の<ruby>洞<rt>うろ</rt></ruby>から、いくつもの目がこちらを見ている。',a:{e:'獣も避ける茨の切れ目を見つけ、<ruby>洞<rt>うろ</rt></ruby>の目を刺激しないように抜けた。',s:'術の灯りを低く絞って足もとだけを照らし、森を起こさないように進んだ。',r:'梢の上に登って星の見える方角を確かめ、迷わず奥へ向かった。',w:'茨を一太刀ずつ払い、頭巾の藍子が通れるだけの道を拓いた。'},f:'茨に外套を裂かれ、<ruby>洞<rt>うろ</rt></ruby>の目に追い立てられるように奥へ転がりこんだ。',
 p:'黒き森は、入口から夜だった。梢が空を塞ぎ、ランタンの灯りが三歩先で吸われる。|赤い頭巾をかぶった藍子が、小さく息を吸った。|藍子：「この暗い雰囲気……。怖さがあるのに、不思議と惹かれてしまいます……」'},
{t:'夜の温室',d:4,x:'先代の番人が遺した、<ruby>硝子<rt>ガラス</rt></ruby>の温室。月光草の棚の半分が踏み荒らされている。残りを守り、荒らした者の跡を探す。',a:{h:'折れた月光草に添え木をし、癒しの力を根に注いだ。しおれた葉が、ゆっくり起き上がる。',e:'踏み跡は、どれも<ruby>硝子<rt>ガラス</rt></ruby>の割れ目の前で消えている。爪痕の深さから、群れの数を読んだ。',s:'まじないで温室の空気を整えると、月光草が一斉に淡く光り、影の出入りした隙間を照らし出した。'},f:'割れた<ruby>硝子<rt>ガラス</rt></ruby>で手を切り、荒らされた棚を前に、しばらく途方に暮れた。',
 p:'木々が途切れた窪地に、先代の番人の温室が沈んでいた。苔むした<ruby>硝子<rt>ガラス</rt></ruby>の向こうで、月光草が淡く光っている。扉を閉めたとたん、外の音が消える。|藍子：「とっても静か……。植物たちの呼吸も、聞こえてきそうなくらいです」|棚の半分は踏み荒らされ、月光草が折れている。隅の椅子には、誰かが置き忘れた古い童話の本。表紙には、赤い頭巾の少女と、黒い狼。'},
{t:'影の狼',d:4,x:'温室を囲む、輪郭のない狼たち。牙だけが白い。<ruby>硝子<rt>ガラス</rt></ruby>が、外からきしみはじめた。',a:{w:'扉の前に立ち、飛びこんでくる影を一頭ずつ斬り払った。斬られた影は、霧になって森へ戻る。',a:'温室の外に火の輪を走らせた。影は光を嫌い、輪の外へ退いた。',r:'白い牙だけを狙って撃つ。牙を失った影は、ただの夜に戻った。',s:'まじないの灯りを<ruby>硝子<rt>ガラス</rt></ruby>いっぱいに反射させた。温室が、森の中の小さな月になる。影は近づけない。'},f:'影の牙は、冷たいのに焼けるように痛い。<ruby>硝子<rt>ガラス</rt></ruby>を背に、じりじりと押しこまれた。',
 p:'<ruby>硝子<rt>ガラス</rt></ruby>の外で、闇が動いた。一頭、二頭――数えるのをやめた。輪郭のない狼が、温室を囲んでいる。|藍子が、童話の本を胸に抱いたまま、立ち上がった。'},
{t:'大狼',d:5,x:'影の群れの主。百年、番人の帰りを待ちつづけた森のさびしさが、狼の形をとったもの。',a:{w:'牙を受け止め、押し返し、一歩も退かなかった。大狼は、番人の隣に立つ者を認めて、牙を収めた。',h:'癒しの力を、傷ではなく、影そのものに注いだ。大狼の輪郭が、少しずつ、ほんものの毛並みになっていく。',s:'まじないで、頭巾に残っていた先代の気配を呼び起こした。大狼は匂いを嗅ぎ、長く、低く鳴いた。',a:'夜空に、火で大きな月を描いた。大狼は見上げ、遠吠えをひとつ。影の群れが、いっせいに伏せた。'},f:'前足のひと薙ぎで、棚ごと吹き飛ばされた。それでも、藍子の前からは退かなかった。',
 p:'群れが割れて、小屋ほどもある黒い狼が進み出た。目だけが、古い月の色をしている。|藍子：「……あなたが、悪い狼さん？」|狼は答えず、ただ、赤い頭巾を見つめている。牙を剥いているのに、その目は、誰かを待ちくたびれた目だった。'}],
after:'大狼は、藍子の前で伏せた。藍子は、その鼻面にそっと手を置く。|藍子：「誰かを傷つけるのも、誰かが傷つくのも、好きじゃありません。……けれど、傷つくことを恐れていては、何もできないから」|藍子：「悪い狼は、もういません。森の番人である私が、全て追い払いましたから。……なんて。本当は、待っていてくれただけなんですよね」|影は縮んで、子犬ほどの黒い毛玉になった。藍子が抱き上げると、もふもふと頭巾の中にもぐりこむ。|庵に戻ると、魔女は、頭巾を返そうとする藍子の手を押し戻した。|魔女：「持っておいき。番人は、森にいなくても番人だよ」|藍子：「……はい。大切にします。森の番人、ちゃんと演じきれましたか？」|魔女：「演じた？　ふん。あの狼は、とっくにあんたを本物の番人だと思ってるよ」|藍子は頭巾を深くかぶり直して、少しだけ声を低くした。|藍子：「この森の番人は、私です。……もう誰も、ひとりきりで待たなくていいように」|それから、いつもの顔に戻って、はにかんだ。|藍子：「……ちょっとだけ、本物の番人みたいでしたか？」'},
q12:{k:'緊急依頼',n:'古竜の目覚め',r:3,min:4,max:4,x:'北の霊峰で古竜が目を覚ました。Cランク以上、四人編成必須。生きて帰ること。',rw:{g:300,xp:4,f:5},after:'',sc:[
{t:'霊峰の吹雪',d:4,x:'北の霊峰は六合目から吹雪。視界は腕の長さほどしかない。',a:{s:'温もりの結界で一行を包んだ。',e:'張り出した雪のふちを避け、風の当たらない岩陰の道を選んだ。',h:'凍傷を癒やしながら、歩みを止めなかった。'},f:'凍えた手足を引きずって登り切った。'},
{t:'竜牙兵',d:5,x:'雪の中から、竜の牙より生まれた骨の兵が六体、音もなく立ち上がった。',a:{w:'骨の継ぎ目を断ち、一体ずつ雪に還した。',a:'{爆炎|炎}が骨を灰に変えた。',h:'{浄化|浄め}の光を浴び、兵はただの牙に戻って転がった。'},f:'斬っても起き上がる骨に、じわじわ削られた。'},
{t:'溶岩の川',d:5,x:'竜の寝息で溶けた岩が、赤い川になって行く手を横切る。',a:{e:'冷え固まった岩だけを見分け、飛び石にして渡った。',r:'対岸の岩に縄付きの矢を三本。即席の橋ができた。',s:'熱避けの護りを全員にかけ、川べりを駆け抜けた。'},f:'靴底を焦がし、火傷を負いながら渡った。'},
{t:'咆哮',d:6,x:'巣の奥で古竜が首をもたげた。咆哮ひとつで、膝が勝手に折れる。',a:{s:'勇気の加護が、全員の震えを止めた。',h:'祈りの声は咆哮の中でも途切れず、恐怖を払った。',w:'咆哮の中を一歩前へ。掲げた剣に、仲間の足音が続いた。'},f:'体がすくみ、尾の一撃をまともに受けた。'},
{t:'古竜',d:7,x:'千年を生きた鱗は鋼より硬い。だが喉元に一枚だけ、逆さに生えた鱗がある。',a:{w:'炎の息をくぐり、逆鱗に{渾身の一閃|渾身の一撃}を叩き込んだ。',a:'空が割れ、{流星|光の塊}が古竜の背を撃った。',r:'息を吸う一瞬、逆鱗の一点を矢が貫いた。'},f:'焼かれ、薙がれ、それでも最後の一撃だけは届いた。'}]}};
QS.q12.rw.mem='tia';QS.q12.after='古竜は地に伏し、やがて喉の奥で笑った。「千年ぶりに負けた。愉快だ」――光が収まると、そこには角の生えた少女が立っていた。「退屈しておったのだ。そなたらの旅に付き合わせよ。名か？　ティアでよい」';
Object.assign(QS,{
q13:{k:'指名依頼',n:'王都からの召喚状',r:4,min:2,max:4,x:'国王陛下より。古竜を従えし冒険者は、十日以内に王都へ参上すること。道中の安全は保証しない。',rw:{g:150,xp:4,f:3,eq:1},after:'王は竜の少女に焼き菓子を勧め、少女は三皿平らげた。辺境に王家の紋章入りの感状が届いたのは、翌月のことだ。',sc:[
{t:'関所の私兵',d:6,x:'街道の関所を、見慣れぬ紋章の私兵が固めている。「竜は当家が預かる」と、通す気配がない。',a:{s:'幻で王家の旗印を空に掲げてみせると、私兵たちは青ざめて道を開けた。',e:'夜のうちに関所の裏の獣道を抜けた。朝、私兵たちは空の街道を見張り続けていた。',h:'腹を壊していた隊長を癒やしてやると、ばつが悪そうに門を開けてくれた。'},f:'押し問答の末に力ずくで突破した。追っ手の矢が背中をかすめる。'},
{t:'密猟団の夜襲',d:6,x:'野営の火が、一斉に消えた。竜の鱗を狙う密猟団だ。闇の中、鎖のついた<ruby>銛<rt>もり</rt></ruby>が飛んでくる。',a:{w:'銛を盾で叩き落とし、鎖をたぐって投げ手を引きずり出した。',r:'鎖の音だけを頼りに、闇の中の射手を一人ずつ黙らせた。',a:'夜空に雷を走らせると、密猟団の姿が白く浮かび上がった。あとは早かった。'},f:'鎖に足を取られ、引きずられながら応戦した。'},
{t:'騎士団長の試し',d:7,x:'王の隣で、白髭の騎士団長が剣を抜いた。「竜を従える器か、確かめさせてもらう」',a:{w:'十合打ち合い、互いの切っ先が喉元で止まった。騎士団長は笑って剣を収めた。',a:'詠唱なしの{氷槍|氷の槍}を、騎士団長の足元一寸に突き立てた。「……見事」',s:'{時の枷|動きを鈍らせるまじない}で剣を止めた一瞬に、仲間が背後を取った。「連携か。よかろう」'},f:'さんざん打ち据えられたが、最後まで膝はつかなかった。「根性は認めよう」'}]},
q14:{k:'探索依頼',n:'迷宮「奈落の階」第二十層',r:4,min:3,max:4,x:'ラズベル地下迷宮の未踏階層。二十層の階層主を確認し、可能なら討伐せよ。三人以上。',rw:{g:180,xp:4,f:3,it:['smoke','song']},after:'二十層の地図は、ギルドの壁に額装して飾られた。隅に小さく、あなたたちの名前が入っている。',sc:[
{t:'転移罠の回廊',d:6,x:'床の魔法陣を踏めば、どこへ飛ばされるか分からない。しかも陣は、ゆっくり動いている。',a:{e:'陣の動きの周期を読み切り、一度も踏まずに渡り切った。',s:'{灯りの術|術の灯り}で、隠された陣まですべて浮かび上がらせた。',a:'陣の術式を読み、魔力を流して一時的に眠らせた。'},f:'踏んだ。壁の中でなかったのが幸いだが、落ちた先は水路だった。'},
{t:'魔物の巣部屋',d:6,x:'扉を開けた瞬間、背後で閂が落ちた。部屋じゅうの暗がりで、無数の目が開く。',a:{w:'壁を背に、押し寄せる端から斬り伏せた。',a:'部屋の中央で{爆炎|炎}が咲き、目の数が半分になった。残りは逃げた。',r:'天井の鍾乳石を射落とし、群れの真ん中に降らせた。'},f:'数に呑まれ、傷だらけになりながら部屋を抜けた。'},
{t:'毒沼の階',d:7,x:'十九層は、階そのものが沼だった。紫の霧が立ちこめ、息をするたび喉が焼ける。',a:{h:'{浄化|浄め}の祈りを途切れさせず、霧の中に清浄な道を一本通した。',s:'風の護りで一行を包み、霧を寄せつけなかった。',e:'沼に沈みかけた古い石橋の跡を見つけ、霧の薄い高みを渡った。'},f:'毒に咳き込みながら、気力だけで歩き切った。'},
{t:'階層主ミノタウロス',d:8,x:'二十層の大広間。牛頭の巨人が、柱ほどの戦槌を引きずって立ち上がった。',a:{w:'戦槌を紙一重でかわし、踏み込んで膝を断った。巨体が傾ぐ。',a:'仲間が稼いだ十数える間で、最大の術を編み上げた。',r:'両目を続けざまに射抜いた。闇雲に振るわれる戦槌は、もう当たらない。'},f:'戦槌の風圧だけで吹き飛ばされた。それでも、最後に立っていたのはこちらだ。'}]},
q15:{k:'救出依頼',n:'遭難したパーティ「蒼の牙」',r:4,min:2,max:4,x:'北の古代遺跡でBランクパーティが消息を絶った。盾役を欠いたまま深入りしたらしい。至急。',rw:{g:160,xp:4,f:3},after:'「蒼の牙」の頭目は、包帯だらけの頭を深く下げた。「速さだけでは、帰ってこられなかった。……礼を言う」',sc:[
{t:'崩れた入口',d:6,x:'遺跡の入口は、内側から崩れていた。瓦礫の隙間から、かすかに風が吹いてくる。',a:{e:'崩れの具合を読み、抜いても落ちない石だけを選んで道を作った。',w:'梁を肩で支え、仲間を先に通した。',s:'{身体強化|力を増すまじない}をかけ、大岩をひとつずつ持ち上げた。'},f:'抜いた石がまずかった。二度目の崩落で、頭を打った。'},
{t:'死霊騎士',d:7,x:'通路を、錆びた甲冑が巡回している。兜の奥に、青い火。斬っても斬っても立ち上がる類だ。',a:{h:'{浄化|浄め}の光が甲冑を貫き、青い火はため息のように消えた。',w:'盾ごと壁に叩きつけ、甲冑をばらばらにした。組み上がる前に通り抜ける。',a:'炎で錆を焼き切り、動けなくなるまで溶かした。'},f:'何度倒しても起き上がる相手に、じりじりと削られた。'},
{t:'閉じ込められた一行',d:7,x:'小部屋に、四人が倒れていた。一人は足が岩の下。もう一人は呪いで顔が土気色だ。',a:{h:'解呪と治癒を同時に進める。全員の息が、ゆっくりと深くなった。',s:'巡りを遅らせる術で呪いの進みを止め、運び出す時間を稼いだ。',e:'てこと、くさびで岩を浮かせ、足を傷つけずに引き抜いた。'},f:'手当てが追いつかない。自分の薬まで使い果たした。'},
{t:'崩落からの脱出',d:7,x:'遺跡全体が鳴動した。天井が、奥から順に落ちてくる。',a:{e:'来た道ではなく、風の通る脇道を選んだ。読みは当たった。',r:'落ちてくる大岩を矢で砕き、担架の上に降らせなかった。',s:'全員に俊足の加護をかけ、担架ごと走り抜けた。'},f:'最後の一人をかばって、背中に瓦礫を受けた。'}]},
q16:{k:'緊急依頼',n:'魔の森の大暴走',r:5,min:3,max:4,x:'魔の森の魔物が一斉に南下。明朝にはラズベルに達する。戦える者は全員、北門へ。',rw:{g:300,xp:5,f:4},after:'北門の上で、誰かが歌い始めた。日が暮れるころには、街じゅうがその歌を歌っていた。',sc:[
{t:'夜明け前の北門',d:7,x:'城壁の上に、衛兵と冒険者と、鍬を持った町人が並ぶ。群れが着くまで、あと一刻。',a:{e:'門前に落とし穴と逆茂木を三重に仕掛けた。町人たちが目を輝かせて手伝った。',s:'震える新兵たち一人ひとりに、勇気の加護をかけて回った。',h:'施療所を門の内側に設け、運ぶ者と診る者の手順を決めた。'},f:'準備が間に合わない。足りない分は、体で埋めるしかなかった。'},
{t:'第一波・魔狼',d:8,x:'地平が黒く波打った。先頭は魔狼。数は、数えるのをやめた。',a:{r:'射程に入った端から射倒す。矢筒が三つ、空になった。',a:'門前の平原に、炎の壁を二重に走らせた。',w:'門の前に立ち、抜けてきた狼を一匹も通さなかった。'},f:'壁の上まで跳び上がってきた一頭に、肩を裂かれた。'},
{t:'第二波・翼竜',d:8,x:'空が陰った。翼竜の群れが、城壁を越えて街へ降りようとしている。',a:{r:'翼の付け根を狙い、先頭の三頭を続けて落とした。群れが乱れる。',a:'雷を空に放つ。濡れた翼から翼へ、光が走った。',s:'幻の大竜を空に描くと、翼竜たちは怯えて高度を上げた。'},f:'急降下の爪を避けきれず、城壁に叩きつけられた。'},
{t:'崩れかけた戦線',d:8,x:'門の内側は、負傷者であふれていた。衛兵隊長が倒れ、指示が止まっている。',a:{h:'{癒しの光|癒しの力}を広場いっぱいに広げた。立てる者から、また壁へ戻っていく。',s:'声を増す術で、街じゅうに届く号令をかけた。止まっていた列が動き出す。',w:'隊長の旗を拾って門の上に立った。それだけで、兵たちの背が伸びた。'},f:'自分の傷を後回しにして、運び、縛り、怒鳴り続けた。'},
{t:'群れの主ベヒモス',d:9,x:'森の木々を薙ぎ倒しながら、小山のような獣が現れた。あれが追い立てていたのだ、すべてを。',a:{w:'突進を真正面から受け流し、すれ違いざまに腱を断った。',a:'口を開けた瞬間を逃さず、喉の奥へ最大の火球を叩き込んだ。',r:'片目、もう片目、そして耳の奥。三本の矢が、巨獣を止めた。'},f:'角にかけられ、宙を舞った。落ちた先で、それでも剣を握っていた。'}]},
q17:{k:'密命',n:'仮面舞踏会の刺客',r:5,min:2,max:4,x:'辺境伯より内密に。今宵の舞踏会に魔族の刺客が紛れている。騒ぎにせず、見つけ出せ。',rw:{g:280,xp:5,f:4,eq:1},after:'辺境伯は、何事もなかったように舞踏会の閉会を告げた。あなたたちの杯にだけ、いちばん良い酒が注がれた。',sc:[
{t:'招待客の中へ',d:7,x:'仮面と絹と、作り笑い。三百人の客のうち、一人だけが人ではない。まずは怪しまれずに紛れること。',a:{s:'幻で衣装を整え、古い家名を名乗った。誰も疑わない。',e:'給仕になりすまして盆を持った。給仕の顔を見る貴族はいない。'},f:'場違いな身なりを見とがめられ、執事に延々と絞られた。'},
{t:'毒の杯',d:8,x:'辺境伯の杯に、葡萄酒が注がれる。色が、ほんのわずかに濃い。',a:{h:'すれ違いざまに、杯へ{浄化|浄め}の祈りを落とした。毒はただの渋みに変わった。',e:'わざとつまずいて杯を落とさせ、注いだ給仕の袖口を見た。爪が、黒い。',s:'{眠りの霧|眠気を誘うまじない}をひと息だけ。杯を持つ手が緩み、葡萄酒は絨毯に吸われた。'},f:'間に合わず、自分が毒見役を買って出た。舌が痺れる。'},
{t:'屋根の上の追跡',d:8,x:'黒い爪の給仕が、窓から屋根へ跳んだ。人の跳び方ではない。月明かりの瓦の上、影が走る。',a:{r:'走る影の、次の一歩が着く瓦を射抜いた。影が体勢を崩す。',e:'屋根の形を読み、先回りして煙突の陰で待ち伏せた。',w:'瓦を蹴って跳び、背中に組みついた。二人まとめて露台に落ちる。'},f:'足を滑らせ、雨どいにぶら下がって肝を冷やした。'},
{t:'魔族の刺客',d:9,x:'仮面が割れ、角と翼が現れた。「辺境の犬どもが。主の露払いくらいにはなれ」',a:{a:'闇の刃を、同じ数の雷で撃ち落とした。最後の一条が翼を焼く。',w:'爪と剣が火花を散らす。七合目で、角を根元から断った。',h:'聖なる光が中庭を満たした。魔族は目を覆い、その隙に仲間の刃が届いた。'},f:'闇の刃に切り刻まれながら、相打ち覚悟で踏み込んだ。'}]},
q18:{k:'決戦',n:'辺境を覆う影',r:5,min:4,max:4,x:'魔将ヴァルガの軍勢が南の峠に布陣。王都の援軍は間に合わない。辺境の全戦力をもって、将を討て。四人編成。',rw:{g:500,xp:6,f:6},after:'',sc:[
{t:'敵陣を抜ける',d:8,x:'峠を埋める篝火。その一番奥に、黒い天幕がある。正面から行けば、千の兵を相手にすることになる。',a:{e:'見張りの交代の隙を縫い、荷車の影から影へ。誰にも気づかれなかった。',s:'幻で敵兵の姿をまとい、堂々と陣の中を歩いた。',r:'遠くの篝火を射倒して騒ぎを起こし、兵をそちらへ引きつけた。'},f:'見つかった。追われながら、陣の奥へ奥へと駆け込む。'},
{t:'親衛隊',d:9,x:'天幕の前に、黒鉄の鎧が六体。魔将の親衛隊だ。一言も発さず、同時に剣を抜いた。',a:{w:'一体目の剣を奪い、二体目に叩きつけた。背中は仲間が守っている。',a:'六体をまとめて氷に閉ざした。砕くのは、仲間に任せる。',r:'鎧の継ぎ目だけを狙う。六本の矢で、六体が膝をついた。'},f:'連携の取れた剣に追い詰められ、深手を負いながら斬り抜けた。'},
{t:'瘴気',d:9,x:'天幕の中は、息が詰まるほどの瘴気だった。足元から力が抜けていく。奥の玉座に、巨きな影。',a:{h:'祈りが瘴気を押し返し、一行のまわりにだけ澄んだ空気が戻った。',s:'護りの結界を幾重にも重ね、瘴気を寄せつけなかった。',a:'瘴気そのものに火を放った。黒い霧が、青く燃えて消えていく。'},f:'吸うたびに肺が焼ける。それでも、前へ。'},
{t:'魔将ヴァルガ',d:10,x:'「竜を降し、獣を退けたというのは貴様らか」――魔将は身の丈の倍ある大剣を、片手で持ち上げた。',a:{w:'大剣を受けた盾が割れた。割れた盾を捨て、懐へ。鎧の胸に、初めて傷が入る。',a:'詠唱が終わるまで、仲間が一歩も退かなかった。だから、撃てた。',r:'兜の隙間は、指一本ぶん。それで十分だった。'},f:'一振りで天幕が吹き飛び、全員が地に転がった。立ち上がるのに、ありったけの意地が要った。'},
{t:'最後の一手',d:10,x:'魔将が膝をついた。だが、その手に闇が集まっていく。峠ごと吹き飛ばす気だ。――次の一手で、決める。',a:{w:'仲間が作った一瞬の隙。{渾身の一閃|渾身の一撃}が、闇ごと魔将を断った。',e:'砕けた鎧の隙間に短剣を滑り込ませたのは、誰も見ていなかった影だった。',a:'全員の魔力を束ねた光が、闇を呑み込んだ。',s:'{時の枷|動きを鈍らせるまじない}が、魔将の腕を止めた。たった一拍。それで、仲間の刃が届いた。',r:'放った矢は、集まる闇の中心を貫き、その向こうの心臓に届いた。',h:'祈りの光が闇を打ち消した。丸腰になった魔将に、仲間の刃が殺到する。'},f:'闇の奔流に呑まれ、それでも手を伸ばし、相打ちで止めた。'}]}});

function persona(){const s=S.st,n=s.n||1,a=s.crit/n>=.45?0:s.hurt/n>=.3?1:2,b=s.chat>=s.rest*2?0:1;
 return{n:[['頼れる参謀型','孤高の職人型'],['熱血の旗手型','不言実行の猛者型'],['世話焼きのまとめ役型','静かな道しるべ型']][a][b],
  x:['下調べと段取りで勝負を決める人。難度を見極め、いちばん効く手を迷わず打ってきた。','考えるより先に足が出る人。傷の数は、前に出た回数の証だ。','無理はしないが、退きもしない人。手堅い一手を積み重ねて、ここまで来た。'][a]+['仲間の話によく耳を傾け、いつも輪の真ん中にいた。','多くは語らず、背中で仲間を引っぱった。'][b]+(s.body>=5?'いざとなれば、技に頼らず体を張る。':s.item>=12?'道具に頼ることを恥じない現実家でもある。':S.gold>=600?'財布の紐は、最後まで固かった。':'')}}
const ST={
q1:{in:['掲示板の隅、何度も貼り直された跡のある貼り紙。依頼主は薬師通りの老婆だという。|ミレア：「マルタお婆さんの依頼ですね。初めての方には、いつもこれをお勧めしているんです」|ミレア：「東の森は浅いところなら安全です。ただ、似た毒草がありますから、葉の裏をよく見てくださいね」','薬師通りの店先で、老婆は乾いた束をひとつ見せてくれた。|マルタ：「これが癒し草。裏に白い筋が三本。二本のは毒だよ。間違えたら自分で試してもらうからね」|冗談か本気か分からない笑顔に送られて、あなたは東門を出た。'],
p:['街道を外れると、土の匂いが濃くなった。木漏れ日の下、小鳥の声。|籠を下ろし、膝をつく。日陰の湿った土に、それらしい葉がいくつも顔を出していた。','籠が半分ほど埋まったころ、近くの茂みががさりと揺れた。|風ではない。何かが、落ち葉の上を這っている。','日が傾き始めた。あと二束で十束になる。|帰り道の崖を見上げたとき、岩肌の中ほどに、見事な緑の塊が揺れているのに気づいた。']},
q2:{in:['ミレア：「これは……人気のない依頼なんです。報酬は悪くないんですけど、その、匂いが」|ミレアは申し訳なさそうに、布きれと香草の小袋を差し出した。|ミレア：「鼻に当ててください。気休めですけど」','市場裏の石段を下りると、下水道管理人の小屋がある。|管理人：「来てくれたか！　あいつら、昨日はうちの猫を追い回しやがったんだ。猫をだぞ」|管理人はランタンを押しつけると、自分は一歩も近づかずに入口を指さした。'],
p:['石段の底、湿った空気が頬に貼りつく。|入口の鉄格子には、赤錆びた錠前がぶら下がっていた。','格子の先は、ゆるい下り坂の水路だった。ランタンの灯りは三歩先で闇に呑まれる。|水音に混じって、きい、きい、と細い鳴き声が重なり始めた。','水路は広い集水場で行き止まりになっていた。|腐った残飯の山が、もぞりと動く。山だと思ったものの半分は、毛皮だった。']},
q3:{in:['貼り紙の文字は、癖の強い古い書体だった。隅に小さく「猫を怖がらせる者お断り」。|ミレア：「森はずれの魔女様です。気難しい方ですけど、報酬の薬はよく効くって評判ですよ」','森はずれの庵は、屋根まで蔦に覆われていた。戸を叩く前に、中から声がする。|魔女：「開いてるよ。足を拭いて入りな」|魔女：「ノワはね、あたしの目であり耳なんだ。三日も帰らないなんて初めてさ。……心配なんかしちゃいないよ、不便なだけだ」|煙管を持つ手が、少しだけ震えていた。'],
p:['庵の中は薬草と煙の匂い。棚には猫用の皿がひとつ、きれいに洗って置いてある。|魔女：「さて、どこから探すね。お手並み拝見といこうか」','手がかりを追って北へ半刻。屋根の落ちかけた廃屋に着いた。|埃の積もった床に、小さな足跡が点々と続いている。見上げると、暗がりに金色の目がふたつ。','黒猫を懐に入れ、夕暮れの道を急ぐ。ノワは観念したのか、喉を鳴らしている。|その喉の音が、ふいに止まった。前方の藪から、低い唸り声。']},
q4:{in:['ミレア：「神殿からの急ぎの依頼です。見習いの子が、昨日の昼に森へ出たきり……」|ミレア：「セラさんというんです。施療院の薬草が足りないからって、一人で。真面目な子なんですよ」','神殿の門前で、年配の神官が待っていた。|神官：「止めたのです。だがあの子は、熱を出した子どもたちを放っておけなかった」|神官：「どうか、連れ帰ってください。あの子の祈りは、まだ拙いが――誰よりもまっすぐなのです」'],
p:['東の森の、癒し草の群生地よりさらに奥。人の入らない道だ。|ぬかるみに、小さな靴跡。その横に、深くえぐれた大きな爪の跡があった。','跡を辿ると、岩棚に口を開けた浅い洞窟が見えた。|洞窟の前を、灰色の影が行ったり来たりしている。','洞窟の奥に、白い法衣の少女がうずくまっていた。あなたを見て、力なく笑う。|セラ：「……来て、くださったんですね。すみません、足が……もう、感覚がなくて」']},
q5:{in:['ミレア：「ゴブリンは一匹なら子どもでも追い払えます。でも巣となると話は別です」|ミレア：「先月も、一人で入った新人さんが……いえ。とにかく、必ず二人以上で。約束ですよ」','街道脇の茶屋で、荷を奪われた行商人が待っていた。|行商人：「反物を三巻きと、火炎瓶をひと箱やられた。命があっただけましだがね」|行商人：「穴は丘の裏だ。夜になるとあいつら、奪った酒で騒ぎやがる。昼のうちに行きな」'],
p:['丘の裏手に回ると、岩の割れ目から煙が細く上がっていた。|入口の脇に、槍を持った小さな影がふたつ。片方は首から角笛を下げている。','洞穴の中は、獣脂の燃える匂いがした。壁の松明はまばらで、足元が暗い。|通路の先に、妙に落ち葉の多い一角がある。洞穴の中に、落ち葉。','通路の奥から、がやがやと耳障りな声。|角を曲がると、そこは天井の高い広間だった。焚き火のまわりで、十数の目が一斉にこちらを向く。','最後の一匹が逃げていくと、広間は静かになった。|――いや。奥の暗がりで、何かが重い腰を上げる音がした。積み上げた木箱の玉座。その主は、まだ座っていたのだ。']},
q6:{in:['ミレア：「隣町ハルデンまでの護衛です。依頼主のベルトさんは、この街いちばんの心配性で有名なんですよ」|ミレア：「あ、それと。もう一人、弓使いの方が雇われています。腕は確かですが……ちょっと、口が」','東門の前に、荷馬車と小太りの商人、それに御者台で脚を組むエルフがいた。|ベルト：「来た来た！　よろしく頼むよ。積み荷は蜂蜜酒なんだ、揺らさないでくれよ」|フィーネ：「あなたたちが護衛？　ふうん。足を引っ張らないでね、矢がもったいないから」'],
p:['昼過ぎ、街道は谷に差しかかった。古い木橋が、深い沢をまたいでいる。|フィーネ：「止まって。……橋板が足りないわ」','谷を抜けた先、道の両側に大岩が並ぶ場所。馬が耳を伏せた。|フィーネ：「来るわよ。七人。風下に回ったつもりでしょうけど、匂うのよね」','日が暮れ、街道脇で火を焚いた。ベルトは荷台で毛布にくるまり、三度目の「大丈夫かね」を言った。|フィーネは火に背を向けて座っている。目を闇に慣らしておくためだ。|真夜中、馬が鋭くいなないた。']},
q7:{in:['ミレア：「踊る子豚亭のおかみさんからです。今夜は収穫祭の前夜で、荒れるんですって」|ミレア：「一人だけ、というのがご希望です。大勢で睨みを利かせると、お客さんが飲めないからって」','踊る子豚亭は、日暮れ前からもう賑やかだった。|おかみ：「あんたかい。いいかい、うちは喧嘩は外、勘定は中。皿は割らせない。それだけ守ってくれりゃいい」|おかみは顎で隅の卓をしゃくった。|おかみ：「それと、あの大きいの。今日で三日目だ。そろそろ潰れる頃合いさ」'],
p:['隅の卓で、熊のような背中が丸まっていた。足元には空の樽。|大男：「足が遅い、だと……俺が前に立ってたから、お前らは無傷だったんだろうが……！」|ジョッキが卓に叩きつけられ、周りの客がそっと席を立った。','大男が静かになると、店に笑い声が戻ってきた。|料理を運ぶ娘が、通りすがりに囁く。|給仕：「奥の卓、さっきから同じ人ばかり勝ってるの。おかしくない？」','夜が更け、客もまばらになった。おかみが最後の樽の栓を閉める。|そのとき、扉が乱暴に開いた。さっきのイカサマ師だ。後ろに、にやついた顔が三つ。']},
q8:{in:['ミレア：「旧市街の町内会からです。枯れ井戸から、夜中に何かを引っかく音がするって」|ミレア：「猫か、風か、それとも……。あの辺り、昔の地下遺構が残っているんですよね」','旧市街の広場。苔むした井戸のまわりに、住人が集まっていた。|老人：「ゆうべは声も聞こえたんだ。『だれかー』って。子どもの声だった」|老婆：「井戸の幽霊だよ。あたしの婆さんも言ってた」|覗き込むと、冷たい風が吹き上げてきた。底のほうで、かり、かり、と音がする。'],
p:['釣瓶の縄は、触れただけで繊維がほつれた。|石組みの壁は苔で滑る。底までは、家三軒ぶんほどありそうだ。','底は乾いていた。横穴がひとつ、人の手で掘られた跡がある。新しい。|奥に、紋章を刻んだ石扉。その前に、小さなつるはしと、食べかけの干し肉が落ちていた。','扉が開くと、音がはっきり聞こえた。爪で石をひっかく音。それと、泣き声。|？？？：「だれか……！　足、挟まって……こいつ、まだ動くんだ！」|暗がりで、石の目がふたつ、青く灯った。']},
q9:{in:['ミレアの顔から、いつもの笑みが消えていた。|ミレア：「北の丘のオークが、開拓村を襲いました。村人が十数人、連れ去られています」|ミレア：「Dランクのあなたたちにお願いするのは、心苦しいんです。でも、今この街で動けるのは――」','開拓村は、半分が焼け跡だった。逃げのびた若者が、包帯の腕で丘を指す。|若者：「親父も、妹も、あの中だ。あいつら、冬越しの人手にするつもりなんだ」|若者：「俺も行く、と言いたいが……この腕じゃ足手まといだ。頼む。頼みます」|丘の上に、黒い柵の影が見えた。'],
p:['日暮れを待って、丘の麓の林に潜む。|丸太の柵、櫓がふたつ、門はひとつ。篝火が焚かれ、見張りの影がゆっくり動いている。','柵に取りついたそのとき、砦の中で太鼓が鳴った。気づかれたか、それとも交代の合図か。|どちらにせよ、門がきしみながら開いていく。','門前を抜け、砦の中へ。家畜小屋のような建物から、すすり泣きが聞こえた。|格子の向こうで、痩せた顔がいくつも、信じられないものを見る目でこちらを見た。','村人を裏手へ逃がし終えたとき、背後の地面が揺れた。|砦の主だ。人の背丈ほどの戦斧を肩に担ぎ、逃げていく村人と、あなたたちを見比べて――笑った。']},
q10:{in:['ギルドの扉が勢いよく開き、ローブ姿の若者が転がり込んできた。|助手：「が、学院です！　実験棟で試作ゴーレムが！　教授会は『想定内』と言っていますが、全然想定内じゃありません！」|ミレア：「……緊急依頼として受理します。お願いできますか」','王立魔法学院の中庭は、避難した学生でごった返していた。|実験棟の窓から、ときどき青白い光と、何かが割れる音。|老教授：「壊してよい。ただし建物は壊すな。あれは寄付で建てたのだ」|助手：「それと、ルシア君がまだ中に……止めると言って聞かなくて」'],
p:['実験棟のまわりには、薄い膜のような光が張られていた。触れた落ち葉が、ぱちりと弾かれる。|教授たちは膜の前で、誰が解除の書類に署名するかを議論している。','棟の中は、嵐の後のようだった。廊下に羊皮紙が舞い、床は水浸し。|角の向こうから、ばたばたと木のぶつかる音が近づいてくる。それも、たくさん。','大実験室の扉は、内側から吹き飛んでいた。|天井まで届く鉄の巨体。その足元で、制御盤にしがみついた女学生が、こちらを見もせずに怒鳴る。|ルシア：「遅い！　誰でもいいから、あれの気を引いて！」']},
q11:{in:['ミレア：「不動産組合からの依頼です。丘の旧伯爵邸、もう十年も買い手がつかなくて」|ミレア：「下見に行った人が、みんな青い顔で戻ってくるんです。『誰かが泣いている』って」','組合の男は、門の前で鍵束を渡すと、三歩下がった。|組合員：「わ、私はここで。中のものは壊しても構いません。ただ、その……泣かせないでやってください」|組合員：「妙な話ですが、聞いていると、こっちまで悲しくなるんですよ」|錆びた門が、風もないのに、きい、と鳴った。'],
p:['玄関の扉は、鍵を差す前に内側へ開いた。|広間には埃よけの布をかぶった家具。正面の大階段。壁の肖像画は、どれも顔のところだけ色があせている。','二階の廊下は長く、両側に飾り鎧が並んでいた。|歩くたび、背後でかちゃり、と小さな音がする。振り向くと、鎧の向きが、さっきと少し違う。','廊下の突き当たり、書斎の扉の下から、青い光が漏れていた。|すすり泣きが聞こえる。扉を開けると、本の山の真ん中に、透きとおった少女が座っていた。']},
q12:{in:['その朝、ギルドの鐘が三度鳴った。緊急招集の合図だ。|ミレア：「北の霊峰で、古竜が目を覚ましました。麓の村に、灰が降り始めています」|ミレア：「王都の騎士団が着くまで十日。それまで保ちません。……行けるのは、あなたたちだけです」','出発の朝。ギルドの前に、見知った顔が並んでいた。薬師のマルタ、酒場のおかみ、下水道の管理人まで。|マルタ：「持っていきな。裏の筋は三本、ちゃんと数えたよ」|ミレアは何か言いかけて、やめて、もう一度口を開いた。|ミレア：「依頼の条件、覚えていますね。『生きて帰ること』です。……達成印、用意して待っていますから」'],
p:['三日歩いて、霊峰の麓。そこから先は道がない。|六合目を越えたあたりで、風が雪を運んできた。','吹雪を抜けると、嘘のように風が止んだ。白い斜面に、巨大な獣の骨が点々と突き出している。|――違う。牙だ。抜け落ちた、竜の牙。それが、雪の下でかたかたと震え始めた。','山頂が近い。雪が消え、岩が黒く濡れている。暖かいのだ。|規則正しい地鳴りが、足の裏に伝わってくる。寝息だ、と気づいたとき、目の前の岩が赤く溶けて流れた。','火口の縁に立つ。底に、山ひとつぶんの鱗がとぐろを巻いていた。|金色の瞳が、ゆっくりと開く。|古竜：「――小さきものが、何用か」','膝が震えている。それでも、誰も退がらなかった。|古竜は首を高く上げ、胸をふくらませた。喉の奥に、白い光が灯る。']}};
Object.assign(ST,{
q13:{in:['ギルドに、金の封蝋の書状が届いた。ミレアが両手で捧げ持っている。|ミレア：「こ、国王陛下からです。『古竜を従えし者、十日以内に参上せよ』……従えてはいませんよね？」|ティア：「従えてはおらぬ。ついて行っておるだけじゃ」','出発の朝。ギルド長が珍しく見送りに出てきた。|ギルド長：「王都の貴族には、竜を欲しがる者が多い。鱗一枚で城が建つからな」|ギルド長：「陛下は話の分かる方だ。問題は、そこへ着くまでだ。気をつけろ」'],
p:['王都まで五日の街道。三日目の昼、関所が見えてきた。|旗が違う。王家の獅子ではなく、見慣れぬ黒い鷲だ。','関所を越えた夜。街道脇の林で火を焚く。|風が止み、虫の声が止んだ。静かすぎる。','王都の城門は、ラズベルの城壁の三倍はあった。|謁見の間。玉座の王は、思ったより若い。その隣で、白髭の老騎士がこちらを値踏みしている。|国王：「よく来た。……爺、やめておけと言っても聞かぬのだろうな」']},
q14:{in:['ミレア：「迷宮管理局からです。十八層まで行ったCランクの一行が、『この先は無理だ』と地図を置いて引き返しました」|ミレア：「二十層には階層主がいるはずです。誰も見たことはありませんけど、足音だけは、十五層まで聞こえるそうです」','ラズベル地下迷宮「奈落の階」。入口の石碑には、踏破者の名が層ごとに刻まれている。|十九層から先は、まだ空白だ。|迷宮番：「帰りの分の松明を忘れるなよ。忘れた奴の名前は、別の石に刻むことになってる」'],
p:['十四層までは、先人の地図が役に立った。|十五層。壁の松明の色が、青に変わる。ここからは、地図の書き込みが急に少ない。','回廊を抜けると、古い扉があった。取っ手だけが、妙に新しく磨かれている。|誰かが、何度も開けたのだ。そして、たぶん出てきていない。','階段を下りるにつれ、空気が重く、甘くなった。|足元の石畳が、途中から水に沈んでいる。水は紫色をしていた。','沼を渡り切った先に、巨大な両開きの扉。|扉の向こうで、何かが歩いている。一歩ごとに、足元の小石が跳ねた。']},
q15:{in:['ミレア：「Bランクパーティ『蒼の牙』が、北の遺跡から戻りません。予定を五日過ぎています」|ミレア：「速攻が売りの一行で……先月、盾役の方が抜けてから、少し無理をしていたみたいです」','遺跡の麓の村。宿の主人は、五日前のことをよく覚えていた。|宿の主人：「四人とも、えらく急いでいたよ。『日帰りで済ませる』ってね。荷物も半分、うちに置いていった」|宿の主人：「前は、でっかい盾を持った人が一緒だったろう。あの人がいつも、帰りの刻限を決めていたんだがなあ」'],
p:['遺跡は、山の斜面に半ば埋もれていた。|入口の前に、焚き火の跡。灰は冷え切っている。','瓦礫を抜けると、長い通路だった。壁に、新しい刀傷。そして、引きずったような血の跡。|奥から、金属の擦れる規則正しい音が近づいてくる。','血の跡は、最奥の小部屋へ続いていた。扉は内側から塞がれている。|蒼の牙：「……誰だ。助け、か？　すまん、動けるのは俺だけだ」','四人を担架と肩で支え、来た道を戻る。|半分まで来たとき、足の下で、低い唸りが始まった。']},
q16:{in:['真夜中、ギルドの鐘が鳴り止まない。|ミレア：「魔の森の物見から早馬です。森じゅうの魔物が、一斉に南へ動いています。大暴走です」|ミレア：「夜明けには北門に着きます。……Aランクのあなたたちに門の指揮をお願いしたいと、衛兵隊長から」','北門へ向かう通りは、松明を持った人であふれていた。逃げる者と、門へ向かう者。|薬師のマルタが、籠いっぱいの癒し草を荷車に積んでいる。|マルタ：「裏の筋は三本、全部数えたよ。今度はあたしらが届ける番さ」'],
p:['城壁の上は、冷たい風が吹いていた。北の地平は、まだ暗い。|衛兵隊長：「兵が二百、冒険者が四十、あとは町の者だ。……足りんな」|隊長は笑った。足りないのは、いつものことだ。','東の空が白む。同時に、北の地平が動いた。|地鳴りが、足の裏から膝へ上ってくる。','魔狼の波が引いた。壁の上に、短い歓声。|それを、頭上からの甲高い叫びが断ち切った。','翼竜が去っても、門の内側の騒ぎは収まらない。|担架が足りない。包帯が足りない。そして、声を出す者がいない。','日が高くなった。群れはまばらになり、森へ引き返す魔物も見える。|終わった、と誰かが言いかけたとき、森の木々がまとめて倒れた。']},
q17:{in:['その依頼は、掲示板ではなく、ミレアの手から直接渡された。封筒に差出人はない。|ミレア：「辺境伯閣下の執事の方が、裏口から。……読んだら燃やすように、と」|中には招待状と、一行だけの走り書き。「今宵、客の中に角を隠した者がいる」','辺境伯の館。裏の通用口で、痩せた執事が待っていた。|執事：「閣下はご存じです。ですが、舞踏会は中止できません。王都の使者が来ている。弱みは見せられないのです」|執事：「騒ぎにせず、客に気づかれず。……無理を申しているのは承知しております」'],
p:['大広間の扉が開く。楽団の音、香水、千本の蝋燭。|仮面の群れが、ゆるやかに渦を巻いている。','一刻ほどが過ぎた。怪しい者は見つからない。|広間の中央で、辺境伯が乾杯の杯を掲げようとしている。銀の盆を持った給仕が、その隣に立った。','給仕は、こちらの視線に気づいた。仮面の奥の目が、縦に細くなる。|次の瞬間、盆が床に落ち、露台の窓が開いていた。','中庭。追い詰められた給仕は、ゆっくりと振り返った。|広間からは、まだ楽団の音が聞こえている。誰も、気づいていない。']},
q18:{in:['その朝、南の空は、昼になっても暗いままだった。|ミレア：「南の峠に、魔将ヴァルガの軍勢です。舞踏会の刺客が言っていた『主』……」|ミレア：「王都の援軍は七日後。峠からここまでは、三日です」|ミレアは、依頼書に自分で判を押した。手が、少しだけ震えている。','ギルドの広間に、街じゅうの冒険者が集まっていた。「蒼の牙」の四人も、衛兵隊長も、迷宮番もいる。|衛兵隊長：「俺たちが正面で騒ぐ。お前たちは将の首だけを狙え」|魔女：「死ぬんじゃないよ。うちの猫が寂しがる」|ミレア：「依頼の条件は、いつもと同じです。『生きて帰ること』。……行ってらっしゃい」'],
p:['夜。峠の麓で、味方の陣が<ruby>鬨<rt>とき</rt></ruby>の声を上げた。陽動が始まったのだ。|その騒ぎを背に、岩陰から敵陣を見下ろす。','陣の最奥。黒い天幕は、近くで見ると小さな砦ほどもあった。|入口の前に、動かない影が六つ。','親衛隊の最後の一体が崩れると、天幕の垂れ布が、内側からの風でめくれ上がった。|冷たく、重く、甘い風だった。','瘴気の奥で、影が立ち上がった。|魔将ヴァルガ：「千の兵を抜けて、四人か。……よい。久しく、退屈していた」','魔将の兜が割れ、大剣が半ばから折れた。こちらも、もう立っているのがやっとだ。|仲間の顔を見る。全員が、同じ顔をしていた。まだやれる、という顔を。']}});
for(const k in ST){QS[k].in=ST[k].in;ST[k].p.forEach((p,i)=>QS[k].sc[i].p=p)}
const QT={
q0:{x:'ギルドで登録を済ませて、子豚亭へ。おかみが何も聞かずに、藍子の前へ温かい山羊乳を置いてくれた。|藍子は両手でカップを包んで、ほうっと長い息をついた。',m:{aiko:'「……あったかい。森で目が覚めてから、ずっと気を張っていたみたいです。今やっと、肩の力が抜けました。……助けてくれて、本当にありがとうございました」'}},
q1:{x:'薬師のマルタが、礼だと言って薬草茶の包みを子豚亭に届けてくれていた。',m:{sera:'「癒し草、施療院でも使うんです。裏の筋が三本……わたし、今日は一度も間違えませんでしたよ」',nico:'「草むしりで金がもらえるなんて、いい街だよなあ。おいら、匂いで全部見つけたぜ」',tia:'「草を摘むだけの仕事に、わらわを連れ出すとはの。……崖の上の景色は、悪くなかったが」',aiko:'「森のお散歩、楽しかったです♪　癒し草は、裏の筋が三本……ちゃんと覚えましたよ」'}},
q2:{x:'席につく前に、おかみに裏の井戸で三度、手を洗わされた。',m:{sera:'「匂い、まだ取れていませんか？　……法衣は三回洗ったんですけど」',fine:'「二度と行かないわ。エルフの鼻を何だと思ってるの。……報酬は、まあ、悪くなかったけど」',gald:'「下水道は狭くていい。俺が通路に立てば、後ろには何も通らん」',aiko:'「下水道は……ちょっと、お散歩には向いてなかったですね。ふふっ、でもランタンの光はきれいでした」'}},
q3:{x:'袖口には、まだ黒い猫の毛がついている。',m:{sera:'「猫ちゃん、無事でよかったですね。……あの、魔女さまの軟膏、成分を聞いてもいいでしょうか」',elma:'「まあ、黒猫。わたくしの屋敷にもおりましたのよ。百年前に。あの子の子孫かしら」',nico:'「梁の上の猫かあ。おいらなら尻尾でつかまって……え、一人で行く依頼だったの？」',aiko:'「黒猫さん、ノワちゃんっていうんですね。猫さん、大好きなんです。……今度、抱っこさせてもらえるかなぁ」'}},
q4:{x:'神殿から、焼き菓子の籠が届いていた。少し焦げている。',m:{sera:'「あの……あらためて、ありがとうございました。あの洞窟の冷たさは、たぶん一生忘れません。来てくれた足音も」',aiko:'「セラちゃん、無事でよかった……。人を癒すお仕事、私も、もっと上手になりたいな」'}},
q5:{x:'行商人が、取り戻した反物の切れ端で、人数ぶんの手拭いを作ってくれた。',m:{sera:'「ゴブリンさんたちにも、帰る場所があったんですよね。……いえ、後悔はしていません。少し、祈っただけです」',fine:'「見張りの二匹、見た？　同時よ、同時。……あなた、ちゃんと数えてた？」',gald:'「あのホブゴブリンの<ruby>鉈<rt>なた</rt></ruby>、重かったな。久しぶりに、盾がいい音で鳴った」',aiko:'「ゴブリンさんたちの巣、思ったより片づいてましたね。……どこにでも、その子たちの暮らしがあるんだなぁって」'}},
q6:{x:'ベルトが礼に置いていった蜂蜜酒の小樽が、卓の真ん中に据えられた。',m:{fine:'「言っておくけど、あの護衛で私が撃った矢は十四本。外したのは、なしよ」',sera:'「ベルトさん、最後まで『大丈夫かね』って。十二回、数えました」',gald:'「荷馬車と同じ速さで歩く仕事は、性に合う。誰にも遅いと言われん」',aiko:'「エルフさんって、本当にいるんですね……！　フィーネさん、耳、触らせてくれないかなぁ」'}},
q7:{x:'おかみが、昨夜割れなかった皿の枚数だけ、腸詰めをおまけしてくれた。',m:{gald:'「……昨夜のことは、半分しか覚えていない。覚えている半分は、忘れてくれ」',fine:'「一人で酒場の用心棒？　人間って、妙な仕事を思いつくのね。で、誰が一番うるさかったの」',sera:'「イカサマって、どうやるんですか？　……いえ、やりませんよ！　見破るためです」',aiko:'「酒場の用心棒なんて、ドラマみたいでした。……ガルドさんって、本当はすごく優しい人ですよね」'}},
q8:{x:'旧市街の町内会から、井戸の幽霊を退治した礼にと、干し果物がひと袋届いた。',m:{nico:'「あの石の犬、まだ夢に出るんだ。……でも、夢の最後は、いつも誰かが扉を開けてくれる」',gald:'「あの井戸を下りるのは骨だった。縄より先に、俺の膝が切れるかと思ったぞ」',fine:'「井戸の底に子どもがいるなんて、誰が思うのよ。……泣き声は、聞こえてたけど」',aiko:'「ニコくん、ずっと一人で頑張ってたんですね。……今日から、帰り道はみんな一緒です」'}},
q9:{x:'開拓村の若者が、村で最初に焼いたというパンを届けに来た。まだ温かい。',m:{sera:'「牢から出てきた方々の顔、見ましたか。あれを見るために、わたしは神官になったんだと思います」',gald:'「オークロードの斧を受けたとき、盾が半分に割れるかと思った。……割れなかった。いい盾だ」',nico:'「裏の抜け道、おいらが見つけたんだぜ。みんな通れたろ？　へへ」',aiko:'「村の人たちが、門を出るとき、何度も振り返って手を振ってくれました。……あの手、ずっと覚えておきたいです」'}},
q10:{x:'学院から届いた請求書は、なぜか箒とバケツの代金だけだった。',m:{lucia:'「あのゴーレム、右膝の関節が設計より二割も脆かったわ。……助かったけれど、設計者としては複雑よ」',nico:'「箒が飛んで、バケツが走るんだぜ！？　学院って、毎日あんななの？」',fine:'「魔法使いって、どうして自分で止められないものを作るのかしら。……あの子は、止めようとしてたわね」',aiko:'「箒とバケツが飛んでました……！　魔法の世界って、お掃除も大変なんですね」'}},
q11:{x:'不動産組合の男が、まだ少し青い顔で、礼の葡萄酒を置いていった。',m:{elma:'「わたくしの屋敷で、皆さまが大立ち回りなさるのを、書斎から聞いておりましたの。少し、楽しかったですわ」',sera:'「鎧に祈りが効いたとき、ほっとしました。……泣いている方を、力で黙らせずに済んで」',lucia:'「幽霊の魔力構造、興味深いわ。今度すこし測らせてもらえないかしら。痛くはしないから」',aiko:'「エルマさんも、日記を書くんですって。百年ぶんの日記……いつか読ませてもらいたいです」'}},
qk:{x:'子豚亭の卓の下で、黒い毛玉が、藍子の足にじゃれている。おかみは見て見ぬふりで、小皿に山羊乳を入れてくれた。',m:{aiko:'「フードは取れませんよ？　今の私にとって、大切なアイデンティティですから。……ふふっ、ごはんのときは、さすがに取りますけど」'}},
q12:{x:'街じゅうが、古竜の話で持ちきりだ。子豚亭の看板には、もう小さな竜の絵が描き足されている。',m:{tia:'「そなたら、わらわの逆鱗を狙うたであろう。……良い目をしておった。千年で一番、良い目じゃった」',gald:'「竜の尾を、盾で受けた。受けたんだ、俺が。……前の連中に、手紙でも書いてやるか」',sera:'「咆哮のとき、祈りの声が震えなかったんです。自分でも、びっくりしました」',elma:'「竜の息って、幽霊にも熱いんですのね。新しい発見ですわ。日記に書きましたの」',lucia:'「古竜の炎の温度、概算で鉄の融点の三倍。記録できたのは、世界でわたしだけよ」',fine:'「竜を射たエルフなんて、森の歴史に一人もいないわ。長老たちに、どんな顔で話そうかしら」',nico:'「溶けた岩の上を走ったんだぜ、おいら。尻尾の先、ちょっと焦げたけど」',aiko:'「竜の前で、足が震えて……。でもティアちゃん、焼き菓子をすごく美味しそうに食べるんですよ。ふふっ」'}},
q13:{x:'王都土産の焼き菓子は、帰り道の三日で半分に減っていた。犯人は分かっている。',m:{tia:'「王というのは、存外話の分かる男であった。菓子の趣味が良い。また呼ばれてやってもよいぞ」',gald:'「騎士団長の剣は重かった。……年を取っても、ああありたいもんだ」',fine:'「王都の人間は、エルフを見ても驚かないのね。つまらないわ。竜には驚いてたけど」',aiko:'「王様に会っちゃいました……！　元の世界の誰に話しても、きっと信じてもらえませんね」'}},
q14:{x:'迷宮番が、石碑に名前を刻む日取りを知らせに来た。綴りを三度、確かめていった。',m:{nico:'「二十層！　おいらの名前が石に残るんだぜ。墓じゃない石にさ。……へへ、変な気分」',lucia:'「転移陣の周期、手帳に全部写したわ。論文三本ぶんよ。共著者の欄、空けてあるから」',sera:'「毒沼の階で、祈りを一度も切らしませんでした。……喉は、まだ少し痛いですけど」',aiko:'「二十層の石碑に名前が刻まれるなんて。私の名前、ちゃんとこの世界の字で書けるかなぁ」'}},
q15:{x:'「蒼の牙」の四人から、不器用な字の礼状と、酒の樽がひとつ届いていた。',m:{gald:'「あいつら、俺の顔を見て泣きやがった。……俺もだ。言うなよ」',sera:'「呪いを解いたとき、あの方、昔の盾役さんの名前を呼んでいました。ずっと、気にしていたんですね」',nico:'「遺跡が崩れるとき、おいらの耳が先に気づいたんだ。昔の商売も、たまには役に立つよな」',aiko:'「洞窟から出たとき、みんなで同時に空を見上げましたよね。……あの青さ、たぶん一生忘れません」'}},
q16:{x:'街じゅうの酒場が、今夜は代金を取らないと決めたらしい。子豚亭は、通りまで人であふれている。',m:{fine:'「矢筒を三つ空にしたの、初めてよ。指が動かないわ。……杯は、持てるけど」',tia:'「群れの主とやら、わらわの寝起きより行儀が悪かったのう。街を守るというのは、存外、気分の良いものじゃ」',gald:'「門の前に立って、一匹も通さなかった。……町の子どもが、俺の盾に花を挿していった」',aiko:'「街の人たち、最後はみんなで歌ってましたね。……歌って、やっぱりすごいです」'}},
q17:{x:'館の執事から、差出人のない箱が届いた。中身は、あの夜いちばん良かった酒だ。',m:{elma:'「舞踏会！　百年越しの舞踏会でしたわ！　……踊れませんでしたけれど。次は、きっと」',lucia:'「仮面をつけて貴族のふりなんて、学院の晩餐会より楽だったわ。あそこは素顔で腹を探り合うもの」',nico:'「給仕の服、似合ってただろ？　盆も落とさなかったし。……つまみ食いは、ちょっとした」',aiko:'「舞踏会、きらきらしてました……！　踊り子のお仕事、ちょっとだけ思い出しちゃいました」'}},
q18:{x:'南の空は、もう暗くない。子豚亭の扉は外され、卓は通りの向こうまで並べられている。',m:{sera:'「みんな、帰ってきました。数えたんです、何度も。……全員です」',gald:'「一歩も退がらなかった。足が遅くてよかったと思ったのは、初めてだ」',fine:'「これで百年ぶんの土産話ができたわ。最後は『みんな無事だった』。約束どおりね」',nico:'「帰り道、ちゃんと人数そろってた！　おいら、三回数えたから間違いない！」',lucia:'「勝算は七割と言ったわね。訂正するわ。あなたたちとなら、最初から十割だった」',elma:'「日記の今日の頁、何から書けばよいのか分かりませんの。……『生きている』と書いても、よろしいかしら」',tia:'「千年で二度目の、良い戦であった。一度目は、そなたらに負けたときじゃ」',aiko:'「みんな、帰ってきました。……ハッピーエンド、ですね♪」'}}};
const SP={
q1:[['aiko',0,'藍子：「わぁ……木漏れ日がきれい。ちょっとだけ、ゆっくり歩いてもいいですか？　お散歩みたいで、楽しくて」|藍子は足を止めて、癒し草の葉を一枚、陽にかざした。|藍子：「裏の筋が三本。ふふっ、覚えました♪」']],
q3:[['aiko',1,'藍子：「あっ、猫さん……！　おいで、怖くないですよー」|藍子がしゃがんで手を差し出すと、梁の上の金色の目が、少しだけ細くなった。']],
q4:[['aiko',2,'藍子が、セラの隣に膝をついた。手のひらが、淡く光る。|藍子：「大丈夫、大丈夫ですよ。……一緒に、帰りましょうね」|セラ：「あったかい……。あなたも、癒し手さんなんですか？」|藍子：「ええと……見習いの、癒しの魔女です。……なんて♪」']],
qk:[['aiko',2,'藍子は頭巾を深く引いて、扉の前に立った。声が、いつもより低く、静かだ。|藍子：「この森は私の宝物。誰にも傷つけはさせません。そのためなら、私は……」|一拍おいて、藍子は小さく咳ばらいをした。|藍子：「……い、今の、どうでしたか？　番人っぽく、聞こえました？」']],
q6:[['sera',2,'セラ：「フィーネさん、火に当たらないんですか？　……あ、目を慣らしているんですね。すごいなあ」|フィーネ：「……別に、すごくはないわよ」'],['aiko',1,'藍子は、フィーネの横顔をちらちらと見ている。|藍子：「あの……フィーネさんって、エルフさんなんですよね。耳がとがってて、すてきです」|フィーネ：「……今、それどころじゃないでしょう。来るわよ、七人」']],
q9:[['sera',2,'セラが、格子の前に膝をついた。|セラ：「もう大丈夫です。迎えに来ました。……わたしも前に、こうして迎えに来てもらったんです」'],['gald',3,'ガルド：「でかい斧だな。……いい。ああいうのを止めるために、俺はいる」'],['aiko',0,'藍子が、焼け跡の村を振り返った。|藍子：「みんな、怖かったですよね。……絶対、連れて帰りましょう。笑顔で」']],
q11:[['aiko',2,'藍子は、少女の抱えた日記を見て、そっと隣に座った。|藍子：「私も、毎日日記を書いているんです。……よかったら、あなたの日記、読ませてもらえませんか？　最後の頁まで」|少女の泣き声が、ほんの少しだけ、小さくなった。'],['sera',2,'セラ：「泣いています。……悪いものの声じゃありません。迷子の声です」']],
q12:[['lucia',3,'ルシア：「古竜と言葉を交わした記録は、文献に三例だけ。四例目は、わたしが書くわ。……手が震えて、字にならないけれど」'],['gald',4,'ガルド：「全員、俺の後ろだ。竜の息だろうが何だろうが、一度は止めてみせる。一度あれば、十分だろう」'],['aiko',3,'咆哮に、膝が勝手に折れた。藍子も同じだ。――それでも藍子は、震える足で、半歩だけ前に出た。|藍子：「優しさに、ずっと守られてきた私だから……今度は、私が守りたいんです」|藍子：「一番弱い私の……強さを、見せます……！」']],
q13:[['tia',2,'ティアは玉座を見上げ、腰に手を当てた。|ティア：「そなたが王か。若いの。わらわが最後に見た王は、そなたの二十代前じゃ」|国王：「……それは、ぜひ話を聞かせてほしい。菓子は好きかね」|ティア：「好きじゃ」']],
q14:[['lucia',0,'ルシア：「待って。この陣、学院の初代学長の筆跡よ。……教本に載っているのと、癖が同じ」|ルシア：「三百年前の人と、答え合わせができるなんて。少しだけ時間をちょうだい。少しだけよ」'],['nico',1,'ニコ：「この扉、嫌な匂いがする。開けた奴が、帰ってきてない匂い」|ニコ：「……でも、行くんだよな。分かってる。おいらが最初に入るよ」']],
q15:[['nico',0,'ニコ：「入口が内側から崩れてる。……盗掘屋はね、こういうとき絶対に入らないんだ」|ニコ：「でも、今のおいらは斥候だから。入るよ」'],['gald',2,'ガルドが、塞がれた扉の前で足を止めた。|ガルド：「……俺だ。開けろ。迎えに来た」|扉の向こうで、長い沈黙。それから、嗚咽。|蒼の牙：「ガルド……すまん。すまなかった……」|ガルド：「話は後だ。全員、俺の後ろに入れ。いつもどおりにな」']],
q16:[['sera',3,'セラは、倒れた人々を見回して、一度だけ深く息を吸った。|セラ：「施療院で習いました。重い方から、順番に。泣くのは、全員を診てからです」'],['tia',4,'ティア：「ほう、あれが主か。図体ばかりじゃの。わらわが元の姿なら、ひと睨みで逃げ出すものを」|ティア：「まあよい。今のわらわは冒険者じゃ。冒険者のやり方で、片づけてやろう」'],['aiko',0,'藍子は、震える新兵や町の子どもたちに、ひとりずつ声をかけて回っている。|藍子：「深呼吸、しましょうか。吸って……吐いて。ほら、少しだけ、肩が下がりましたね♪」|城壁の上の空気が、ほんの少し柔らかくなった。']],
q17:[['elma',0,'エルマが、広間の入口で動かなくなった。|エルマ：「……百年前、わたくしが行けなかった舞踏会も、きっとこんなふうでしたのね」|エルマ：「大丈夫ですわ。お仕事ですもの。でも――一曲ぶんだけ、目に焼きつけさせてくださいな」'],['fine',2,'フィーネ：「屋根の上？　任せなさい。枝から枝へ跳ぶのに比べたら、瓦なんて平地よ」'],['aiko',1,'藍子：「あの、私に任せてもらえますか？　踊り子の衣装、まだ持ってるんです」|楽団の曲が変わる。広間の真ん中で、藍子がゆっくりと踊りはじめた。客たちの目が、一斉にそちらへ向く。|その隙に、あなたは給仕たちの手元を見て回った。']]};

e:['ドノバンは、分解した錠前を卓いっぱいに並べた。|鍵師ドノバン：「開ける前に、組み立てろ。中を知らん奴に、外から開けられるわけがない」|三度組み間違えて、四度目に、ばねがかちりと収まった。',SCH.e.ok[0],
 '目隠しをされた。|鍵師ドノバン：「迷宮の中じゃ、灯りが消えることもある。指で見ろ、耳で見ろ」|暗闇の中、ピンの落ちる音を数える。五つ目で、錠は素直に口を開けた。',SCH.e.ok[1],
 'ドノバンが出してきたのは、錠ではなく、古い箱だった。|鍵師ドノバン：「死んだ師匠の作だ。俺は二十年、開けられずにいる」|半日かかった。蓋が開くと、中には紙切れが一枚。『開けた者へ。次はお前が作れ』|ドノバンは長いこと黙って、それから鼻をすすった。'],
a:['黒板の術式を、一文字ずつ書き写す。|老教授：「火を出すのは簡単だ。難しいのは、出した火を止めることでね」|帰りぎわ、掌の上の小さな火を、初めて自分の意志で消せた。',SCH.a.ok[0],
 '講義のあと、教授に中庭へ呼び出された。|老教授：「理論は及第。では実技だ。あの的を、隣の花壇を焦がさずに撃ちたまえ」|三度目で、的だけが燃えた。教授は花壇の無事を確かめてから、小さくうなずいた。',SCH.a.ok[1],
 '教授は、書きかけの論文を机に広げた。|老教授：「ここの式が、三年解けん。君の実戦での感覚を聞きたい」|あれこれ話すうち、夜が明けた。式は解けなかったが、教授は余白に、あなたの名前を書き入れた。|老教授：「共同研究者、だ。学外生では前例がないがね」'],
s:['魔女の庵で、一日じゅう茶を淹れさせられた。|魔女：「湯の機嫌も読めない者に、人の機嫌が読めるもんかね」|七杯目で、魔女は初めて最後まで飲み干した。黒猫のノワは、まだ寄ってこない。',SCH.s.ok[0],
 '魔女は、市場の人混みにあなたを連れ出した。|魔女：「あの果物売り、何に困ってると思う？　当ててごらん。術はそれからだよ」|腰だ、と答えると、魔女はにやりと笑った。まじないをひとつ掛けると、果物売りは林檎をおまけしてくれた。',SCH.s.ok[1],
 '庵の戸を開けると、魔女は寝台で咳をしていた。|魔女：「ただの風邪さ。……今日の客は、あんたが見ておやり」|占い、失せ物探し、眠れない子のまじない。日が暮れるまでに七人。最後の客が帰ると、ノワが膝に乗ってきた。|魔女：「ふん。あたしより評判がよかったら、承知しないよ」'],
r:['一日じゅう、矢をつがえずに弓だけを引かされた。|組合長ヘルガ：「腕で引くな。背中で引け。腕は添えるだけだ」|夕方、初めてつがえた一本は、的の縁に刺さった。ヘルガは何も言わなかったが、矢を抜きに行く足取りは軽かった。',SCH.r.ok[0],
 '射場ではなく、風の強い丘に連れていかれた。|組合長ヘルガ：「風は敵じゃない。読めば味方だ。草を見な、雲を見な」|十本外して、十一本目。矢は弧を描いて、的の真ん中に落ちた。',SCH.r.ok[1],
 '夜明け前の森。ヘルガと二人、半日、声も出さずに鹿を待った。|組合長ヘルガ：「射るな。今日は、射たないことを覚えな」|目の前を、子鹿を連れた母鹿が通り過ぎていく。弦から指を離さなかったあなたに、ヘルガは初めて干し肉を分けてくれた。'],
h:['施療院の朝は、湯を沸かすことから始まる。|老神官：「祈りの前に、清潔です。光で癒せぬ病も、石鹸で防げることがあります」|昼までに敷布を三十枚洗った。指はふやけたが、包帯の巻き方は手が覚えた。',SCH.h.ok[0],
 '泣き止まない子どもの手当てを任された。|老神官：「傷は小さい。大きいのは、怖さのほうです。そちらを先に癒しておあげなさい」|歌をひとつ歌ってやると、子どもは泣き止んだ。傷は、そのあいだに塞がっていた。',SCH.h.ok[1],
 '夜半、施療院の戸が叩かれた。崩れた足場の下敷きになった職人が、三人。|老神官：「私は奥の方を。あなたは手前の二人を。……できますね」|問いではなかった。夜明けには、三人とも静かな寝息を立てていた。老神官は、震えるあなたの手に、温かい茶を持たせてくれた。']};
const giveM=t=>{const k='m'+t,on=gearOf('me').length<2;S.gear.push({k,w:on?'me':null});return `免許皆伝の証に「${GR[k].n}」を受け取った（${GR[k].x}）。${on?'':'持ち物に入れた。'}`};
// 経験値札がたまったら自動で札を覚える。もうひとつの縁がLv3になるまでは得意と交互、そのあとは得意・得意・もうひとつの順
function autoGrow(got){S.grw=[];for(let n=0;n<30;n++){const early=S.og!==S.sub&&S.sk[S.sub]<3;let t=early?((S.gi||0)%2?S.sub:S.og):((S.gl||0)%3<2?S.og:S.sub),c=trainCost(t);if(!c){t=t===S.og?S.sub:S.og;c=trainCost(t);if(!c)break}
 if(S.xp<c.xp)break;S.xp-=c.xp;S.sk[t]++;if(early)S.gi=(S.gi||0)+1;else S.gl=(S.gl||0)+1;const l=S.sk[t];got.push(['成長',`${T[t].n} Lv${l}：新しい札「${SK[t][l-1]}」`]);
 if(S.gr[t]&&l<=7){const g={t,l};if(l===7)g.m=giveM(t);S.grw.push(g)}}}
// ガルド：ふだんの掛け声では、前の仲間の話をしない
// 古竜の小休止は、巣に踏み込む前に
// 藍子：依頼ごとの台詞（w=道すがら、ok/crit/hurt=場面の結果、af=依頼のあと）
// 藍子：語らいの話題が尽きたあとの、いつもの夜
const AGEN=[{x:'藍子が、杯の水面をのぞきこんで、ふっと笑った。|藍子：「プロデューサーさんに初めて会った日のことを、思い出してたんです」',r:[['もう少し聞かせてくれ','藍子：「公園を、いつもみたいにお散歩していたんです。そうしたら、知らない人に声をかけられて。『アイドルに興味はありませんか』って」|藍子：「びっくりしました。私、目立つほうじゃないし、歩くのも話すのも遅いし。……でも、その人、私が答えるまで、ずっと待っていてくれたんです」|藍子：「急かさない人なんだなって。それで、この人となら、って思いました」|それから藍子は、森で最初にあなたを見たときのことを話した。足音が、似ていたのだという。|藍子：「人違い、恥ずかしかったです……。でも、間違えた相手が冒険者さんで、よかった」'],['今日は早めに休もう','藍子：「はい。……続きは、また今度。長いお話になっちゃうので♪」']]},
{x:'藍子は、果実水の杯を揺らしながら、窓の外を見ている。|藍子：「今日の帰り道、路地の奥に、小さな噴水を見つけたんです。誰も気づかないような」',r:[['もう少し聞かせてくれ','藍子：「猫さんが二匹、縁で丸くなってて。そっと近づいたら、片方だけ目を開けて、また閉じたんです。『まあ、いいか』って顔で」|藍子：「元の世界でも、お散歩の途中で、そういう場所を見つけるのが好きでした。地図に載ってない、自分だけのお気に入り」|藍子：「明日、案内しますね。……あ、でも、依頼の前だと遅刻しちゃうかな。私と歩くと、いつも時間が足りなくなるって言われるんです」|結局、噴水の話から公園の話になり、公園の話から雲のかたちの話になって、気づけば店の灯りが半分消えていた。'],['今日は早めに休もう','藍子：「そうですね。噴水のお話は、また明日。……おやすみなさい♪」']]},
{x:'藍子は、行商人から借りたという古い童話の本を、卓のランプに寄せて読んでいる。|藍子：「読書をするには少し暗いですけど、童話を読むのにはいい雰囲気ですね」',r:[['もう少し聞かせてくれ','藍子：「元の世界で、赤ずきんの役をいただいたことがあるんです。でも、ふつうの赤ずきんじゃなくて。悪い狼を全部追い払った、森の番人の赤ずきん」|藍子：「いつもの私とは、ぜんぜん違う役でした。暗くて、強くて。……夜の温室にこもって、台本と童話を何度も読んだんです。植物の呼吸が聞こえそうなくらい、静かな場所で」|藍子：「願いを叶えたいのなら、強くなることも必要ですよね。あの役が、それを教えてくれました」|藍子は本を閉じて、少しだけ声を低くした。|藍子：「暗いだけじゃないんです。強くて、それでも優しい赤ずきん」|藍子：「……ふふっ。台詞より先に、あの子の気持ちのほうを覚えちゃいました」'],['今日は早めに休もう','藍子：「この頁を読んだら、休みますね。……内容は知ってるのに、わくわくするんです」']]},
{x:'藍子が、指で四角を作って、卓の上の料理をのぞいている。|藍子：「あっ、ごめんなさい。つい、写真を撮る癖で」',r:[['もう少し聞かせてくれ','藍子：「私のカメラ、小さくて、ちょっとぼやけて写るんです。でも、そのぼやけ方が好きで」|藍子：「はっきり写らないぶん、あとで見返すと、そのときの空気を思い出せるんですよ。あったかかったな、とか、いい匂いがしたな、とか」|藍子は指の四角を、あなたに向けた。|藍子：「……はい、今日の一枚。カメラがなくても、ちゃんと覚えておきます」|それから藍子は、今まで撮った写真の話を、一枚ずつ聞かせてくれた。見たことのない世界の、見たことのない公園が、少しだけ目に浮かんだ。'],['今日は早めに休もう','藍子：「はい。今日の一枚は、心の中に撮っておきますね。おやすみなさい」']]},
{x:'藍子は、舞台の上の旅芸人を見ながら、頬杖をついている。|藍子：「舞台の袖に、いつも同じ人が立っていてくれるって、すごく心強いことなんですよ」',r:[['もう少し聞かせてくれ','藍子：「ライブの前は、やっぱり緊張するんです。でも、袖を見ると、プロデューサーさんがいて。何も言わないで、うなずくだけなんですけど」|藍子：「見守ってもらえているから、のびのびできるんだなって。私ひとりの力じゃないんです」|藍子：「……この世界に来て、最初は袖に誰もいない気がして、心細かったです」|藍子は、あなたのほうを見た。|藍子：「でも今は、依頼のたびに、隣を見ると冒険者さんがいるから。……ふふっ。私、見守ってくれる人に恵まれてますね」'],['今日は早めに休もう','藍子：「あの一座の踊り、最後まで見たら帰りますね。おやすみなさい♪」']]},
{x:'藍子は、子豚亭のおかみに淹れてもらった豆茶の香りを、ゆっくり確かめている。|藍子：「これ、コーヒーに似てるんです。元の世界で、よくカフェに行っていたから、懐かしくて」',r:[['もう少し聞かせてくれ','藍子：「カフェって、お茶を飲みながら、ゆっくりするためのお店なんです。窓ぎわの席で、通りを歩く人を眺めたりして」|藍子：「何もしない時間って、もったいないって言う人もいますけど。私は、そういう時間がいちばん贅沢だと思うんです」|おかみが、頼んでいない焼き菓子を一皿置いていった。|藍子：「わぁ……ありがとうございます。ふふっ。この世界のカフェは、ここですね」|豆茶が冷めるまで、二人で何もしなかった。たしかに、贅沢な時間だった。'],['今日は早めに休もう','藍子：「じゃあ、これを飲み終わったら。……ゆっくり、ひと口ずつ♪」']]},
{x:'外は雨。子豚亭の屋根を、雨粒がぱらぱらと叩いている。|藍子：「雨の音、好きなんです。お散歩はできませんけど」',r:[['もう少し聞かせてくれ','藍子：「雨の日は、傘の中だけ、自分の小さなお部屋みたいになるでしょう？　あれが好きで」|藍子：「この世界の雨は、少し甘い匂いがしますね。森が近いからかな」|藍子：「明日の朝は、きっと水たまりに空が映ってます。……写真は撮れないので、のぞきこむだけにしますね」|雨がやむまで、と言って話しはじめたのに、雨がやんでも、話は終わらなかった。'],['今日は早めに休もう','藍子：「雨音を聞いていると、よく眠れそうです。おやすみなさい♪」']]},
{x:'藍子が、少しあらたまった顔で切り出した。|藍子：「あの……私、歩くの遅いですよね。依頼のとき、みんなを待たせてないかなって」',r:[['もう少し聞かせてくれ','藍子：「元の世界でも、言われてたんです。私といると、時間がゆっくり流れるって。気づくと何時間も経ってる、って」|藍子：「最初は、申し訳ないなって思ってました。でも、ある人が言ってくれたんです。『急がなくていいって思える時間は、貴重だよ』って」|藍子：「だから今は、それが私のいいところなのかなって。……冒険者としては、ちょっと困りものかもしれませんけど」|そう言って笑う藍子の向こうで、時の鐘が鳴った。いつのまにか、二刻も話しこんでいた。'],['今日は早めに休もう','藍子：「あっ、もうこんな時間。……ほら、やっぱり。私といると、こうなっちゃうんです」']]},
{x:'藍子は、卓の上に小さなものを並べている。瑠璃色の羽根、癒し草の押し葉、誰かにもらった飴の包み紙。|藍子：「この世界でできた、宝物です」',r:[['もう少し聞かせてくれ','藍子：「元の世界にも、宝物がたくさんあるんです。いただいた曲、いただいた衣装。受け取ったときの気持ちは、今でも忘れられません」|藍子：「両手に溢れるくらいあるのに、もっと欲しい、ひとつも失いたくないって思ってしまうんです。……わがままですよね」|藍子：「でも、そのわがままは、貫き通したいなって。向こうの宝物も、こっちの宝物も」|藍子は、並べたものをひとつずつ布に包み直した。包み終わるまで、あなたは黙って待った。|藍子：「……待っていてくれて、ありがとうございます。急がせない人って、ほっとします」'],['今日は早めに休もう','藍子：「ひとつずつしまったら、休みますね。……数えるだけで、幸せなので」']]},
{x:'藍子は、卓に小石や木の実を並べて、細い革紐を通している。|藍子：「依頼の途中で拾ったんです。きれいだったので、腕輪にしようかなって」',r:[['もう少し聞かせてくれ','藍子：「手作りって、時間がかかるぶん、作っているあいだずっと、あげる人のことを考えていられるんです」|藍子：「この青い石は、ルリの羽の色。こっちの木の実は、今日の森の匂いがします」|結び目をひとつ作るたびに、藍子は小さく「よし」と言う。|藍子：「……できました。はい、どうぞ。お守り、というほどじゃないですけど」|腕に巻くと、少し不揃いで、少し温かかった。'],['今日は早めに休もう','藍子：「続きは、また明日にしますね。急いで作ると、結び目が歪んじゃうので」']]},
{x:'藍子の指先に、粉がついている。|藍子：「おかみさんの厨房を、少しお借りしたんです。焼き菓子を作りたくて」',r:[['もう少し聞かせてくれ','藍子：「元の世界のお砂糖とは、甘さが違うんですよ。蜂蜜を足したり、木の実を砕いたり、三回くらい失敗しました」|藍子：「失敗したぶんは、常連さんたちが、あっという間に……。失敗作のほうが好評で、ちょっと複雑です」|藍子は、布にくるんだ一枚を、そっと卓に置いた。|藍子：「これは、うまく焼けたぶんです。……どうぞ。誰かに食べてもらうところまでが、手作りなので」|素朴な味だった。もう一枚ないかと聞くと、藍子は嬉しそうに、鞄からもう一包み出した。'],['今日は早めに休もう','藍子：「じゃあ、お菓子は明日のおやつに。……湿気ないように、包んでおきますね」']]},
{x:'隣の卓で、旅の吟遊詩人が古い歌を弾いている。藍子は、小さく体を揺らしていた。|藍子：「……いい歌ですね。言葉は分からないのに、懐かしい気がします」',r:[['もう少し聞かせてくれ','藍子：「私、歌もダンスも、最初から得意だったわけじゃないんです。同じ日にレッスンを始めた子が、どんどん先に行っちゃって」|藍子：「でも、焦って速く歩こうとしたら、転んじゃって。……それで、自分の歩幅で行こうって決めたんです」|吟遊詩人が曲を変えた。ゆっくりした、子守歌のような節。|藍子は、聞こえるか聞こえないかの声で、それに合わせて口ずさんだ。隣の卓の喧嘩が、いつのまにか止んでいた。'],['今日は早めに休もう','藍子：「最後の一曲だけ、聴いていってもいいですか？　……ありがとうございます」']]},

const AKN={'癒しの手':'藍子が、傷ついた仲間の肩に手のひらを当てた。あの日、小鳥を救ったのと同じ淡い光。こわばっていた手足に力が戻り、その一拍で、道が開けた。',
'陽だまりの結界':'藍子が両手を広げると、陽だまりのような光がその場ごと包んだ。敵意も、痛みも、少しだけ遠くなる。その隙に、一行は前へ進んだ。',
'癒しの魔女の祈り':'藍子が帽子のつばを押さえ、目を閉じて祈った。やわらかな光が一行の傷をふさぎ、足を前へ押し出す。難所は、もう後ろにあった。',
'おひさまの毛布':'藍子が指をくるりと回す。干したての毛布のような温もりが一行を包み、疲れがほどけた。体が軽い。そのまま、一気に切り抜けた。',
'ふんわりお洗濯':'藍子が指を回すと、水と泡が渦を巻いて、行く手の障りをまとめて洗い流した。お洗濯の魔法は、こういうときにも効くらしい。',
'ひだまりの魔法':'藍子の手のひらから、午後の陽だまりがこぼれた。暗がりは明るみ、冷えた指は温まり、尖っていたものが丸くなる。気づけば、難所は後ろにあった。',
'陽だまりのステップ':'藍子が、ゆっくりとステップを踏んだ。一拍遅れの足取りに、見る者の肩から力が抜ける。その呼吸に合わせて動くと、不思議なほどうまくいった。',
'癒しの舞':'藍子がひと回りすると、裾から淡い光が散った。痛みが引き、息が整う。舞が終わるころには、一行は難所の向こう側に立っていた。',
'時忘れの舞':'藍子が舞いはじめると、まわりの時間だけがゆっくりになった。誰もが、次の一手を忘れて見入っている。その長い一拍のあいだに、すべてが片づいた。',
'ルリの偵察':'ルリが梢の上をひと回りして、藍子の肩に戻ってきた。藍子はその声に耳をすませ、進むべきほうを指さす。言われたとおりに動くと、道が開けた。',
'妖精さんたち、力を貸して':'藍子が手のひらを差し出すと、小さな光の粒が集まってきた。妖精たちは、行く手を塞ぐものにいたずらを仕掛け、あっさり道を空けさせた。',
'森の仲間の大合唱':'藍子の呼びかけに、鳥が、獣が、いっせいに声を上げた。四方から響く大合唱に、立ちはだかるものがひるむ。その隙を、一行は逃さなかった。',
'盗賊の早業':'藍子が咳ばらいをして、声を低くした。「あまりアタシを、ナメないでくれよ？」――指先がするりと動き、いつのまにか、やるべきことは済んでいた。',
'忍び足のステップ':'藍子は、ゆっくり、ゆっくり歩いた。あまりに自然で、誰の目にも留まらない。気づかれないまま、いちばん大事なところまでたどり着いた。',
'心の鍵開け':'藍子は、手を出すかわりに、相手をじっと見た。ひとこと、静かに問いかける。固く閉じていたものが、内側から開いた。',
'ふんわり掌底':'藍子の掌が、ふわりと前に出た。力はない。けれど、相手の勢いをそのまま借りた一押しは、驚くほど遠くまで届いた。',
'受け流しの型':'藍子は半歩ずれて、手のひらで力の向きを変えた。まっすぐ来たものが、まっすぐ脇へ逸れていく。息は上がっているのに、かすり傷ひとつない。',
'陽だまりの構え':'藍子は構えたまま、ただ微笑んでいた。打ちこむ隙はいくらでもあるのに、誰も打ちこめない。気の抜けたところを、一行は静かに通り抜けた。',
'手作りの魔除け':'藍子が、編んだお守りを掲げた。術式は少し歪んでいる。それでも、ほんのり温かい光が、悪いものを一歩だけ退がらせた。その一歩で十分だった。',
'迷わずの地図':'藍子が、手描きの地図を広げた。インクの線が、ひとりでに伸びていく。線の示すとおりに進むと、いちばん無理のない道だった。',
'幸せの魔道具':'藍子が鞄から取り出したのは、小さな魔道具と、薄焼きの菓子だった。甘い香りに、その場の誰もが一瞬だけ手を止める。その一瞬で、道は開いた。',
'勇気のおまじない':'藍子が、胸の前で小さく手を握った。「大丈夫。怖くても、いけます」――震えたままの声が、なぜか一行の背中をまっすぐに押した。',
'見習い勇者の一歩':'藍子が、半歩ではなく、一歩前に出た。胸の徽章が光る。その背中を見て、全員の足が続いた。',
'守り抜く誓い':'藍子が、顔を上げた。「私は私の大切なもののために……いきます！」――その声に、倒れかけていた者まで立ち上がる。一行は、ひとかたまりになって押し通った。',
'手のひらに、幸せを':'藍子と目が合う。「手のひらに、幸せをっ」――重ねた手から光があふれ、息の合った一手が、道を開いた。'};

 return hud()+`<div class="head"><h2>行商人の露店</h2><p>道具は一度きり、最大6個（いま${S.items.length}個）。装備は買ったあと、掲示板の「仲間と装備」で誰かに身につけさせる。</p></div><div class="say"><b>行商人</b>${ri<3?'「いらっしゃい。駆け出しさん向けの品なら、ひととおり揃ってるよ」':ri<4?'「お、顔つきが変わったね。奥の箱も開けようか。値は張るが、物はいい」':ri<5?'「竜を連れた御一行に、安物は出せないね。王都の工房から取り寄せた品だ」':'「Aランク様のお越しだ。この箱はね、あんたが来るまで誰にも見せなかったんだよ」'}</div>${msg()}<p class="lbl">道具</p><div class="hand two">${Object.entries(IT).map(([id,it])=>fuda({a:'buy',d:`data-id="${id}"`,name:it.n,x:it.x,foot:`${it.c}G・所持${S.items.filter(x=>x===id).length}`,dis:S.gold<it.c||S.items.length>=6})).join('')}</div>${tier('装備',0)}${tier('上級品',3)}${tier('逸品',4)}${tier('伝説級',5)}${go('back','掲示板に戻る',{alt:1})}`},
recruit(){const c=20+10*rankI(),b=rankI()>=2?3:2,full=S.act.length>=3;return hud()+`<div class="head"><h2>臨時メンバー募集</h2><p>次に受ける依頼一回だけ同行する助っ人（ソロ限定の依頼には来ない）。契約料は${c}G。</p></div>${msg()}${S.temp?`<div class="say"><b>契約中</b>${S.temp.n}（${T[S.temp.t].n}）が、次の依頼を待っている。</div>`:full?'<div class="say"><b>席がない</b>同行する仲間がすでに3人いる。依頼の貼り紙で誰かを待機にすれば雇える。</div>':''}<div class="hand">${S.cands.map(i=>{const p=TP[i];return fuda({t:p.t,a:'hire',d:`data-i="${i}"`,name:p.n,x:p.c.map(n=>`${n} ${b}`).join('<br>'),foot:c+'G',dis:!!S.temp||full||S.gold<c})}).join('')}</div>${go('back','掲示板に戻る',{alt:1})}`},
tavern(){const L=S.last;return hud()+`<div class="scene read"><p class="prog">依頼明けの一杯</p><h2>踊る子豚亭</h2>${S.tav?prose(S.tav===2?'藍子と話したあと。もう一人、誰かの隣に座ろうか。まっすぐ帰ってもいい。':(S.pub?'':PUBX+'|')+(L?QT[L.id].x+'|':'')+'今夜は、誰の隣に座ろう。話を聞けるのは一晩に一人。まっすぐ帰ってもいい。'):prose('今夜はもう解散した。次の依頼を終えたら、また集まろう。')}</div>${S.tav?`<div class="hand">${S.mem.filter(id=>S.tav!==2||id!=='aiko').map(id=>{const m=MB[id];return fuda({t:m.t,a:'talk',d:`data-id="${id}"`,name:m.n,x:m.j,foot:hearts(id),own:L&&L.p.includes(id)?'今日の依頼に同行':(S.epi[id]||0)<3?'話したそうにしている':'くつろいでいる'})}).join('')}</div>`:''}${go('back','掲示板に戻る',{alt:1})}`},
talk(){const t=S.talk,m=MB[t.id];return hud()+talkV(`${m.n}と卓を囲む`,'踊る子豚亭',t.lead||'',m,epOf(t.id,t.idx),t,'talkR',S.tav===2?'tavern':'back',S.tav===2?'仲間の卓へ移る':'ギルドへ戻る')},
equip(){const w=S.who,me=w==='me',m=MB[w],mine=gearOf(w),free=S.gear.map((g,i)=>[g,i]).filter(x=>!x[0].w);
 const cards=me?TK.flatMap(t=>Array.from({length:S.sk[t]},(_,l)=>({n:SK[t][l],t,p:l+1,w:'me'}))):mCards(w);
 return hud()+`<div class="head"><h2>仲間と装備</h2><p>装備は一人2つまで。仲間は依頼に同行するとLvが上がり、語らうと絆が深まる。</p></div>
<div class="tabs">${['me',...S.mem].map(id=>`<button class="tab ${id===w?'on':''}" data-a="who" data-w="${id}">${id==='me'?'あなた':MB[id].n}</button>`).join('')}</div>
<div class="say"><b>${me?whoAmI():m.j}</b>${me?`${RK[rankI()]}ランクの冒険者。技能は、${LITE?'依頼をこなすたびに伸びていく':'経験値札がたまると自動で伸びる'}。`:`Lv${mLv(w)}${mLv(w)<5?`（次のLvまで、依頼の経験あと${[2,5,9,16][mLv(w)-1]-(S.mx[w]||0)}）`:'（最高）'}<br>${hearts(w)}${bondOf(w)<3?'　絆3で絆の札を覚える':''}${LITE?'':`<br>これまでの返事：背中を押す ${(S.lean[w]||[0,0])[0]}回／寄り添う ${(S.lean[w]||[0,0])[1]}回`}`}</div>
${w==='aiko'?`<p class="lbl">藍子の技能（見習い帖の頁 ${S.ap}枚）</p>${aRows()}<p class="prog">藍子は伸ばした技能のうち、Lvの高い4つを札として持っていく。</p>`:''}${!LITE&&!me&&w!=='aiko'&&mLv(w)<4?(n=>`<p class="prog">Lv${n?4:2}で覚える札は、返事の向きで決まる。背中を押すほうが多ければ「${m.c[n+2][0]}」（${T[m.t].n}）、寄り添うほうが多ければ「${m.alt[n][0]}」（${T[m.alt[n][2]].n}）。</p>`)(mLv(w)<2?0:1):''}
<p class="lbl">札</p><div class="rows">${cards.map(c=>`<div class="row"><i class="chip t-${c.t}">${T[c.t].g}</i><span>${c.n}${c.any?'（絆・どこでも適性）':''}</span><span>突破力 ${c.p+bon(c)}</span></div>`).join('')}</div>
<p class="lbl">装備中 ${mine.length}/2（タップで外す）</p>${mine.length?`<div class="hand two">${S.gear.map((g,i)=>g.w===w?gfuda(g.k,'strip',i,'外す'):'').join('')}</div>`:'<p class="prog">何も身につけていない。</p>'}
<p class="lbl">持ち物（タップで装備）</p>${free.length?`<div class="hand two">${free.map(([g,i])=>gfuda(g.k,'wear',i,mine.length>=2?'枠がいっぱい':'装備する',mine.length>=2)).join('')}</div>`:'<p class="prog">空いている装備はない。露店や依頼の報酬で手に入る。</p>'}
${go('back','掲示板に戻る',{alt:1})}`},
status(){const cnt={};S.items.forEach(i=>cnt[i]=(cnt[i]||0)+1);
 return hud()+`<div class="head"><h2>冒険者証</h2><p>${whoAmI()}　${RK[rankI()]}ランク${rankI()<3?`（次のランクまで名声あと${[2,5,9][rankI()]-S.fame}）`:rankI()===3?'（古竜の依頼を果たせばBランク）':rankI()===4?`（Aランクまで名声あと${20-S.fame}）`:''}</p></div>
<p class="lbl">技能</p><div class="rows">${TK.map(t=>`<div class="row"><i class="chip t-${t}">${T[t].g} ${T[t].n}</i><span class="pips">${'●'.repeat(S.sk[t])}${'○'.repeat(SMAX-S.sk[t])}</span><span>札${S.sk[t]}枚</span></div>`).join('')}</div>
<p class="lbl">仲間</p><div class="rows">${S.mem.length?S.mem.map(id=>{const m=MB[id];return `<div class="row"><i class="chip t-${m.t}">${T[m.t].g}</i><span>${m.n} Lv${mLv(id)}　${hearts(id)}</span><span>${S.act.includes(id)?'同行':'待機'}</span></div>`}).join(''):'<p class="prog">まだ固定の仲間はいない。依頼の報酬に「新しい仲間」とある貼り紙を探そう。</p>'}${S.temp?`<div class="row"><i class="chip t-${S.temp.t}">${T[S.temp.t].g}</i><span>${S.temp.n}</span><span>臨時</span></div>`:''}</div>
${S.mem.includes('aiko')?`<p class="lbl">藍子の技能（見習い帖の頁 ${S.ap}枚）</p>${aRows()}`:''}<p class="lbl">道具</p><p class="prog">${Object.keys(cnt).length?Object.entries(cnt).map(([i,n])=>`${IT[i].n}×${n}`).join('、'):'なし'}</p>
<div class="stack">${S.done.q18?go('recap','旅の記録と称号を見る'):''}${go('back','掲示板に戻る',{alt:1})}${go('reset','記録を消して最初から',{alt:1})}</div>`},
recap(){const s=S.st,d=domT(),head=d?TL.find(t=>t.k==='t'+d).n:TK.every(t=>S.sk[t]>=3)?'万能の人':'辺境の冒険者',p=persona(),best=[...S.mem].sort((a,b)=>bondOf(b)-bondOf(a))[0],fav=[...TK].sort((a,b)=>s.t[b]-s.t[a])[0],qn=Object.keys(QS);
 const rows=[['達成した依頼',`${qn.filter(k=>S.done[k]).length} / ${qn.length}`],['挑んだ場面',`${s.n}`],['会心の一手',`${s.crit}回`],['負傷',`${s.hurt}回`],['倒れた回数',`${s.fail}回`],['いちばん使った技',s.t[fav]?`${T[fav].n}（${s.t[fav]}枚）`:'―'],['いちばん絆の深い仲間',best?`${MB[best].n}（絆${bondOf(best)}）`:'―'],['仲間との語らい',`${s.chat}回`],['稼いだ報酬',`${s.gold}G`]];
 return `<div class="head"><p class="eyebrow">旅の記録</p><h2>${whoAmI()}の歩み</h2></div><div class="crest"><span>あなたの称号</span><b>${head}</b></div>${aCrest()}<div class="say"><b>冒険者気質診断：${p.n}</b>${p.x}</div><div class="slips">${rows.map(g=>`<div class="slip"><span>${g[0]}</span><span>${g[1]}</span></div>`).join('')}</div><p class="lbl">称号コレクション ${COL.length} / ${TL.length}</p><div class="rows">${TL.map(t=>{const now=t.f(),old=COL.includes(t.k);return `<div class="row ttl"><span class="pips">${now?'●':old?'◎':'○'}</span><span>${now||old?t.n:'？？？'}</span><span>${t.x}</span></div>`}).join('')}</div><p class="prog">● 今回の旅で獲得　◎ 以前の旅で獲得　○ まだ。得意な技や仲間との過ごし方を変えると、別の称号が手に入る。</p><div class="stack">${go('back','ギルドへ戻る')}${go('reset','別の冒険者で最初から',{alt:1})}</div>`},
reset(){return `<div class="head"><h2>本当に最初からやり直しますか</h2><p>技能・仲間・所持品の記録がすべて消えます。</p></div><div class="stack">${go('reset2','記録を消す')}${go('back','やめて掲示板に戻る',{alt:1})}</div>`},
parting(){const ch=['待っている人のところへ帰るんだ','この街に、残ってほしい','藍子が決めていい'],x=['帰ることを勧める','残ってほしいと伝える','藍子の心に任せる。これまでの絆と、返事の向きで決まる'];
 return `<div class="scene read"><p class="prog">終章のまえに</p><h2>陽だまりの扉</h2>${prose(PART)}</div><p class="prog">藍子に返す言葉を選ぶ</p><div class="hand">${ch.map((n,i)=>fuda({t:'h',a:'part',d:`data-i="${i}"`,ty:'言葉',gl:'藍',name:n,x:x[i]})).join('')}</div>`},
ending(){if(!S.aend)return V.ending0();const e=S.aend,b=bondOf('aiko'),sk=e.sk,bk=sk==='tou'||sk==='bu'?'band':sk,bi=b>=5?0:b<3?2:1;
 const why=AE.why[e.ch<2?e.ch:e.k==='stay'?2:3];
 const body=e.k==='ret'?[AE.pre,why,AE.retBond[bi],AE.ret,AE.souv[bk],AE.retEnd]:[AE.pre,why,AE.stay[bk],AE.stayBond[bi],AE.stayEnd];
 return `<section class="title"><p class="eyebrow">終章</p><h1>${e.k==='ret'?'光の<br>向こうへ':'陽だまりの<br>街で'}</h1></section><div class="scene read">${prose(body.join('|'))}</div>${go('recap','旅をふりかえる',{s:'実績と称号、冒険者気質診断'})}`},
aschool(){const k=S.ask,a=AK[k],l=S.ak[k]||0,c=acost(k),rq=areq(k),just=S.alast===k,txt=just?a.ls[l-1]:l>=3?a.ls[2]:a.hi[l];
 return hud()+`<div class="scene read"><p class="prog">藍子の見習い帖　${a.n}${l?' Lv'+l:''}</p><h2>${a.at}</h2>${prose(txt)}</div>${msg()}${!just&&c!=null?`<div class="hand two">${fuda({t:a.t,a:'alearn',name:`Lv${l} → ${l+1}`,x:`藍子が覚える札：${a.card[l]}（${a.any?'どの場面でも適性・':''}突破力${a.p[l]}）`,foot:rq||`見習い帖の頁 ${c}枚`,fc:rq?'bad':'',dis:!!rq||S.ap<c})}</div>`:''}${LITE?'':`<p class="prog">見習い帖の頁は、藍子を連れて依頼を果たすか、子豚亭で藍子と語らうとたまる（いま${S.ap}枚）。どの技能を伸ばしたかで、物語の結末が変わる。</p>`}${go('back','掲示板に戻る',{alt:1})}`},
school(){const t=S.sch,s=SCH[t],l=S.sk[t];return hud()+`<div class="scene read"><p class="prog">${T[t].n} Lv${l}</p><h2>${s.n}</h2>${prose(S.gtx||'')}</div>${msg()}${LITE?'':`<p class="prog">経験値札がたまると、自動で札を覚える。もうひとつの縁（${T[S.sub].n}）がLv3になるまでは得意な技（${T[S.og].n}）と交互に、そのあとは得意を2回、もうひとつの縁を1回の順に。挨拶を済ませた師匠は、Lv7の免許皆伝まで、そのたびに稽古をつけてくれる。</p>`}${go('back','掲示板に戻る',{alt:1})}`},
grow(){const g=S.grw[0],s=SCH[g.t],hi={2:1,4:2,6:3}[g.l],txt=g.l===7?MAS[g.t]:(hi?`${s.who}：${s.hi[hi]}|`:'')+GSC[g.t][g.l-2];
 return hud()+`<div class="scene read"><p class="prog">${S.gaf?'打ち上げの翌朝。':''}師匠の稽古　${T[g.t].n} Lv${g.l}${g.l===7?'　免許皆伝':''}</p><h2>${s.n}</h2>${prose(txt)}</div><p class="msg">札「${SK[g.t][g.l-1]}」を覚えた。${g.m||''}</p>${go('grown',S.grw.length>1?'次の稽古へ':'稽古を終える')}`}
};
function save(){if(S.scr==='title')return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function render(keep){_i=0;if(S.og&&!S.org)S.org='town';if(S.og&&!S.sub)S.sub=S.og;S.st=S.st||ST0();for(const k of['cin','pf','lean','grow','sp','uf','ak','gr'])S[k]=S[k]||{};if(!V[S.scr])S.scr=S.og?'guild':'title';const cur=S;let html=V[S.scr]();S=cur;$app.classList.toggle('still',!!keep);$app.innerHTML=html;const an=!keep&&$app.querySelector&&$app.querySelector('#ans');if(an){$app.classList.add('still');window.scrollTo(0,Math.max(0,an.getBoundingClientRect().top+window.scrollY-72))}else if(!keep)window.scrollTo(0,0);save()}
function start(data){$app=document.getElementById('app');
 try{COL=JSON.parse(localStorage.getItem(TKEY))||[]}catch(e){}if(data&&data.S)S=data.S;else{try{const j=localStorage.getItem(KEY);if(j)saved=JSON.parse(j)}catch(e){}S=fresh()}
 $app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;S.msg='';const keep=A[b.dataset.a](b.dataset);if(S.msg&&S.scr!=='aschool')toast(S.msg);render(keep===true)});
 render()}
if(typeof module!=='undefined')module.exports={A,V,QS,render,start,get S(){return S}};
else{window.claude?.hot?.snapshot?.(()=>({S}));window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{})}
</script>

</body>
