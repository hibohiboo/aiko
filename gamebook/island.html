<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ゆるふわソロキャンアイランド</title>
<meta name="description" content="目を覚ましたら、知らない浜辺。リュックの中には、魔法瓶がひとつ。">
<meta property="og:type" content="website">
<meta property="og:title" content="ゆるふわソロキャンアイランド">
<meta property="og:description" content="目を覚ましたら、知らない浜辺。リュックの中には、魔法瓶がひとつ。">
<meta property="og:url" content="https://hibohiboo.github.io/aiko/island.html">
<meta property="og:image" content="https://hibohiboo.github.io/aiko/island-ogp.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20d%3D%22M8%209.5c-1.3-1.7.9-2.8-.3-4.8M12%209.5c-1.3-1.7.9-2.8-.3-4.8M16%209.5c-1.3-1.7.9-2.8-.3-4.8%22%20stroke%3D%22%239a8f7c%22%20stroke-width%3D%221.8%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M3.5%2011.5h17l-2%2010.5h-13z%22%20fill%3D%22%23f6eedd%22%20stroke%3D%22%238a7d66%22%20stroke-width%3D%22.8%22%2F%3E%3Cpath%20d%3D%22M4.4%2016.5c2.5-2%205%202%207.6%200s5%202%207.6%200%22%20stroke%3D%22%236f9670%22%20stroke-width%3D%221.3%22%20fill%3D%22none%22%2F%3E%3Cpath%20d%3D%22M0%200q2.88-2.64%205.52%200q-2.64%202.64-5.52%200z%22%20fill%3D%22%236f9670%22%20transform%3D%22translate(6%2015.2)%20rotate(-40)%22%2F%3E%3Cpath%20d%3D%22M0%200q2.88-2.64%205.52%200q-2.64%202.64-5.52%200z%22%20fill%3D%22%236f9670%22%20transform%3D%22translate(12.8%2017.6)%20rotate(30)%22%2F%3E%3Cellipse%20cx%3D%2212%22%20cy%3D%2211.8%22%20rx%3D%228.2%22%20ry%3D%221.9%22%20fill%3D%22%23c99a6b%22%2F%3E%3C%2Fsvg%3E">
<style>
:root{
  --paper:#f3ead3; --paper2:#ebdfc2; --ink:#2a2216; --muted:#76684f; --line:#d3c39f;
  --hp:#c23f35; --food:#b87a12; --water:#2a73ad; --ok:#2f6b4c; --warn:#b5541b;
  --night:#121a30; --night2:#1d2747;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#d9cba8;color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--paper);position:relative;display:flex;flex-direction:column}

/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.hud-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.day{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:.02em}
.pips{display:flex;gap:4px}
.pip{font-size:12px;padding:2px 7px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
.pip.done{background:var(--paper2);color:#a89a7d;text-decoration:line-through}
.pip.now{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.hud-place{margin-left:auto;font-size:13px;color:var(--muted)}
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g{position:relative}
.g-head{display:flex;align-items:baseline;gap:4px;font-size:12px;color:var(--muted)}
.g-head b{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;margin-left:auto}
.g-state{font-size:11px;font-weight:700;color:#fff;background:var(--warn);border-radius:3px;padding:0 4px;display:none}
.g.low .g-state{display:inline-block}
.bar{position:relative;height:9px;border-radius:5px;background:#e2d5b6;overflow:hidden;margin-top:3px;border:1px solid transparent}
.g.low .bar{border-color:var(--warn)}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:5px}
.bar .ghost{background:repeating-linear-gradient(135deg,#0003 0 3px,#0001 3px 6px);transition:width .45s ease .35s}
.bar .fill{transition:width .2s ease}
.g.hp .fill{background:var(--hp)} .g.food .fill{background:var(--food)} .g.water .fill{background:var(--water)}
.float{position:absolute;right:0;top:-4px;font-size:13px;font-weight:800;pointer-events:none;animation:floatUp 1.1s ease forwards}
.float.neg{color:var(--hp)} .float.pos{color:var(--ok)}
@keyframes floatUp{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-14px)}}

/* ---------- places ---------- */
.places{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none}
.places::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:7px 11px;border-radius:18px;border:1px solid var(--line);background:#fbf6e9;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.here{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.chip.locked{background:transparent;color:#9b8d72;border-style:dashed}
.chip.newp{box-shadow:0 0 0 2px var(--ok) inset}
.move-note{padding:0 14px;font-size:11px;color:var(--muted);min-height:16px}
.move-note.err{color:var(--warn);font-weight:700}

/* ---------- scene ---------- */
main{flex:1;padding:6px 14px 96px}
.scene{font-family:var(--serif);font-size:15px;line-height:1.85;margin:6px 0 12px}
.scene .pname{font-family:var(--sans);font-size:12px;color:var(--muted);display:block;margin-bottom:2px}

.cards{display:flex;flex-direction:column;gap:9px}
.card{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;align-items:start;text-align:left;width:100%;padding:12px 12px 11px;border-radius:10px;border:1px solid var(--line);background:#fffaf0;box-shadow:0 2px 0 #cdbd97;cursor:pointer;transition:transform .08s,box-shadow .08s}
.card:active:not(.off){transform:translateY(2px);box-shadow:0 0 0 #cdbd97}
.card .ci{font-size:28px;line-height:44px;text-align:center;background:var(--paper2);border-radius:8px;grid-row:span 2}
.card .ct{font-weight:700;font-size:15px}
.card .cs{font-size:12px;color:var(--muted);margin-top:1px}
.costs{display:flex;flex-wrap:wrap;gap:4px;grid-column:2}
.cost{font-size:11px;padding:1px 6px;border-radius:3px;background:var(--paper2);font-variant-numeric:tabular-nums}
.cost.f{color:#7d5208} .cost.w{color:#1c5585}
.cost.need{background:var(--ok);color:#fff}
.note{grid-column:1/-1;font-size:12px;border-radius:5px;padding:4px 7px;margin-top:4px}
.note.warn{background:#f8e1c9;color:#7a3810}
.note.danger{background:#f4d3cf;color:#7c1f17;font-weight:700}
.card.warn{border-color:#d9a06b}
.card.off{background:#ece4cf;box-shadow:none;cursor:not-allowed;opacity:.85}
.card.off .ct,.card.off .ci{filter:grayscale(1);opacity:.55}
.card.off .note{background:#ddd3bb;color:#4d4434}
.card.deal{animation:deal .28s ease both}
@keyframes deal{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}

.result{border:1px solid var(--line);background:#fffaf0;border-radius:10px;padding:14px;animation:deal .25s ease both}
.result .story{font-family:var(--serif);line-height:1.9;font-size:15px;margin:0 0 8px;white-space:pre-line}
.result .extra{font-size:13px;color:var(--hp);font-weight:700;margin:4px 0;white-space:pre-line}
.gets{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 4px}
.get{font-size:12px;padding:3px 8px;border-radius:12px;background:var(--paper2)}
.get.neg{background:#f4d3cf;color:#7c1f17}
.get.pos{background:#d8e8d6;color:#1e4a33}
.get.know{background:#28344f;color:#f3ead3;cursor:pointer}
.get.clue{background:#5a3d6b;color:#f6ecff;cursor:pointer}
.get.place{background:var(--ok);color:#fff}
.btn{display:block;width:100%;padding:13px;border-radius:9px;border:0;background:var(--ink);color:var(--paper);font-weight:700;font-size:15px;cursor:pointer;margin-top:12px}
.btn.sub{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{background:#cbbd9c;color:#7f7258;cursor:not-allowed}

/* ---------- bottom nav ---------- */
nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:grid;grid-template-columns:repeat(4,1fr);background:#efe4c8;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.bottom button{background:none;border:0;padding:8px 2px 9px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;position:relative}
nav.bottom button span{font-size:20px}
.badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--hp);color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:0 5px;min-width:16px}
.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.18)}}

/* ---------- sheet ---------- */
.veil{position:fixed;inset:0;background:#0007;z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;max-height:82vh;max-height:82dvh;overflow:auto;background:var(--paper);border-radius:14px 14px 0 0;z-index:21;padding:14px 14px calc(20px + env(safe-area-inset-bottom));animation:up .24s ease}
@keyframes up{from{transform:translate(-50%,40px);opacity:.4}}
.sheet h2{font-family:var(--serif);font-size:18px;margin:0 0 10px;display:flex;align-items:center}
.sheet h2 small{font-family:var(--sans);font-size:12px;color:var(--muted);margin-left:8px;font-weight:400}
.close{margin-left:auto;background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer}
.sec{font-size:12px;color:var(--muted);margin:14px 0 6px;font-weight:700}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}
.row .ri{font-size:22px;width:30px;text-align:center}
.row .rn{flex:1;font-size:14px}
.row .rn small{display:block;color:var(--muted);font-size:11px}
.mini{border:1px solid var(--ink);background:#fffaf0;border-radius:6px;padding:6px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
.mini[disabled]{border-color:#b9ab8c;color:#9b8d72;cursor:not-allowed;background:transparent}
.mats{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.mat{font-size:11px;padding:1px 6px;border-radius:3px;background:var(--paper2)}
.mat.short{background:#f4d3cf;color:#7c1f17;font-weight:700}
.mat.ok{background:#d8e8d6;color:#1e4a33}
.matlist{display:flex;flex-wrap:wrap;gap:6px}
.msg{background:#fffaf0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:6px}
.kn{padding:10px 0;border-bottom:1px dashed var(--line)}
.kn b{font-size:14px}
.kn p{margin:3px 0 0;font-size:13px;line-height:1.7;color:#4a3f2d}
.kn.unk b{color:#a99b7f;letter-spacing:.2em}
.newtag{font-size:10px;background:var(--ok);color:#fff;border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:2px}
.clue{font-family:var(--serif);padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.7}
.clue.unk{color:#a99b7f}

/* ---------- night ---------- */
.nightwrap{background:linear-gradient(var(--night),var(--night2));color:#e6e1f0;flex:1;padding:28px 18px 40px;min-height:100vh;min-height:100dvh}
.nightwrap h2{font-family:var(--serif);font-size:22px;margin:0 0 4px}
.nightwrap .sky{font-size:30px;letter-spacing:10px;margin:8px 0 16px}
.nightwrap p{font-family:var(--serif);line-height:1.95;white-space:pre-line}
.nightwrap .ledger{background:#ffffff10;border:1px solid #ffffff24;border-radius:10px;padding:10px 12px;margin:16px 0;font-size:13px}
.ledger div{display:flex;justify-content:space-between;padding:3px 0}
.ledger .neg{color:#ff9b8f} .ledger .pos{color:#9fe0b3}
.nightwrap .btn{background:#e6e1f0;color:var(--night)}
.nightwrap .get.clue{display:inline-block}

/* ---------- title / result ---------- */
.title{padding:60px 22px 40px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center}
.title h1{font-family:var(--serif);font-size:40px;margin:0 0 6px;letter-spacing:.12em}
.title .wave{font-size:13px;color:var(--muted);letter-spacing:.4em;margin-bottom:34px}
.title .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:26px 0 6px}
.title .meta div{background:#fffaf0;border:1px solid var(--line);border-radius:8px;padding:8px 4px;font-size:11px;color:var(--muted)}
.title .meta b{display:block;font-size:18px;color:var(--ink)}
.howto{text-align:left;font-size:12.5px;line-height:1.8;color:#4a3f2d;background:#fffaf0;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:16px}
.res{padding:26px 16px 40px}
.res .kind{font-size:12px;letter-spacing:.3em;color:var(--muted)}
.res h1{font-family:var(--serif);font-size:28px;margin:4px 0 10px}
.res .story{font-family:var(--serif);line-height:1.95;font-size:15px;white-space:pre-line}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.stats div{background:#fffaf0;border:1px solid var(--line);border-radius:8px;padding:10px 4px;text-align:center;font-size:11px;color:var(--muted)}
.stats b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.stats .big{grid-column:1/-1}
.stats .big b{font-size:34px}
.persona{background:var(--ink);color:var(--paper);border-radius:12px;padding:16px;margin:14px 0}
.persona .lbl{font-size:11px;letter-spacing:.2em;opacity:.7}
.persona h3{font-family:var(--serif);font-size:21px;margin:4px 0 6px}
.persona p{font-size:13px;line-height:1.8;margin:0 0 10px;opacity:.9}
.tagbar{display:grid;grid-template-columns:64px 1fr 26px;align-items:center;gap:8px;font-size:12px;margin:5px 0}
.tagbar .tb{height:7px;border-radius:4px;background:#ffffff22;overflow:hidden}
.tagbar .tb i{display:block;height:100%;background:var(--paper);border-radius:4px;transition:width .8s ease}
.tagbar.top{font-weight:700}
.tagbar.top .tb i{background:#f2c56b}

.sec small{font-weight:400;margin-left:6px}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:#a99b7f;font-size:13px}
.thinkhead{font-weight:700;font-size:15px;margin:4px 0 10px}
.thinkhead small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.btn.think{margin-top:14px}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:8px 0 0}
.card.fresh{border-color:var(--ok);box-shadow:0 2px 0 var(--ok)}
.card.incoming{border:2px solid var(--ok);cursor:default}
.swaprow{display:flex;gap:8px;align-items:stretch}
.swaprow .card{flex:1;cursor:default}
.mini.drop{align-self:center;border-color:var(--hp);color:var(--hp)}
.cost.once{background:#e3d6f0;color:#4b2f66}
.note.info{background:#e4ecf3;color:#1c4568}
.get.idea{background:#f2c56b;color:#3d2a00;cursor:pointer}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important}
}
nav.bottom.one{grid-template-columns:1fr}
nav.bottom.two{grid-template-columns:1fr 1fr}
nav.bottom.two button{flex-direction:row;justify-content:center;gap:6px;font-size:14px;padding:12px 4px 13px}
nav.bottom.two button span{font-size:20px}
nav.bottom.two button[disabled]{opacity:.4}
nav.bottom.two .badge{top:6px;left:auto;right:18%}
nav.bottom.one button{flex-direction:row;justify-content:center;gap:8px;font-size:14px;padding:12px 4px 13px}
nav.bottom.one button span{font-size:20px}
.journal{font-family:var(--serif);font-size:14px;line-height:1.8;color:#5a4a30;border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:8px 0 4px;white-space:pre-line}
.kbox{background:#28344f;color:#f3ead3;border-radius:9px;padding:10px 12px;margin:10px 0 2px;animation:deal .3s ease both}
.kbox .klbl{font-size:11px;opacity:.75;letter-spacing:.1em}
.kbox b{font-size:14px}
.kbox p{font-size:12.5px;line-height:1.75;margin:4px 0 0;opacity:.92}
.kbox.old{background:#3a4560;padding:7px 12px}
.nightwrap .kbox{background:#ffffff14;border:1px solid #ffffff26}
.pager{display:flex;align-items:center;gap:12px;margin-top:6px}
.pager span{font-size:12px;color:var(--muted);white-space:nowrap}
.pager .btn{margin-top:0}
.page.turn{animation:turn .32s ease both}
@keyframes turn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.result .story{min-height:5.7em}
.cards.fixed{margin-bottom:14px}
.card.story{border:2px solid #c99a3a;background:#fff6dc;box-shadow:0 2px 0 #c99a3a}
.card.story .ci{background:#f6e2b0}
.card.camp{border-color:#9db39f;background:#f4f8ef;box-shadow:0 2px 0 #9db39f}
.get.lost{background:#e9dccb;color:#6b4a1e;border:1px dashed #b08a55}
.res .clue{font-size:13px}
.moon2{display:inline-block;font-size:.68em;margin-left:6px;filter:hue-rotate(-45deg) saturate(2.5) brightness(.9);vertical-align:4px}

.move-note{display:none;min-height:0;margin:8px 14px 0;padding:7px 10px;border-radius:7px;background:#fffaf0;border:1px solid var(--line);font-size:12px;white-space:pre-line}
.move-note.on{display:block}
.row.lockrow .rn{color:#9b8d72}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{flex:1;padding:8px;border-radius:7px;border:1px solid var(--line);background:#fffaf0;font-size:13px;cursor:pointer}
.tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.pip i{font-style:normal;margin-right:3px;font-size:12px}
.pip.done i{filter:grayscale(1);opacity:.6}

.ic{width:1em;height:1em;display:inline-block;vertical-align:-.14em}
.card .ci .ic{width:30px;height:30px;vertical-align:middle}
.ic2{position:relative;display:inline-block;line-height:1}
.ic2 b{position:absolute;right:-.28em;bottom:-.18em;font-size:.55em;font-weight:400}
.pip i .ic{width:13px;height:13px;vertical-align:-2px}
.pip.done i .ic{filter:grayscale(1);opacity:.55}
nav.bottom.two button span .ic{width:22px;height:22px}

/* ---------- 藍子版 ---------- */
.ep{background:#f6ecd2;border:1px solid #d9c08a;border-left:4px solid #c99a3a;border-radius:8px;padding:10px 12px;margin:2px 0 8px;animation:deal .3s ease both}
.ep .eph{font-size:11.5px;font-weight:700;color:#8a6420;letter-spacing:.04em;margin-bottom:4px}
.ep p{font-family:var(--serif);font-size:14px;line-height:1.85;margin:0;white-space:pre-line;color:#4a3b22}
.result .ep{min-height:5.7em}
.snap{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;padding:10px;border-radius:9px;border:1.5px dashed #8a6420;background:#fff6dc;color:#5a4214;font-weight:700;font-size:14px;cursor:pointer}
.snap small{font-weight:400;font-size:11px;color:#8a6420}
div.snap.done{cursor:default;border-style:solid;font-weight:400;font-size:12.5px;background:#f1e8d0}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px;margin:6px 0 4px}
.ph{margin:0;background:#fffdf7;padding:7px 7px 9px;border-radius:3px;box-shadow:0 2px 6px #0002;transform:rotate(-1deg)}
.ph:nth-child(even){transform:rotate(1.2deg)}
.phi{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:44px;background:linear-gradient(160deg,#cfe0e8,#e9dcbc);border-radius:2px}
.phi .ic{width:44px;height:44px}
.ph figcaption{font-family:var(--serif);font-size:11.5px;line-height:1.55;margin-top:6px;color:#4a3f2d}
.nightwrap .ep{background:#ffffff12;border-color:#ffffff30;border-left-color:#c99a3a}
.nightwrap .ep p{color:#e6e1f0}
.nightwrap .ep .eph{color:#f2c56b}
.nightwrap .snap{background:#ffffff14;color:#f3ead3;border-color:#f2c56b;margin-bottom:6px}
.nightwrap .snap small{color:#f2c56b}
.nightwrap div.snap.done{background:#ffffff0c;color:#f3ead3}
nav.bottom.three{grid-template-columns:repeat(3,1fr)}
nav.bottom.three button{flex-direction:row;justify-content:center;gap:5px;font-size:13px;padding:12px 2px 13px}
nav.bottom.three button span{font-size:19px}
nav.bottom.three button span .ic{width:20px;height:20px}
nav.bottom.three button[disabled]{opacity:.4}
nav.bottom.three .badge{top:5px;left:auto;right:6%}
/* はじめて移動できるようになったとき：移動ボタンを光らせて、吹き出しで知らせる */
nav.bottom button.intro{background:#f7e3a8;animation:navglow 1.6s ease-in-out infinite}
@keyframes navglow{0%,100%{box-shadow:inset 0 0 0 0 #e0a84400}50%{box-shadow:inset 0 0 0 3px #e0a844}}
.navtip{position:absolute;bottom:calc(100% + 9px);right:6px;background:#3d2a00;color:#fff7e0;font-style:normal;font-size:12.5px;font-weight:700;white-space:nowrap;padding:7px 11px;border-radius:9px;pointer-events:none;box-shadow:0 3px 10px #0003;animation:tipin .5s ease both,tipbob 1.6s ease-in-out .5s infinite}
.navtip::after{content:'';position:absolute;top:100%;right:24px;border:6px solid transparent;border-top-color:#3d2a00}
.navtip.l{right:auto;left:6px}
.navtip.l::after{right:auto;left:24px}
@keyframes tipin{from{opacity:0;transform:translateY(10px)}}
@keyframes tipbob{50%{transform:translateY(-3px)}}
.tabs{flex-wrap:wrap}
.tab{min-width:0;padding:7px 4px;font-size:12.5px}
.tab small{display:block;font-size:10.5px;opacity:.75;font-weight:400}
.kn .src{display:inline-block;margin-left:6px;font-size:10.5px;color:#8a6420;background:#f6ecd2;border-radius:3px;padding:0 5px;vertical-align:1px}
.title .kick{font-size:12px;letter-spacing:.3em;color:var(--muted);margin-bottom:8px}
.title h1{font-size:32px;letter-spacing:.08em;line-height:1.35}
.title a.back{display:block;margin-top:18px;font-size:13px;color:var(--muted)}
.ideabox{background:#fff3cf;border:1px solid #f2c56b;border-radius:9px;padding:10px 12px;margin:10px 0 2px;animation:deal .3s ease both}
.ideabox .klbl{font-size:11px;letter-spacing:.1em;color:#8a6420}
.ideabox b{font-size:14px}
.ideabox p{font-family:var(--serif);font-size:13px;line-height:1.8;margin:4px 0 0;white-space:pre-line;color:#4a3b22}
.ideabox small{font-family:var(--sans);font-size:11px;color:var(--muted)}
.title .wipe{margin-top:18px;font-size:12px;opacity:.75}
.emblem{display:block;width:220px;max-width:72%;height:auto;margin:0 auto 18px}
.emblem .steam{animation:steam 4.2s ease-in-out infinite;opacity:0}
.emblem .steam:nth-of-type(2){animation-delay:1.4s}
.emblem .steam:nth-of-type(3){animation-delay:2.8s}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}35%{opacity:.85}100%{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.emblem .steam{animation:none!important;opacity:.7}}
.title .tag{font-family:var(--serif);font-size:14px;color:var(--muted);letter-spacing:.2em;margin-bottom:30px}

  jelly:['クラゲに刺されたら','真水で洗うと、残った針が刺激されて毒が出ることがある。海水でそっと洗い流す。残った触手は素手で触らず、貝殻やカードのふちでこそげ取る。','七海ちゃん'],
  seaweed:['海藻のしょっぱさ','海藻はミネラルが豊富で食べられるものが多いが、塩分も多い。食べたぶん、水も必要になる。','七海ちゃん'],
  birdwater:['鳥の声をたどる','鳥は毎日、水を飲みに行く。朝や夕方に、たくさんの鳥の声が重なって聞こえる方角には、水場があることが多い。','山歩き名人のおばあさん'],
  followdown:['迷ったら引き返す','水は低いほうへ流れるので、谷に沿えば沢に出やすい。ただ、道に迷ったときに沢を下ると、滝や崖で行き止まりになりやすい。迷ったら落ち着いて、来た道を引き返すのが基本。','山歩き名人のおばあさん'],
  conchoidal:['貝殻状断口','黒曜石やチャートのような石は、割ると貝殻のような曲面で割れて、鋭い刃ができる。','考古学の先生'],
  rope:['撚り（より）','繊維を同じ向きにねじり、それを逆向きに撚り合わせると、ほどけにくい強い縄になる。','村のおばあちゃん'],
  medome:['目止め','焼いたばかりの土器や土鍋には細かいすき間がある。最初にお粥や芋のような、でんぷん質のものを煮ると、すき間がふさがって水漏れしにくくなる。','肇ちゃんのおじいさん'],
  taro:['芋は火を通す','タロイモの仲間は、生だとえぐみで口や喉がかゆく、痛くなる。よく加熱して食べる。','村のおばあちゃん'],
  salt:['塩も大事','汗をかくと、水といっしょに塩分も失われる。水だけをたくさん飲むと、かえって体調をくずすことがある。','亜季さん'],
  mosio:['藻塩焼き','海水の塩分は3%ほどで、そのまま煮つめても少ししか塩がとれず、薪もたくさん要る。昔は、海藻に海水をかけて干すのをくり返して塩をふかせ、その海藻を海水で洗って濃い塩水（かん水）を作ってから煮つめた。','志希ちゃんと塩づくりの職人さん'],
  ash:['灰で洗う','焚き火の灰を水に溶かした上澄み（灰汁）は、油汚れを落とす。昔は食器や布を灰で洗っていた。','村のおばあちゃん'],
  kayari:['蚊遣り（かやり）','ヨモギのような葉をいぶした煙は、昔から虫よけに使われてきた。','村のおばあちゃん'],
  kanten:['観天望気','夕焼けの次の日は晴れ、朝焼けは雨のしるしといわれる。天気は西から変わることが多いからだ。','漁師のおじいさん'],
  santen:['三点支持','岩場を登り下りするときは、両手両足のうち三つで体を支え、動かすのは一つずつ。体重をかける前に、足場がしっかりしているか確かめる。','山歩き名人のおばあさん'],
  firstaid:['応急手当て','切り傷は、まずきれいな水で汚れを洗い流す。それから清潔な布を当てて、強く押さえて血を止める（圧迫止血）。','亜季さん'],
  wetcold:['濡れた服は体温を奪う','水は空気よりずっと熱を伝えやすい。濡れた服のままだと、体温がどんどん奪われる。雨の夜は、屋根と乾いた寝床がいちばんの守り。','亜季さん'],
  cavelife:['洞窟で暮らさない理由','洞窟の中は一年じゅう気温が低めで湿気が多く、体も服も薪も乾きにくい。奥で火を焚くと煙がこもり、大雨のあとは水が出ることもある。それに、外から見つけてもらえない。休むなら入口の近くで。','鍾乳洞の回'],
  akuni:['灰汁で繊維をとる','ツルや木の皮を灰汁で煮たり、熱い灰に埋めて蒸したりすると、かたい部分がやわらかくなる。水の中でしごくと繊維だけが残り、細くて丈夫な糸になる。藤布や葛布も、こうして作られてきた。','村のおばあちゃん'],
  heat:['昼の暑さと汗','強い日差しの下では、汗で水分がどんどん出ていく。暑い時間は日陰を選び、頭を布などで守る。動くなら、朝夕の涼しいうちに。','亜季さん'],
  herbtea:['野草のお茶','ヨモギやドクダミのような身近な葉を、昔から干したり煎じたりしてお茶にしてきた。知っている葉だけを使う。','村のおばあちゃん'],
  cairn:['ケルン','山道の分かれ道に石を積んで、道しるべにする。迷いやすい場所ほど、来た道と行く道の両方に目印を残しておく。','山歩き名人のおばあさん'],
  taneimo:['種芋','サトイモの仲間は、掘った芋の小さな子芋を種芋にして植える。芽の出るほうを上にして、やわらかく耕した土に浅く埋める。','村のおばあちゃん'],
  kaizuka:['貝塚','昔の人が食べた貝の殻などを捨てた場所。土器のかけらや骨も出てきて、何を食べ、どう暮らしていたかがわかる。','考古学の先生'],
  kintsugi:['金継ぎ','割れたり欠けたりした器を漆でつぎ合わせ、継ぎ目を金や銀で飾って直す。傷を隠さず、器の歴史として残す。','金継ぎの職人さん'],
  mukuroji:['ムクロジ','ムクロジの実の皮は、水でもむと泡立つ。昔は石鹸のかわりに、洗濯や髪洗いに使われた。黒くて硬い種は、羽根つきの玉になる。','村のおばあちゃん'],
  shampoo:['実で髪を洗う','泡立つ実や木の皮は、髪や体の汚れを落とす。昔の人は、ムクロジやサイカチの実を使った。','村のおばあちゃん'],
  tearai:['手を洗う、爪を切る','料理の前と、けがの手当ての前には手を洗う。爪が長いと、すき間に汚れやばい菌がたまる。','亜季さん'],
  sentaku:['洗濯は日に干す','洗ったものはお日さまに当てて干す。日の光と風で乾かすと、いやな匂いも減る。','村のおばあちゃん'],
  fusayouji:['房楊枝','やわらかい木の枝の先を叩いて房にほぐし、歯ブラシにする。江戸時代の人は、これで歯をみがいた。','楊枝屋の職人さん'],
  shioha:['塩で歯をみがく','塩をつけて歯と歯ぐきをみがくと、すっきりする。昔は、歯みがき粉のかわりに塩を使った。','塩づくりの職人さん'],
  himono:['干物','魚を開いて塩をし、日と風で干す。水分が抜けると腐りにくくなり、うま味も濃くなる。','漁村のおかみさん'],
  hoshiimo:['干しいも','芋を煮てやわらかくし、皮をむいて薄く切り、日と風で干す。甘みが増して、長くもつ。','村のおばあちゃん'],
  kabuwake:['株分け','根もとから芽がいくつも出ている草花は、根を傷つけないように土ごと掘りあげて分け、植えかえるとふやせる。','夕美さん'],
  greenflash:['グリーンフラッシュ','空気が澄んだ日、太陽が水平線に沈む瞬間に、上のふちが一瞬だけ緑に光ることがある。','未央ちゃん'],
  hikarigoke:['ヒカリゴケ','ふつうのヒカリゴケは自分では光らない。レンズのような細胞が、入ってきたわずかな光を返して光って見える。','鍾乳洞の回'],
  groundwater:['地下水','岩や砂を通ってきた地下水は濁りが少ないことが多い。ただ、それだけで安全とは限らない。','井戸掘りの回'],
  polaris:['北極星','北極星はほぼ真北の空にあって、ほとんど動かない。北斗七星やカシオペヤ座から探せる。','星空キャンプの回'],
  smoke:['狼煙の色','乾いた薪は煙が少ない。青い葉や生木をくべると白い煙が増えて、遠くから見えやすい。','亜季さん'],
  rosetta:['ロゼッタストーン','同じ内容が3種類の文字で刻まれていたことが、古代エジプトの文字を読み解く手がかりになった。','博物館の回'],
  moon:['月はひとつ','地球の衛星は月ひとつだけ。満ち欠けはおよそ29.5日でひとめぐりする。','']
};

// ポジパDASHの回想。新しいことをしたとき、新しいものを作ったときに一度だけ挟まる
const EP={
  aki:['第91回「サバイバルの心得」','ポジパ島編の最初の回は、亜季さんの講義から始まりました。\n「よいですか、ポジパ分隊！　人は空気がなければ3分、水がなければ3日、食べ物がなければ3週間であります！」\n茜ちゃんは「3週間も食べないなんて無理です！」って本気で青ざめていて、未央ちゃんは「軍曹、質問！　おやつは何日ですか！」って。\n亜季さんは笑って、「まずは水。それから、ぐっすり眠れる場所。焦らないことが、いちばんの装備であります」\n\n……焦らない。それなら、得意です。'],
  camp:['第92回「ポジパ島、上陸！」','初めて島に上陸した日、茜ちゃんは真っ先に波打ち際へ走っていって、「ここに建てましょう！　海が目の前です！」って。\n亜季さんが、砂に残った海藻の線を指さしました。\n「茜殿、あの線まで潮が来るのであります。拠点は、満ち潮の届かない、風をよけられる場所に！」\n三人で何度も浜を往復して……結局、崖の下に決まったんです。\n\nあのときの崖に、ちょっとだけ似ています。'],
  flash:['第27回「夕日を待つ」','「グリーンフラッシュって知ってる？　見たら幸せになれるんだって！」\n未央ちゃんがそう言うから、三人で堤防に並んで、夕日が沈むのを待ちました。\n茜ちゃんはずっと「まだですか！」、未央ちゃんはずっとスマホを構えて。\n結局見えなかったけれど、帰り道、未央ちゃんが「三人で見たかったね」って。\n\n……見えましたよ、未央ちゃん。今は、ひとりだけど。'],
  cook:['第95回「ポジパ島ごはん」','島でとれたものだけで、ごはんを作った回。\n茜ちゃんがとってきた貝と、未央ちゃんが釣った小さな魚と、私が摘んだ野草。\n焼いた石の上で、じゅうじゅう焼くんです。\n「カレー粉があれば完璧なのに！」って茜ちゃん。\nデザートは、差し入れに来てくれた菜帆ちゃんの焼きりんご。\nカレー粉はなかったけど……みんなで食べたあのごはんが、いちばんおいしかった気がします。'],
  fire:['第93回「火を起こせ！」','火起こしの回では、私だけ、いつまでたっても煙が出なくて。\n茜ちゃんは三十秒で「ボンバーーッ！」って火をつけて、未央ちゃんも負けじと汗だくで……。\n「藍子殿は、力ではなく道具に頼るのであります」\n亜季さんが、ひもと枝で小さな弓を作ってくれました。\nその日の放送の最後に映っていたのは、やっと点いた小さな火を見て、泣きそうになっている私の顔でした。'],
  tide:['第16回「潮だまりの生きもの」','ゲストは、お魚が大好きな七海ちゃん。漁師のおじいさんに連れられて、潮の引いた磯を歩いた回です。\n七海ちゃんは潮だまりをのぞくたびに、「この子はギンポ、こっちはハゼの仲間れす〜」って、すぐに名前を教えてくれました。\n「カニの脚は、何本でしょう〜？」って、七海ちゃんのクイズ。\n茜ちゃんは「8本です！」、未央ちゃんは「6本？」。正解は、ハサミも入れて10本れす、って。\n茜ちゃんはカニを追いかけて岩の上ですべって、未央ちゃんはそれを撮って、私は……カニさんに「こんにちは」って言っていました。\n「カニさんにごあいさつする人、はじめて見たれす」って、七海ちゃんに笑われました。'],
  bed:['第97回「ふかふかの寝床」','大工の棟梁に、寝床の作り方を教わった回。\n「地面に寝るとな、体の熱を土に持っていかれる。まずは体を浮かせるんだ」\n未央ちゃんは葉っぱを山のように積んで、ダイブして、そのまま埋まっていました。\n茜ちゃんは五分で眠っていました。\n私は……みんなの寝顔を撮っていたら、スタッフさんに「藍子ちゃんも寝て」って言われちゃいました。'],
  beach:['第101回「浜のお掃除」','番組で、浜辺のごみ拾いをしたことがあります。\nペットボトル、お菓子の袋、どこかの国の文字が書かれたボトル……。\n「浜を見れば、海のつながりが分かるんだ」と漁師のおじいさん。\n拾っても拾っても終わらなくて、でも、きれいになった浜はとても気持ちよくて。'],
  tsubaki:['第34回「フィルムで町歩き」','ゲストは、カメラ仲間の椿さん。トイカメラを首にさげて、港町を半日お散歩した回です。\n茜ちゃんは、一本目のフィルムを十分で撮りきってしまって。\n「フィルムは、数が限られていますから。一枚ずつ、心が動いたときに」\n椿さんは、なかなかシャッターを切りませんでした。そのかわり、切るときは迷わない。\n帰りのロケバスで、椿さんが言ったんです。\n「撮った写真には、その日の自分も、ちゃんと写っているんですよ」'],
  knife:['第44回「石器時代に挑戦」','考古学の先生が持ってきてくれた、黒くてつやつやした石。\n「こう、角を狙って、迷わず打つ」\n未央ちゃんが一発で割って、「見て見て！　刃物だよ、これ！」って大はしゃぎ。\n私はこわごわ打つから、ちっとも割れなくて。\n先生が「迷わず、ね」って笑っていたの、今ならわかる気がします。'],
  forest:['第47回「山の水をさがせ」','山歩き名人のおばあさんと、山で水を探した回。\n「水は低いほうへ流れる。谷へ下りれば、たいてい沢があるよ」\nそう教えてくれたあと、おばあさんは急にまじめな顔になりました。\n「でもね、道に迷ったときに沢を下っちゃいけない。滝や崖に出て、戻れなくなるんだ。迷ったら、まず落ち着いて、来た道を引き返すの」\n茜ちゃんが「引き返すのは負けじゃないんですね！」って言うと、おばあさんは「生きて帰るのがいちばんの勝ちさ」って笑っていました。\n子どものころ迷子になってばかりだった私には、とても大事な言葉です。'],
  rope:['第12回「縄をなう」','村のおばあちゃんに教わった縄ない。\n手のひらで藁をこすり合わせると、くるくると縄が伸びていくんです。\n「藍子ちゃんは、ゆっくりだけど目がそろってるねえ。いい縄になるよ」\nその縄は、今も古民家の大黒柱に巻いてあります。\n……おばあちゃん、元気かな。'],
  rod:['第9回「港の朝」','漁師のおじいさんの船に乗せてもらった、早朝の回。\n「魚は、しずかな人のところに来る」\nゲストの七海ちゃんも「お魚さんは、足音や影にびっくりするんれす」ってうなずいていて。\nそう言われて、私だけたくさん釣れちゃったんです。\n茜ちゃんは糸を垂らしたまま「まだですか！　まだですか！」って叫んでいて、一匹も釣れませんでした。\n帰りの船で、おじいさんがこっそり「お嬢ちゃん、漁師になれるぞ」って。'],
  plants:['第52回「森の恵みと、森のこわさ」','ゲストは夕美さん。山歩き名人のおばあさんと一緒に、みんなで山の植物を見て歩いた回です。\n夕美さんは、道ばたの小さな花の名前を、ひとつ残らず知っていました。\n茜ちゃんが真っ白なキノコを見つけて「おいしそうです！」って手を伸ばしたとき、名人のおばあさんより先に、夕美さんがそっと止めたんです。\n「それ、すごくきれいだけど、とっても危ない子なんだよ」\nおばあさんが「知らないものは、口に入れない。見て楽しむ」とうなずいて、夕美さんは「お花だって、野に咲いてる姿がいちばんキレイだもんね」って笑っていました。'],
  well:['第112回「井戸を掘る」','ポジパ島で、井戸を掘った回があります。\n掘っても掘っても土ばかりで、三日目。茜ちゃんのスコップの先から水がしみ出してきたときは、三人で泥だらけになって抱き合いました。\n「土や岩を通ってきた水は、にごりが少ないんだ」と、山歩き名人のおばあさん。\nもちろん、そのあとちゃんと調べてから飲んだんですよ。'],
  basket:['第23回「背負いかごで山へ」','村のおばあちゃんの家の納屋には、古い背負いかごがたくさん吊るしてありました。\n「昔は、これひとつで山へ行って、なんでも持って帰ってきたのよ」\n三人でおそろいのかごを編んで、山菜採りに出かけた日。\n茜ちゃんのかごは山盛りで、未央ちゃんのかごは半分がお菓子で、私のかごには、きれいな葉っぱとお花が入っていました。'],
  tea:['第31回「野草のお茶」','村のおばあちゃんの縁側で、ヨモギとドクダミを干してお茶にした回。\n「知ってる葉っぱだけね。知らない葉っぱは、お茶にしない」\nおばあちゃんは私のお茶をひと口飲んで、「藍子ちゃん、淹れるのが上手ねえ」って。\nお茶を淹れるのだけは、ちょっと自信があるんです。\n茜ちゃんは「にがーーい！」って叫んで、二杯おかわりしていました。'],
  pot:['第66回「土器を焼こう」','ゲストは、ビビッドカラーエイジで一緒の肇ちゃん。\n岡山にある、肇ちゃんのおじいさんの工房におじゃましました。\nおじいさんは口数の少ない人で、粘土をひも状にして巻き上げるところを、黙って一度だけ見せてくれました。\n未央ちゃんのはなぜか傾いていて、茜ちゃんのは力が入りすぎてぺちゃんこ。私のは、のんびり作っていたら乾きすぎて、ひびが入ってしまいました。\n「割れたら、また作ればええ。土はなくならん」\nおじいさんがぽつりとそう言うと、肇ちゃんが「……私も、何度もそう言われてきたんです」って、うれしそうに笑っていました。\n加奈ちゃんへのおみやげに、三人で小さなお皿をひとつずつ焼いたんですよ。'],
  stars:['第124回「星空キャンプ」','ポジパ島でキャンプをした夜、ガイドさんが星の探し方を教えてくれました。\n「ひしゃくの形の北斗七星。その先を五つぶん伸ばすと、北極星」\nゲストのイヴちゃんは「サンタの国でも、北極星は道しるべなんですよ〜」って、楽しそうに空を指さしていました。\n茜ちゃんは三秒で寝ていて、未央ちゃんとイヴちゃんと私で、夜中まで星を数えました。\n「あーちゃん、あれ流れ星！」\nお願いごとを言いそびれて、二人で笑いました。'],
  hut:['第118回「屋根をふく」','大工の棟梁と、ポジパ島に初めて小屋を建てた回。\n屋根の葉は、下から順に、うろこみたいに重ねていくんです。\n「上から重ねると、雨が中へ入っちまう。何事も下からだ」\n完成した夜、ちょうど雨が降って、三人で屋根の下で雨音を聞きました。\n未央ちゃんが「……なんか、いいね」って小さく言って、茜ちゃんも、めずらしく静かにうなずいていました。'],

const known=k=>!!((S&&S.know[k])||META.know[k]);

/* ----- inventory ----- */
const atCamp=()=>S.place==='camp';

const cap=()=>S.tools.basket?14:8;
const owns=t=>t==='pot'?POT.some(k=>inv(k)+(S.store[k]||0)>0):CARRY.includes(t)?inv(t)+(S.store[t]||0)>0:!!S.tools[t];
const tool=t=>t==='pot'?POT.some(k=>have(k)>0):CARRY.includes(t)?have(t)>0:!!S.tools[t];
const packN=()=>Object.entries(S.inv).filter(([k])=>!KEYI.includes(k)).reduce((a,[,n])=>a+n,0);

  '砂浜を歩いて、風をしのげる場所を探した。\n平らな浜がどこまでも続いていて、身を隠せるものがない。\nお日さまが、少しずつ傾いていく。',
  '浜の外れで、崖が海に張り出しているところを見つけた。\n岩がひさしのように突き出して、その下だけ砂が乾いている。\n満ち潮の海藻の線は、ずっと手前で止まっていた。',

// 焼き方：[はじめて焼くとき, 二回目から]
const COOKT={
  fish:['小枝の皮をむいて、魚の口から尾のほうへ、波を縫うように刺していく。\n焚き火のまわりの砂に、斜めに立てて並べた。\n「遠火の強火じゃ」\n漁師のおじいさんの声を思い出して、炎から少し離す。近すぎると、皮だけ焦げて中は生のままになってしまう。\nじりじり、と脂が落ちて、炎がぱっと跳ねる。くるりと返して、もう半分。\n皮がきつね色にふくらんできたら、焼きあがり。','魚は小枝に刺して、遠火でじっくり焼いた。'],
  crab:['焚き火の燠を少しよけて、平たい石を熱しておく。\nさっきまで、脚をわらわら動かしていたカニさん。\n……正直に言うと、こういうインパクトのある食べものは、ちょっと苦手です。\nでも、そうも言っていられない。\n番組では、お店に並ぶ前の命のことも、ちゃんと教わってきたから。\nカニさんは、甲羅を下にして石の上へ。\n「……ごめんなさい。いただきます」\n黒っぽかった甲羅が、みるみるうちに赤く染まっていく。\n殻のすき間から、しゅわしゅわと潮の香りの湯気が上がった。','カニは甲羅を下にして、焼いた石の上で赤くなるまで焼いた。'],
  clam:['貝は、口を上にして燠の上に並べる。\n「貝はね、ひっくり返さないの。おいしいおつゆがこぼれちゃうから」\n村のおばあちゃんに教わったとおり、じっと待つ。\nぱかっ。ぱかっ。\nひとつずつ口を開いていく貝の中で、おつゆがふつふつと煮立っていた。','貝は口を上にして燠に並べ、ぱかっと開くまで待った。'],
  egg:['平たい石を焚き火にのせて、よく熱する。\n真ん中を少しくぼませておくと、白身が流れていかない。\n手をかざして、じんわり熱が伝わってくるくらいになったら――\n卵を石のかどでこつんと割って、そっと落とす。\nじゅっ。\n白身のふちがちりちりと、レースみたいに焼けていく。黄身は、まんまるのまま。\n「……ふふっ。目玉焼きだ」\nフライパンのかわりに、島の石。','卵は、焼いた石の上で目玉焼きにした。'],
  imo:['芋は大きな葉で包んで、焚き火の下の、熱い灰の中に埋めた。\n「焼き芋はね、炎じゃなくて、灰でじっくり焼くのよ」\n村のおばあちゃんの言葉を思い出しながら、のんびり待つ。\n枝でつついて掘り出すと、葉っぱは真っ黒。\nそっと開くと、ほっくりした湯気が立ちのぼった。','芋は葉で包んで、熱い灰に埋めて焼いた。']
};
C('camp','cook',{fixed:1,i:'🐟+🔥',t:'焚き火で料理する',s:'焼けるものをまとめて焼く',c:[2,3],tags:['safe'],req:s=>s.fire,dis:s=>!Object.keys(COOK).some(k=>have(k)&&((k!=='wshell'&&k!=='wflask')||tool('pot')))&&'焼けるものがない',run:s=>{
  const get={},foods=[];let water=0;
  for(const[k,to]of Object.entries(COOK)){if((k==='wshell'||k==='wflask')&&!tool('pot'))continue;const n=have(k);if(!n)continue;get[k]=-n;get[to]=(get[to]||0)+n;if(COOKT[k])foods.push(k);else water=1}
  const salt=foods.length&&have('salt')>0;if(salt)get.salt=-1;
  const first=foods.filter(k=>!s.seen['cook:'+k]),again=foods.filter(k=>s.seen['cook:'+k]);
  first.forEach(k=>s.seen['cook:'+k]=1);
  const t=first.map(k=>COOKT[k][0]);
  if(again.length)t.push((first.length?'ほかのものも、いつものように焼いた。\n':'')+again.map(k=>COOKT[k][1]).join('\n'));
  if(foods.length)t.push('香ばしい匂いが、岩陰いっぱいに満ちる。'+(salt?'\n仕上げに、手作りの塩をひとつまみ。':'')+'\n焼きあがったものを、大きな葉っぱのお皿に並べた。\n使った石や器は、あとで灰をまぶしてこすり洗いしよう。');
  if(water)t.push('汲んできた水は土器に移して、ぐらぐらと沸かしてから冷ました。');
  if(foods.length)t.push(...ep('cook'));
  return{get,d:{hp:salt?5:0},know:[water?'boil':null,foods.length?'ash':null],photo:foods.length?'cook':null,t}}});
C('ruins','gate',{fixed:1,story:1,i:'🌀',t:'門にかけらをはめる',s:'青い石のかけら 3/3',c:[0,0],tags:['observe'],req:s=>inv('shard')>=3,run:s=>({choice:1,photo:'gate',t:[
  '門の柱の三つのくぼみに、青いかけらをひとつずつはめていく。\n最後のひとつがかちりと収まった瞬間、足もとの地面が、低くうなった。',
  '門の内側の霧が、ゆっくりと渦を巻きはじめる。\n渦の奥に、灯りが見えた。\nロケのテント。朝ごはんの湯気。浜辺を走りまわる、ふたつの人影。\n「……未央ちゃん。茜ちゃん」',
  'ふり返る。\n霧の切れ間から、ふたつの月が昇りはじめた島が見える。\n'+['岩陰の野営地。','岩陰の、ヤシの葉を重ねた寝床。','流木の柱を立てた、屋根のある小屋。','平たい石の上に建てた、高床の家。'][s.shelter]+(s.fire?'\n焚き火の煙が、細く空へのぼっている。':'')+(s.tools.catcher?'\n雨の夜に、ぽたぽたと音を立てていた雨水だめ。':'')+'\n\n全部、ここに置いていく。\n持っていけるのは、リュックの中のものと、'+(s.album.length?'トイカメラの写真と、':'')+'覚えたことだけ。\n\n「……おじゃましました。ありがとう」'+(s.flags.birdFriend?'\n肩の上で、ルリが小さく鳴いた。':'')+'\n\n門は、そう長くは開いていないだろう。']})});

C('camp','teeth',{i:'🪥',t:'歯をみがく',s:'朝のうちに',c:[1,1],tags:['safe'],slot:0,w:1.5,req:s=>!!s.flags.life50,run:s=>{const first=!s.flags.teeth;s.flags.teeth=1;const salt=have('salt')>0;
  if(first)return{d:{hp:4},know:salt?['fusayouji','shioha']:'fusayouji',t:['ずっと、指とハンカチでみがいていた歯。\n……ちゃんとした歯ブラシが、ほしいな。','やわらかい木の細い枝を折って、先っぽを、石でとんとん叩く。\n繊維がほぐれて、小さな筆みたいになった。\n房楊枝。江戸時代の人の、歯ブラシ。\n番組で、楊枝屋さんの職人さんに作り方を見せてもらって、「ほんとうに歯ブラシみたい……」って、三人でびっくりしたっけ。',(salt?'手作りの塩を、ほんの少しつけて、ごしごし。\n……しょっぱい。でも、口の中が、すうっとする。':'ごしごし。\n……うん。口の中が、すうっとする。')+'\n\nアイドルは、笑顔がお仕事。\n魔法瓶のふたに映った自分に、にこっと笑ってみる。……うん、大丈夫。']};
  return{d:{hp:3},t:['房楊枝で、歯をみがいた。すっきり。','歯をみがきながら、朝の海をながめた。','しゃかしゃか。今日も、いい天気。'][ri(0,2)]}}});
C('camp','cafetime',{i:'☕',t:'カフェで、ひと休み',s:'夕方だけ。香りのいい葉を使う',c:[1,1],tags:['safe'],slot:2,w:2,req:s=>s.tools.cafe&&s.fire,dis:s=>have('herb')<1&&'香りのいい葉がない',run:s=>({get:{herb:-1},d:{hp:10,water:10},t:['葉っぱのお茶を淹れて、カフェの椅子に座った。\n夕焼けが、湯気の向こうでゆらゆらしている。'+(s.flags.birdFriend?'\nルリは、今日もふたつめの椅子の常連さん。':''),'「本日のおすすめは、葉っぱのお茶です」\n……ほかに、メニューはないけれど。\n一杯のお茶を、ゆっくり、ゆっくり飲んだ。','カフェの椅子で、日記を書いた。\nお茶が冷めるくらい、ゆっくり。'][ri(0,2)]})});

C('camp','sing',{i:'🎵',t:'歌を口ずさむ',s:'ひとりの夕方は、少しさびしいから',c:[1,2],tags:['safe'],run:s=>{const n=(s.flags.sang||0);s.flags.sang=n+1;

  return{d:{hp:6},t:t+(s.flags.birdFriend?'\nルリが、合いの手みたいにピィと鳴いた。':'')}}});

C('rocks','tide',{i:'🦀',t:'潮だまりをのぞく',s:'取り残された生き物を探す',c:[4,7],tags:['observe','explore'],run:s=>{
  if(!s.clues.crab)return{clue:'crab',know:'tidepool',get:{crab:1},photo:'crab',t:['潮だまりの底に、カニさんがいた。\n「こんにちは。……ちょっとだけ、ごめんなさい」\n甲羅をつまんで持ち上げると、脚がわらわらと宙をかく。',...ep('tide'),'一本、二本……脚は10本。七海ちゃんのクイズの答えと、同じ。\nでも、ハサミが3本あった。\n「……え？」','となりの潮だまりのカニも、そのとなりのカニも、そっとのぞいてみた。\n……どのカニさんも、ハサミが3本。']};
  const o={t:'',get:{}};const r=R();if(r<.5){o.get.crab=1;o.t='岩のすき間からカニを引っぱり出した。'}else if(r<.75){o.get.fish=1;o.t='逃げ場をなくした小魚を、手ですくった。'}else{o.get.clam=1;o.t='岩に貼りついた貝をはがした。'}
  if(P(.15)){o.d={hp:-5};o.t=hurtAdd(o.t,'slip','濡れた岩で、つるりと足がすべった。\nとっさに手をついて、膝をしたたかにすりむく。血がにじんだ。\n潮だまりの水で傷を洗いながら、ふと思う。……ここで頭を打っていたら。\n濡れた岩の上では、海藻のついていないところを選んで歩こう。','濡れた岩で足をすべらせて、膝をすりむいた。')}return o}});
C('beach','seawater',{i:'🌊',t:'海水を飲む',s:'目の前に水はいくらでもある',c:[0,0],tags:['risk'],dis:s=>known('seawater')&&'海水は飲むほど渇く',run:s=>({d:{water:-8,hp:-4},know:'seawater',hurt:'余計に喉が渇いた',t:firstHurt('seawater',['両手ですくって、ごくごく飲みほす。\nしょっぱい。それでも一瞬だけ、喉がうるおった――気がした。','すぐに、前よりひどい渇きがやってきた。\n舌が上あごに貼りつく。こめかみが、どくどくと脈打つ。\n「……亜季さんに、あれだけ言われていたのに」\n海の水は、飲めば飲むほど体の水を持っていく。わかっていたのに、目の前の青さに負けてしまった。','波打ち際に座りこんで、しばらく動けなかった。\n真水を探そう。今度こそ、ちゃんと。'],'両手ですくって飲みほす。しょっぱい。一瞬だけ、喉がうるおった。\nすぐに、前よりひどい渇きがやってきた。')})});
C('beach','swim',{i:'🏊',t:'海に入って魚を追う',s:'うまくいけば魚が手に入る',c:[6,9],tags:['risk'],run:s=>{const r=R();
  if(r<.3)return{d:{hp:-12},hurt:'クラゲに刺された',know:'jelly',cause:'クラゲの毒',t:firstHurt('jelly',['海に腰までつかって、魚の影を追っていたとき。\n腕に、ぴりっと電気が走った。','次の瞬間、焼けるような痛み。\n腕に赤いみみず腫れが、すうっと浮き上がってくる。\n水の中に、透明な傘がふわりと揺れていた。クラゲ。','「真水じゃなくて、海水で……こすらないで……」\n七海ちゃんに教わったことを、声に出して確かめる。\n浜に上がって、海水でそっと洗い流した。\n肌に残った細い糸のような触手は、素手でさわらず、貝殻のふちでそっとこそげ取る。\n痛みは、夕方まで引かなかった。'],'腕に焼けるような痛み。透明なクラゲが漂っていた。\n七海ちゃんに教わったとおり、海水でそっと洗い流した。')};
  if(r<.6)return{get:{fish:1},t:'浅瀬に追いこんだ魚を、両手でつかみ上げた！\n「や、やりました……！」'};return{d:{hp:-3},t:'魚の影は見えるのに、指先をすり抜けていく。\n泳ぎつかれて、浜でしばらく大の字になった。\n茜ちゃんのトレーニングについていったときも、こんな感じだったなぁ。'}}});
C('beach','sos',{i:'🆘',t:'砂浜にSOSを書く',s:'空から見えるように大きく',c:[5,8],tags:['safe'],run:s=>{s.flags.sos=1;
  if(s.day>=3&&!s.clues.noplanes)return{clue:'noplanes',t:'流木で大きなSOSを描き直した。\nあおむけに寝ころんで、空を見上げる。\n雲がゆっくり流れていく。ほかには何も通らない。今日も。昨日も。'};
  return{t:'流木を並べて、大きなSOSを描いた。\n最後に、すみっこに小さく「藍子」と書きたした。誰かが見つけてくれますように。'}}});
C('beach','raft',{i:'🛶',t:'いかだで沖へ出る',s:'この島を出られるかもしれない',c:[8,14],tags:['risk','explore'],once:1,w:3,req:s=>s.tools.raft,run:s=>{s.tools.raft=0;s.flags.raftUsed=1;const strong=s.flags.strongRaft;return{d:{hp:strong?-4:-8},clue:'loop',t:['流木のいかだを、波打ち際から押し出した。\nツルで作った櫂で、ひたすら沖へ漕ぐ。島がだんだん小さくなっていく。\n「まっすぐ……まっすぐ……回らないで……」'+(strong?'\n大きな波をかぶっても、繊維の縄はぎゅっと締まったまま。いかだは、きしみもしない。':'\n大きな波を越えるたびに、ツルの縄がぎしぎしときしむ。\n「ほどけないで……お願い……」\n縄にしがみついて、何度も水をかぶった。'),'やがて、白い霧に包まれた。\n自分の手も見えない。お日さまの位置だけを頼りに、まっすぐ、まっすぐ漕ぎ続けた。','どれくらいたっただろう。霧が、ふっと晴れた。\n\n目の前にあったのは、白い砂浜。\n'+(s.flags.sos?'流木で描いた、見覚えのあるSOS。すみっこに「藍子」。':'見覚えのある岬の黒い岩。'+(s.fire?'岩陰から立ちのぼる、焚き火の煙。':'崖の下の、あの岩陰。')),(strong?'いかだは浜に乗り上げた。繊維の縄は、最後まで一本もほどけなかった。\nでも、霧の外へは出られなかった。\n「……戻ってきちゃった」':'いかだは浜に乗り上げて、ばらばらにくずれた。\n「……戻ってきちゃった」')]}}});
C('beach','sunset',{i:'🌅',t:'夕日をながめる',s:'夕方だけ',c:[1,3],tags:['observe'],slot:2,run:s=>{if(!known('greenflash'))return{d:{hp:6},know:'greenflash',photo:'flash',t:['お日さまが水平線――ううん、霧の向こうに沈んでいく。\n最後の一瞬、上のふちが緑色に光った。\n「あっ……！」',...ep('flash')]};return{d:{hp:6},know:'kanten',t:'空が茜色に染まっていく。\n茜ちゃんの色だな、と思った。今日も一日、生きのびました。\n「夕焼けの次の日は、晴れ」漁師のおじいさんの口ぐせ。明日も、きっといいお天気。'}}});
// ---- forest ----
C('forest','fruit',{i:'🫐',t:'木の実を採る',s:'鳥がついばんでいる実だけを選ぶ',c:[4,6],tags:['safe'],run:s=>({get:{fruit:ri(1,2)},t:'鳥がついばんでいた枝から、同じ実をもいだ。\n鳥さんが食べられるなら、きっと大丈夫。'})});
C('forest','redberry',{i:'🔴',t:'見慣れない赤い実を食べる',s:'つやつやしておいしそう',c:[2,3],tags:['risk'],run:s=>{if(P(.45))return{d:{hp:-14,food:-5},hurt:'お腹を下した',know:'unknownplant',cause:'見知らぬ実',t:firstHurt('berry',['つやつやの赤い実をひとつ、口に入れる。\n甘い。……と思ったのもつかの間。','お腹の奥が、ねじれるように痛みだした。\n冷や汗が背中を伝う。木の根もとにしゃがみこんで、浅い息をくり返す。\n「……知らないものは、口に入れない……」\n名人のおばあさんの言葉が、今になって身にしみる。',...ep('plants'),'痛みの波が引くまで、日陰でじっとしていた。\n夕美さん、ごめんなさい。見て楽しむだけに、しておけばよかった。'],'甘い。……と思ったら、またお腹がねじれるように痛みだした。\n知らない実は、やっぱりこわい。')};return{d:{food:12,water:4},t:'甘ずっぱくて、みずみずしい。当たりだったみたい。'}}});
C('forest','farm',{i:'🌱',t:'芋の畑を作る',s:'森のはずれの、日当たりのいいところ',c:[5,7],tags:['craft'],once:1,w:3,req:s=>!!s.names,dis:s=>inv('imo')<1&&'種芋にする芋を、1つ持ってくる',run:s=>{s.flags.farm=s.day;return{get:{imo:-1},know:'taneimo',made:'芋の畑',photo:'farm',t:['森のはずれに、木もれ日のよく届く場所がある。\n落ち葉をどけて、平たい石で土を掘り返した。\n石ころを拾って、根っこを抜いて、また掘り返して。\n……ただ土をやわらかくするだけなのに、すごく時間がかかる。','持ってきた芋から、小さな子芋をひとつ外した。\n「芋はね、子どもを植えるのよ。芽の出るほうを上にしてね」\n村のおばあちゃんの家の畑で、並んで植えたことがある。\nおばあちゃんは私の何倍も速くて、私が一列植えるあいだに、三列ぜんぶ終わっていた。','子芋を土に埋めて、手のひらで、ぽんぽんと押さえた。\n「大きくなってね」\n毎日、食べものを探しに行くだけだった私が、はじめて、食べものを育てている。']}}});
C('forest','harvest',{i:'🥔',t:'畑の芋を掘る',s:'葉っぱが大きく育った',c:[3,5],tags:['craft'],w:3,req:s=>s.flags.farm&&s.day-s.flags.farm>=5,run:s=>{const first=!s.flags.harvested;s.flags.harvested=1;s.flags.farm=s.day;
  return{get:{imo:3},t:first?['ハート形の葉っぱが、もう膝の高さまで育っている。\n根もとを、そっと掘ってみた。','……ころん。\n土の中から、丸い芋がいくつも顔を出した。\n「わぁ……！　ありがとう」\n自分で植えた芋。ひとつ持ち上げると、ずしりと重い。\n子芋をひとつ、また土に戻しておく。次の芋のために。']:'畑の芋を掘った。\nひとつ植えて、みっつ。子芋をまた土に戻して、「またね」。'}}});
C('forest','listen',{i:'👂',t:'森の奥で、しばらく耳をすます',s:'何もしない時間',c:[2,3],tags:['observe','safe'],once:1,w:2,req:s=>!!s.names,run:s=>{trace('terrace');return{d:{hp:6},t:['森の奥の、苔むした倒木に腰かけた。\n目を閉じて、耳をすます。\n葉っぱのこすれる音。遠くの波。小さな羽音。','しばらくすると、青い鳥たちが、一羽、また一羽と集まってきた。'+(s.flags.birdFriend?'\nルリの仲間たちだ。':'')+'\nみんな、同じところにとまっている。\n苔におおわれた、長い土手みたいなところ。','近づいて、苔をそっとめくってみた。\n下から出てきたのは、平たい石。\nその隣にも。その上にも。\n石が、きちんと積まれている。\n\n石垣だ。森の斜面に、何段も、何段も。','……段々畑。\nロケで訪ねた山の村にも、こんな段々畑があった。\nここで、誰かが畑を耕していたんだ。ずっと、ずっと昔に。\n\n鳥たちが、石垣の上で、のんびり羽をつくろっている。\nここは、昔から、鳥たちのお気に入りの場所なのかもしれない。']}}});
C('forest','village',{i:'🏚️',t:'段々畑の上のほうへ登ってみる',s:'石垣が、まだ上へ続いている',c:[4,6],tags:['explore','observe'],once:1,w:3,req:s=>s.flags.life50&&s.traces&&s.traces.terrace,run:s=>{trace('village');s.flags.village=1;return{photo:'hands',d:{hp:6},t:[
  '石垣にそって、斜面を登っていく。\n段々畑のいちばん上に、ひらけた場所があった。\n草の中に、石が丸く並んでいる。まんなかの土だけ、黒い。\n……炉のあと。ここで、火を焚いていたんだ。',
  'まわりの地面に、浅いくぼみが、輪になって並んでいた。\n柱を立てた穴のあと。\nひとつの輪。ふたつの輪。……もっと。\n家が、何軒も建っていた。ここは、村だったんだ。',
  '大きな岩の肌に、手のひらの形が、赤く残っていた。\n大きな手。そのとなりに、小さな手。\n私の手を、大きな手のほうに、そっと重ねてみる。\n……少しだけ、私のほうが小さい。',
  '岩のくぼみに、手のひらに乗るくらいの、石の小鳥が置かれていた。\n目が、四つ。尾羽が、ふたつに分かれている。'+(s.flags.birdFriend?'\n「……ルリちゃんに、そっくり」\n肩の上のルリが、首をかしげた。':''),
  '岩の奥の壁に、絵が彫られていた。左から、順番に。\n杖を持った人が、石の門を、空に向かって掲げている。\n門のまんなかに、まるい石。\nまるい石に、ひびが入って、三つに割れる。\n三つのかけらを、門の柱のくぼみに、ひとつずつはめていく人。'+(s.places.ruins?'\n……「'+pn('ruins')+'」の、あの三つのくぼみ。':''),
  ...ep('kintsugi'),
  'その先の絵。\nふたつの月の下で、焚き火を囲む人たち。\n門をくぐらずに、手をつないで、ここに残る人たち。\nそれから、ひとつのかけらを、洞窟の壁のほうへ運んでいく人。'+(s.clues.mural?'\n……壁画の下の、あのくぼみ。':''),
  '絵の最後には、何も彫られていなかった。\nなめらかな石の面が、続いているだけ。\n\n言葉は、ひとつもない。\nでも、なんだか――\n「……急がなくていいよ、って、言われてるみたい」\n\n岩に向かって、ぺこりと頭を下げた。\n「ありがとうございます。ちゃんと、受け取りました」']}}});
C('forest','awatree',{i:'🫧',t:'ふわふわ流れてくる泡を追いかける',s:'森の奥から、何か流れてくる',c:[3,4],tags:['explore','observe'],once:1,w:2,req:s=>!!s.flags.life50,run:s=>{trace('awatree');return{get:{awa:3},know:'mukuroji',photo:'bubbles',t:[
  '森を歩いていたら、目の前を、ふわりと何かが横切った。\n……泡？\nシャボン玉みたいな、透明な泡。ひとつ、またひとつ、森の奥から流れてくる。',
  '泡をたどっていくと、大きな木に行きあたった。\n幹は、両手を広げても半分も届かないくらい太い。\n枝に、黄色っぽい、まるい実がたくさん。\n実のひとつが、風で枝にこすれて、そこから泡が、ぷくりとふくらんでいた。',
  '落ちていた実を拾って、水といっしょに、手のひらでもんでみる。\nもこもこ、と泡が立った。\n「……ムクロジに、よく似てる」\n村のおばあちゃんの家の庭に、ムクロジの木があった。\nお正月の羽根つきの、黒い玉。あれはこの実の種なのよ、って教えてもらったっけ。',
  '手のひらの泡が、いくつかくっついて、ひとつの大きな泡になった。\nそのまま、ふわっと浮きあがる。\nよく見ると、泡の内側に、けしつぶみたいな小さな種が、いくつもくっついていた。\n泡は、木の上を越えて、空のほうへのぼっていく。\n\n「……あなたは、泡で、種をまくんですね」\nこの木は、「あわの実」って呼ぶことにしよう。',
  '木のまわりには、若い木が、少し離れたところに何本も生えていた。\nこの大きな木は、いつから、ここにあるんだろう。'+(s.traces&&s.traces.terrace?'\n石垣の段々畑も、すぐ近く。……むかしの誰かが、植えたのかな。':'')+(s.flags.birdFriend?'\nルリが、のぼっていく泡を、夢中で追いかけていた。':'')]}}});
C('forest','awapick',{i:'🫧',t:'あわの実を拾う',s:'泡の木の下で',c:[2,3],tags:['safe'],w:1.5,req:s=>!!(s.traces&&s.traces.awatree),run:s=>({get:{awa:ri(2,3)},t:'あわの実の木の下で、落ちている実を拾った。\n風が吹くと、枝の実がこすれて、泡がふわふわ森へ流れていく。'})});
C('forest','mushroom',{i:'🍄',t:'白いキノコを食べる',s:'香りはいい',c:[1,2],tags:['risk'],dis:s=>known('mushroom')&&'知らないキノコは食べない',run:s=>({d:{hp:-22,food:5},hurt:'手足がひどくしびれた',know:'mushroom',cause:'毒キノコ',t:['白いキノコを、ひと口だけかじった。\nいい香り。ほんのり、木の匂いがする。','しばらくして、指先がじんとしびれはじめた。\nしびれは手首へ、腕へ。唇まで、ぴりぴりする。\n立ち上がろうとして、膝から力が抜けた。','木の根もとにうずくまって、ゆっくり息をする。\n少しずつ、水を口にふくむ。\n「大丈夫……大丈夫……」\n自分に言い聞かせながら、半日、動けずに過ごした。',...ep('plants'),'……夕美さんの「とっても危ない子なんだよ」が、今ごろになって聞こえた気がした。']})});
C('forest','vines',{i:'🌿',t:'ツルを集める',s:'縄や結び目に使える',c:[4,6],tags:['craft'],run:s=>({get:{vine:2+(P(.3)?1:0)},t:'木に絡みついた丈夫なツルを、引きはがして束ねた。'})});
C('forest','twigs',{i:'svg:twig',t:'枯れ枝とヤシの葉を拾う',s:'燃料と屋根の材料',c:[3,6],tags:['craft'],run:s=>({get:{twig:2,leaf:ri(1,2)},t:'乾いた枝と、大きなヤシの葉を集めた。'})});
C('forest','herb',{i:'🌱',t:'いい香りの葉を摘む',s:'どこかで嗅いだことのある香り',c:[2,4],tags:['safe'],run:s=>({get:{herb:2},t:['葉をちぎって香りをかぐと、ヨモギに似たやさしい匂いがした。\n村のおばあちゃんの縁側を思い出す。\n知っている葉っぱに、ちゃんと似ているものだけを選んで摘んだ。',...ep('plants'),(s.recipes.tea?'香りのいい葉を、両手いっぱいに摘んだ。':'……これ、お茶にできないかな。')]})});
C('forest','dig',{i:'🥔',t:'芋を掘る',s:'ハート形の大きな葉の根もと',c:[5,7],tags:['craft'],run:s=>P(.7)?{get:{imo:ri(1,2)},know:'taro',t:firstDo('dig','タロイモに似た、ハート形の大きな葉。根もとを石で掘ると、ごつごつした芋が出てきた。\n「生で食べちゃだめよ。口がかゆくなるからね」\n村のおばあちゃんの声がする。焚き火で焼こう。','ハート形の葉の根もとを掘って、芋を掘り出した。')+(s.flags.leaked&&!s.flags.sealed?'\n……そういえば、新しい土器は、最初に何かを煮るといいんだっけ。':'')}:{t:'掘っても掘っても、細い根ばかりだった。\n手が泥だらけになった。'}});
C('hill','flowers',{i:'🌼',t:'白い小花を摘む',s:'風に揺れる草地に咲いている',c:[2,3],tags:['observe'],run:s=>({get:{flower:ri(2,3)},t:'崖の上の草地に、シロツメクサに似た白い花が咲いていた。\n「ごめんね、少しだけ」\n摘んだ花を手のひらにのせると、甘い香りがした。\n夕美さんなら、この花の名前もすぐにわかるのかな。'})});
C('forest','palm',{i:'🌴',t:'ヤシの木に登る',s:'実と葉がまとめて手に入る',c:[6,8],tags:['risk'],run:s=>{if(P(.3))return{d:{hp:-10},get:{coconut:1},hurt:'木から落ちた',cause:'転落',t:firstHurt('palm',['幹にしがみついて、少しずつ登っていく。\nあと少し。実に手が届きそう――','そこで、うっかり下を見てしまった。\n思っていたより、ずっと高い。くらり、と目の前が揺れる。\n手のひらが、汗ですべった。','背中から、砂の上に落ちた。\n息が止まる。しばらく、空しか見えなかった。\n……下が砂でよかった。岩だったら、と思うと、ぞっとする。','体を起こして、手足をひとつずつ動かしてみる。痛いけど、折れてはいない。\n転がってきた実をひとつだけ拾って、そろそろと帰った。'],'途中で下を見てしまって、手がすべった。背中から砂に落ちる。\n転がってきた実をひとつだけ拾った。')};return{get:{coconut:2,leaf:1},t:'下は見ないで、幹にしがみついて登りきった。\n実をふたつ落として、そろそろと降りる。……膝が笑ってる。'}}});
C('forest','fallen',{i:'🥥',t:'落ちたヤシの実を探す',s:'木の根もとを見て回る',c:[3,5],tags:['safe'],run:s=>P(.7)?{get:{coconut:1},t:'根もとの草むらに、熟した実がひとつ落ちていた。'}:{get:{shell:1},t:'あるのは割れて乾いた殻ばかり。\nきれいに半分に割れたものをひとつ拾った。器になりそうだ。'}});
C('forest','deep',{i:'🌳',t:'森の奥へ分け入る',s:'水の音がした気がする',c:[6,10],tags:['explore'],once:1,w:2,req:s=>!s.places.stream,run:s=>{if(P(known('followdown')?.75:.5))return{discover:['stream'],know:['followdown','birdwater'],want:'shell',t:['喉がからから。水を探さなきゃ。\n「迷ったら、沢へ下りちゃいけないよ。落ち着いて、来た道を引き返すの」\n山歩き名人のおばあさんの言葉が、頭の中で聞こえる。',...ep('forest'),'立ち止まって、目を閉じた。耳をすます。\n葉のざわめき。虫の羽音。それから、鳥の声。\n……あちこちで鳴いているけれど、右手の奥のほうだけ、いくつもの声が重なって、にぎやかだ。\n「鳥はね、毎日水を飲みに行くの。鳥がたくさん鳴いているほうに、水はあるよ」\nこれも、おばあさんの言葉。','迷っているわけじゃない。来た道は、まだちゃんとわかる。\nそれに、今は水がいる。鳥の声のするほうへ。\n通った枝にツルを結んで目印にしながら、地面のくぼみに沿って、少しずつ下りた。\n子どものころは、迷子になってばかりだった。だから、ふり返って目印を確かめるのを忘れない。','さらさら、と音がした。\n茂みを抜けた先に、澄んだ小川が流れていた。\n思わずかけ寄って、手を浸す。冷たい。\n……でも、このまま飲んで大丈夫かな。']};return{keep:1,d:{water:-4},know:'followdown',t:['シダをかき分けて進むうちに、どっちから来たのかわからなくなった。\n胸がどきどきする。……子どものころ、迷子になったときと同じ。','「迷ったら、落ち着いて、来た道を引き返すの」\n深呼吸して、折れた枝と足あとをたどって、森の入口まで戻った。\n次は、通った道に目印を残しながら進もう。',...ep('forest')]}}});
C('forest','bird',{i:'svg:bird4',t:'鳥の声をたどる',s:'鳥のいる所には実がある',c:[3,6],tags:['observe'],run:s=>{if(!s.clues.bird&&P(.6)){s.flags.recall=1;return{clue:'bird',want:'fruit',get:{fruit:1},photo:'bird',t:['枝の上で、青い鳥が実をついばんでいた。\n……あれ？　この色、どこかで――\nふいに鳥がこちらを向いた。小さな顔に、黒い目が四つ並んでいる。\n二股の尾羽をひるがえして、鳥は森の奥へ飛んでいった。','……思い出した。\nあの朝、ポジパ島の浜辺に白い霧が出て、霧のなかから、あの青い鳥が飛んできたんだ。\n一枚撮りたくて追いかけて、岩のアーチをくぐって――\n気がついたら、この島の浜で眠っていた。']}};return{get:{fruit:1},t:'鳥が落とした実を拾った。「ありがとう」'}}});
C('forest','feedbird',{i:'svg:bird4',t:'青い鳥に木の実をわける',s:'木の実を持っていく',c:[2,3],tags:['observe'],w:2,req:s=>s.clues.bird&&!s.flags.birdFriend&&inv('fruit')>=1,run:s=>{const n=s.flags.birdN||0;s.flags.birdN=n+1;
  if(n===0)return{get:{fruit:-1},t:'枝の上の青い鳥に、木の実をそっと差し出した。\n「こんにちは。お腹、すいてませんか？」\n四つの目が、じっとこちらを見る。……今日は、降りてきてくれなかった。\n実は枝の根もとに置いておいた。'};
  if(n===1)return{get:{fruit:-1},t:'今日も木の実を差し出すと、青い鳥は枝を一本ずつ降りてきて、手のひらの実をついばんだ。\n小さなくちばしが、くすぐったい。\n「ふふっ。また明日も来ますね」'};
  s.flags.birdFriend=1;return{get:{fruit:-1},photo:'sora',t:['呼ぶより先に、青い鳥が肩に舞い降りてきた。\n「わっ……。ふふっ、おはようございます」','「あなたに、名前をつけてもいいですか？」\nきれいな瑠璃色だから――「ルリちゃん」。\nルリちゃんは、二股の尾羽をふるわせて鳴いた。\n……前にも、こんなふうに瑠璃色の小鳥に名前をつけたことがあるような。夢の中だったかな。\n\nこの島で、はじめてのお友だち。']}}});

C('rocks','rcrab',{i:'🦀',t:'岩陰のカニを捕る',s:'すばしっこい',c:[4,7],tags:['risk'],run:s=>{const o=P(.6)?{get:{crab:1},t:'岩の裏から、カニを引っぱり出した。'}:{t:'逃げられた。「あっ、待って……」'};if(P(.2)){o.d={hp:-4};o.t=hurtAdd(o.t,'pinch','「いたっ……！」\nハサミが、指にがっちり食いこんだ。振っても離れない。\n無理に引っぱったら、指の皮ごと持っていかれそう。\n「はさまれたら、水に浸けてやれ。そうすりゃ放す」\n漁師のおじいさんの言葉を思い出して、潮だまりにそっと手を沈める。\nカニはぱっと指を放して、岩の陰へ逃げていった。','指をはさまれた。痛い……。')}return o}});
C('rocks','dryweed',{i:'svg:seaweed+🧂',t:'海藻に海水をかけて干す',s:'塩をつくる下ごしらえ。日ざしの強い昼に',c:[4,6],tags:['craft'],slot:1,req:s=>s.fire||s.flags.salt||owns('pot'),run:s=>{const first=!s.flags.dryweed;s.flags.dryweed=1;return{get:{saltweed:2},know:'mosio',t:first?['打ち上げられた海藻を集めて、日当たりのいい平らな岩の上に広げた。\n潮だまりの海水を両手ですくって、上から、ぱしゃり。','お日さまに照らされて、海藻はみるみる乾いていく。\n乾いたら、また海水をかける。乾いたら、また。\n何度もくり返すうちに、海藻の表面に、白い粉がうっすらふいてきた。','「水を飛ばすのは、お日さまにタダでやってもらお♪」\n志希ちゃんの楽しそうな声と、塩づくりの職人さんが教えてくれた、昔の人のやり方。\n海藻に、塩を集めてもらうんだ。\nこれを野営地で海水に洗えば、濃い塩水になるはず。']:'海藻を岩に広げて、海水をかけては干すのをくり返した。\n表面に、白い塩がふいてきた。'}}});
C('rocks','weedpick',{i:'svg:seaweed',t:'海藻を摘んで干す',s:'雨の日のための保存食',c:[3,4],tags:['craft'],w:2,req:s=>!!s.flags.life50,run:s=>{dry('hweed',2);const f=!s.flags.weedpick;s.flags.weedpick=1;return{t:f?'岩に張りついた海藻を、根もとからちぎりとった。\nそのままだとしょっぱいけれど、真水でさっと洗って、干しておけば……\n岩の上に、一枚ずつ広げて並べる。\n何日かお日さまに当てたら、干し海藻のできあがり。':'海藻を摘んで、岩の上に広げて干した。'}}});
C('rocks','seaweed',{i:'svg:seaweed',t:'海藻をかじる',s:'食べられるが、しょっぱい',c:[2,4],tags:['safe'],run:s=>({d:{food:8,water:-4},know:'seaweed',t:'岩に張りついた海藻をかじった。お腹は少し満ちたけれど、喉が渇く。\n七海ちゃんなら、どの海藻がおいしいか、すぐにわかるんだろうな。'})});

C('rocks','lookup',{i:'⛰️',t:'崖を見上げる',s:'上には何があるんだろう',c:[1,2],tags:['explore'],once:1,w:2.5,req:s=>!s.places.hill,run:s=>({discover:['hill'],want:'vine',t:'岩場の奥に、切り立った崖がそびえている。上には緑が見える。\n登れれば、島じゅうを見渡せそう。\n……高いところは、ちょっと苦手なんだけど。素手で登るには高すぎる。'})});
C('rocks','climb',{i:'🧗',t:'崖をよじ登る',s:'ロープなしで',c:[7,10],tags:['risk','explore'],w:1.5,req:s=>s.places.hill&&!owns('rope')&&!s.flags.climbed,run:s=>{if(P(.45)){s.flags.climbed=1;return{goto:'hill',t:'「下は見ない、下は見ない……」\n指をかけ、足をかけ、息を止めて体を引き上げた。\n崖の上に出た！　膝がまだ震えている。でも、手がかりはもう覚えた。'}}return{d:{hp:-18},hurt:'足をすべらせて落ちた',cause:'転落',know:'santen',want:'vine',t:firstHurt('climb',['岩の出っぱりに指をかけて、体を引き上げる。\n「下は見ない、下は見ない……」\n半分ほど登ったところで、足をかけた岩が、ぼろりと崩れた。','とっさに、見てしまった。下を。\n足がすくむ。指先から、力が抜けていく。','岩場に叩きつけられた。\n腰から背中へ、じんと重い痛みが広がる。\nしばらく、声も出なかった。','「両手両足のうち三つで体を支えて、動かすのは一つずつ。足をかける前に、岩を確かめる」\n名人のおばあさんに教わった登り方を、今さら思い出す。\n縄があれば。せめて、もっとゆっくり登っていれば。'],'半分ほど登ったところで、うっかり下を見てしまった。\n足がすくんで、手がすべる。岩場に落ちて、したたかに腰を打った。\n「縄があれば……」')}}});

C('stream','hairwash',{i:'🫧',t:'あわの実で洗う',s:'小川のほとりで',c:[2,3],tags:['safe'],w:2,req:s=>!!(s.traces&&s.traces.awatree),dis:s=>inv('awa')<1&&'あわの実を持ってくる',run:s=>{const n=s.flags.washN||0;s.flags.washN=n+1;
  if(n===0)return{get:{awa:-1},d:{hp:10},know:['shampoo','tearai'],t:['あわの実を、小川の水といっしょに、両手でもむ。\nもこもこの泡を髪にのせて、指の腹で、やさしく洗った。\n……ずっと、海の水と、小川の水だけだったから。\n髪のきしきしが、すうっとほどけていく。','水で泡を流すと、髪が、さらさらと指を通った。\n「……ふふっ。生き返りましたぁ」\nお仕事の日、ヘアメイクさんに「藍子ちゃんの髪、やわらかいね」って言ってもらえるのが、ちょっとうれしかった。\n帰ったら、また、そう言ってもらえる髪でいたいな。','残った泡で、手をていねいに洗った。\nそれから、伸びていた爪を、平たい石でこすって短くする。\n「料理の前には手を洗う！　爪は短く！　小さな傷から、ばい菌が入るであります！」\n亜季さんの声で、思い出した。']};
  if(n===1)return{get:{awa:-1},d:{hp:8},know:'sentaku',t:'あわの実の泡で、服を洗った。\nもんで、すすいで、もう一度もんで。\n岩の上に広げて干すと、お日さまの匂いがした。\n村のおばあちゃんの家の、物干しの匂い。'};
  return{get:{awa:-1},d:{hp:8},t:['あわの実で髪を洗った。さらさら。','あわの実で服を洗って、岩の上に干した。お日さまの匂い。','泡がいくつかくっついて、空へのぼっていった。種をつれて。\n「いってらっしゃい」'][ri(0,2)]}}});
C('stream','drinkraw',{i:'🤲',t:'小川の水をそのまま飲む',s:'澄んで見える',c:[1,0],tags:['risk'],run:s=>{if(P(.4))return{d:{water:30,hp:-10,food:-6},hurt:'お腹をこわした',know:'boil',cause:'生水',t:firstHurt('rawwater',['澄んだ水を両手ですくって、ごくごく飲んだ。\n冷たくて、おいしい。','夕方になって、お腹がきりきりと痛みだした。\n何度も茂みに駆けこんで、そのたびに体から水が抜けていく。\n額に脂汗。足に力が入らない。','「澄んで見えても、生水は危ないのであります」\n亜季さんの声。……ちゃんと、言ってたのに。\nお腹をこわすと、飲んだ以上に水を失ってしまう。水は、沸かしてから。'],'冷たい水を、ごくごく飲んだ。\n夕方になって、ひどい腹痛がやってきた。澄んで見えても、生水は危ない。')};return{d:{water:35},t:'冷たくて、体のすみずみまで染みわたる。'}}});
// 水を汲む（小川・地底湖）
const noVessel=s=>!inv('shell')&&!inv('flask')&&!POT.some(k=>inv(k))&&'空の器を持っていない';
// 小川の水は、湯冷ましや地下水の入った土器には汲まない（安全な水を捨てることになるから）
C('stream','fetch',{i:'svg:wshell',t:'水を汲む',s:'殻・魔法瓶・土器に汲む',c:[2,4],tags:['safe'],dis:s=>!inv('shell')&&!inv('flask')&&!inv('pot')&&!inv('wpot')&&'空の器を持っていない',run:s=>fetchWater(s,'stream')});
C('cave','lakefetch',{i:'svg:wshell',t:'地底湖の水を汲む',s:'その場で飲んで、器にも汲む',c:[2,3],tags:['safe'],dis:noVessel,run:s=>fetchWater(s,'lake')});
function fetchWater(s,where){
  const n=inv('shell'),fl=inv('flask'),get={},parts=[],g=where==='lake'?'g':'w';
  if(n){get.shell=-n;get[g+'shell']=n;parts.push('ヤシの殻')}
  if(fl){get.flask=-fl;get[g+'flask']=fl;parts.push('魔法瓶')}
  const pk=POT.find(k=>inv(k)&&(g==='g'||k==='pot'||k==='wpot'));
  if(pk){if(pk!==g+'pot'){get[pk]=-1;get[g+'pot']=1}s.potW=s.flags.sealed?3:1;parts.push(s.flags.sealed?'土器（3杯分）':'土器')}
  if(pk&&!s.flags.sealed){s.flags.leaked=1;if(!have('imo'))(s.want||(s.want={})).imo=1}
  const leak=pk&&!s.flags.sealed?'\n……土器の底から、じわりと水がしみ出してくる。焼きたての器には、目に見えないすき間があるんだっけ。一杯分しか持ちそうにない。':'';
  if(where==='lake')return{get,d:{water:30},know:'groundwater',t:(inv('torch')?'松明を岩のすき間に立てかけて':'ほたる石を岩のくぼみに置いて')+'、地底湖のほとりにしゃがむ。\nまずは両手ですくって、しんと冷えた水を、喉が満足するまで飲んだ。\n持ってきた'+parts.join('と')+'を、湖にそっと沈めて、水を満たした。\nこぼさないように葉でふたをする。'+leak+'\n岩のすき間を、長い時間をかけてしみ出してきた水。小川の水とは違って、このまま持って帰っても飲めそう。'};
  return{get,t:'持ってきた'+parts.join('と')+'に、水を汲んだ。こぼさないように葉でふたをする。'+leak+(known('boil')?'\n野営地で沸かしてから飲もう。':'')};
}

C('stream','rodfish',{i:'🎣',t:'釣り糸を垂らす',s:'釣り竿を持ってきた',c:[3,5],tags:['safe'],req:s=>inv('rod'),run:s=>s.flags.fline?(P(.95)?{get:{fish:ri(2,3)},t:'細い糸の先で、浮きがすっと沈んだ。\n一匹釣りあげて、また糸を垂らすと、すぐに次の当たり。\n繊維の糸は、水の中でほとんど見えない。'}:{t:'今日は食いが悪い。のんびり待つのも、釣りのうち。'}):P(.85)?{get:{fish:ri(1,2)},t:'しずかに待っていると、貝殻の針に銀色の魚がかかった。\n魚は、しずかな人のところに来る。'}:{t:'今日は食いが悪い。のんびり待つのも、釣りのうち。'}});
C('stream','wash',{i:'🫧',t:'水浴びをする',s:'汗と塩を落とす',c:[1,0],tags:['safe'],run:s=>({d:{hp:7},t:'冷たい水に体を沈める。肌に張りついていた塩が流れ落ちた。\n髪を結びなおすと、気持ちまでしゃんとする。'})});
C('stream','upstream',{i:'🌫️',t:'上流をたどる',s:'水はどこから来るのだろう',c:[6,9],tags:['explore'],once:1,w:2,req:s=>!s.places.ruins,run:s=>{if(clueN(s)>=4)return{discover:['ruins'],t:['岩を越え、苔の斜面を登る。やがて濃い霧が立ちこめた。\n……この霧、なんだかなつかしい。','霧の切れ間に、石の柱が並んでいるのが見えた。\n自然にできたものじゃない。誰かが、ここに立てたものだ。']};return{discover:['ruins'],t:'上流へ行くほど霧が濃くなって、足もとも見えなくなった。引き返すしかない。\nこの霧の先へ進むには、まだ何かが足りない気がする。\nこの島のことを、もっとよく知らなきゃ。'}}});

C('cave','moss',{i:'✨',t:'光る苔を観察する',s:'壁がぼんやり青い',c:[2,4],tags:['observe'],once:1,w:2,run:s=>({clue:'moss',know:'hikarigoke',photo:'moss',t:['岩壁の苔が、ぼんやりと青く光っている。\n'+light()+'を背中に隠してみた。\nまっくらな中で、苔だけが青く光り続けていた。',...ep('cave'),'鍾乳洞のガイドさんは、ヒカリゴケは自分では光らないって言っていた。\n……じゃあ、この苔は？']})});
C('cave','mural',{i:'🖐️',t:'壁画を調べる',s:'岩肌に何か描かれている',c:[3,5],tags:['observe'],once:1,w:2,run:s=>s.flags.muralLeft?(packFull()?{keep:1,t:'壁画の下のくぼみで、青いかけらが光っている。'+FULLSHARD}:{get:{shard:1},t:'壁画の下のくぼみから、残しておいた青いかけらをそっと外した。\nかけらは手のひらで、かすかに光った。'}):(f=>{if(f)s.flags.muralLeft=1;return{clue:'mural',keep:f,get:f?{}:{shard:1},photo:'mural',t:['奥の岩壁に、赤い顔料で絵が描かれていた。\n'+light()+'を近づける。','空に、大小ふたつの円。\nその下に、柱が並ぶ石の門。\n海の上には舟。舟から降りる、小さな人の姿がいくつも。\n「私みたいに、迷いこんだ人たち……？」','絵の下のくぼみに、青い石のかけらがはめこまれていた。'+(f?FULLSHARD:'\nそっと外すと、かけらは手のひらでかすかに光った。')]}})(packFull())});
C('cave','lake',{i:'💧',t:'地底湖の水を飲む',s:'岩にこされた水',c:[1,0],tags:['safe'],run:s=>({d:{water:35},know:'groundwater',t:['しんと冷えた水。舌に何の味も残らない。',...ep('well')]})});
C('cave','cavelife',{i:'🛖',t:'ここで暮らせないか考える',s:'雨もしのげるし、水もある',c:[1,2],tags:['observe'],once:1,w:3,run:s=>({know:'cavelife',t:['ひんやりした岩壁に、手を当てて考える。\n雨はしのげる。地底湖の水もある。苔のおかげで、真っ暗でもない。\n……ここに住めたら、楽かもしれない。','でも、しばらく座っていると、背中から冷えがしみこんでくる。\n外はあんなに暑いのに、ここは一日じゅう、ひんやりしたまま。\n岩壁はじっとり濡れていて、服も、拾ってきた枝も、乾きそうにない。','鍾乳洞の回で、ガイドさんが言っていた。\n「洞窟の中は、一年じゅうほとんど同じ温度なんだ。夏はすずしいけど、寝泊まりするには冷えすぎるし、湿気で体が冷える」\n「それに、奥で火を焚くと、煙の逃げ場がないからね」','足もとの砂に、波のようなすじが残っていた。岩壁の、私の背より高いところにも、水のあとの線。\n……大雨のあとは、地底湖の水がここまで上がってくるんだ。\nそれに、ここからは海が見えない。もし船が通っても、狼煙も、手を振ることもできない。','「……休ませてもらうのは、入口のあたりまでにしよう」\n住むのは、お日さまと海の見える、あの岩陰。\n洞窟は、水を汲みに来て、苔の光をながめに来る場所。']})});
const light=()=>inv('torch')?'松明':'ほたる石';
const DEEP=[
  s=>({tool:'glow',clue:'glowstone',photo:'glowstone',t:['松明の明かりの外、岩の割れ目の奥で、何かが青白く光っていた。\n手を伸ばすと、ころんとした石がひとつ、手のひらに転がりこんできた。','松明を背中に隠してみる。\n……石は、ひとりで光っていた。苔よりずっと明るい。足もとの小石まで、くっきり見える。\n「お月さまを、ちぎってきたみたい」\nあたたかくもない。重くもない。ポケットに入れると、布ごしに、ぽうっと青く透けた。\n「ほたる石、って呼ぶことにしますね」\n――これがあれば、松明がなくても洞窟を歩けそう。']}),
  s=>({clue:'ceiling',photo:'ceiling',d:{hp:4},t:['低い通路を抜けると、広い空洞に出た。\n'+light()+'の光を、そっと手でおおう。','見上げると、天井いっぱいに、小さな光の粒が散らばっていた。\n苔でも、石でもない。ひとつひとつが、ゆっくりまたたいている。\n……星空だ。洞窟の中に、星空がある。\n目でなぞっていくと、大きな丸と、小さな丸。そのまわりを、光の粒が輪になってめぐっている。\n「ふたつの、月……？」']}),
  s=>({d:{hp:10},t:['ぽちょん。ぽちょん。\n天井から垂れた鍾乳石の先から、しずくが落ちている。\nしずくが落ちるたびに、下の石の皿が、澄んだ音を鳴らす。','ド、ミ、ソ……。いくつも並んだ皿が、それぞれ違う高さで歌っている。\n「……ふふっ。伴奏、してくれるんですか？」\nしずくの音に合わせて、小さな声で歌ってみた。\n洞窟じゅうに声が広がって、ひとりなのに、みんなで歌っているみたいだった。']}),
  s=>({clue:'glowfish',photo:'glowfish',d:{hp:6},t:['細い地下の流れに、ほのかな光がいくつも浮かんでいた。\nしゃがんで、そっとのぞきこむ。\n……お魚さん。体が透きとおっていて、骨まで見える。その骨が、ぼんやり光っているんだ。','「七海ちゃんが見たら、きっと大はしゃぎですね」\n手をさし入れても、逃げない。指のまわりを、光がくるくる回った。\n……とるのは、やめておこう。ここは、この子たちのおうちだから。']}),
  s=>({discover:['cove'],clue:'cove',photo:'cove',t:['奥へ進むほど、'+light()+'の光が、ふわりと横に流れる。\n……風だ。洞窟の奥なのに、風が吹いてくる。それも、潮の匂いのする風。','風をたどって、狭いすき間を横向きになってすり抜ける。\n岩のざらざらが、背中とおなかをこすっていく。\n「ん、しょ……っ」\n……その先に、光が見えた。']})
];
C('cave','deeper',{i:'svg:torch',t:'洞窟の奥へ進む',s:'足もとに注意',c:[5,7],tags:['explore'],run:s=>{const n=s.flags.deepN||0;s.flags.deepN=n+1;const k=s.flags.deepF||0;if(n>=3&&k<DEEP.length){s.flags.deepF=k+1;return DEEP[k](s)}const o={get:P(.5)?{stone:2}:{clay:1},t:'奥へ進むと、粘土質の床と崩れた岩があった。使えそうなものを拾う。'};if(P(.25)){o.d={hp:-8};o.hurt='天井に頭をぶつけた';o.t=hurtAdd(o.t,'head','ごつん。\n低い天井に、思いきり頭をぶつけた。目の前に星が散る。\n'+(inv('torch')?'松明を落としそうになって、あわてて握りなおす。……ここで火を落としたら、まっくらだ。':'ほたる石を落としそうになって、あわてて握りなおす。……これをなくしたら、まっくらだ。')+'\nしゃがみこんで、痛みが引くのを待った。\n鍾乳洞のロケで頭をぶつけていた茜ちゃんの気持ちが、ちょっとわかった。洞窟では、頭を低く。','低い天井に頭をぶつけた。……洞窟では、頭を低く。')}else if(P(.3))o.t+='\n足もとを何かがカサカサと横切った。「ひゃっ……！」虫は、苦手です。';return o}});
// ---- cove ----
C('cave','singcave',{i:'🎵',t:'鍾乳石に合わせて歌ってみる',s:'しずくの音が、歌みたい',c:[2,3],tags:['observe'],once:1,w:2,req:s=>!!s.names&&(s.flags.deepF||0)>=3,run:s=>{trace('melody');return{d:{hp:12},t:[
  '歌う鍾乳石の前に座った。\nぽちょん。ぽちょん。しずくが落ちるたびに、石の皿が、澄んだ音を返す。',
  'しずくの音に合わせて、小さく歌ってみた。\n……すると。\n声に合わせて、まわりの鍾乳石が、ひとつ、またひとつと鳴りはじめた。\n低い音。高い音。私の歌のうしろで、和音みたいに重なっていく。',
  '明かりを近づけて、鍾乳石の根もとを見る。\nどの石にも、ほんの少し、削ったあとがあった。\n長さをそろえて、音を合わせたみたいに。\n……誰かが、この洞窟を、楽器にしたんだ。',
  '歌い終わっても、音は消えなかった。\n鍾乳石たちが、知らない旋律を、ゆっくりくり返している。\n言葉は、ひとつもない。でも、やさしい歌だってことだけは、わかった。\n\n「……すてきな歌ですね」\n知らない誰かに、そう返事をした。']}}});
C('cove','covelook',{i:'🌌',t:'入り江をながめる',s:'岩の裂け目から光が落ちてくる',c:[1,2],tags:['observe'],once:1,w:2,run:s=>({d:{hp:8},t:['砂の上に腰を下ろして、入り江をながめた。\n岩の天井の裂け目から、光の柱が一本、まっすぐ水面に落ちている。\n光の柱の中を、細かい粒がきらきら舞っていた。','水面の光と、柱の光がまじりあって、入り江ぜんぶが、ゆっくり呼吸しているみたい。\n……写真に撮っても、きっとこの感じは写らない。\nそれでも、ここに来たことは、ちゃんと覚えていたい。']})});
C('cove','glowwade',{i:'🌊',t:'光る浅瀬を歩く',s:'足もとで、光がほどける',c:[1,2],tags:['safe'],run:s=>({d:{hp:10},t:firstDo('glowwade','靴を脱いで、浅瀬に足をひたした。\nひんやり。一歩ふみ出すたびに、足のまわりで光がふわっとほどけて、星みたいに散らばっていく。\n「わぁ……！」\nくるっと回ってみる。光の輪が、くるくる広がった。\n……誰も見ていないから、もう一回だけ。','光る浅瀬を、ゆっくり歩いた。足のまわりで、光がふわっとほどけていく。')})});
C('cove','coveshell',{i:'🐚',t:'虹色の貝殻を拾う',s:'花びらみたいに薄い',c:[1,2],tags:['observe'],once:1,run:s=>({d:{hp:6},t:'砂の上の貝殻を、ひとつ拾い上げる。\n花びらみたいに薄くて、光にかざすと、虹色が透けて見えた。\n「ひとつだけ、いただいていきますね」\nハンカチに包んで、胸のポケットにしまった。帰ったら、加奈ちゃんに見せてあげたいな。'})});
C('cove','coveclam',{i:'🐚',t:'浅瀬で貝を探す',s:'光る砂の下に',c:[3,5],tags:['safe'],run:s=>({get:{clam:ri(1,2)},t:'光る砂を指でそっと掘ると、貝が出てきた。\n貝の殻まで、ほんのり青く光っている。……食べても、大丈夫ですよね？'})});

C('hill','overlook',{i:'🏝️',t:'島を見渡す',s:'島の形を確かめる',c:[3,6],tags:['explore','observe'],once:1,w:2,run:s=>{const o={noGo:1,clue:'fogwall',photo:'overlook',t:['島は、思っていたより小さい。歩いて一日でひと回りできそう。\n浜辺、森、岩場。'+(s.fire?'自分の野営地の煙も見える。':'崖の下に、野営地の岩陰も見える。'),'視線を沖へ移す。\n……どの方角も、海の少し先で、白い霧が壁のように立ちのぼっている。\n空と海の境目が、どこにも見えなかった。']};if(!s.places.stream){o.discover=['stream'];o.t.push('森の中に、光る筋が見えた。小川だ。')}return o}});
C('hill','stars',{i:'🌌',t:'星が出るのを待つ',s:'夕方だけ',c:[2,4],tags:['observe'],slot:2,once:1,w:2,run:s=>({clue:'stars',know:'polaris',photo:'stars',t:['日が沈んで、空いっぱいに星が広がった。\nこんなに星の多い空は、はじめて。',...ep('stars'),'北の空を探す。ひしゃくの形。カシオペヤのW。\n目をこらしても、どの星をつないでも、見覚えのある形にならない。\n「……未央ちゃん。北極星、どこにもないよ」']})});
C('hill','smoke',{i:'💨',t:'狼煙を上げる',s:'枯れ枝とヤシの葉を持っていく',c:[5,7],tags:['explore'],req:s=>s.fire&&inv('twig')>=1&&inv('leaf')>=1,run:s=>{const o={get:{twig:-1,leaf:-1},know:'smoke',t:['焚き火の燠を運んで、青い葉をくべた。白い煙が高く昇っていく。',...ep('smoke')]};if(!s.clues.noplanes){o.clue='noplanes';o.t.push('日が傾くまで待った。\n返事の煙も、船も、飛行機も、何も来なかった。')}else o.t.push('誰も来ない。\nそれでも、白い煙がまっすぐ昇っていくのを見ていると、少しだけ心が強くなる。');return o}});
C('hill','nest',{i:'🪺',t:'海鳥の巣を探る',s:'崖のふちにある',c:[4,6],tags:['risk'],run:s=>{let o;if(!s.flags.nestShard){const seen=s.flags.nestSeen;s.flags.nestSeen=1;const f=packFull();if(!f)s.flags.nestShard=1;o={get:f?{}:{shard:1},t:seen?'崖のふちに腹ばいになって、もう一度巣をのぞいた。下は見ない。\n'+(f?'青いかけらは、まだそこにある。'+FULLSHARD:'残しておいた青いかけらを、そっと取り出した。'):'崖のふちに腹ばいになって、巣をのぞいた。下は見ない。\n巣の中に、卵といっしょに、青く光る石のかけらがあった。\n鳥が光るものを集めてきたのかな。'+(f?FULLSHARD:'')}}else o=P(.6)?{get:{egg:1},t:'卵をひとつ、ゆずってもらった。'}:{t:'親鳥に追い払われた。「ご、ごめんなさい」'};if(P(.15)){o.d={hp:-5};o.t=hurtAdd(o.t,'peck','頭の上で、ばさっと羽音がした。\n親鳥が、鋭いくちばしで頭をつついてくる。何度も、何度も。\n「ご、ごめんなさい……！」\n腕で頭をかばいながら後ずさる。……すぐ後ろは、崖のふち。\nあわてて動くのが、いちばん危ない。息を整えて、ゆっくり、ゆっくり離れた。','親鳥に頭をつつかれた。')}return o}});
C('hill','benchmake',{i:'🪑',t:'夕日のベンチを作る',s:'流木を運んでくる',c:[4,6],tags:['craft'],once:1,w:3,req:s=>!!s.names,dis:s=>inv('wood')<2&&'流木を2本、持ってくる',run:s=>(trace('seat'),{get:{wood:-2},tool:'bench',made:'夕日のベンチ',t:['崖の上の草地の、いちばん西のはし。\n運んできた流木を、平たい石の上に渡して、ぐらつかないように小石をかませた。\n腰かけてみる。……うん、ちょうどいい高さ。','ベンチのわきの草をかき分けたら、苔むした平たい石が顔を出した。\nまわりの石とちがって、上がつるりと平らにならしてある。\n座るのに、ちょうどいい高さ。……向いているのも、夕日の沈むほう。\n\nずっと昔に、誰かが、ここで夕日を見ていたのかもしれない。\n「……おとなり、失礼しますね」','ここからなら、島がぜんぶ見える。\n'+['beach','forest','rocks','camp'].filter(p=>s.places[p]).map(pn).join('。')+'。\n「夕方に、また来ますね」']})});
C('hill','benchsun',{i:'🌅',t:'ベンチで夕日を待つ',s:'夕方だけ',c:[1,2],tags:['safe','observe'],slot:2,req:s=>s.tools.bench,run:s=>{const first=!s.flags.benchSun;s.flags.benchSun=1;
  return first?{d:{hp:12},photo:'bench',t:['ベンチに腰かけて、お日さまが霧の向こうへ沈んでいくのを待った。\n島じゅうが、ゆっくりオレンジ色に染まっていく。\n'+pn('beach')+'の砂も、'+(s.places.forest?pn('forest')+'の葉っぱも、':'')+(s.places.camp?pn('camp')+'の煙も':'波の音も')+'。',...ep('flash'),'「……きれい」\n高いところは、やっぱり少しこわい。\nでも、ここに座っていると、それよりずっと、うれしい気持ちのほうが大きい。']}
  :{d:{hp:12},t:['ベンチに腰かけて、夕日を待つ。\n今日の空は、少し桃色が多い。','ベンチで夕日を待つ。\n風が強くて、髪がくしゃくしゃ。それでも、来てよかった。','ベンチで、お日さまが沈むまで、ぼんやりしていた。\n未央ちゃんと茜ちゃんにも、この夕日を見せたいな。'][ri(0,2)]+(s.flags.birdFriend&&P(.5)?'\nルリが、ベンチのはしっこにとまって、同じほうを見ていた。':'')}}});
C('hill','breeze',{i:'🍃',t:'風に吹かれて休む',s:'体力を回復する',c:[2,4],tags:['safe'],run:s=>({d:{hp:8},t:'白い小花の咲く草の上に寝ころぶ。風の音だけが聞こえる。\nこういう時間が、私はいちばん好きです。'})});

function gain(k,n,res){
  if(n>0){
    if(atCamp()){S.store[k]=(S.store[k]||0)+n;res.gets.push([k,n]);if(S.want)delete S.want[k];return}
    let put=n;
    if(!KEYI.includes(k)){const room=Math.max(0,cap()-packN());put=Math.min(n,room)}
    if(put){S.inv[k]=inv(k)+put;res.gets.push([k,put]);if(S.want)delete S.want[k];if(!S.seen['ui:bag'])S.seen['ui:bagnew']=1}
    if(n-put>0)res.lost.push([k,n-put]);
  }else if(n<0){
    let need=-n;const fromPack=Math.min(need,inv(k));S.inv[k]=inv(k)-fromPack;need-=fromPack;
    if(need&&atCamp())S.store[k]=Math.max(0,(S.store[k]||0)-need);
    if(!S.inv[k])delete S.inv[k];if(S.store[k]===0)delete S.store[k];
    res.gets.push([k,n]);
  }
}

      const zero=c.water&&S.water-c.water<=0||c.food&&S.food-c.food<=0;

      return`<div class="row ${L?'lockrow':''}"><span class="ri">${L?'🔒':ic(PLACES[p].i)}</span><span class="rn">${pn(p)}${UI.newPlaces[p]?'<span class="newtag">NEW</span>':''}<div class="mats">${L?`<span class="mat short">${esc(L)}</span>`:cost}${!L&&zero&&!LITE?`<span class="mat short">♥−${(c.water&&S.water-c.water<=0?6:0)+(c.food&&S.food-c.food<=0?5:0)}</span>`:''}</div></span><button class="mini" data-go="${p}" ${L?'disabled':''}>${L?'行けない':'行く'}</button></div>`}).join('')||'<p class="hint" style="text-align:left">ほかに知っている場所はまだない。</p>';
    if(!LITE)h+='<p class="hint" style="text-align:left;margin-top:12px">遠い場所ほど満腹と水分を使う。道は 野営地・浜辺 → 森の入口 → 小川、浜辺 → 岩場 とつながっている。</p>';
  }else if(name==='know'){
    const tab=UI.noteTab||'know';
    const clues=Object.assign({},META.clues||{},(S&&S.clues)||{});const cn=Object.keys(clues).filter(c=>CL[c]).length;
    const n=Object.keys(K).filter(known).length;
    const eps=Object.keys(EP).filter(e=>META.eps&&META.eps[e]).sort((a,b)=>parseInt(EP[a][0].slice(1))-parseInt(EP[b][0].slice(1)));
    const album=S?S.album:Object.keys(PHOTO).filter(p=>META.photos[p]);
    h=`<h2>手帳<button class="close">閉じる</button></h2><div class="tabs">`+[['know','知恵袋',n+'/'+Object.keys(K).length],['ep','思い出',eps.length+'/'+Object.keys(EP).length],['album','アルバム',S?album.length+'/'+FILM:album.length+'枚'],...(cn?[['clue','島のメモ',cn+'/'+NCL]]:[]),...(S&&S.names?[['map','島の地図','']]:[])].map(([k,l,c])=>`<button class="tab ${tab===k?'on':''}" data-tab="${k}">${l}<small>${c}</small></button>`).join('')+'</div>';
    if(tab==='map'&&S&&S.names)h+='<p class="hint" style="text-align:left;margin-top:0">日記帳の最後のページに描いた、島の地図。</p>'+ORDER.filter(p=>S.names[p]).map(p=>'<div class="kn"><b>'+ic(PLACES[p].i)+' '+esc(S.names[p])+'</b><p>'+esc(S.nameMemo[p]||'')+'</p></div>').join('')+(S.traces?'<div class="sec">むかしの人のあしあと</div>'+Object.keys(TRACE).filter(k=>S.traces[k]).map(k=>'<div class="clue">'+esc(TRACE[k])+'</div>').join(''):'');
    else if(tab==='clue'&&cn)h+=Object.keys(CL).map(c=>clues[c]?`<div class="clue">${CL[c]}</div>`:'<div class="clue unk">？？？</div>').join('');
    else if(tab==='ep')h+=eps.length?eps.map(e=>`<div class="ep"><div class="eph">📺 ポジパDASH ${esc(EP[e][0])}</div><p>${esc(EP[e][1])}</p></div>`).join(''):'<p class="hint" style="text-align:left">島で新しいことをすると、ポジパDASHで教わったことを思い出す。</p>';
    else if(tab==='album')h+=(S?'':'<p class="hint" style="text-align:left;margin-top:0">これまでに撮った写真</p>')+(album.length?albumHTML(album):'<p class="hint" style="text-align:left">まだ一枚も撮っていない。トイカメラのフィルムは '+FILM+' 枚。</p>');
    else h+=Object.entries(K).map(([k,[t,b,src]])=>known(k)?`<div class="kn"><b>${t}</b>${src?`<small class="src">${esc(src)}</small>`:''}<p>${b}</p></div>`:'<div class="kn unk"><b>？？？</b></div>').join('');
  }
  sh.innerHTML=h;
  app.appendChild(v);app.appendChild(sh);
  sh.querySelector('.close').onclick=()=>closeSheet();
  sh.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>useItem(b.dataset.use,+b.dataset.i));
  sh.querySelectorAll('[data-carry]').forEach(b=>b.onclick=()=>carry(b.dataset.carry,+b.dataset.d));
  sh.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>move(b.dataset.go));
  sh.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{UI.noteTab=b.dataset.tab;openSheet('know')});
  sh.querySelector('.close').focus({preventScroll:true});
}
function closeSheet(silent){
  document.querySelectorAll('.veil,.sheet').forEach(e=>e.remove());
  UI.sheet=null;
  if(!silent&&S&&S.phase==='play'){renderNav();const b=document.querySelector('[data-s="bag"]');if(b)b.focus({preventScroll:true})}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.sheet)closeSheet()});

function renderNight(){
  const n=S.night,pg=pages(n.t),pi=n.page||0,last=pi>=pg.length-1;
  app.innerHTML=`<div class="nightwrap"><h2>${S.day}日目の夜</h2><div class="sky" aria-hidden="true">🌕${S.clues.moons?'<span class="moon2">🌕</span>':''}　✦ ✧</div>
  ${pageHTML(pg[pi],'page'+(pi?' turn':''))}
  ${last?`${knBox(n.kn)}${photoHTML(n.photo,n.snapped,n)}<div class="ledger">${n.lines.map(([a,b,c])=>`<div><span>${a}</span><span class="${c}">${b}</span></div>`).join('')}
  <div style="border-top:1px solid #ffffff30;margin-top:6px;padding-top:6px"><span>朝の状態</span><span>♥ ${S.hp}　🍖 ${S.food}　💧 ${S.water}</span></div></div>`:''}
  <button class="btn" id="morn">${!last?'つづき ▸':S.hp<=0?'結果を見る':DAYNAME[S.day]?DAYNAME[S.day]+'の朝へ':'朝を迎える'}</button></div>`;
  const b=document.getElementById('morn');b.onclick=morning;b.focus({preventScroll:true});bindPhoto(renderNight);
}

  +'<rect x="84.5" y="47.5" width="11" height="5.5" rx="1.6" fill="#86a983"/><rect x="86.8" y="45" width="6.4" height="3" rx="1.2" fill="#c9c2b4"/><path d="M83.5 55.5v4M83.5 79v5" stroke="#fff" stroke-opacity=".5" stroke-width="1.6" stroke-linecap="round"/>'
  +'<path d="M106 74h17l-1.6 12.5h-13.8z" fill="#f6eedd"/><path d="M106.6 78.5c2.6-2 5.2 2 7.8 0s5.2 2 7.8 0" stroke="#6f9670" stroke-width=".8" fill="none"/><path d="M0 0q2.4-2.2 4.6 0q-2.2 2.2-4.6 0z" fill="#6f9670" transform="translate(109 77) rotate(-40)"/><path d="M0 0q2.4-2.2 4.6 0q-2.2 2.2-4.6 0z" fill="#6f9670" transform="translate(116.5 79.5) rotate(30)"/><ellipse cx="114.5" cy="74.3" rx="8.5" ry="1.7" fill="#c99a6b"/>'
  +'<path d="M30 113c8-3.5 16-3.5 24 0s16 3.5 24 0 16-3.5 24 0 16 3.5 24 0 16-3.5 24 0 16 3.5 24 0V122H30z" fill="#bcd3d6"/>'

  +'</g></svg>';
function renderTitle(){
  const run=store.get('aiko_drift_run1');
  const ne=Object.keys(META.eps||{}).length;
  app.innerHTML=`<div class="title">${EMBLEM}<h1>ゆるふわ<br>ソロキャン<br>アイランド</h1><div class="tag">……おじゃまします</div>
  ${run&&run.phase!=='end'?`<button class="btn" id="cont">つづきから（${run.day}日目・${SLOTS[run.slot]||'夜'}）</button><button class="btn sub" id="start">はじめから</button>`:'<button class="btn" id="start">はじめる</button>'}
  <div class="meta"><div><b>${META.best||0}日</b>最長の日数</div><div><b>${Object.keys(META.endings||{}).length}/2</b>エンディング</div><div><b>${ne}/${Object.keys(EP).length}</b>思い出</div></div>
  ${ne||META.runs?'<button class="btn sub" id="notebook">📓 手帳を見る</button>':''}
  ${LITE?"":`<div class="howto">・高森藍子が、番組『ポジパDASH』で教わった知恵を頼りに、ひとりで島を生きのびる。<br>・「考える」と案が3つ浮かぶ。1つ選んで、その場所の手札（3枚まで）に加える。<br>・手札の行動を選ぶと時間が進む（1日に朝・昼・夕の3回）。<br>・行動すると満腹と水分が減る。どちらかが0になると体力が減り、0で終わり。<br>・移動には満腹と水分を使う。遠い場所ほど多く減る。<br>・作ることと火で焼くことは、野営地でしかできない。<br>・新しいことをすると、番組の思い出がよみがえる。<br>・トイカメラのフィルムは${FILM}枚。残したい瞬間を選んで撮ろう。</div>`}
  <a class="back" href="index.html">← お話の一覧へ</a>${LITE?'':'<button class="btn sub wipe" id="wipe">🗑 保存データを消す（debug）</button>'}</div>`;
  const wp=document.getElementById('wipe');if(wp)wp.onclick=()=>{if(!confirm('この島の保存データ（進行中の記録・手帳・アルバム・最長日数）をすべて消します。よろしいですか？'))return;store.del('aiko_drift_run1');store.del('aiko_drift_meta1');location.reload()};
  document.getElementById('start').onclick=()=>{if(run&&run.phase!=='end'&&!confirmReset())return;newRun();render()};
  const c=document.getElementById('cont');if(c)c.onclick=()=>{S=run;UI=freshUI();render()};
  const nb=document.getElementById('notebook');if(nb)nb.onclick=()=>{UI.noteTab='ep';openSheet('know')};
}
let resetArmed=false;
function confirmReset(){if(resetArmed)return true;resetArmed=true;const b=document.getElementById('start');b.textContent='もう一度押すと、今の記録を消してはじめる';setTimeout(()=>{resetArmed=false;if(b.isConnected)b.textContent='はじめから'},3500);return false}

function renderResult(){
  const k=S.ending;
  const bird=S.flags.birdFriend,al=S.album;
  const E={
    dead:['GAME OVER','力尽きる',`砂の上に倒れこんだ。\n波の音が、少しずつ遠くなっていく……\n\n「あーちゃーん！」\nどこかで、未央ちゃんの声が聞こえた気がした。\n\n原因：${S.cause||'疲労'}`],
    return:['ENDING','おかえりなさい',(giftText()?giftText()+'\n\n':'')+'門をくぐった瞬間、ふたつの月の光が背中で重なった。\n霧が渦を巻いて、潮の匂いが変わる。'+(bird?'\n\n肩の上で、ルリが小さく鳴いた。ふり向くと、青い羽が一枚、霧の向こうへ舞っていった。'+(S.flags.charm?'\n足に結んだ飾り紐が、霧のなかで一瞬だけ、白く光った。':'')+'\n「……またね、ルリちゃん。どこかの森で、また会える気がする」':'')+'\n\n目を開けると、ポジパ島の浜辺だった。\n岩のアーチ。ロケのテント。朝ごはんの匂い。\n\n「あーちゃん！　どこ行ってたの、もう！」\n「藍子ちゃーーん！　探しましたよーっ！！」\n走ってくる未央ちゃんと茜ちゃん。その後ろで、プロデューサーさんが、ほっとしたように笑っていた。\n\n私がいなくなっていたのは、ほんの一時間だったそうです。\n\n「……ただいま。あのね、聞いてほしいお話が、たくさんあるんです」'+(al.includes('moons')?'\n\n後日、トイカメラの写真を現像したら、ふたつの月がちゃんと写っていました。\n三人で、しばらく何も言えませんでした。':al.length?'\n\n後日、トイカメラの写真を現像して、三人で一枚ずつ眺めました。\n「これ、どこ？」って聞かれて、私は「ないしょです」って笑いました。\nいちばんお気に入りの一枚は、歌鈴ちゃんとの「藍鈴ダイアリー」に貼りました。':'')],
    survive:['ENDING',(DAYNAME[S.daysSurvived]||S.daysSurvived+'日目')+'の朝',(DAYNAME[S.daysSurvived]||S.daysSurvived+'日目')+'の朝。\n水の探し方も、火の起こし方も、もう体が覚えている。\n今日も、日記の最初に書く。\n「未央ちゃん、茜ちゃん、プロデューサーさんへ。私は元気です」\n\n'+(giftText()?giftText().replace('次にこの島へ流れ着く誰かのために','いつか、この島に誰かが流れ着いたときのために')+'\n\n':'')+'霧の向こうに帰り道があると信じて、今日もゆっくり、'+pn('beach')+'をお散歩する。'+(bird?'\n肩の上には、ルリ。':'')]
  }[k];
  const tg=S.tags,max=Math.max(...Object.values(tg));
  const top=Object.keys(tg).sort((a,b)=>tg[b]-tg[a])[0];
  const per=max>0?PERSONA[top]:['まだ何者でもない藍子','次の島では、どんな藍子になるだろう。'];
  const placesN=Object.keys(S.places).length;
  app.innerHTML=`<div class="res"><div class="kind">${E[0]}</div><h1>${E[1]}</h1><p class="story">${esc(E[2])}</p>
  <div class="stats"><div class="big"><b>${S.daysSurvived}日</b>島で過ごした日数</div>
  <div><b>${S.stats.actions}</b>行動</div><div><b>${placesN}/${ORDER.length}</b>見つけた場所</div><div><b>${S.stats.made.length}</b>作ったもの</div>
  <div><b>${S.eps.length}</b>DASHの思い出</div><div><b>${clueN(S)}/${NCL}</b>気づいた違和感</div><div><b>${S.stats.hurts}</b>痛い目</div></div>
  <div class="persona"><div class="lbl">今回の藍子は</div><h3>${per[0]}</h3><p>${per[1]}</p>
  ${Object.keys(TAGS).map(t=>`<div class="tagbar ${t===top&&max>0?'top':''}"><span>${TAGS[t]}</span><span class="tb"><i style="width:0" data-w="${max?Math.round(tg[t]/max*100):0}"></i></span><span>${tg[t]}</span></div>`).join('')}</div>
  <div class="sec">トイカメラの写真 ${al.length}/${FILM}</div>
  ${al.length?albumHTML(al):'<p class="hint" style="text-align:left">一枚も撮らなかった。</p>'}
  ${S.eps.length?`<div class="sec">思い出したポジパDASH</div><div class="matlist">${S.eps.map(e=>`<span class="get know">📺 ${esc(EP[e][0])}</span>`).join('')}</div>`:''}
  <div class="sec">この島の違和感 ${clueN(S)}/${NCL}</div>
  ${Object.keys(CL).map(c=>S.clues[c]?`<div class="clue">✔ ${CL[c]}</div>`:`<div class="clue unk">${META.clues[c]?'（前の島で気づいた）'+CL[c]:'？？？'}</div>`).join('')}
  ${S.stats.made.length?`<div class="sec">作ったもの</div><div class="matlist">${S.stats.made.map(x=>`<span class="get">${esc(x)}</span>`).join('')}</div>`:''}
  ${Object.keys(S.newKnow).length?`<div class="sec">今回はじめて教わったことを思い出した</div><div class="matlist">${Object.keys(S.newKnow).map(x=>`<span class="get know">📺 ${K[x][0]}</span>`).join('')}</div>`:''}
  <button class="btn" id="again">もう一度、島へ</button><button class="btn sub" id="totitle">タイトルへ</button></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>app.querySelectorAll('.tb i').forEach(i=>i.style.width=i.dataset.w+'%')));
  document.getElementById('again').onclick=()=>{newRun();render()};
  document.getElementById('totitle').onclick=()=>{S=null;render()};
}

render();
